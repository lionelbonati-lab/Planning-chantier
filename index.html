  .interrupteur input:checked ~ .interrupteur-piste::before { transform: translateX(16px); }
  .interrupteur input:focus-visible ~ .interrupteur-piste { outline: 2.5px solid var(--accent); outline-offset: 2px; }

  .liste-intervenants { display: flex; flex-direction: column; gap: 8px; max-width: 520px; }
  .ligne-intervenant { display: flex; align-items: center; padding: 11px 14px; border: 1px solid var(--border); border-radius: 10px; font-size: 13px; background: var(--surface-2); }
  .ligne-intervenant b { font-weight: 700; }
  .ligne-intervenant > span.compte { color: var(--ink-faint); font-size: 11px; margin-left: 10px; }
  .ligne-intervenant > span.compte:empty { margin-left: 0; } /* compteur pas encore chargé : pas de trou visuel */
  /* Round du 12.09.2026 — page Jalons : la plage de dates a sa PROPRE classe
     (pas .compte, réservée au compteur de personnes/le drapeau important) pour
     éviter toute ambiguïté de sélecteur entre les deux usages. Même rendu que
     .compte pour rester visuellement cohérent avec le reste de l'appli. */
  .ligne-intervenant > span.plage-jalon { color: var(--ink-faint); font-size: 11px; margin-left: 10px; }
  .ligne-actions { display: flex; align-items: center; gap: 14px; margin-left: auto; padding-left: 14px; }
  .ligne-intervenant .gauche-chantier { display: flex; align-items: center; gap: 10px; }
  .swatch-chantier { width: 18px; height: 18px; border-radius: 6px; flex-shrink: 0; border: 1px solid var(--border); }
  .champ-couleur-chantier { display: flex; align-items: center; gap: 10px; margin: 10px 0; }
  .champ-couleur-chantier input[type="color"] { width: 40px; height: 32px; padding: 2px; border: 1px solid var(--border); border-radius: 7px; background: var(--surface-2); cursor: pointer; }
  .champ-couleur-chantier label { font-size: 12px; color: var(--ink-muted); }
  .champ-couleur-texte-statut { display: flex; align-items: center; gap: 10px; margin: 10px 0; }
  .champ-couleur-texte-statut input[type="color"] { width: 40px; height: 32px; padding: 2px; border: 1px solid var(--border); border-radius: 7px; background: var(--surface-2); cursor: pointer; }
  .champ-couleur-texte-statut input[type="color"]:disabled { opacity: .4; cursor: not-allowed; }
  .champ-couleur-texte-statut label { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--ink-muted); cursor: pointer; }
  .apercu-texte-statut { margin: 10px 0 4px; padding: 9px 12px; border-radius: 8px; background: var(--bg); font-size: 12px; color: var(--ink-faint); }
  .apercu-texte-statut .apercu-txt { color: var(--ink); font-weight: 600; }
  .ligne-ajouter {
    display: flex; align-items: center; justify-content: center; gap: 6px; width: 100%;
    padding: 11px 14px; border: 1.5px dashed var(--accent); border-radius: 10px;
    font-size: 13px; font-weight: 700; color: var(--accent); background: none; cursor: pointer; font-family: inherit;
  }
  .ligne-ajouter:hover { background: var(--accent-soft); }

  /* Tri (↑/↓) + Actif/désactivés — round du 14.09.2026, Lionel : « j'aimerais
     pouvoir trier et désactiver mes entrées dans les listes personnel,
     chantier, intervenant. » Puis, sur mockup-listes-tri-desactivation.html
     validé : « bouton activer ok, ca me plait [...] ok pour les flèches de
     tri » + « possibilité de supprimer des éléments car certains chantier
     ou ouvriers peuvent ne plus revenir » (garder aussi une VRAIE
     suppression, en plus de désactiver) puis « bouton supprimer avec icone
     rouge suffit » (pas besoin d'une UI de confirmation plus élaborée que
     l'existante, demanderConfirmation() suffit).
     .cf-actions ↑/↓ repris à l'identique de .ligne-champ-form .cf-actions
     (page Entrée rapide) — nouvelle règle plutôt que d'élargir le sélecteur
     existant, qui ne visait QUE .ligne-champ-form (portée locale à ce
     panneau, sans lien avec .ligne-intervenant). */
  .ligne-intervenant .cf-actions { display: flex; align-items: center; gap: 2px; flex-shrink: 0; margin-right: 2px; }
  .ligne-intervenant .cf-actions button {
    background: none; border: none; color: var(--ink-faint); cursor: pointer;
    font-size: 12px; padding: 2px 5px; font-family: inherit; border-radius: 5px;
  }
  .ligne-intervenant .cf-actions button:hover:not(:disabled) { color: var(--accent); background: var(--bg); }
  .ligne-intervenant .cf-actions button:disabled { opacity: .3; cursor: default; }
  /* Interrupteur "Actif" par ligne : même patron que .interrupteur ci-dessus
     (déjà utilisé pour "Afficher les week-ends"), même classes — un seul
     jeu de règles pour les 2 usages, taille déjà adaptée à une ligne de
     liste (40x24). */
  .champ-actif {
    display: flex; align-items: center; gap: 7px; font-size: 11px; color: var(--ink-faint);
    font-family: 'IBM Plex Mono', monospace; text-transform: uppercase; letter-spacing: .03em;
  }
  .ligne-desactivee { opacity: .62; }
  .ligne-desactivee b { font-weight: 700; text-decoration: line-through; text-decoration-color: var(--ink-faint); }
  .lien-reactiver { font-size: 12px; font-weight: 700; color: var(--accent); cursor: pointer; background: none; border: none; font-family: inherit; padding: 0; }
  .lien-reactiver:hover { text-decoration: underline; }
  /* Suppression définitive (irréversible, cascade sur l'historique côté
     personnes — cf. supprimerPersonnePermanenceServeur) : uniquement
     proposée sur une ligne déjà désactivée, jamais sur une ligne active
     (il faut d'abord désactiver). Icône rouge + libellé, pas de 2e niveau
     d'UI — Lionel : « bouton supprimer avec icone rouge suffit ». */
  .lien-supprimer-def {
    display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 600;
    color: var(--important-ink); cursor: pointer; background: none; border: none; font-family: inherit; padding: 0;
  }
  .lien-supprimer-def:hover { text-decoration: underline; }
  .lien-supprimer-def svg { flex-shrink: 0; }
  .repli-desactives {
    display: flex; align-items: center; gap: 6px; margin-top: 10px; padding: 8px 4px; max-width: 520px;
    font-size: 11.5px; font-weight: 700; color: var(--ink-faint); cursor: pointer; background: none; border: none;
    font-family: 'IBM Plex Mono', monospace; text-transform: uppercase; letter-spacing: .04em;
  }
  .repli-desactives:hover { color: var(--ink-muted); }
  .repli-desactives .chevron { display: inline-block; transition: transform .15s; }
  .repli-desactives.ouvert .chevron { transform: rotate(90deg); }
  .groupe-desactives { display: flex; flex-direction: column; gap: 8px; margin-top: 8px; max-width: 520px; }

  .liste-formulaires { display: flex; flex-direction: column; gap: 8px; max-width: 640px; }
  .carte-form { display: flex; align-items: center; justify-content: space-between; padding: 12px 14px; border: 1px solid var(--border); border-radius: 10px; background: var(--surface-2); gap: 10px; flex-wrap: wrap; }
  .carte-form .gauche { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
  .carte-form b { font-size: 13.5px; }
  .carte-form .champs { font-size: 11px; color: var(--ink-faint); font-family: 'IBM Plex Mono', monospace; }
  .badge-intervenant { font-size: 10.5px; font-weight: 700; padding: 3px 9px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); white-space: nowrap; }
  .badge-type-absence { font-size: 10.5px; font-weight: 700; padding: 3px 9px; border-radius: 999px; background: var(--absence-bg); color: var(--ink); white-space: nowrap; }
  .carte-form .droite { display: flex; align-items: center; gap: 14px; flex-shrink: 0; }
  .lien-modifier, .lien-renommer { font-size: 12px; font-weight: 600; color: var(--ink-muted); cursor: pointer; background: none; border: none; font-family: inherit; padding: 0; }
  .lien-modifier:hover, .lien-renommer:hover { color: var(--accent); }
  .lien-supprimer { font-size: 12px; font-weight: 600; color: var(--ink-faint); cursor: pointer; background: none; border: none; font-family: inherit; padding: 0; }
  .lien-supprimer:hover { color: var(--important-ink); }
  .panneau-nouveau-form { margin-top: 16px; padding: 16px 18px; border: 1.5px dashed var(--border); border-radius: 12px; background: var(--surface); max-width: 420px; }
  .panneau-nouveau-form h3 { font-size: 12px; font-weight: 700; margin: 0 0 12px; color: var(--ink-muted); text-transform: uppercase; letter-spacing: .04em; }
  .champ-ligne { display: flex; flex-direction: column; gap: 4px; margin-bottom: 12px; }
  .champ-ligne label { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; color: var(--ink-faint); }

  .constructeur-champ input[type="text"] { font: inherit; font-size: 12.5px; padding: 8px 10px; border-radius: 7px; border: 1px solid var(--border); background: var(--surface-2); color: var(--ink); width: 100%; }

  .categorie .pastille-cat { -webkit-appearance: none; -moz-appearance: none; appearance: none; width: 16px; height: 16px; border-radius: 50%; background: var(--cat-couleur); flex-shrink: 0; border: 2px solid var(--surface-2); box-shadow: 0 0 0 1px var(--border); padding: 0; cursor: pointer; }
  .categorie .pastille-cat::-webkit-color-swatch-wrapper { padding: 0; border-radius: 50%; }
  .categorie .pastille-cat::-webkit-color-swatch { border: none; border-radius: 50%; }

  .calendrier-wrap { overflow-x: auto; max-width: 100%; }

  .calendrier th, .calendrier td { border: 1px solid var(--border); text-align: center; }
  .calendrier th { background: var(--surface); font-weight: 700; color: var(--ink-faint); padding: 4px 0; font-size: 10px; }
  .calendrier th.coin { background: var(--surface-2); }

  .calendrier td.jour { height: 24px; cursor: pointer; position: relative; background: var(--surface-2); }
  .calendrier td.jour:hover { box-shadow: inset 0 0 0 1.5px var(--accent); }

  /* ============================================================
     RÉINTÉGRATION V2 — décalage en masse, assignation groupée,
     impression/PDF (cf. FRONTEND-CHANGELOG.md). Fonctionnalités réelles de
     production que le portage V3 avait fait disparaître (le prototype V3
     ne les avait jamais eues à concevoir). Rendu avec le même vocabulaire
     visuel que le reste de l'appli (.pop/.voile-confirm/.chip-row/
     .label-champ/.confirm-boutons) plutôt que réintroduire les "sheets"
     plein écran de l'ancien Index.html V2.
     ============================================================ */

  .pop button.btn-primaire { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .pop button.btn-primaire:hover { filter: brightness(1.06); }
  .pop button.btn-primaire:disabled { opacity: .55; cursor: default; }

  .impression-modal { width: 900px; max-width: calc(100vw - 32px); max-height: calc(100vh - 40px); text-align: left; padding: 20px 22px; }
  .impression-modal .cp-titre { font-size: 13px; }
  .print-doc { background: var(--bg); border: 1px solid var(--border); border-radius: 10px; padding: 16px; font-size: 12px; }
  table.print-table { width: 100%; border-collapse: collapse; }
  table.print-table th, table.print-table td { border: 1px solid var(--border-strong); padding: 5px 7px; font-size: 11px; vertical-align: top; }
  /* Option A — bande de couleur par tâche (round du 16.09.2026, choisie par
     Lionel via AskUserQuestion pour représenter plusieurs chantiers sur la
     même case à l'impression, cf. infoCase/celluleTache dans openPrintSheet) :
     td.td-tache garde son fond (posé en style inline = couleur de la
     DERNIÈRE tâche de la case, cf. le commentaire détaillé sur celluleTache
     — un <td> est la seule chose qui remplit fiablement toute la hauteur de
     SA LIGNE dans un tableau à hauteur "auto" ; un enfant en % ne le peut
     pas, cf. ce même commentaire) mais devient un simple conteneur pour le
     PADDING (padding:0 ici, reporté sur .print-bande) : chaque tâche
     empilée dessine sa PROPRE bande pleine largeur, opaque, PAR-DESSUS ce
     fond. Une case à une seule tâche (l'immense majorité des cas) est donc
     visuellement identique à avant ce round : une seule bande, de la même
     couleur que le <td> lui-même, occupe toute la cellule. Plusieurs bandes
     dans la même case sont séparées par un mince trait (border-top plutôt
     que la bordure de grille normale, pour rester visible même quand 2
     bandes partagent la même couleur de chantier). */
  table.print-table td.td-tache { padding: 0; }
  table.print-table .print-bande { padding: 5px 7px; }
  table.print-table .print-bande + .print-bande { border-top: 1px solid var(--border-strong); }
  /* Portage du mockup d'affinage des bordures (mockup-impression-bordures.html,
     rounds 1 à 13, validés par Lionel le 15.09.2026 — "super, passe à la
     mise en place sur l'appli") : cadre extérieur du tableau à 2px, contre
     1px pour la grille intérieure (round du 16.09.2026 — voir juste
     ci-dessous : à l'origine 1.4px, changé le jour même). Écart voulu assez
     large pour ne pas se faire arrondir au même pixel par le moteur
     d'impression sous border-collapse (la bordure fine l'emporterait quand
     même — déjà rencontré sur ce fichier). Exclut les lignes spacer/
     spacer-section/notes : pas de cadre extérieur à afficher sur une ligne
     qui doit rester sans bordure ou sans trace de grille — même piège de
     "sélecteur plus spécifique qui regagne silencieusement" que documenté
     plus bas sur .print-spacer et .print-notes, d'où le ":not()" plutôt que
     de compter sur la règle de base pour perdre d'elle-même.

     round du 16.09.2026 — Lionel, sur un vrai PDF généré depuis le site en
     ligne : "sur un zoom à 100% les bordures sont de tailles différentes".
     Vérifié sur CE PDF précis (pas une capture d'écran, le fichier lui-même,
     mesuré pixel par pixel) : la même bordure de grille, à la même position
     logique (ex. la frontière Jeu17/Ven18), mesurait tantôt 2px, tantôt 3px
     de large selon la ligne personne où elle tombait (Lionel/François :
     2px — Mathis/Antoine : 3px), alors que le CSS est strictement
     identique aux 4 endroits. Cause : 1.4px n'est pas un nombre entier de
     pixels d'impression — le moteur (ici Skia/PDF, Chrome 152 côté Lionel)
     doit arrondir cette largeur à chaque ligne, et le point d'arrondi
     dépend de la position sous-pixel exacte de CETTE ligne dans la page
     (qui dérive légèrement d'une ligne personne à l'autre selon la hauteur
     cumulée du contenu au-dessus) — d'où un résultat qui varie alors que la
     règle ne varie pas. Reproduit à l'identique avec une bordure 1.4px dans
     un test isolé (4 lignes personne, même frontière verticale mesurée aux
     mêmes 4 positions x sur chacune) : passer cette largeur à 1px (entier)
     élimine la dérive dans ce test — les 4 lignes mesurent alors exactement
     la même largeur en pixels d'impression, quelle que soit leur position
     verticale. Répercuté partout où 1.4px servait de largeur de grille
     (règle ci-dessus, pointillé matin/aprem, cadre des notes remplies plus
     bas) : l'écart avec le cadre 2px reste net (toujours au-dessus du seuil
     qui se ferait absorber par l'arrondi, cf. paragraphe précédent) tout en
     gardant chaque largeur individuellement stable. */
  table.print-table thead tr:first-child th { border-top: 2px solid var(--border-strong); }
  table.print-table tbody tr:last-child td { border-bottom: 2px solid var(--border-strong); }
  table.print-table tr:not(.print-spacer):not(.print-spacer-section):not(.print-notes) th:first-child,
  table.print-table tr:not(.print-spacer):not(.print-spacer-section):not(.print-notes) td:first-child {
    border-left: 2px solid var(--border-strong);
  }
  table.print-table tr:not(.print-spacer):not(.print-spacer-section):not(.print-notes) th:last-child,
  table.print-table tr:not(.print-spacer):not(.print-spacer-section):not(.print-notes) td:last-child {
    border-right: 2px solid var(--border-strong);
  }
  /* round du 15.09.2026 — Lionel : "la ligne des dates en grisé comme la
     colonne des noms" — fond neutre plutôt que --jalon-bg (violet, déjà le
     code couleur de la ligne Jalons juste en dessous : le réutiliser ici
     n'avait pas de sens et prêtait à confusion). var(--bg) est exactement
     la teinte déjà visible dans la colonne des noms (celle-ci n'a jamais eu
     de fond propre, donc montre par transparence le fond de .print-doc). */
  table.print-table thead th { background: var(--bg); font-weight: 700; text-align: center; }
  /* Ligne mois (round du 15.09.2026, suite — "rajouter une ligne mois,
     l'année peut être placée dans la cellule haut gauche") : un cran plus
     discret que la ligne jour/date juste en dessous (petite majuscule,
     encre atténuée) pour ne pas rivaliser avec elle — c'est un repère,
     pas l'information principale de l'en-tête. */
  .print-mois th { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; color: var(--ink-muted); }
  .print-mois .coin-annee { text-align: left; padding-left: 7px; }
  /* .coin-semaine (round du 15.09.2026, suite — "Inscription semaine N
     dans la case sous l'année") : même traitement que .coin-annee juste
     au-dessus (dont elle reprend aussi l'alignement à gauche), pour que
     "2026" et "Semaine 38" se lisent comme un seul bloc de repère dans le
     coin, plutôt que comme 2 styles différents empilés au hasard.
     Sélecteur "table.print-table .coin-semaine" (pas juste ".coin-semaine")
     — même bug de spécificité qu'ailleurs dans ce fichier : la règle
     générale "table.print-table thead th" (1 classe + 3 types) écrasait
     silencieusement le text-align:left d'un simple ".coin-semaine" (1
     classe, 0 type) et "Semaine 38" restait centré au lieu d'être aligné
     avec "2026" et les noms de personnes juste en dessous (repéré sur un
     PDF réel, pas au premier coup d'œil dans le code). */
  table.print-table .coin-semaine { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; color: var(--ink-muted); text-align: left; padding-left: 7px; }
  /* Sous-en-tête Matin/Aprem (round du 15.09.2026, suite — "l'affichage
     matin/après-midi côte à côte, comme le planning") : même traitement
     discret que la ligne mois, pour ne pas rivaliser avec la ligne
     jour/date juste au-dessus (l'info qu'on cherche en premier sur la
     feuille reste "quel jour", pas "matin ou aprem"). */
  .print-demis th { font-size: 9.5px; font-weight: 600; text-transform: uppercase; letter-spacing: .03em; color: var(--ink-faint); padding-top: 3px; padding-bottom: 3px; }
  /* Portage mockup — colonne des noms : bordure DROITE de la 1ère colonne
     (noms/"Jalons"/"Notes") aussi à 2px, pour la détacher nettement de la
     grille des jours. Exclut .print-demis (ligne Matin/Aprem — pas de
     cellule à elle dans la colonne des noms, rowspan=2 de .coin-semaine posé
     sur la ligne au-dessus, cf. openPrintSheet) : sans cette exclusion, le
     premier "Matin" hériterait à tort de ce 2px, en conflit avec le
     pointillé matin/aprem juste à côté (même largeur) — bug repéré dans le
     mockup, visible seulement sur le 1er jour de la semaine. */
  table.print-table tr:not(.print-spacer):not(.print-spacer-section):not(.print-demis):not(.print-notes) th:first-child,
  table.print-table tr:not(.print-spacer):not(.print-spacer-section):not(.print-demis):not(.print-notes) td:first-child {
    border-right: 2px solid var(--border-strong);
  }
  .print-jalons td { background: var(--surface-2); }
  .print-jalons td.filled { background: var(--jalon-bg); }
  /* round du 15.09.2026 (suite) — Lionel : "ligne entre personnel fine et
     vide, sans couleur". Le sélecteur juste au-dessus
     (table.print-table th, table.print-table td) a une spécificité de
     (0,1,2) : plus élevée que ".print-spacer td" seul, (0,1,1) — il gagnait
     donc silencieusement et affichait un trait plein là où "border: none"
     était déjà écrit. Ajout de "table.print-table tr" pour repasser devant,
     (0,1,3), sans toucher au reste (padding/height inchangés). */
  table.print-table tr.print-spacer td { border: none; padding: 0; height: 6px; }
  /* round du 15.09.2026 (suite) — Lionel : "Ligne entre personnel et
     intervenants, vide et sans couleur aussi, un peu plus large que celle
     entre le personnel pour bien voir la distinction" — même séparateur
     invisible que .print-spacer (aucune bordure/couleur : la règle
     ci-dessus s'applique déjà, .print-spacer-section vient toujours en
     plus, jamais seule), juste plus haut ; uniquement à la frontière
     Personnel/Intervenants (cf. openPrintSheet, indexFrontiereSection). */
  table.print-table tr.print-spacer-section td { height: 14px; }
  /* Portage mockup (rounds 7 à 10) — 3 nouvelles lignes de repère, toutes à
     2px : (1) sous Jalons, posée sur le PREMIER spacer qui suit la ligne
     Jalons (classe print-spacer-jalons — qu'il s'agisse du spacer avant
     Notes si elle est remplie, ou directement du spacer avant la 1ère
     personne sinon, cf. openPrintSheet) ; (2) au-dessus de CHAQUE personne/
     intervenant, posée en border-BOTTOM sur le spacer qui la précède
     (classe print-spacer-personne) — pas border-top, qui collerait au
     contraire à la ligne du DESSUS (bug rencontré et corrigé dans le
     mockup, round 9) : border-bottom colle bien à la personne SUIVANTE,
     avec l'espace neutre du spacer restant visible avant, côté ligne
     précédente ; (3) en bas de CHAQUE ligne personne/intervenant elle-même
     (round 10), en plus du 2px déjà en haut via (2) — chaque personne se
     retrouve ainsi encadrée en haut ET en bas, séparée de la suivante par
     l'espace neutre du spacer. */
  table.print-table tr.print-spacer.print-spacer-jalons td { border-top: 2px solid var(--border-strong); }
  table.print-table tr.print-spacer.print-spacer-personne td { border-bottom: 2px solid var(--border-strong); }
  table.print-table tbody tr:not(.print-jalons):not(.print-notes):not(.print-spacer):not(.print-spacer-section) td {
    border-bottom: 2px solid var(--border-strong);
  }
  /* round du 15.09.2026 (suite) — Lionel : "traitillé entre aprèm et
     matin", puis (round suivant) "le traitillé de la demi-journée plus fin
     et discret". Seule la frontière INTERNE matin→aprem (bordure gauche de
     la sous-colonne Aprem, classe .demi-aprem posée à la fois sur le
     sous-en-tête et sur chaque cellule aprem — cf. openPrintSheet) doit
     paraître traitillée ; la frontière entre 2 jours (bordure gauche de la
     sous-colonne Matin du jour suivant, sans cette classe) doit elle rester
     pleine, sans quoi on ne distinguerait plus un changement de jour d'un
     simple changement de demi-journée.
     PAS un vrai "border-left: dashed" sur la cellule (essayé au round
     précédent) : avec border-collapse: collapse, la bordure d'une cellule
     et celle de sa voisine partagent le même trait, et le conflit se
     résout d'abord par la largeur AVANT le style — donc pour gagner face
     au trait plein 1.4px de la case Matin voisine, il fallait une largeur
     sensiblement plus grande (2px), sans quoi navigateur/impression
     arrondissaient les 2 largeurs au même pixel et le plein l'emportait
     quand même (constaté sur un PDF réel à 1.6px : toujours plein, malgré
     "dashed" bien annoncé par getComputedStyle). Mais 2px de large, c'est
     justement ce que Lionel trouve trop épais/voyant une fois imprimé — et
     rien entre 1.4 et 2px n'est fiable.
     2 étapes séparées, cette fois : (1) la bordure RÉELLE de la cellule
     (celle qui participe au collapse) est repassée à une largeur qui gagne
     de façon fiable (2px), mais en couleur TRANSPARENTE — elle "gagne"
     toujours le conflit, mais ne dessine plus rien : le trait plein sombre
     du reste du tableau disparaît à cette frontière précise, sans laisser
     de résidu visible dans les tirets du pointillé (piège du 1er essai :
     un ::before dessiné PAR-DESSUS le trait plein d'origine ne masque que
     ses propres tirets "pleins" — le sombre continuait à apparaître DANS
     les espaces vides entre 2 tirets, donnant un trait bicolore pleins/
     tirets au lieu d'un pointillé propre). (2) un ::before purement
     décoratif, hors du système de bordures de la table, dessine ENSUITE le
     vrai pointillé sur ce fond redevenu neutre.
     Couleur (round suivant) — Lionel : "je ne suis pas convaincu par ce
     pointillé, tu peux le laisser noir mais plus fin" : essayé en
     var(--border) (plus doux que le reste du tableau, cf. plus haut) au
     round précédent, mais moins lisible que voulu — remis en noir
     (var(--border-strong), la même encre que tout le reste du tableau),
     seule la LARGEUR reste réduite (1px, contre 1.4px pour les autres
     bordures à l'époque de ce round — la grille est passée à 1px aussi
     depuis, cf. round du 16.09.2026 documenté plus haut ; paragraphe
     conservé tel quel pour l'historique, cf. la suite de ce commentaire où
     cette technique est de toute façon remplacée) : c'est elle qui rend le
     trait "plus fin", pas sa couleur.
     Portage du mockup (rounds 11 et 13) — 2 bugs latents découverts en
     poussant plus loin l'affinage des bordures dans le mockup, tous deux
     déjà présents ici avec la technique ci-dessus ("2px transparent qui
     gagne le collapse") mais jamais remarqués en prod avant ce round-là :
     (1) sous border-collapse, le fond propre d'une case s'arrête à la
     moitié de l'épaisseur de SA bordure — ici 2px transparent, donc 1px de
     chaque côté où aucune case adjacente ne peint son propre fond : ce qui
     apparaît dans cette bande n'est donc ni le bleu chantier, ni l'orange
     absence, ni le blanc surface-2 de la case, mais le fond de l'ancêtre
     (blanc à l'impression, cf. .impression-modal dans @media print) qui
     transparaît par-dessous — un mince trait blanc parasite, quelle que
     soit la couleur de la case. (2) border-collapse ne résout pas
     seulement le conflit de largeur le LONG de la frontière verticale,
     mais aussi À CHAQUE CROISEMENT avec une bordure horizontale : notre
     transparent 2px, plus large que la base 1.4px, gagne aussi ces
     croisements-là (haut ET bas de chaque case), rendant transparente une
     largeur de 2px de la ligne horizontale exactement à cet endroit — une
     coupure visible dans TOUTES les lignes horizontales qui croisent la
     frontière matin/aprem (d'autant plus visible maintenant que les
     lignes 2px personne/jalons ci-dessus la croisent aussi). Diagnostiqué
     et corrigé dans le mockup en désactivant isolément chaque suspect
     (cf. son historique de commits) : aucun réglage de pseudo-élément ne
     peut corriger (2), qui vient de la déclaration border-collapse
     elle-même — il fallait renoncer au calcul "transparent qui gagne le
     collapse".
     Remplacé par une frontière NORMALE (1.4px solid, comme n'importe
     quelle autre ligne intérieure de la grille) : aucun conflit de largeur
     avec la case voisine, donc les croisements avec les lignes
     horizontales redeviennent des croix de grille banales, sans coupure —
     (2) réglé structurellement. Le pointillé devient un pur habillage
     décoratif PAR-DESSUS cette ligne normale, cantonné loin des bords de
     la case (2px d'inset haut/bas, largement suffisant pour rester à
     distance de sûreté de n'importe quelle bordure horizontale du fichier,
     1.4px normale ou 2px pour les séparateurs personne/jalons, le cas le
     plus épais) : ::before peint le fond réel de la case pour effacer
     visuellement le trait plein dans cette zone — (1) réglé, plus de
     résidu blanc, seulement le fond de la case ou du dégradé ci-dessous ;
     ::after, par-dessus, dessine le VRAI motif décoratif dans un inset
     encore plus réduit (3px). Style (round suivant, portage) — Lionel a
     choisi le motif en POINTS du mockup final plutôt que de garder les
     tirets déjà en place ici : dégradé répété 1.4px/2px (au lieu de
     bordure dashed) pour dessiner ces points, seule différence entre cette
     règle et le fichier mockup (qui, lui, travaillait sur une grille de
     base à 1px, cf. son propre historique de rounds pour le détail complet
     du diagnostic).
     Largeurs 1.4px → 1px (round du 16.09.2026, cf. le commentaire détaillé
     sur la règle de base de la grille, plus haut) : même correctif que le
     reste du fichier, pour la même raison — 1.4px n'étant pas un nombre
     entier de pixels d'impression, ces largeurs subissaient la même dérive
     d'arrondi (2px/3px selon la ligne) que la grille elle-même.
     Flou du pointillé (round du 16.09.2026, suite) — Lionel, après le
     correctif ci-dessus : "L'impression est bonne mais les pointillés
     paraissent floues". Cause : le dégradé linear-gradient utilisé ci-dessous
     pour dessiner les points est, par construction, un contenu interpolé en
     douceur (un dégradé de couleur, pas un tracé) — à l'échelle minuscule de
     ce motif (1px/2px), le moteur de rendu PDF (Skia/PDF) anti-aliase
     fortement chaque transition couleur→transparent, ce qui donne un halo
     gris/brunâtre flou autour de chaque point au lieu d'un point net.
     Confirmé par une comparaison contrôlée (3 techniques rendues en PDF réel
     à 400dpi puis zoomées au pixel près) : le dégradé est nettement flou/
     auréolé, alors que border-style: dotted et dashed — des traits vectoriels
     de première classe, que le navigateur rend nets par nature — ne le sont
     pas ; confirmé aussi directement sur un PDF réel envoyé par Lionel (zoom
     pixel sur la frontière Rhabillages/Maçonnerie de la ligne Mathis) : les
     mêmes taches grises floues apparaissent entre les points.
     Remplacé le dégradé par un vrai border-left: dotted (width: 0 sur
     l'élément lui-même, la largeur du trait étant portée par border-left) :
     le point reste aussi discret et fin qu'avant (1px, cohérent avec la
     grille elle-même passée à 1px ci-dessus) mais net, sans flou, quelle que
     soit la résolution d'impression.

     Round du 16.09.2026 (Option A, bande de couleur par tâche) — .demi-aprem
     reste posée sur le <td> lui-même, comme avant ce round (essayé un temps
     sur chaque .print-bande individuellement pour un masquage parfait
     bande-par-bande, abandonné : ça dépendait du même correctif de hauteur
     par % qui s'est avéré ne pas marcher dans un tableau à hauteur "auto",
     cf. le commentaire détaillé sur celluleTache). `background-color:
     inherit` (::before, juste en dessous) reprend donc le fond du <td>
     — désormais la couleur de la DERNIÈRE tâche de la case (cf. même
     commentaire) plutôt qu'un unique chantier de case comme avant ce round.
     Sur une case à une seule tâche (l'immense majorité des cas), c'est
     exactement la même couleur qu'avant : aucun changement visible. Sur une
     case à PLUSIEURS bandes de couleurs différentes côté aprem (rare), le
     masquage/pointillé reprend la couleur de la dernière bande sur toute la
     hauteur plutôt que celle d'une bande du dessus — imperfection mineure
     déjà actée dans ce même commentaire, à l'endroit exact où elle se
     produit (un pixel de large, au bord partagé avec la case voisine). */
  table.print-table .demi-aprem { position: relative; }
  table.print-table .demi-aprem::before {
    content: ""; position: absolute; left: -1px; top: 2px; bottom: 2px; width: 1px;
    background-color: inherit;
  }
  table.print-table .demi-aprem::after {
    content: ""; position: absolute; left: -1px; top: 3px; bottom: 3px; width: 0;
    border-left: 1px dotted var(--border-strong);
  }
  /* Portage mockup (round 5) — même piège de spécificité que .print-spacer
     documenté plus haut : ".print-notes td" (1 classe + 1 type) était battu
     par la règle de base "table.print-table th, table.print-table td" (1
     classe + 2 types), qui gagnait donc silencieusement et affichait un
     cadre 1.4px (1px depuis le round du 16.09.2026, cf. plus haut) plein
     sur chaque case vide de la ligne Notes malgré ce "border:none" bien
     présent ici. Porté au même gabarit que le reste du fichier
     (table.print-table tr.XXX td, 2 classes) pour gagner de façon fiable,
     tout en restant sous les règles de cadre extérieur 2px (première/
     dernière colonne) qui, elles, doivent continuer à gagner sur cette
     ligne (cf. leur propre exclusion ":not(.print-notes)" plus haut). */
  table.print-table tr.print-notes td { border: none; padding: 0 7px; }
  table.print-table tr.print-notes td.filled { border: 1px solid var(--border-strong); background: var(--note-bg); padding: 4px 7px; }
  .print-statut { display: inline-block; font-size: 9px; font-weight: 700; text-transform: uppercase; letter-spacing: .02em; padding: 1px 6px; border-radius: 999px; margin-top: 3px; }
  .print-important { color: var(--important-ink); font-weight: 700; }
  .print-legend { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--border); }
  .print-legend .legend-item { display: flex; align-items: center; gap: 6px; font-size: 11.5px; color: var(--ink); }
  .print-legend .legend-item .sw { width: 13px; height: 13px; border-radius: 3px; box-shadow: inset 0 0 0 1px rgba(0,0,0,.15); }
  .skip-note { font-size: 11.5px; color: var(--ink-faint); font-style: italic; margin-top: 10px; }
  .impression-actions { display: flex; gap: 10px; margin-top: 16px; justify-content: flex-end; }

  /* round du 15.09.2026 — Lionel : "on peut travailler sur la page
     d'impression ?", puis "impression du navigateur" une fois le choix
     posé (cf. FRONTEND-CHANGELOG.md). apiGenererPdf (Google Apps
     Script/Drive) n'a pas d'équivalent une fois hébergé sur GitHub Pages —
     le bouton "Générer le PDF" appelait déjà gs("apiGenererPdf", ...), qui
     lève systématiquement une exception rattrapée par le try/catch de
     openPrintSheet() (cf. plus bas) depuis ce round-ci du portage. Plutôt
     que d'écrire une fonction serveur dédiée (Edge Function) pour
     reconstruire un PDF depuis zéro, le bouton déclenche maintenant
     l'impression du NAVIGATEUR directement sur l'aperçu déjà affiché :
     dans la boîte qui s'ouvre, "Enregistrer en PDF" comme imprimante donne
     exactement le même fichier qu'avant, sans aucun aller-retour serveur.
     Règles ci-dessous : tout ce qui n'est pas l'aperçu (l'appli en
     dessous, le voile sombre, les boutons Fermer/Générer eux-mêmes) est
     masqué à l'impression ; la modale, normalement centrée en
     position:fixed avec une hauteur plafonnée + défilement (cf. .pop),
     redevient un document normal qui peut s'étaler sur plusieurs pages ;
     les couleurs restent celles du mode CLAIR même si Lionel a le mode
     sombre activé à l'écran (imprimer un fond sombre gâcherait l'encre et
     la lisibilité sur papier) ; -webkit-print-color-adjust/print-color-adjust
     forcent l'impression des couleurs de chantier (sans ça, certains
     navigateurs les omettent par défaut pour économiser l'encre — ici
     elles sont le seul repère visuel du chantier). Format paysage par
     défaut (table large de 5 à 10 jours) — Lionel garde la main pour
     changer dans la boîte du navigateur si besoin. */
  @media print {
    /* overlay (.voile-confirm) et modale (.impression-modal) sont 2 enfants
       DIRECTS de <body>, pas l'un dans l'autre (cf. openPrintSheet : 2
       appendChild(document.body) séparés) — cette règle masque tout le
       reste de la page (l'appli, toute autre modale déjà ouverte), sans
       rien supposer de plus sur la structure. */
    body > *:not(.voile-confirm):not(.impression-modal) { display: none !important; }
    /* Fond de <body> forcé en blanc : sans ça, la teinte --bg (claire mais
       pas blanche, cf. :root plus haut — encore plus visible en mode
       sombre) remplit toute la page autour du document, gaspille de
       l'encre et ne ressemble pas à du papier. */
    body { background: #fff !important; }
    .voile-confirm { position: static !important; background: none !important; }
    .impression-modal {
      position: static !important; transform: none !important; left: auto !important; top: auto !important;
      width: auto !important; max-width: none !important; max-height: none !important; overflow: visible !important;
      box-shadow: none !important; border: none !important; margin: 0 !important;
      --bg: #eef0ec; --surface: #fbfaf7; --surface-2: #ffffff;
      --ink: #1a2129; --ink-muted: #57616b; --ink-faint: #8b93a0;
      --border: #d7dad2; --border-strong: #1a2129;
      --important-ink: #93362b; --absence-bg: #f6c893; --jalon-bg: #d7cdf0; --note-bg: #f7e6ab;
      color: var(--ink); background: #fff;
    }
    .impression-actions { display: none !important; }
    /* round du 15.09.2026 (suite) — Lionel : "Il reste une grande fenêtre
       rectangle sous le planning, la supprimer. je veux un fond blanc et
       uni". .print-doc est une carte pensée pour l'APERÇU À L'ÉCRAN (fond
       légèrement teinté, bordure arrondie, cf. règle de base plus haut) —
       une fois sur le papier, cette carte devient un grand rectangle
       visible autour (et sous) le tableau, sur un fond qui n'est jamais
       tout à fait blanc. À l'impression uniquement (l'aperçu à l'écran
       garde sa carte, utile pour se repérer avant d'imprimer) : plus de
       bordure, plus de coins arrondis, plus de fond teinté — juste le
       tableau posé à même la page, sur le blanc uni du papier (déjà forcé
       plus haut sur body). Le padding de la carte est retiré aussi (la
       modale elle-même en garde un, cf. .impression-modal, et la marge de
       @page ci-dessous) pour ne pas laisser un cadre de respiration qui
       ferait encore deviner l'ancienne carte. */
    .print-doc { background: #fff; border: none; border-radius: 0; padding: 0; }
    /* Lionel : "Pas besoin de aperçu avant impression - semaine N, ni de
       la légende de la personne masquée" — 2 mentions utiles pour se
       repérer À L'ÉCRAN avant d'imprimer (quelle semaine ? qui a été
       masqué et pourquoi ?) mais qui n'ont rien à faire sur le document
       final une fois imprimé — masquées ici plutôt que retirées de
       l'aperçu à l'écran, où elles restent affichées. */
    .cp-titre, .skip-note { display: none !important; }
    .print-doc, table.print-table, table.print-table th, table.print-table td {
      -webkit-print-color-adjust: exact; print-color-adjust: exact; color-adjust: exact;
    }
    table.print-table { page-break-inside: auto; }
    table.print-table tr { page-break-inside: avoid; }
    @page { size: landscape; margin: 12mm; }
  }
</style>

     UI/UX (double-clic, glisser, séries, undo/redo…) sans le
     réécrire intégralement.

     tableaux ne sont plus la source de vérité. Ils sont RECONSTRUITS
     à chaque chargement depuis les données serveur (etat.cache, une

     déclenche automatiquement la synchronisation.

     retrouvée en relisant etat.cache au moment de la synchronisation.

  var app = document.getElementById("app");
  var progressEl = document.getElementById("progress");
  var toastEl = document.getElementById("toast");
  var toastTimer = null;

  function toast(msg) {
    if (!msg) return;
    toastEl.textContent = msg;
    toastEl.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toastEl.classList.remove("show"); }, 2600);
  }

  /* ============ APPELS SERVEUR ============ */
  // gs(fn, args, onOk, onErr) — wrapper conservé tel quel depuis Index.html V2.
  function gs(fn, args, onOk, onErr) {
    google.script.run
      .withSuccessHandler(onOk)
      .withFailureHandler(onErr || erreurFatale)
      [fn].apply(null, args || []);
  }
  var occupations = 0;
  function occupe(actif) {
    occupations = Math.max(0, occupations + (actif ? 1 : -1));
    progressEl.classList.toggle("on", occupations > 0);
  }
  // Petit wrapper "promesse" pour enchaîner/attendre une suite d'appels gs()
  // sans réécrire la gestion occupe()/erreur à chaque fois (utilisé par le
  // moteur de synchronisation, cf. plus bas).
  function gsP(fn, args) {
    return new Promise(function (resolve, reject) {
      occupe(true);
      gs(fn, args, function (r) { occupe(false); resolve(r); }, function (err) { occupe(false); reject(err); });
    });
  }

  // invoquerFonctionServeur(nom, body) — équivalent gsP() pour les 4 Edge
  // Functions déjà déployées (phase 4, étape 4, cf. MIGRATION-GITHUB-PLAN.md
  // §6bis) : appelle sbClient.functions.invoke(nom, {body}) et renvoie une
  // promesse qui résout avec `data` ou rejette avec une vraie Error, dans
  // les DEUX cas d'échec possibles (vérifié dans le code source de
  // @supabase/functions-js@2.115.0, aucun moyen de tester contre le vrai
  // réseau depuis cet environnement) :
  //  - échec de TRANSPORT (réseau, fonction plantée, 4xx/5xx) : sbClient
  //    attache déjà le JWT de la session active (this.functionsFetch lit le
  //    token au moment de l'appel, cf. SupabaseClient.ts) — pas besoin de le
  //    passer à la main. Un code HTTP non-2xx devient un FunctionsHttpError
  //    dans `error`, PAS un data.ok===false : les 4 fonctions renvoient
  //    TOUJOURS un statut non-2xx sur erreur métier (cf. leur index.ts,
  //    fonction json(body, status)), jamais 200+ok:false en pratique — mais
  //    error.message est le générique "Edge Function returned a non-2xx
  //    status code", pas le vrai message ; on relit le corps JSON
  //    ({ok:false, erreur:"..."}) pour remonter le vrai texte au toast.
  //  - échec MÉTIER renvoyé en 200 (n'arrive avec aucune des 4 fonctions
  //    actuelles, mais le contrat documenté dans le plan l'autorise) :
  //    data.ok === false, géré séparément.
  function invoquerFonctionServeur(nom, body) {
    occupe(true);
    return sbClient.functions.invoke(nom, { body: body }).then(function (res) {
      occupe(false);
      if (res.error) {
        var ctx = res.error.context; // objet Response cloné par functions-js
        if (ctx && typeof ctx.json === "function") {
          return ctx.json().then(
            function (corps) { throw new Error((corps && corps.erreur) || res.error.message); },
            function () { throw new Error(res.error.message || String(res.error)); }
          );
        }
        throw new Error(res.error.message || String(res.error));
      }
      if (res.data && res.data.ok === false) throw new Error(res.data.erreur || "Échec.");
      return res.data;
    }, function (err) { occupe(false); throw err; });
  }

  function afficherChargement(msg) {
    app.innerHTML = '<div class="loading-screen"><div class="spin"></div><div class="msg">' + esc(msg || "Chargement du planning…") + '</div></div>';
  }
  function erreurFatale(err) {
    var texte = (err && err.message) ? err.message : String(err);
    app.innerHTML =
      '<div class="error-screen">' +
      '<div class="mark-err">' + ICONS.close + '</div>' +
      '<h2>Impossible de charger le planning</h2>' +
      '<p>' + esc(texte) + '</p>' +
      '<button class="btn-primary" id="retryBtn" style="padding:9px 16px;border-radius:9px;border:1px solid var(--border);background:var(--accent);color:var(--accent-ink);cursor:pointer;font-weight:600;">Réessayer</button>' +
      '</div>';
    document.getElementById("retryBtn").addEventListener("click", demarrer);
  }

  /* ============ ÉTAT SERVEUR ============ */
  var etat = {
    // [{labG, num, debut, fin}] — plus renvoyé par le serveur depuis la
    // phase 4/étape 2 (chargement) : labG n'est plus qu'une coordonnée
    // CLIENT (le lundi de la semaine, en YYYYMMDD entier), et la liste
    // entière est calculée localement par genererSemaines() — cf. plus bas,
    // section "CHARGEMENT DEPUIS SUPABASE (phase 4, étape 2)".
    semaines: [],
    indexSemaine: -1,
    aujourdhui: "",
    chantiers: [],          // [{nom, couleur, ligne}] — ligne = chantiers.id (Supabase), cf. demarrer()
    chantierParNom: {},
    palette: [],
    statutsServeur: [],     // [{cle, nom, couleur, ordre}]
    formulairesRapidesServeur: [], // [{nom, ordre, champs:[...]}]
    feriesServeur: [],      // [{iso, libelle, categorie}]
    categoriesFeriesServeur: [], // [{id,nom,couleur}] (table `categories_feries`, sql/0005) — [] si absente/vide, cf. catsFeries(), repli sur CATEGORIES_FERIES_DEFAUT
    // Personnes actives (table `personnes`, actif=true), chargées UNE FOIS
    // au bootstrap (demarrer()) et réutilisées par chaque chargement de
    // semaine (chargerSemaineDepuisServeur) — pas de re-requête par semaine.
    personnesActives: [],   // [{id, nom, sous_traitant, ordre}]
    // Lookups id -> valeur affichable, construits au bootstrap à partir de
    // `chantiers`/`statuts` — évitent de renvoyer des id bruts jusque dans
    // la vue (le contrat de chargerSemaine_/construireVueDepuisCache attend
    // des NOMS de chantier et des CLÉS de statut, jamais des id).
    chantiersParId: {},     // {id: nom}
    statutsParId: {},       // {id: cle}
    // Sens inverse (étape 4 du §6bis, migration hors Google) : le SEUL
    // lookup nécessaire pour ça — un chantier a déjà son id via
    // etat.chantierParNom[nom].ligne, cf. plus bas — car les tables
    // `chantiers`/`statuts` telles que rangées ici perdent l'id une fois
    // ramenées à {nom}/{cle} pour l'affichage.
    statutIdParCle: {},     // {cle: id}
    // Semaines déjà chargées, par labG — même cache scopé que V2
    // (FRAICHEUR_MS, invalidation "semaine"/"suivantes"/"tout").
    cache: {},
    cacheTs: {}
  };
  var FRAICHEUR_MS = 90 * 1000;

  function mettreEnCache(data) {
    etat.cache[data.labG] = data;
    etat.cacheTs[data.labG] = Date.now();
  }
  function oublierCache(labGDepuis) {
    if (labGDepuis == null) { etat.cache = {}; etat.cacheTs = {}; return; }
    Object.keys(etat.cache).forEach(function (k) {
      if (+k >= labGDepuis) { delete etat.cache[k]; delete etat.cacheTs[k]; }
    });
  }

  /* ============ FENÊTRE AFFICHÉE (1 ou 2 semaines) ============ */
  function fenetreLabGs() {
    var out = [etat.semaines[etat.indexSemaine].labG];
    if (deuxSemaines && etat.semaines[etat.indexSemaine + 1]) out.push(etat.semaines[etat.indexSemaine + 1].labG);
    return out;
  }
  function fenetreDonnees() { return fenetreLabGs().map(function (lg) { return etat.cache[lg]; }); }
  function fenetrePrete() { return fenetreDonnees().every(Boolean); }

  // S'assure que toutes les semaines de la fenêtre actuellement demandée
  // (1 ou 2, selon deuxSemaines) sont en cache et fraîches, en va-et-vient
  // avec le serveur si besoin, puis appelle cb().
  // Phase 4/étape 2 : gs("apiChargerSemaine", ...) remplacé par un appel
  // direct à chargerSemaineDepuisServeur() (requêtes Supabase par plage de
  // dates, cf. section "CHARGEMENT DEPUIS SUPABASE" plus bas) — même
  // contrat vis-à-vis de l'appelant (résout toujours, jamais de rejet qui
  // remonterait jusqu'ici, cf. .catch ci-dessous).
  function assurerFenetreChargee(cb) {
    var labs = fenetreLabGs();
    var manquantes = labs.filter(function (lg) {
      var ts = etat.cacheTs[lg];
      return !etat.cache[lg] || !ts || (Date.now() - ts) >= FRAICHEUR_MS;
    });
    if (!manquantes.length) { cb(); return; }
    occupe(true);
    Promise.all(manquantes.map(function (lg) {
      return chargerSemaineDepuisServeur(lg).then(function (data) { mettreEnCache(data); },
        function (err) { if (!etat.cache[lg]) toast("Échec du chargement de la semaine : " + (err && err.message ? err.message : err)); });
    })).then(function () { occupe(false); cb(); });
  }

  /* ============ DATES RÉELLES <-> gi (coordonnée d'affichage) ============
     Cf. §1 du spec : gi n'est qu'une coordonnée d'affichage, recalculée à
     chaque chargement de fenêtre — jamais une identité stockée. */
  function isoDeDate(d) {
    var y = d.getFullYear(), m = d.getMonth() + 1, day = d.getDate();
    return y + "-" + (m < 10 ? "0" : "") + m + "-" + (day < 10 ? "0" : "") + day;
  }
  // Affichage suisse/français DD.MM.AAAA d'une date ISO (YYYY-MM-DD) — retour
  // de Lionel du 03.09.2026 : la popup "Aller à…" affichait jusqu'ici les
  // dates ISO brutes reçues du serveur (ex. "2026-09-01"), à changer pour
  // "dd.mm.aaaa".
  function isoAffiche(iso) {
    if (!iso || iso.length !== 10) return iso || "";
    var p = iso.split("-");
    return p[2] + "." + p[1] + "." + p[0];
  }
  function labGDeGi(gi) {
    var labs = fenetreLabGs();
    return estGiWeekend(gi) ? labs[semaineDuGiWeekend(gi)] : labs[Math.floor(gi / 5)];
  }
  function jourIdxDeGi(gi) {
    // 0..4 = lundi..vendredi (comme le backend, cf. apiEnregistrerCellulePersonne
    // historique) ; 6 = samedi, 7 = dimanche (extension §2 du spec — les DEUX
    // routent vers la même colonne fusionnée côté feuille).
    if (estGiWeekend(gi)) return jourWeekendIdx(gi) === 0 ? 6 : 7;
    return gi % 5;
  }
  function isoDeGi(gi) {
    var lab = labGDeGi(gi), data = etat.cache[lab];
    if (!data) return null;
    if (estGiWeekend(gi)) {
      var d0 = new Date(data.isoDates[0] + "T00:00:00");
      d0.setDate(d0.getDate() + 5 + jourWeekendIdx(gi));
      return isoDeDate(d0);
    }
    return data.isoDates[gi % 5];
  }
  // Round D — inverse d'isoDeGi : cherche `iso` dans la fenêtre ACTUELLEMENT
  // affichée (1 ou 2 semaines, cf. fenetreDonnees) et renvoie le `gi`
  // correspondant, ou null si cette date ne s'y trouve pas (cf.
  // cablerCalendrierDate, qui gère alors la navigation vers la bonne
  // semaine avant de rappeler cette fonction). Même découpage gi que
  // labGDeGi/estGiWeekend : jours ouvrés en `si*5+j`, week-end en
  // `1000 + si*2 + (0|1)`, `si` = index de semaine DANS la fenêtre (0 ou 1).
  function giDepuisIso(iso) {
    var donnees = fenetreDonnees();
    for (var si = 0; si < donnees.length; si++) {
      var data = donnees[si];
      if (!data || !data.isoDates) continue;
      for (var j = 0; j < 5; j++) if (data.isoDates[j] === iso) return si * 5 + j;
      if (data.isoDates[0]) {
        var lundi = new Date(data.isoDates[0] + "T00:00:00");
        var sam = new Date(lundi.getTime()); sam.setDate(sam.getDate() + 5);
        var dim = new Date(lundi.getTime()); dim.setDate(dim.getDate() + 6);
        if (isoDeDate(sam) === iso) return 1000 + si * 2;
        if (isoDeDate(dim) === iso) return 1000 + si * 2 + 1;
      }
    }
    return null;
  }
  // Jour ouvré voisin (lun-ven, jamais samedi/dimanche) d'une date ISO, dans
  // le sens `sens` (+1/-1) — utilisé par les flèches ‹ › des dates de
  // formulaire (cablerDatesPlage) pour avancer/reculer exactement comme le
  // fait la grille (gi ne code que les jours ouvrés, cf. jourIdxDeGi).
  // Round du 12.09.2026 : la version précédente de ce commentaire disait
  // cette fonction "sans être plafonnée à la fenêtre chargée" — inexact,
  // corrigé après le retour de Lionel : cf. le commentaire de
  // appliquerDateChoisieFormulaire (appelée juste après par
  // cablerDatesPlage), qui explique pourquoi la fenêtre chargée reste bien
  // une limite réelle (pas seulement d'affichage).
  function isoJourOuvreVoisin(iso, sens) {
    var d = new Date(iso + "T00:00:00");
    do {
      d.setDate(d.getDate() + sens);
    } while (d.getDay() === 0 || d.getDay() === 6);
    return isoDeDate(d);
  }
  // Round du 12.09.2026 — page Jalons : si iso tombe un samedi/dimanche,
  // avance au premier jour ouvré suivant (ex. "aujourd'hui" pour une
  // nouvelle fiche, ouverte un week-end) ; sinon le renvoie tel quel.
  function premierJourOuvreDepuis(iso) {
    var d = new Date(iso + "T00:00:00");
    if (d.getDay() === 0 || d.getDay() === 6) return isoJourOuvreVoisin(iso, 1);
    return iso;
  }
  function libelleJourGi(gi) {
    var lab = labGDeGi(gi), data = etat.cache[lab];
    if (!data) return { jour: "", mois: "" };
    if (estGiWeekend(gi)) {
      var iso = isoDeGi(gi);
      var d = new Date(iso + "T00:00:00");
      return { jour: d.getDate(), mois: MOIS_ABBR[d.getMonth() + 1] };
    }
    return { jour: data.dates[gi % 5], mois: data.mois[gi % 5] };
  }
  var MOIS_ABBR = ["", "jan.", "fév.", "mars", "avr.", "mai", "juin", "juil.", "août", "sept.", "oct.", "nov.", "déc."];

  // ---- espace "week-end" (conservé tel quel du prototype, cf. §1.6/§4.1
  // du prototype et §8 du spec) : gi >= 1000 = case Samedi/Dimanche, pure

  // afficherVersionServeur()/apiVersionServeur supprimés le 07.09.2026 (phase
  // 4, étape 5 — chasse aux trous laissés par la migration, cf.
  // MIGRATION-GITHUB-PLAN.md §6bis étape 5). Ce diagnostic datait du round du
  // 02.09.2026 ("ne marche pas même avec un nouveau déploiement") : il
  // vérifiait qu'Apps Script servait bien le dernier WebApp.gs envoyé. Il
  // appelait encore gsP() (donc google.script.run, cf. gs() plus haut) et
  // s'exécutait automatiquement à CHAQUE ouverture de la page Fériés — sans
  // le fix, Lionel aurait vu un message d'erreur "google is not defined"
  // permanent en bas de cette page. Le concept n'a plus de sens une fois
  // hébergé sur GitHub Pages (plus de "déploiement" Apps Script à vérifier) :
  // supprimé plutôt que porté.

  // Routage par onglets : un seul .page.actif à la fois. Round du
  // 12.09.2026 — remplace l'ancien routage sidebar (repli auto sur Planning,
  // panneau ouvert/fermé par pointerdown) : les onglets sont de simples
  // boutons statiques, toujours au même endroit, donc plus besoin de gérer
  // un état ouvert/fermé ni un clic en dehors pour refermer quoi que ce
  // soit. Chaque page "données serveur" se re-render à chaque activation
  // (jamais mise en cache côté page — la source de vérité est
  // etat.*Serveur/PERSONNES, déjà tenue à jour par les fonctions de
  // rafraîchissement de chaque CRUD).
  function cablerNavigation() {
    var ongletsBtns = document.querySelectorAll(".onglet");
    var RENDU_PAR_PAGE = {
      jalons: renderJalons, personnel: renderPersonnel, intervenants: renderIntervenants,
      chantiers: renderChantiers, statuts: renderStatuts,
      "entree-rapide": renderFormulaires, feries: renderFeries,
      // Round du 16.09.2026 (suite, encore) : la page Planning elle-même
      // n'a pas besoin d'un re-rendu complet à chaque activation (ses
      // données restent à jour en tâche de fond, cf. synchroniser()) — mais
      // #legendeBarre/.entete-planning-figee ont pu être mesurés (top sticky,
      // cf. ajusterEnteteFixe) pendant qu'elle était display:none (sur un
      // autre onglet), ce qui donne des hauteurs nulles et donc un top faux.
      // Remesurer juste au moment où elle redevient visible corrige ça sans
      // reconstruire toute la grille.
      planning: ajusterEnteteFixe
    };
    ongletsBtns.forEach(function (btn) {
      btn.addEventListener("click", function () {
        ongletsBtns.forEach(function (b) { b.classList.toggle("actif", b === btn); });
        document.querySelectorAll(".page").forEach(function (p) { p.classList.remove("actif"); });
        var page = document.getElementById("page-" + btn.dataset.page);
        if (page) page.classList.add("actif");
        var fn = RENDU_PAR_PAGE[btn.dataset.page];
        if (fn) fn();
      });
    });
  }

  function cablerPagePlanning() {
    // Boutons ↶/↷ de la barre d'outils (round du 12.09.2026, signalé par
    // Lionel : "le bouton annuler et refaire qui ne fonctionne pas") : ils
    // existaient dans le HTML et leur état disabled/enabled était bien tenu
    // à jour par majBoutonsUndo(), mais AUCUN clic n'était jamais câblé
    // dessus — bug présent depuis le tout premier commit du dépôt, seuls les
    // raccourcis clavier Ctrl+Z/Ctrl+Y (cf. plus bas, gestion clavier)
    // appelaient réellement defaire()/refaire().
    var btnDefaire = document.getElementById("btnDefaire");
    if (btnDefaire) btnDefaire.addEventListener("click", defaire);
    var btnRefaire = document.getElementById("btnRefaire");
    if (btnRefaire) btnRefaire.addEventListener("click", refaire);
    // Round D — le bouton "2 semaines" (ex-paire .toggle-sem) est câblé dans
    // construireGrille (avec Aujourd'hui/les flèches semaine, qu'il rejoint
    // visuellement) puisqu'il vit dans .semaine-titre, reconstruite à chaque
    // rendu — cf. basculerDeuxSemaines juste plus bas, appelée depuis
    // là-bas. "Ajout lointain" a disparu (Lionel : "on peut maintenant le
    // faire via les nouveaux formulaires").
    // "Imprimer" (STATIQUE depuis le round du 16.09.2026, suite, encore ;
    // redevenu un simple bouton icône .toolbar-btn au §83, cf. son historique
    // CSS plus haut) : il ne dépend d'aucune donnée de la grille, donc
    // câblé ici, une seule fois, plutôt que recréé à chaque construireGrille().
    var btnImprimerTitre = document.getElementById("btnImprimerTitre");
    if (btnImprimerTitre) btnImprimerTitre.addEventListener("click", openPrintSheet);
    // §83 (round du 16.09.2026, encore un autre, suite×7) — le sélecteur de
    // chantier par défaut (ex-clic sur un swatch de la légende) : ouverture/
    // fermeture du panneau câblées ici, une seule fois (conteneur STATIQUE,
    // comme Imprimer) ; le CONTENU du panneau (liste des chantiers actifs)
    // et l'apparence du bouton (swatch/nom) sont reconstruits par
    // construireSelectChantier() à chaque rendu — cf. plus bas.
    var selectChantier = document.getElementById("selectChantier");
    var btnSelectChantier = document.getElementById("btnSelectChantier");
    // §85 (round du 17.09.2026) — menuAjoutElement/reinitialiserMenuAjoutElement/
    // fermerAutresMenusOutils sont déclarées ici (var/function, "hoistées"
    // dans toute cablerPagePlanning) mais réellement remplies un peu plus
    // bas, avec le reste du câblage de #menuAjoutElement — utilisables dès
    // ici (fermeture du sélecteur de chantier) comme depuis là-bas, pour que
    // #selectChantier et les 3 nouveaux .outil-menu (zoom, ligne+, +) restent
    // mutuellement exclusifs : un seul panneau ouvert à la fois dans cette
    // barre.
    var menuAjoutElement = document.getElementById("menuAjoutElement");
    var pageAjoutPersonne = document.getElementById("pageAjoutPersonne");
    var typeAjoutBarreEnCours = null;
    function reinitialiserMenuAjoutElement() {
      if (!menuAjoutElement) return;
      var pageChoix = menuAjoutElement.querySelector('[data-page="choix"]');
      if (pageChoix) pageChoix.hidden = false;
      if (pageAjoutPersonne) pageAjoutPersonne.hidden = true;
      typeAjoutBarreEnCours = null;
    }
    // Ferme tout ce qui peut être ouvert dans cette barre SAUF `sauf` (un des
    // .outil-menu, ou null pour tout fermer) — réinitialise au passage
    // #menuAjoutElement sur sa page "choix" dès qu'il fait partie de ce qui
    // se ferme, pour ne jamais le rouvrir plus tard sur l'étape "pour qui ?"
    // d'un ajout précédent abandonné en cours de route.
    function fermerAutresMenusOutils(sauf) {
      document.querySelectorAll(".outil-menu.ouvert").forEach(function (m) {
        if (m === sauf) return;
        m.classList.remove("ouvert");
        if (m === menuAjoutElement) reinitialiserMenuAjoutElement();
      });
      if (selectChantier) selectChantier.classList.remove("ouvert");
    }
    if (selectChantier && btnSelectChantier) {
      btnSelectChantier.addEventListener("click", function (e) {
        e.stopPropagation();
        var etaitOuvert = selectChantier.classList.contains("ouvert");
        fermerAutresMenusOutils(null);
        selectChantier.classList.toggle("ouvert", !etaitOuvert);
      });
    }
    // Ouverture/fermeture des 3 .outil-menu (zoom, ligne+, +) — générique
    // plutôt que triplée, même idée que #selectChantier ci-dessus (bouton
    // statique qui ouvre son propre panneau).
    document.querySelectorAll(".outil-menu").forEach(function (menu) {
      var btnMenu = menu.querySelector(":scope > button");
      if (!btnMenu) return;
      btnMenu.addEventListener("click", function (e) {
        e.stopPropagation();
        var etaitOuvert = menu.classList.contains("ouvert");
        fermerAutresMenusOutils(menu);
        var maintenantOuvert = !etaitOuvert;
        menu.classList.toggle("ouvert", maintenantOuvert);
        if (menu === menuAjoutElement && !maintenantOuvert) reinitialiserMenuAjoutElement();
      });
    });
    // Un clic À L'INTÉRIEUR d'un panneau ne doit pas remonter jusqu'au
    // document (qui fermerait tout avant même que le bouton cliqué — Retour,
    // une personne, un palier de zoom — ait pu agir) — même filet que
    // .select-chantier-panneau n'a jamais eu besoin d'avoir, ses boutons
    // fermant déjà le panneau explicitement à chaque clic.
    document.querySelectorAll(".outil-menu-panneau").forEach(function (p) {
      p.addEventListener("click", function (e) { e.stopPropagation(); });
    });
    // Clic extérieur : ferme absolument tout (#selectChantier ET les 3
    // .outil-menu), remplace l'ancien listener dédié à #selectChantier seul
    // (§83) — fermerAutresMenusOutils(null) couvre maintenant les deux.
    document.addEventListener("click", function () { fermerAutresMenusOutils(null); });

    // ---- "ligne+" : Personnel ou Intervenant — réutilise TEL QUEL
    // ouvrirAjoutPersonne(sousTraitant), le même popup qu'ouvrait le "+" du
    // bout de ligneSection avant sa suppression ce round.
    var menuAjoutLigne = document.getElementById("menuAjoutLigne");
    if (menuAjoutLigne) {
      menuAjoutLigne.querySelectorAll("[data-ligne]").forEach(function (btn) {
        btn.addEventListener("click", function () {
          menuAjoutLigne.classList.remove("ouvert");
          ouvrirAjoutPersonne(btn.dataset.ligne === "intervenant");
        });
      });
    }

    // ---- "+" (ajout d'élément) : Tâche/Absence/Note/Jalon. Note/Jalon
    // s'ouvrent directement (ouvrirAjoutElementBarre plus bas, cf. son
    // commentaire). Tâche/Absence affichent d'abord la 2e page "pour qui ?"
    // — liste reconstruite à l'ouverture (pas à chaque rendu de la grille,
    // ce menu n'étant consulté qu'à la demande) depuis PERSONNES, déjà la
    // liste "actif=true" triée (cf. demarrer()) — Absence exclut les
    // intervenants, même règle que boutonsMenuAjout()/le clic sur une case.
    if (menuAjoutElement && pageAjoutPersonne) {
      var pageChoixAjout = menuAjoutElement.querySelector('[data-page="choix"]');
      pageChoixAjout.querySelectorAll("[data-type]").forEach(function (btn) {
        btn.addEventListener("click", function () {
          var type = btn.dataset.type;
          if (type !== "tache" && type !== "absence") {
            menuAjoutElement.classList.remove("ouvert");
            ouvrirAjoutElementBarre(type, null);
            reinitialiserMenuAjoutElement();
            return;
          }
          typeAjoutBarreEnCours = type;
          pageAjoutPersonne.innerHTML =
            '<button type="button" class="outil-menu-retour">‹ Retour</button>' +
            '<div class="outil-menu-titre">Pour qui — ' + (type === "tache" ? "Tâche" : "Absence") + '</div>';
          var liste = type === "absence" ? PERSONNES.filter(function (p) { return !p.sousTraitant; }) : PERSONNES;
          liste.forEach(function (p) {
            var it = document.createElement("button");
            it.type = "button";
            it.className = "outil-menu-item";
            it.dataset.personne = p.id;
            it.textContent = p.nom;
            it.addEventListener("click", function () {
              menuAjoutElement.classList.remove("ouvert");
              ouvrirAjoutElementBarre(typeAjoutBarreEnCours, p.id);
              reinitialiserMenuAjoutElement();
            });
            pageAjoutPersonne.appendChild(it);
          });
          pageAjoutPersonne.querySelector(".outil-menu-retour").addEventListener("click", reinitialiserMenuAjoutElement);
          pageChoixAjout.hidden = true;
          pageAjoutPersonne.hidden = false;
        });
      });
    }

    // ---- Case de zoom façon Sheets. niveauZoomPlanning est appliqué (CSS
    // zoom, sur grilleEntete/grilleCorps — jamais sur .entete-planning-figee
    // elle-même) à chaque construireGrille(), donc render(false) suffit ici
    // pour que le changement soit immédiatement visible — même trajet que
    // les 4 icônes masquer/afficher ci-dessus.
    var NIVEAUX_ZOOM_PLANNING = [75, 90, 100, 110, 125, 150];
    var btnZoomMoins = document.getElementById("zoomMoins");
    var btnZoomPlus = document.getElementById("zoomPlus");
    if (btnZoomMoins) btnZoomMoins.addEventListener("click", function () {
      var i = NIVEAUX_ZOOM_PLANNING.indexOf(niveauZoomPlanning);
      niveauZoomPlanning = NIVEAUX_ZOOM_PLANNING[Math.max(0, i - 1)];
      render(false);
    });
    if (btnZoomPlus) btnZoomPlus.addEventListener("click", function () {
      var i = NIVEAUX_ZOOM_PLANNING.indexOf(niveauZoomPlanning);
      niveauZoomPlanning = NIVEAUX_ZOOM_PLANNING[Math.min(NIVEAUX_ZOOM_PLANNING.length - 1, i + 1)];
      render(false);
    });
    var panneauZoom = document.getElementById("panneauZoom");
    if (panneauZoom) {
      panneauZoom.querySelectorAll("[data-zoom]").forEach(function (btn) {
        btn.addEventListener("click", function () {
          niveauZoomPlanning = parseInt(btn.dataset.zoom, 10);
          document.getElementById("menuZoom").classList.remove("ouvert");
          render(false);
        });
      });
    }

    // §87 (round du 17.09.2026, suite×2) — navigation de semaine dupliquée
    // dans la barre (Lionel : « l'insertion via le "+" doit pouvoir se faire
    // aussi en dehors de la vue visible, actuellement limité à la semaine en
    // cours ; on pourrait ajouter aujourd'hui/2 semaines/la navigation dans
    // la toolbar », mockup mockup-sous-menu-outils.html à l'appui, puis
    // ajusté : « il manque un rectangle avec un numéro de semaine, type
    // "Sem. 38" cliquable [...] dans le style visuel du zoom, mais avec le
    // même comportement que l'actuel [ouvrirAllerSemaine] »). ‹/›/Aujourd'hui/
    // 2 semaines réutilisent TELLES QUELLES naviguerSemaine/allerAujourdhui/
    // basculerDeuxSemaines, déjà éprouvées par la ligne coinNav/navSemaine
    // qu'elles remplacent (retirée de construireGrille ce round, Lionel :
    // « on enlève la première ligne du tableau qui ne sert plus »).
    var btnSemainePrec = document.getElementById("btnSemainePrec");
    var btnSemaineSuiv = document.getElementById("btnSemaineSuiv");
    var btnAujourdhuiBarre = document.getElementById("btnAujourdhui");
    var btnDeuxSemainesBarre = document.getElementById("btnDeuxSemaines");
    if (btnSemainePrec) btnSemainePrec.addEventListener("click", function () { naviguerSemaine(-1); });
    if (btnSemaineSuiv) btnSemaineSuiv.addEventListener("click", function () { naviguerSemaine(1); });
    if (btnAujourdhuiBarre) btnAujourdhuiBarre.addEventListener("click", allerAujourdhui);
    if (btnDeuxSemainesBarre) btnDeuxSemainesBarre.addEventListener("click", basculerDeuxSemaines);
    // #menuSemaine/#btnSemainePill remplacent ouvrirAllerSemaine() (popup
    // centrée avec un <select>, supprimée avec son unique déclencheur
    // .lien-aller) par un dropdown façon Sheets, cohérent avec zoom/ligne+/+
    // juste à côté — reconstruit à l'OUVERTURE seulement (comme
    // #pageAjoutPersonne plus haut), jamais à chaque rendu : etat.semaines
    // ne change jamais en cours de session, et peut compter jusqu'à 521
    // semaines (FENETRE_SEMAINES=260 avant/après aujourd'hui) — tout afficher
    // d'un coup produirait un dropdown interminable, d'où une fenêtre de 8
    // avant / 8 après la semaine choisie (17 lignes, scrollable via
    // .semaine-panneau) : largement suffisant pour un saut rapide, ‹/› ou
    // rouvrir le dropdown depuis la nouvelle position couvrant le reste.
    // S'appuie sur l'ORDRE D'ATTACHEMENT des écouteurs sur #btnSemainePill :
    // la boucle générique ".outil-menu" plus haut bascule déjà .ouvert avant
    // que ce second écouteur (attaché après, donc exécuté après) ne
    // (re)construise le contenu — la lecture de .ouvert ci-dessous reflète
    // donc le nouvel état, pas l'ancien, sans avoir à dupliquer la logique
    // de bascule.
    var menuSemaine = document.getElementById("menuSemaine");
    var btnSemainePill = document.getElementById("btnSemainePill");
    var panneauSemaine = document.getElementById("panneauSemaine");
    if (menuSemaine && btnSemainePill && panneauSemaine) {

        if (!menuSemaine.classList.contains("ouvert")) return;
        panneauSemaine.innerHTML = "";
        var titre = document.createElement("div");
        titre.className = "outil-menu-titre";
        titre.textContent = "Aller à…";
        panneauSemaine.appendChild(titre);
        var debut = Math.max(0, etat.indexSemaine - 8), fin = Math.min(etat.semaines.length - 1, etat.indexSemaine + 8);
        var _boucleSemaine = function (idx) {
          var s = etat.semaines[idx];
          var it = document.createElement("button");
          it.type = "button";
          it.className = "outil-menu-item" + (idx === etat.indexSemaine ? " actif" : "");
          var nom = document.createElement("span");

          nom.textContent = "Semaine " + s.num;
          var droite = document.createElement("span");
          droite.className = "semaine-item-droite";
          var dates = document.createElement("span");

          droite.appendChild(dates);
