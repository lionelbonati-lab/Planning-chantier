            var coche = document.createElement("span");
            coche.className = "coche";
            coche.textContent = "✓";
            droite.appendChild(coche);
          }
          it.appendChild(nom);
          it.appendChild(droite);
          it.addEventListener("click", function () {
            menuSemaine.classList.remove("ouvert");
            if (idx === etat.indexSemaine) return;
            etat.indexSemaine = idx;
            bullesSelectionnees = {};
            assurerFenetreChargee(function () { construireVueDepuisCache(); render(false); majBarreSelection(); });
          });
          panneauSemaine.appendChild(it);
        };
        for (var iSem = debut; iSem <= fin; iSem++) _boucleSemaine(iSem);
      });
    }
    // §82 — les 4 contrôles masquer/afficher (Jalons/Notes/Personnel/
    // Intervenants, cf. .controles-affichage dans htmlPagePlanning ; devenus
    // des icônes .toolbar-toggle au §83, Lionel : « je préfèrerai des icones
    // pour les 4 sous-groupes ») sont un conteneur STATIQUE comme Imprimer
    // ci-dessus : câblés une seule fois ici plutôt que reconstruits à chaque
    // construireGrille(). majControlesAffichage() (appelée à chaque rendu)
    // se charge ensuite de tenir leur apparence (active/désactivée) à jour.
    var contAffichage = document.getElementById("controlesAffichage");
    if (contAffichage) {
      contAffichage.querySelectorAll(".toolbar-toggle").forEach(function (btn) {
        btn.addEventListener("click", function () {
          var cible = btn.dataset.affichageCible;
          if (cible === "jalon") replierJalons = !replierJalons;
          else if (cible === "note") replierNotes = !replierNotes;
          else if (cible === "personnel") replierSectionPersonnel = !replierSectionPersonnel;
          else if (cible === "intervenants") replierSectionIntervenants = !replierSectionIntervenants;
          render(false);
        });
      });
    }
    // Round suivant (11.09.2026) — Lionel : « le bouton recharger doit
    // disparaitre. » Le bouton #btnReset et son câblage (oublierCache() +
    // assurerFenetreChargee(...) pour relire la fenêtre depuis le serveur)
    // sont supprimés ; oublierCache()/assurerFenetreChargee() restent
    // utilisées ailleurs (cf. synchroniser()), seul ce point d'appel dédié
    // au bouton disparaît.
    var chk = document.getElementById("chkWeekends");
    if (chk) {
      chk.checked = afficherWeekends;
      chk.addEventListener("change", function () { afficherWeekends = chk.checked; render(false); });
    }
  }

  /* ============================================================
     PAGES "PERSONNEL" / "INTERVENANTS" — CRUD (§6 du spec). Phase 4/étape 3
     (§6bis) : ajouterPersonneServeur/renommerPersonneServeur/
     basculerActifPersonneServeur (section "CONFIG SIMPLE" plus bas)
     remplacent apiAjouterPersonne/apiRenommerPersonne/apiSupprimerPersonne.
     Le concept de "portée" (cette semaine seulement / et les suivantes)
     DISPARAÎT ici : c'était un contournement du classeur (une personne = 4
     lignes PARTAGÉES par toutes les semaines, "renommer à partir de telle
     semaine" = réécrire seulement les colonnes de cette semaine et des
     suivantes). Une personne est maintenant une seule vraie ligne
     `personnes`, valable pour toutes les semaines à la fois —
     renommer/désactiver s'applique donc TOUJOURS partout, passé compris,
     sans qu'aucun prompt de portée n'ait plus de sens à proposer
     (demanderPortee2 retiré). Désactiver reste un simple "vider" côté
     planning, comme avant (actif=false, pas un DELETE, cf.
     basculerActifPersonneServeur) — round du 14.09.2026 : une vraie
     suppression (irréversible, cascade sur l'historique) existe désormais
     EN PLUS, mais séparément, cf. supprimerPersonnePermanenceServeur.
     ============================================================ */
  function rafraichirApresPersonnel() {
    // Un ajout/renommage/désactivation touche potentiellement toutes les
    // semaines (jamais scopé à "depuis la semaine affichée" comme avant,
    // cf. commentaire ci-dessus) : tout le cache est invalidé plutôt que
    // seulement depuis labGCourant(). etat.personnesActives est rechargé
    // AVANT de redemander la fenêtre affichée, sans quoi
    // chargerSemaineDepuisServeur filtrerait encore sur l'ancienne liste.
    oublierCache(null);
    TACHES_PAR_PERSONNE = null; promesseTachesParPersonne = null;
    rechargerPersonnesActives_().then(function () {
      assurerFenetreChargee(function () {
        construireVueDepuisCache();
        render(false);
        renderPersonnel(); renderIntervenants();
      });
    }).catch(erreurFatale);
  }
  // texteCompteurTaches(n) : null tant que le chargement n'est pas terminé
  // (case laissée vide plutôt qu'un "0" trompeur pendant l'attente).
  function texteCompteurTaches(n) {
    if (n == null) return "";
    return n === 0 ? "Aucune tâche en cours" : (n === 1 ? "1 tâche en cours" : n + " tâches en cours");
  }
  // opts.premier/opts.dernier : bornes du groupe ACTIF affiché (désactive
  // ↑ en tête, ↓ en fin — même logique que .cf-monter/.cf-descendre
  // d'Entrée rapide). Absents (undefined) pour une ligne désactivée, qui
  // n'a pas de flèches — cf. commentaire de tête plus haut (round du
  // 14.09.2026).
  function ligneFichePersonne(p, opts) {
    opts = opts || {};
    var n = TACHES_PAR_PERSONNE ? TACHES_PAR_PERSONNE[p.id] : null;
    if (!p.actif) {
      return '<div class="ligne-intervenant ligne-desactivee" data-id="' + esc2(p.id) + '"><b>' + esc(p.nom) + '</b>' +
        '<span class="compte"></span>' +
        '<span class="ligne-actions">' +
        '<button type="button" class="lien-reactiver">Réactiver</button>' +
        '<button type="button" class="lien-supprimer-def" title="Supprimer définitivement">' + ICONS.trash + ' Supprimer</button>' +
        '</span></div>';
    }
    return '<div class="ligne-intervenant" data-id="' + esc2(p.id) + '">' +
      '<span class="cf-actions">' +
      '<button type="button" class="cf-monter" title="Monter"' + (opts.premier ? " disabled" : "") + '>↑</button>' +
      '<button type="button" class="cf-descendre" title="Descendre"' + (opts.dernier ? " disabled" : "") + '>↓</button>' +
      '</span>' +
      '<b>' + esc(p.nom) + '</b>' +
      '<span class="compte">' + esc(texteCompteurTaches(n == null ? null : n)) + '</span>' +
      '<span class="ligne-actions">' +
      // <label>, pas <span> : le piste couvre TOUT le .interrupteur en
      // position absolute (cf. .interrupteur-piste), le checkbox lui-même
      // n'est donc jamais atteignable au clic direct — seul le
      // label-forwarding natif du navigateur le rend cliquable, exactement
      // comme .reglage-ligne (chkWeekends, htmlPageGeneral) qui est déjà un
      // <label> pour la même raison. Repéré en écrivant
      // verif_tri_desactiver.js (round du 14.09.2026, Playwright ne
      // parvenait pas à cliquer le checkbox) : sans <label>, l'interrupteur
      // aurait été inerte au clic pour de vrais utilisateurs aussi, pas
      // seulement pour le test.
      '<label class="champ-actif"><span class="interrupteur"><input type="checkbox" checked><span class="interrupteur-piste"></span></span>Actif</label>' +
      '<button type="button" class="lien-modifier">Modifier</button>' +
      '</span></div>';
  }
  // Charge compterTachesPersonnesServeur() une seule fois (mémorisée dans
  // promesseTachesParPersonne, cf. section "CONFIG SIMPLE" plus bas), puis
  // patche directement les badges déjà à l'écran — jamais un re-render
  // complet depuis ce callback (renderPersonnel/renderIntervenants
  // appellent elles-mêmes chargerCompteursTaches : un re-render en boucle
  // depuis ici recréerait la boucle).
  function chargerCompteursTaches() {
    if (TACHES_PAR_PERSONNE) { appliquerCompteursTaches(); return; }
    if (!promesseTachesParPersonne) {
      promesseTachesParPersonne = compterTachesPersonnesServeur().then(function (r) {
        TACHES_PAR_PERSONNE = r || {};
        appliquerCompteursTaches();
      }).catch(function () {
        promesseTachesParPersonne = null; // échec : pas de compteur affiché, retenté à la prochaine ouverture de page
      });
    }
  }
  function appliquerCompteursTaches() {
    document.querySelectorAll(".ligne-intervenant[data-id] .compte").forEach(function (el) {
      var id = el.closest("[data-id]").dataset.id;
      el.textContent = texteCompteurTaches(TACHES_PAR_PERSONNE[id]);
    });
  }
  // ↑/↓ : échange l'ordre entre 2 lignes ACTIVES voisines (jamais les
  // désactivées, qui n'ont pas de flèches) — 2 updates serveur puis
  // rafraîchissement complet, même schéma que pour les chantiers plus bas
  // (echangerOrdreChantiers). `actifs` = tableau déjà trié par ordre,
  // capturé en fermeture au moment du rendu (cf. renderListePersonnes).
  function echangerOrdrePersonnes(id, direction, actifs) {
    var idx = -1;
    for (var i = 0; i < actifs.length; i++) if (actifs[i].id === String(id)) { idx = i; break; }
    var j = idx + direction;
    if (idx < 0 || j < 0 || j >= actifs.length) return;
    var a = actifs[idx], b = actifs[j];
    Promise.all([
      sbClient.from("personnes").update({ ordre: b.ordre }).eq("id", ancreDe(a.id)),
      sbClient.from("personnes").update({ ordre: a.ordre }).eq("id", ancreDe(b.id))
    ]).then(function (r) {
      r.forEach(function (res) { if (res.error) throw res.error; });
      rafraichirApresPersonnel();
    }).catch(function (err) { toast("Échec du tri : " + (err && err.message ? err.message : err)); });
  }
  function cablerListePersonnes(zone, apresChangement, actifs) {
    function idDe(el) { return el.closest("[data-id]").dataset.id; }
    function nomDe(el) { return el.closest("[data-id]").querySelector("b").textContent; }
    zone.querySelectorAll(".lien-modifier").forEach(function (btn) {
      btn.addEventListener("click", function () { ouvrirModifierPersonne(idDe(btn), apresChangement); });
    });
    zone.querySelectorAll(".lien-reactiver").forEach(function (btn) {
      btn.addEventListener("click", function () {
        basculerActifPersonneServeur(ancreDe(idDe(btn)), true).then(function () {
          rafraichirApresPersonnel();
          toast("Réactivé.");
        }).catch(function (err) { toast("Échec : " + (err && err.message ? err.message : err)); });
      });
    });
    // Suppression définitive — cf. supprimerPersonnePermanenceServeur : un
    // vrai DELETE, jamais proposé ici que sur une ligne déjà désactivée
    // (.lien-supprimer-def n'existe que sur ces lignes-là, cf.
    // ligneFichePersonne). Cascade en base sur taches/assignations/series
    // (sql/0001 : "on delete cascade") — irréversible, d'où la
    // confirmation explicite malgré la demande de Lionel de garder le
    // bouton lui-même simple ("icône rouge suffit").
    zone.querySelectorAll(".lien-supprimer-def").forEach(function (btn) {
      btn.addEventListener("click", function () {
        var id = idDe(btn), nom = nomDe(btn);
        demanderConfirmation("Supprimer définitivement « " + nom + " » ? Cette action est irréversible et efface aussi tout son historique (tâches, assignations).", function () {
          supprimerPersonnePermanenceServeur(ancreDe(id)).then(function () {
            rafraichirApresPersonnel();
            toast("Supprimé définitivement.");
          }).catch(function (err) { toast("Échec de la suppression : " + (err && err.message ? err.message : err)); });
        });
      });
    });
    // Interrupteur "Actif" — seulement présent sur les lignes actives
    // (jamais sur .ligne-desactivee, qui n'a que Réactiver/Supprimer) :
    // décocher = désactiver. Revert visuel immédiat (checkbox remise à
    // checked) que la confirmation aboutisse ou non — c'est le
    // rafraîchissement qui suit une désactivation confirmée qui fait
    // réellement disparaître la ligne du groupe actif (elle réapparaît
    // dans "Désactivés"), jamais un simple état visuel local du switch.
    zone.querySelectorAll(".ligne-intervenant:not(.ligne-desactivee) .interrupteur input").forEach(function (chk) {
      chk.addEventListener("change", function () {
        var id = idDe(chk), nom = nomDe(chk);
        chk.checked = true;
        var n = TACHES_PAR_PERSONNE ? TACHES_PAR_PERSONNE[id] : null;
        var titre = "Désactiver « " + nom + " »" + (n ? " qui a " + (n === 1 ? "1 tâche en cours" : n + " tâches en cours") : "") + " ?";
        demanderConfirmation(titre, function () {
          basculerActifPersonneServeur(ancreDe(id), false).then(function () {
            rafraichirApresPersonnel();
            toast("Désactivé.");
          }).catch(function (err) { toast("Échec : " + (err && err.message ? err.message : err)); });
        });
      });
    });
    zone.querySelectorAll(".cf-monter").forEach(function (btn) {
      btn.addEventListener("click", function () { echangerOrdrePersonnes(idDe(btn), -1, actifs); });
    });
    zone.querySelectorAll(".cf-descendre").forEach(function (btn) {
      btn.addEventListener("click", function () { echangerOrdrePersonnes(idDe(btn), 1, actifs); });
    });
    var btnAdd = zone.querySelector(".ligne-ajouter");
    if (btnAdd) btnAdd.addEventListener("click", function () { ouvrirAjoutPersonne(btnAdd.dataset.sousTraitant === "1"); });
    var btnRepli = zone.querySelector(".repli-desactives");
    if (btnRepli) btnRepli.addEventListener("click", function () {
      btnRepli.classList.toggle("ouvert");
      var groupe = zone.querySelector(".groupe-desactives");
      if (groupe) groupe.hidden = !btnRepli.classList.contains("ouvert");
    });
  }
  // Page de gestion (Personnel/Intervenants) : liste COMPLÈTE (actifs +
  // désactivés), contrairement à PERSONNES/etat.personnesActives qui reste
  // actifs seulement (la grille n'affiche jamais une personne désactivée,
  // historique compris — comportement PRÉEXISTANT, inchangé ici, cf.
  // desactiverPersonneServeur d'origine devenu basculerActifPersonneServeur
  // plus bas). Jamais mise en cache : ces 2 pages sont peu visitées, un
  // aller-retour de plus à chaque activation d'onglet est négligeable
  // (même choix que renderStatuts/renderFormulaires, qui ne cachent pas
  // non plus).
  function renderListePersonnes(sousTraitant) {
    var zone = document.getElementById(sousTraitant ? "listeIntervenants" : "listePersonnel");
    if (!zone) return;
    listerPersonnesGestionServeur().then(function (toutes) {
      var liste = toutes.filter(function (p) { return !!p.sousTraitant === !!sousTraitant; });
      var actifs = liste.filter(function (p) { return p.actif; });
      var inactifs = liste.filter(function (p) { return !p.actif; });
      var html = actifs.map(function (p, i) {
        return ligneFichePersonne(p, { premier: i === 0, dernier: i === actifs.length - 1 });
      }).join("") + '<button type="button" class="ligne-ajouter" data-sous-traitant="' + (sousTraitant ? 1 : 0) + '">+ Ajouter</button>';
      if (inactifs.length) {
        html += '<button type="button" class="repli-desactives"><span class="chevron">›</span> Désactivés (' + inactifs.length + ')</button>' +
          '<div class="groupe-desactives" hidden>' + inactifs.map(function (p) { return ligneFichePersonne(p); }).join("") + '</div>';
      }
      zone.innerHTML = html;
      cablerListePersonnes(zone, function () { renderListePersonnes(sousTraitant); }, actifs);
      chargerCompteursTaches();
    }).catch(erreurFatale);
  }
  function renderPersonnel() { renderListePersonnes(false); }
  function renderIntervenants() { renderListePersonnes(true); }
  function ouvrirAjoutPersonne(sousTraitant) {

  function ouvrirModifierPersonne(id, apresChangement) {

  // supprimerPersonneServeur (le lien "Supprimer" d'origine, qui appelait

  // suppression existe désormais séparément (supprimerPersonnePermanenceServeur,

  /* ============================================================
     PAGE "CHANTIERS" — CRUD complet (§7 du spec). Phase 4/étape 3 (§6bis) :
     ajouterChantierServeur/majCouleurChantierServeur/renommerChantierServeur/
     compterUtilisationsChantierServeur/retirerChantierServeur (section
     "CONFIG SIMPLE" plus bas) remplacent apiEnregistrerChantiers/
     apiRenommerChantier/apiCompterUtilisationsChantier/apiSupprimerChantier.
     Renommer ne migre plus aucune case : les cases du planning renvoient à
     un chantier par SON ID (assignations.chantier_id, une vraie clé
     étrangère, sql/0001) et non plus par son nom — ce que
     apiRenommerChantier devait faire à la main (balayer toutes les cases du
     classeur) est donc devenu un non-problème, un simple update. Supprimer
     compte/vide TOUTES les cases concernées, passées comprises (déviation
     assumée par rapport à l'ancien "semaine affichée et suivantes
     seulement" — la contrainte de clé étrangère l'exige de toute façon, cf.
     compterUtilisationsChantierServeur).
     ============================================================ */
  // opts.premier/opts.dernier : cf. commentaire équivalent sur
  // ligneFichePersonne — même logique de bornes, même absence de flèches
  // sur une ligne désactivée.
  function ligneFicheChantier(c, opts) {
    opts = opts || {};
    if (!c.actif) {
      return '<div class="ligne-intervenant ligne-desactivee" data-ligne="' + c.ligne + '">' +
        '<span class="gauche-chantier"><span class="swatch-chantier" style="background:' + esc2(c.couleur) + '"></span><b>' + esc(c.nom) + '</b></span>' +
        '<span class="ligne-actions">' +
        '<button type="button" class="lien-reactiver">Réactiver</button>' +
        '<button type="button" class="lien-supprimer-def" title="Supprimer définitivement">' + ICONS.trash + ' Supprimer</button>' +

  var JALONS_TOUS = null; // null = pas encore chargé ; tableau de jalons FUSIONNÉS sinon (cf. fusionnerJalonsTous)

  function chargerJalonsTousServeur() {
    return sbClient.from("jalons").select("id, date, texte, important, chantier_id, demi").order("date").then(function (r) {
      if (r.error) throw new Error(r.error.message);

  // Fusion PURE (aucun accès réseau/DOM) — regroupe des lignes jalons triées
  // par date en jalons "plage" : 2 lignes se fusionnent si elles portent le
  // même texte/important/chantier ET que la 2e tombe sur le jour ouvré qui
  // suit directement la 1ère (isoJourOuvreVoisin, déjà utilisée par les
  // flèches de dates plus bas dans ce fichier — saute les week-ends).
  // idDebut/idFin (les id des lignes de bord) servent de clé d'identité côté
  // UI ; `demi` n'est PAS pris en compte ici : cette page travaille toujours
  // en jours entiers (cf. tête de section), un jalon posé avec une
  // demi-journée de bord depuis la grille s'affiche donc ici sans distinction.
  function fusionnerJalonsTous(lignes) {
    var tri = lignes.slice().sort(function (a, b) { return a.date < b.date ? -1 : a.date > b.date ? 1 : 0; });
    var items = [];
    var courant = null;
    tri.forEach(function (l) {
      var chantierId = l.chantier_id != null ? l.chantier_id : null;
      var important = !!l.important;
      if (courant && l.texte === courant.texte && important === courant.important &&
          chantierId === courant.chantierId && isoJourOuvreVoisin(courant.dateFin, 1) === l.date) {
        courant.dateFin = l.date;
        courant.idFin = l.id;
      } else {
        courant = { idDebut: l.id, idFin: l.id, dateDebut: l.date, dateFin: l.date, texte: l.texte, important: important, chantierId: chantierId };
        items.push(courant);

    });

  }

      }).catch(function (err) {
        zone.innerHTML = '<div class="page-placeholder">Échec du chargement : ' + esc(err && err.message ? err.message : err) + '</div>';
      });
      return;
    }
    var tries = JALONS_TOUS.slice().sort(function (a, b) { return a.dateDebut < b.dateDebut ? -1 : a.dateDebut > b.dateDebut ? 1 : 0; });
    zone.innerHTML = tries.map(ligneFicheJalon).join("") + '<button type="button" class="ligne-ajouter">+ Ajouter</button>';
    cablerListeJalons(zone);
  }

  // ---- Fiche Ajouter/Modifier (bandeau coloré par chantier + 2 dates ISO
  // sans A/P + nom en texte libre) — réutilise bandeauHTML/piedPrincipalHTML
  // (fabriques partagées définies plus bas dans ce fichier, cf. leur
  // commentaire de tête) et les mêmes classes CSS que .carte-item, mais PAS
  // datesPlageHTML/cablerDatesPlage (ceux-là travaillent en `gi`, borné à la
  // fenêtre chargée — cf. tête de section) : dateLigneJalonHTML/
  // cablerDatesJalon ci-dessous en sont des variantes en ISO pur, sans
  // aucune limite de fenêtre, et sans les boutons A/P (non demandés ici).
  function dateLigneJalonHTML(label, iso, bord) {
    return '<div class="date-ligne" data-bord="' + bord + '">' +
      '<div class="date-ligne-gauche">' +
      '<span class="label-date">' + label + '</span>' +
      '<div class="date-nav">' +
      '<button type="button" class="fleche f-fleche" data-sens="-1" title="Jour ouvré précédent">' + ICONE_CHEVRON_G + '</button>' +
      '<span class="date-val">' + esc(libelleDateIsoCourte(iso)) + '</span>' +
      '<button type="button" class="fleche f-fleche" data-sens="1" title="Jour ouvré suivant">' + ICONE_CHEVRON_D + '</button>' +
      '</div></div></div>';
  }
  function datesPlageJalonHTML(debutIso, finIso) {
    return '<div class="dates-plage">' + dateLigneJalonHTML("Début", debutIso, "debut") + dateLigneJalonHTML("Fin", finIso, "fin") + '</div>';
  }
  // Même règle asymétrique que appliquerDateChoisieFormulaire (plus bas dans
  // ce fichier, cf. son commentaire pour l'historique complet) : le bord
  // édité prend exactement la date choisie, l'AUTRE bord n'est recollé que
  // si le garder rendrait Début > Fin — mais ici, à la différence de la
  // grille, AUCUNE fenêtre à respecter : n'importe quelle date ISO est
  // valide, jamais de rejet ni de toast.
  function appliquerDateChoisieJalon(state, bord, isoChoisi, rafraichir) {
    var autre = bord === "debut" ? state.finIso : state.debutIso;
    if (bord === "debut") {
      state.debutIso = isoChoisi;
      state.finIso = (autre >= isoChoisi) ? autre : isoChoisi;
    } else {
      state.finIso = isoChoisi;
      state.debutIso = (autre <= isoChoisi) ? autre : isoChoisi;
    }
    rafraichir();
  }
  function cablerDatesJalon(pop, state, rafraichir) {
    var conteneur = pop.querySelector(".dates-plage");
    conteneur.querySelectorAll(".f-fleche").forEach(function (btn) {
      btn.addEventListener("click", function () {
        var bord = btn.closest(".date-ligne").dataset.bord;
        var isoActuel = bord === "debut" ? state.debutIso : state.finIso;
        appliquerDateChoisieJalon(state, bord, isoJourOuvreVoisin(isoActuel, +btn.dataset.sens), rafraichir);
      });
    });
    conteneur.querySelectorAll(".date-val").forEach(function (span) {
      span.classList.add("date-val-cliquable");
      span.title = "Cliquer pour choisir une date dans le calendrier";
      span.addEventListener("click", function () {
        if (conteneur.querySelector(".date-picker-natif")) return;
        var ligne = span.closest(".date-ligne");
        var bord = ligne.dataset.bord;
        var input = document.createElement("input");
        input.type = "date";
        input.className = "date-picker-natif";
        input.value = bord === "debut" ? state.debutIso : state.finIso;
        var r = span.getBoundingClientRect();
        input.style.left = r.left + "px"; input.style.top = r.top + "px";
        input.style.width = Math.max(r.width, 90) + "px"; input.style.height = r.height + "px";
        ligne.appendChild(input);
        var nettoye = false;
        function nettoyer() { if (nettoye) return; nettoye = true; if (input.parentElement) input.remove(); }
        input.addEventListener("change", function () {
          var iso = input.value;
          nettoyer();
          if (iso) appliquerDateChoisieJalon(state, bord, iso, rafraichir);
        });
        input.addEventListener("blur", function () { setTimeout(nettoyer, 200); });
        if (input.showPicker) { try { input.showPicker(); } catch (ex) { input.focus(); } }
        else input.focus();
      });
    });
  }
  // Round du 14.09.2026 : n'offre plus un chantier désactivé au choix pour
  // un NOUVEAU jalon — sauf s'il s'agit justement du chantier déjà choisi
  // sur ce jalon (édition d'un jalon existant qui pointait vers un chantier
  // depuis désactivé) : reste alors proposé/sélectionné, pour ne jamais
  // faire disparaître silencieusement le lien à l'enregistrement.
  function champChantierJalonHTML(chantierIdInit) {
    var liste = etat.chantiers.filter(function (c) {
      return c.actif !== false || (chantierIdInit != null && String(chantierIdInit) === String(c.ligne));
    });
    var options = liste.map(function (c) {
      var sel = chantierIdInit != null && String(chantierIdInit) === String(c.ligne);
      return '<option value="' + esc2(c.ligne) + '"' + (sel ? " selected" : "") + '>' + esc(c.nom) + '</option>';
    }).join("");

  }
  function ouvrirFormulaireJalon(itemExisting) {
    var aujourdhuiIso = premierJourOuvreDepuis(isoDeDate(new Date()));
    var state = {
      debutIso: itemExisting ? itemExisting.dateDebut : aujourdhuiIso,
      finIso: itemExisting ? itemExisting.dateFin : aujourdhuiIso,
      important: itemExisting ? itemExisting.important : false,
      // Round du 14.09.2026 : le 1er chantier ACTIF (etat.chantiers peut
      // désormais contenir des désactivés, triés par ordre sans distinction) —
      // jamais un chantier désactivé comme choix par défaut d'un nouveau jalon.
      chantierId: itemExisting ? itemExisting.chantierId : (function () {
        var actifs = etat.chantiers.filter(function (c) { return c.actif !== false; });
        return actifs.length ? actifs[0].ligne : null;
      })()
    };
    function couleurBandeau() {
      var c = chantierParId(state.chantierId);

    var pop = document.createElement("div");

      datesPlageJalonHTML(state.debutIso, state.finIso) +
      '<div class="corps"><div class="label-champ" style="margin:0 0 6px">Nom</div>' +
      '<input type="text" class="f-nom-jalon" value="' + esc2(itemExisting ? itemExisting.texte : "") + '" placeholder="ex. Livraison agglos"></div>' +

    var px = Math.round(window.innerWidth / 2 - 162), py = Math.max(30, Math.round(window.innerHeight / 2 - 230));
    positionnerPop(pop, px, py);
    var fermer = fermerAuClicExterieur(pop, null, function () { pop.querySelector(".f-ok").click(); });
    function cablerBandeau() {
      pop.querySelector(".f-annuler").addEventListener("click", fermer);

    function rafraichirBandeau() {
      pop.querySelector(".bandeau").outerHTML = bandeauHTML({
        clair: !chantierParId(state.chantierId), fondStyle: "background:" + couleurBandeau(),
        important: state.important, chantierHTML: champChantierJalonHTML(state.chantierId), nomGrand: "Jalon"
      });

      cablerDatesJalon(pop, state, rafraichirDates);

    cablerDatesJalon(pop, state, rafraichirDates);
    var suppr = pop.querySelector(".f-suppr");
    if (suppr) suppr.addEventListener("click", function () { fermer(); supprimerJalonServeur(itemExisting, renderJalons); });
    pop.querySelector(".f-ok").addEventListener("click", function () {
      var texte = pop.querySelector(".f-nom-jalon").value.trim();
      if (!texte) { fermer(); return; }
      var payload = {
        kind: "jalon", dateDebut: state.debutIso, dateFin: state.finIso, texte: texte,
        important: state.important, chantierId: state.chantierId, mode: "remplacement",
        origine: itemExisting ? {
          dateDebut: itemExisting.dateDebut, dateFin: itemExisting.dateFin, texte: itemExisting.texte,
          important: itemExisting.important, chantierId: itemExisting.chantierId
        } : null
      };
      fermer();
      occupe(true);
      invoquerFonctionServeur("enregistrer-plage", payload).then(function () {
        occupe(false);
        JALONS_TOUS = null;
        renderJalons();
        toast(itemExisting ? "Modifié." : "Ajouté.");
      }).catch(function (err) {
        occupe(false);
        toast("Échec de l’enregistrement : " + (err && err.message ? err.message : err));
      });
    });
  }

  /* ============================================================
     PAGE "STATUTS" — CRUD complet (§3 du spec, apiListerStatuts/
     apiEnregistrerStatuts, NOUVELLES). Simplification vs le prototype :
     pas d'éditeur de style de texte (gras/italique/souligné/couleur du
     texte) — champs texteGras/texteItalique/texteSouligne/texteCouleur du
     prototype absents du contrat serveur (cle/nom/couleur/ordre seulement),
     déviation documentée dans FRONTEND-CHANGELOG.md. Pas de réordonnancement
     (comme le prototype) : un nouveau statut est ajouté en fin de liste.

  function ligneFicheStatut(s) {
    return '<div class="ligne-intervenant" data-cle="' + esc2(s.cle) + '">' +
      '<span class="gauche-chantier"><span class="swatch-chantier" style="background:' + esc2(s.couleur) + '"></span><b>' + esc(s.nom) + '</b></span>' +

  function renderStatuts() {

    zone.innerHTML = liste.map(ligneFicheStatut).join("") + '<button type="button" class="ligne-ajouter">+ Ajouter</button>';

    zone.querySelectorAll(".lien-supprimer").forEach(function (btn) {
      btn.addEventListener("click", function () {
        var cle = btn.closest("[data-cle]").dataset.cle;
        var s = etat.statutsServeur.filter(function (x) { return x.cle === cle; })[0];
        supprimerStatutServeur(s);

    var btnAdd = zone.querySelector(".ligne-ajouter");

  function couleurProposeeStatut() {
    var utilisees = {};
    etat.statutsServeur.forEach(function (s) { utilisees[(s.couleur || "").toLowerCase()] = true; });
    for (var i = 0; i < PALETTE_STATUTS.length; i++) if (!utilisees[PALETTE_STATUTS[i].toLowerCase()]) return PALETTE_STATUTS[i];
    return PALETTE_STATUTS[0];

  function rafraichirApresStatuts(nouveauxStatuts) {
    etat.statutsServeur = nouveauxStatuts || [];

    construireVueDepuisCache();
    render(false);

  function ouvrirAjoutStatut() {

    var px = Math.round(window.innerWidth / 2 - 110), py = Math.round(window.innerHeight / 2 - 90);
    positionnerPop(pop, px, py);

      enregistrerStatutsServeur([], [{ nom: nom, couleur: pop.querySelector(".f-couleur").value, ordre: ordre }], []).then(function (r) {
        rafraichirApresStatuts(r);

    });

  function ouvrirModifierStatut(s) {
    var pop = document.createElement("div");
    pop.className = "pop form-pop";
    pop.innerHTML =
      '<div class="cp-titre">Modifier</div>' +
      '<input type="text" class="f-nom" value="' + esc2(s.nom) + '">' +
      '<div class="champ-couleur-chantier"><label>Couleur du badge</label><input type="color" class="f-couleur" value="' + esc2(s.couleur) + '"></div>' +
      '<div class="form-actions"><button type="button" class="f-annuler">Annuler</button><button type="button" class="f-ok">Enregistrer</button></div>';
    var px = Math.round(window.innerWidth / 2 - 110), py = Math.round(window.innerHeight / 2 - 90);
    positionnerPop(pop, px, py);
    var fermer = fermerAuClicExterieur(pop, null, function () { pop.querySelector(".f-ok").click(); });
    var inputNom = pop.querySelector(".f-nom");
    pop.querySelector(".f-annuler").addEventListener("click", fermer);
    pop.querySelector(".f-ok").addEventListener("click", function () {
      var nom = inputNom.value.trim();
      if (!nom) { fermer(); return; }
      fermer();
      enregistrerStatutsServeur([{ cle: s.cle, nom: nom, couleur: pop.querySelector(".f-couleur").value, ordre: s.ordre }], [], []).then(function (r) {
        rafraichirApresStatuts(r);
        toast("Modifié.");
      }).catch(function (err) { toast("Échec de la modification : " + (err && err.message ? err.message : err)); });

  function supprimerStatutServeur(s) {
    if (!s) return;
    demanderConfirmation("Supprimer le statut « " + s.nom + " » ? Les tâches qui l’utilisaient n’auront plus de statut.", function () {
      enregistrerStatutsServeur([], [], [s.cle]).then(function (r) {
        rafraichirApresStatuts(r);

  /* ============================================================
     PAGE "ENTRÉE RAPIDE" — CRUD des formulaires dynamiques (§3 du spec,
     apiListerFormulairesRapides/apiEnregistrerFormulaireRapide/
     apiSupprimerFormulaireRapide). "Assigné à" restauré round "reverifie 1x
     que tu a tout fait" du 02.09.2026 (8e colonne AssigneA côté WebApp.gs,
     select .nf-assigne ici, filtrage dans boutonsMenuAjout) — c'était une
     déviation documentée vs le prototype (contrat serveur pas encore étendu
     à l'époque, cf. FRONTEND-CHANGELOG.md §2), pas un manque définitif.
     Simplifications restantes vs le prototype : pas de "type" (Tâche/
     Absence) par formulaire (cf. ouvrirFormulaireDynamique plus haut). Pas
     de champ "unité" dédié pour un champ Nombre (absent du contrat) : à
     inclure dans le libellé (ex. "Quantité (m³)").
     ============================================================ */
  var champsEnConstruction = [];
  var formulaireEnEdition = null; // nom du formulaire en édition, ou null pour un nouveau
  var typeChampActuel = "texte";

  // Les 3 formulaires rapides HISTORIQUES (Armature/Béton/Livraison armature)
  // ont chacun leur propre interface dédiée, codée en dur (cf.
  // ouvrirFormulaireArmature/ouvrirFormulaireBeton/ouvrirFormulaireLivraisonArmature
  // plus bas), reconnue par CORRESPONDANCE EXACTE DE NOM dans
  // cablerBoutonsMenuAjout — jamais par le formulaire générique ci-dessous.
  // Round "entrées rapides disparues" (01.09.2026, cf. BACKEND-CHANGELOG.md
  // §7bis pour le détail complet) : ces 3 noms peuvent désormais apparaître
  // dans CETTE page de réglages générique (avant, la feuille de config était
  // vide et ils n'apparaissaient nulle part). Les y RENOMMER casserait
  // silencieusement la correspondance exacte de nom et ferait perdre leur
  // interface dédiée au profit du formulaire générique (vide, seul le champ
  // "info" placeholder) — "Modifier" est donc désactivé pour ces 3-là
  // (leurs champs ne sont de toute façon jamais lus par leur interface
  // dédiée, cf. FR_CHAMPS_DEFAUT côté WebApp.gs). "Supprimer" reste permis
  // (retire simplement le bouton du menu "Ajouter", sans danger — facile à
  // reconstruire en resauvegardant n'importe quel autre formulaire, qui
  // réutilise la même feuille).
  var NOMS_FORMULAIRES_SPECIAUX = ["Armature", "Béton", "Livraison armature"];

  function champsResumeAffiche(f) {
    return (f.champs && f.champs.length) ? f.champs.map(function (c) { return c.label; }).join(" · ") : "Aucun champ";
  }
  // ---- "Assigné à" = une CATÉGORIE, pas une personne ---------------------
  // Correction du 02.09.2026 (Lionel : "les ajouts rapides doivent être pour
  // le personnel en général, pas une seule personne"). Sa demande d'origine —
  // "les entrées rapides par intervenant ou ouvrier" — parlait bien des deux
  // CATÉGORIES (le personnel d'un côté, les intervenants de l'autre) ; je
  // l'avais sur-interprétée en assignation individuelle. Le besoin réel :
  // qu'un formulaire "Armature" n'encombre pas le menu des intervenants, et
  // inversement.
  //   ""              -> tout le monde
  //   "@personnel"    -> le personnel interne seulement
  //   "@intervenants" -> les sous-traitants seulement
  // Rétrocompatibilité : une valeur numérique est une ancre de personne
  // (assignation individuelle du round précédent) — toujours honorée à
  // l'affichage comme au filtrage, pour ne rien casser de ce qui a déjà pu
  // être enregistré, même si l'interface ne propose plus de la créer.
  var ASSIGNE_TOUS = "", ASSIGNE_PERSONNEL = "@personnel", ASSIGNE_INTERVENANTS = "@intervenants";
  function nomAssigneAffiche(f) {
    var a = String(f.assigneA || "");
    if (a === ASSIGNE_TOUS) return "Tout le monde";
    if (a === ASSIGNE_PERSONNEL) return "Personnel";
    if (a === ASSIGNE_INTERVENANTS) return "Intervenants";
    var p = personneParAncre(a); // ancienne assignation individuelle
    return p ? p.nom : ("#" + a);
  }
  // Ce formulaire doit-il apparaître dans le menu "Ajouter" de cette personne ?
  function formulaireVisiblePour(f, personneId) {
    var a = String(f.assigneA || "");
    if (a === ASSIGNE_TOUS) return true;
    var estIntervenant = secteurPersonne(personneId) === "sous-traitant";
    if (a === ASSIGNE_PERSONNEL) return !estIntervenant;
    if (a === ASSIGNE_INTERVENANTS) return estIntervenant;
    return a === String(personneId); // ancienne assignation individuelle
  }
  function renderFormulaires() {
    var zone = document.getElementById("listeFormulaires");
    if (!zone) return;
    // Filet de sécurité, cf. chargerFormulairesRapides — no-op si déjà
    // chargé/en cours (cas normal, le chargement d'arrière-plan démarré à
    // l'ouverture de l'appli a presque toujours déjà fini ici).
    chargerFormulairesRapides();
    var liste = etat.formulairesRapidesServeur.slice().sort(function (a, b) { return (a.ordre || 0) - (b.ordre || 0); });
    zone.innerHTML = liste.map(function (f) {
      return '<div class="carte-form" data-nom="' + esc2(f.nom) + '">' +
        '<div class="gauche"><b>' + esc(f.nom) + '</b><span class="champs">' + esc(champsResumeAffiche(f)) + ' · Assigné à : ' + esc(nomAssigneAffiche(f)) + (f.typeEntree === "absence" ? ' · Absence' : '') + '</span></div>' +
        '<div class="droite">' +
        '<button type="button" class="lien-modifier">Modifier</button>' +
        '<button type="button" class="lien-supprimer">Supprimer</button></div></div>';
    }).join("") || '<div class="page-placeholder">Aucun formulaire pour l’instant.</div>';
    // Bouton d'ajout EN BAS DE LISTE, comme sur Chantiers, Statuts, Personnel
    // et Intervenants (retour de Lionel : "le bouton ajout de formulaire est
    // mal placé"). Il était seul de son espèce en haut, dans le titre de page.
    var btnBas = document.createElement("button");
    btnBas.type = "button";
    btnBas.className = "ligne-ajouter";
    btnBas.textContent = "+ Nouveau formulaire";
    btnBas.addEventListener("click", ouvrirNouveauFormulaire);
    zone.appendChild(btnBas);
    // Reprise en un clic des absences historiques (Congé / Vacances), jusqu'ici
    // codées en dur dans le menu "Ajouter" et donc impossibles à éditer. Un
    // bouton explicite plutôt qu'une création automatique : rien n'est écrit
    // dans sa feuille sans qu'il l'ait demandé. Disparaît une fois faites.
    if (!liste.some(function (f) { return f.typeEntree === "absence"; })) {
      var btnAbs = document.createElement("button");
      btnAbs.type = "button";
      btnAbs.className = "ligne-ajouter";
      btnAbs.textContent = "+ Reprendre les absences (Congé, Vacances) pour pouvoir les modifier";
      btnAbs.addEventListener("click", creerAbsencesParDefaut);
      zone.appendChild(btnAbs);
    }
    zone.querySelectorAll(".lien-modifier").forEach(function (btn) {
      btn.addEventListener("click", function () {

      el.addEventListener("click", function (ev) {
        if (ev.target.classList.contains("pastille-cat")) return; // clic sur la pastille = choix de couleur, pas sélection de catégorie active
        ferieCategorieActive = el.dataset.cat;
        renderFerieCategories();
      });
    });
    zone.querySelectorAll(".pastille-cat").forEach(function (el) {
      // "input" : aperçu live pendant que le sélecteur natif est ouvert
      // (calendrier + grille du planning se reteintent immédiatement, comme
      // dans la maquette d'origine) — rien n'est envoyé au serveur ici.
      el.addEventListener("input", function () {
        var cat = catsFeries().filter(function (c) { return c.id === el.dataset.catCouleur; })[0];
        if (cat) cat.couleur = el.value;
        renderFerieCalendrier();
        render(false);
      });
      // "change" (tiré une fois la popup couleur native refermée) : seul
      // moment où on enregistre côté serveur — jamais à chaque "input", qui
      // tirerait des dizaines d'appels pendant un glissement dans le sélecteur.
      el.addEventListener("change", function () {
        enregistrerCouleurCategorieFerie(el.dataset.catCouleur, el.value);
      });
    });
  }
  function enregistrerCouleurCategorieFerie(id, couleur) {
    enregistrerCouleursCategoriesFeriesServeur([{ id: id, couleur: couleur }]).then(function (r) {
      etat.categoriesFeriesServeur = (r && r.length) ? r : etat.categoriesFeriesServeur;
      renderFerieCategories();
      renderFerieCalendrier();
      render(false);
      toast("Couleur enregistrée.");
    }).catch(function (err) { toast("Échec de l’enregistrement : " + (err && err.message ? err.message : err)); });
  }
  function renderFerieCalendrier() {
    var table = document.getElementById("ferieCalendrier");
    if (!table) return;
    var html = '<colgroup><col style="width:78px">';
    for (var jc = 1; jc <= 31; jc++) html += "<col>";
    html += "</colgroup><thead><tr><th class=\"coin\"></th>";
    for (var j = 1; j <= 31; j++) html += "<th>" + j + "</th>";
    html += "</tr></thead><tbody>";
    for (var m = 0; m < 12; m++) {
      html += '<tr><td class="mois">' + MOIS_FR[m] + "</td>";
      var nbJours = joursDansMois(ferieAnnee, m);
      for (var j2 = 1; j2 <= 31; j2++) {
        if (j2 > nbJours) { html += '<td class="jour vide"></td>'; continue; }
        var jourSemaine = new Date(ferieAnnee, m, j2).getDay();
        var estWeekend = jourSemaine === 0 || jourSemaine === 6;
        var entree = feriesAnneeCourante[m + "-" + j2];
        var cat = entree && catsFeries().filter(function (c) { return c.id === entree.categorie; })[0];
        var classes = "jour" + (estWeekend ? " weekend" : "") + (cat ? " coloree" : "");
        var style = cat ? ' style="--jour-couleur:' + cat.couleur + '"' : "";
        var titre = entree ? ' title="' + esc(entree.libelle) + '"' : "";
        html += '<td class="' + classes + '" data-m="' + m + '" data-j="' + j2 + '" data-weekend="' + estWeekend + '"' + style + titre + "></td>";
      }
      html += "</tr>";
    }
    html += "</tbody>";
    table.innerHTML = html;
    table.querySelectorAll("td.jour:not(.vide)").forEach(function (td) {
      if (td.dataset.weekend === "true") return; // week-end non cliquable (déjà chômé, cf. calculerFeries)
      td.addEventListener("click", function () {
        var m = +td.dataset.m, j = +td.dataset.j, key = m + "-" + j;
        var actuel = feriesAnneeCourante[key];
        if (actuel && actuel.categorie === ferieCategorieActive) {
          delete feriesAnneeCourante[key];
        } else {
          var catObj = catsFeries().filter(function (c) { return c.id === ferieCategorieActive; })[0];
          feriesAnneeCourante[key] = {
            iso: isoFerie(ferieAnnee, m, j),
            libelle: (actuel && actuel.libelle) || catObj.nom,
            categorie: ferieCategorieActive
          };
        }
        renderFerieCalendrier();
      });
    });
  }
  function renderFeries() {
    chargerFeriesAnnee(ferieAnnee);
    document.getElementById("ferieAnneeLabel").textContent = ferieAnnee;
    renderFerieCategories();
    renderFerieCalendrier();
  }
  function cablerPageFeries() {
    var prec = document.getElementById("ferieAnneePrec"), suiv = document.getElementById("ferieAnneeSuiv");
    if (prec) prec.addEventListener("click", function () { ferieAnnee--; renderFeries(); });
    if (suiv) suiv.addEventListener("click", function () { ferieAnnee++; renderFeries(); });
    var btnCalc = document.getElementById("btnCalculerFeries");
    if (btnCalc) btnCalc.addEventListener("click", function () {
      calculerFeries(ferieAnnee).forEach(function (it) {
        var key = it.mois + "-" + it.jour;
        var existant = feriesAnneeCourante[key];
        // Round du 02.09.2026 (suite, bug remonté par Lionel) : un jour déjà
        // catégorisé manuellement en "Vacances entreprise"/"Compensés" n'est
        // plus écrasé par un recalcul — seuls les jours encore vides ou déjà
        // "ferie" (donc pas encore décidés autrement) sont (re)remplis. Avant
        // ce correctif, "Calculer les fériés" remettait silencieusement en
        // "Férié" tout jour déjà marqué autrement s'il coïncidait avec un
        // férié calculé (Noël, Nouvel an, etc.) — repassait potentiellement
        // beaucoup de jours en rouge d'un coup, sans confirmation.
        if (existant && existant.categorie !== "ferie") return;
        feriesAnneeCourante[key] = { iso: isoFerie(ferieAnnee, it.mois, it.jour), libelle: it.nom, categorie: "ferie" };
      });
      renderFerieCalendrier();
      toast("Fériés calculés pour " + ferieAnnee + " (pas encore enregistrés).");
    });
    var btnEff = document.getElementById("btnEffacerFeries");
    if (btnEff) btnEff.addEventListener("click", function () {
      demanderConfirmation("Effacer toutes les dates colorées de " + ferieAnnee + " à l’écran (Enregistrer ensuite pour appliquer) ?", function () {
        feriesAnneeCourante = {};
        renderFerieCalendrier();
        toast("Effacé à l’écran — clique Enregistrer pour appliquer.");
      });
    });
    var btnSave = document.getElementById("btnEnregistrerFeries");
    if (btnSave) btnSave.addEventListener("click", function () {
      var modifs = [], nouveaux = [], supprimes = [], clesVues = {};
      Object.keys(feriesAnneeCourante).forEach(function (k) {
        clesVues[k] = true;
        var cur = feriesAnneeCourante[k], orig = feriesAnneeOriginal[k];
        if (!orig) nouveaux.push({ iso: cur.iso, libelle: cur.libelle, categorie: cur.categorie });
        else if (orig.libelle !== cur.libelle || orig.categorie !== cur.categorie) modifs.push({ iso: cur.iso, libelle: cur.libelle, categorie: cur.categorie });
      });
      Object.keys(feriesAnneeOriginal).forEach(function (k) { if (!clesVues[k]) supprimes.push(feriesAnneeOriginal[k].iso); });
      if (!modifs.length && !nouveaux.length && !supprimes.length) { toast("Rien à enregistrer."); return; }
      // Diagnostic (round du 02.09.2026, suite, bug remonté par Lionel —
      // "presque tout est écrasé lors de l'enregistrement"). Round encore
      // suivant (même jour) : Lionel a confirmé via apiVersionServeur() que
      // le déploiement actif sert bien CE WebApp.gs, et le bug persiste quand
      // même — l'hypothèse "déploiement pas à jour" est donc ÉLIMINÉE. Le
      // message ci-dessous ne doit plus prétendre le contraire (corrigé),
      // et le diagnostic est rendu plus précis (iso/catégorie concrets,
      // envoyé vs revenu, au lieu d'un simple compte) pour trouver la vraie
      // cause sans deviner à l'aveugle une 3e fois.
      var categoriesEnvoyees = {};
      modifs.concat(nouveaux).forEach(function (e) { categoriesEnvoyees[e.iso] = e.categorie; });
      enregistrerFeriesServeur(modifs, nouveaux, supprimes).then(function (r) {
        etat.feriesServeur = r || [];
        reconstruireFeriesParIso();
        chargerFeriesAnnee(ferieAnnee);
        renderFerieCalendrier();
        render(false); // les teintes de fériés du planning peuvent avoir changé
        var categoriesRevenues = {};
        (r || []).forEach(function (f) { categoriesRevenues[f.iso] = f.categorie; });
        var visees = 0, ecarts = 0, exemples = [];
        Object.keys(categoriesEnvoyees).forEach(function (iso) {
          if (categoriesEnvoyees[iso] === "ferie") return; // rien à détecter si "ferie" était déjà voulu
          visees++;
          var revenu = categoriesRevenues.hasOwnProperty(iso) ? categoriesRevenues[iso] : "(absent de la réponse)";
          if (revenu !== categoriesEnvoyees[iso]) {
            ecarts++;
            if (exemples.length < 3) exemples.push(iso + " : envoyé « " + categoriesEnvoyees[iso] + " », revenu « " + revenu + " »");
          }
        });
        if (ecarts > 0) {
          // Filet de sécurité conservé après la résolution du bug des fériés
          // (cf. BACKEND-CHANGELOG.md §19, cause = cellules fusionnées en
          // colonne "Catégorie") : si une catégorie enregistrée ne revient
          // pas telle qu'envoyée, mieux vaut le dire avec le détail utile que
          // d'afficher "Enregistré." sur une perte silencieuse — c'est ce
          // silence qui avait laissé le bug s'installer. Le rapatriement du
          // diagnostic serveur dans ce message, lui, est retiré : il n'avait
          // de sens que le temps de l'enquête.
          toast("Enregistré, mais " + ecarts + " jour(s) sur " + visees + " n’ont pas gardé la catégorie demandée. Exemples — " + exemples.join(" ; "));
        } else {
          toast("Enregistré.");
        }
      }).catch(function (err) { toast("Échec de l’enregistrement : " + (err && err.message ? err.message : err)); });
    });
  }

  /* ============================================================
     CHARGEMENT DEPUIS SUPABASE (phase 4, étape 2 du §6bis)
     ------------------------------------------------------------
     Remplace apiDemarrer()/apiChargerSemaine() (WebApp.gs) : le nouveau
     schéma (sql/0001_schema.sql) n'a plus de notion de "semaine" côté
     serveur — taches/assignations/jalons/notes sont juste des lignes avec
     une vraie date. `labG` redevient donc une coordonnée PUREMENT CLIENTE
     (jamais envoyée ni reçue du serveur) : l'entier YYYYMMDD du LUNDI de la
     semaine, qui sert uniquement de clé au cache existant
     (etat.cache/mettreEnCache, cf. plus haut) — exactement le même rôle
     qu'avant, juste calculé au lieu de venir de la colonne label du
     classeur.

     Trois familles de fonctions ci-dessous :
     - des fonctions de dates PURES (numeroSemaineIsoUTC, genererSemaines,
       infosSemaineDepuisLabG...) — jamais d'appel réseau, testées dans
       test_chargement.js ;
     - construireDonneesSemaine(labG, brut, lookups), pure elle aussi : prend
       des lignes Supabase déjà récupérées (tableaux d'objets bruts) et les
       remet exactement dans la forme que chargerSemaine_ (WebApp.gs)
       renvoyait — c'est CE contrat que construireVueDepuisCache() (plus
       bas, INCHANGÉE) consomme, jamais modifié ici ;
     - chargerSemaineDepuisServeur(labG), la seule des trois à parler au
       réseau (sbClient.from(...)) : un mince emballage autour des deux
       précédentes.
     ============================================================ */

  // Fenêtre de semaines générée au bootstrap, très large (~5 ans de chaque
  // côté d'aujourd'hui) — pure arithmétique de dates, sans coût serveur
  // (rien n'est chargé avant assurerFenetreChargee), qui rend en pratique
  // inatteignables les messages "Déjà la première/dernière semaine du
  // planning" (naviguerSemaine) : il n'y a plus de notion de planning qui
  // "s'arrête" quelque part, contrairement au classeur (SEMAINES_AVANCE).
  var FENETRE_SEMAINES = 260;

  function pad2_(n) { return (n < 10 ? "0" : "") + n; }
  // Parse strict "YYYY-MM-DD" -> Date UTC (minuit UTC) — même convention que
  // functions/*/logic.js (dateUTC), reprise ici pour que toute l'arithmétique
  // de semaines du client suive la même règle que le backend : jamais de
  // Date en heure locale (cf. new Date(y,m,d) qui dépendrait du fuseau du
  // navigateur, piège classique autour de minuit).
  function dateUTCDepuisIso_(iso) {
    var p = String(iso || "").split("-");
    if (p.length !== 3) throw new Error("Date invalide : " + iso);
    var d = new Date(Date.UTC(parseInt(p[0], 10), parseInt(p[1], 10) - 1, parseInt(p[2], 10)));
    if (isNaN(d.getTime())) throw new Error("Date invalide : " + iso);
    return d;
  }
  function isoDepuisDateUTC_(d) { return d.toISOString().slice(0, 10); }
  function ajouterJoursUTC_(d, n) { var r = new Date(d.getTime()); r.setUTCDate(r.getUTCDate() + n); return r; }
  // labG <-> iso du lundi qu'il désigne — pure reformulation, aucun calcul
  // de calendrier ici (cf. lundiDeSemaineUTC pour "quel est le lundi de la
  // semaine contenant telle date").
  function labGVersIso_(labG) { var s = String(labG); return s.slice(0, 4) + "-" + s.slice(4, 6) + "-" + s.slice(6, 8); }
  function isoVersLabG(iso) { return parseInt(String(iso).replace(/-/g, ""), 10); }

  // Port UTC de numeroSemaineIso_ (WebApp.gs) — même formule ("jeudi de la
  // même semaine ISO"), seule la base horaire change (UTC au lieu
  // d'heure locale, cf. dateUTCDepuisIso_ ci-dessus). Le "jeudi" est ce qui
  // fait fonctionner la règle même à cheval sur une année (le n° de semaine
  // ISO d'un lundi 30 décembre peut être "1" de l'année suivante, cf.
  // test_chargement.js) : le jeudi de cette semaine-là tombe bien en janvier.
  function numeroSemaineIsoUTC(dateIso) {
    var d = dateUTCDepuisIso_(dateIso);
    var jeudi = ajouterJoursUTC_(d, 3 - ((d.getUTCDay() + 6) % 7));
    var j4 = new Date(Date.UTC(jeudi.getUTCFullYear(), 0, 4));
    return 1 + Math.round(((jeudi.getTime() - j4.getTime()) / 86400000 - 3 + ((j4.getUTCDay() + 6) % 7)) / 7);
  }
  // Lundi (iso) de la semaine ISO contenant dateIso — port UTC de lundiDe_.
  function lundiDeSemaineUTC(dateIso) {
    var d = dateUTCDepuisIso_(dateIso);
    return isoDepuisDateUTC_(ajouterJoursUTC_(d, -((d.getUTCDay() + 6) % 7)));
  }

  // Génère etat.semaines : une entrée par semaine (lundi ancré), de
  // `semainesAvant` semaines avant la semaine d'aujourd'hui à `semainesApres`
  // après, dans l'ordre chronologique. Remplace entièrement le mécanisme de
  // "création automatique des semaines manquantes" (assurerSemainesAvance_,
  // WebApp.gs) : plus rien à "créer" à l'avance, une date est une date, que
  // des lignes existent déjà dessus ou non.
  function genererSemaines(aujourdhuiIso, semainesAvant, semainesApres) {
    var lundiAuj = dateUTCDepuisIso_(lundiDeSemaineUTC(aujourdhuiIso));
    var out = [];
    for (var i = -semainesAvant; i <= semainesApres; i++) {
      var lundi = ajouterJoursUTC_(lundiAuj, i * 7);
      var lundiIso = isoDepuisDateUTC_(lundi);
      // fin = DIMANCHE (pas vendredi) : même bornage que l'ancien
      // listerSemainesPlanning (WebApp.gs), qui prenait la dernière date
      // trouvée sur la ligne 3 en balayant jusqu'à la colonne week-end
      // dimanche incluse — c'est ce bornage que indexSemaineAujourdhui_
      // (plus bas, INCHANGÉE) utilise pour "la semaine contenant aujourd'hui"
      // : un samedi/dimanche doit rester rattaché à SA semaine, pas basculer
      // sur la suivante.
      var dimancheIso = isoDepuisDateUTC_(ajouterJoursUTC_(lundi, 6));
      out.push({ labG: isoVersLabG(lundiIso), num: String(numeroSemaineIsoUTC(lundiIso)), debut: lundiIso, fin: dimancheIso });
    }
    return out;
  }

  // Abréviations françaises de mois pour l'affichage des dates de la grille
  // — copiées telles quelles de WebApp.gs (MOIS_ABBR_WEB).
  var MOIS_ABBR_WEB = ["", "jan.", "fév.", "mars", "avr.", "mai", "juin", "juil.", "août", "sept.", "oct.", "nov.", "déc."];

  // Couleurs proposées pour un nouveau chantier — copiées telles quelles de
  // Planning_Format.gs (CHANTIER_PALETTE) : palette choisie pour rester
  // lisible à l'impression (cf. commentaire d'origine dans Planning_Format.gs),
  // reprise sans y toucher. etat.palette (demarrer()) s'en sert directement ;
  // couleurProposeeChantier() (page "Chantiers", pas encore portée) choisira
  // la 1ère couleur pas encore utilisée dedans, exactement comme avant.
  var CHANTIER_PALETTE = [
    '#adcbef', '#f8c8b5', '#aee3d0', '#fae5ba', '#f5c4d6', '#bcdebc', '#b8b2dd', '#f5c0c0',
    '#81afe7', '#f4ab8e', '#7bd1b2', '#f7d691', '#efa3c0', '#95cb95', '#938acb', '#f1a1a0',
    '#5493de', '#f08e67', '#3aba8c', '#f4c45f'
  ];

  // Toutes les dates dérivées d'un labG : les 5 jours ouvrés (affichage +
  // clé de regroupement) et les 2 jours de week-end — pure, réutilisée à la
  // fois pour construire la plage de la requête Supabase (chargerSemaineDepuisServeur)
  // et pour peupler dates/mois/isoDates/weekendDates du contrat de sortie
  // (construireDonneesSemaine).
  function infosSemaineDepuisLabG(labG) {
    var lundiIso = labGVersIso_(labG);
    var lundi = dateUTCDepuisIso_(lundiIso);
    var dates = [], mois = [], isoDates = [];
    for (var j = 0; j < 5; j++) {
      var d = ajouterJoursUTC_(lundi, j);
      dates.push(pad2_(d.getUTCDate()));
      mois.push(MOIS_ABBR_WEB[d.getUTCMonth() + 1]);
      isoDates.push(isoDepuisDateUTC_(d));
    }
    var weekendDates = [isoDepuisDateUTC_(ajouterJoursUTC_(lundi, 5)), isoDepuisDateUTC_(ajouterJoursUTC_(lundi, 6))];
    return { debut: lundiIso, fin: weekendDates[1], dates: dates, mois: mois, isoDates: isoDates, weekendDates: weekendDates };
  }

  // Remet en forme des lignes Supabase déjà récupérées (taches/assignations/
  // jalons/notes de la semaine, personnes déjà chargées une fois au
  // bootstrap) dans EXACTEMENT la forme que chargerSemaine_ (WebApp.gs)
  // renvoyait — c'est ce contrat que construireVueDepuisCache() consomme,
  // inchangé, plus bas dans ce fichier.
  //
  // brut = { personnes, taches, assignations, jalons, notes } (tableaux
  // bruts, tels que renvoyés par sbClient.from(...).select(...)).
  // lookups = { chantiersParId, statutsParId } (cf. etat, remplis par
  // demarrer()).
  //
  // Décision de portage (cf. §8 du plan, "deux chantiers sur une même
  // demi-journée") : le nouveau schéma autorise plusieurs lignes
  // `assignations` pour la même (personne, date, demi), l'UI actuelle
  // (comme l'ancien classeur) n'en affiche qu'une par case — on garde donc
  // la PREMIÈRE par id croissant et on ignore les suivantes. Même règle
  // pour un éventuel jalon en double sur une même date (ne devrait pas
  // arriver en pratique, aucune contrainte unique en base). Pour l'ordre
  // des tâches et des notes dans une case (avant : ordre des lignes de
  // texte dans la cellule), ordre.taches existe en base (colonne `ordre`,
  // triée ici) ; jalons/notes n'ont pas de colonne d'ordre dédiée — l'id
  // croissant (ordre d'insertion) en tient lieu, repli raisonnable en
  // l'absence d'un besoin exprimé de réordonner des notes à la main.
  function construireDonneesSemaine(labG, brut, lookups) {
    var infos = infosSemaineDepuisLabG(labG);
    var chantiersParId = (lookups && lookups.chantiersParId) || {};
    var statutsParId = (lookups && lookups.statutsParId) || {};

    function cle_(personneId, demi, date) { return personneId + "|" + demi + "|" + date; }

    var assignationParCle = {};
    (brut.assignations || []).slice().sort(function (a, b) { return a.id - b.id; }).forEach(function (a) {
      var k = cle_(a.personne_id, a.demi, a.date);
      if (!assignationParCle[k]) assignationParCle[k] = a; // 1ère par id, cf. commentaire ci-dessus
    });

    var tachesParCle = {};
    (brut.taches || []).slice().sort(function (a, b) { return (a.ordre || 0) - (b.ordre || 0); }).forEach(function (t) {
      var k = cle_(t.personne_id, t.demi, t.date);
      (tachesParCle[k] = tachesParCle[k] || []).push(t);
    });

    var jalonParDate = {};
    (brut.jalons || []).slice().sort(function (a, b) { return a.id - b.id; }).forEach(function (j) {
      if (!jalonParDate[j.date]) jalonParDate[j.date] = j;
    });

    var notesParDate = {};
    (brut.notes || []).slice().sort(function (a, b) { return a.id - b.id; }).forEach(function (n) {
      (notesParDate[n.date] = notesParDate[n.date] || []).push(n);
    });

    function tacheVue_(t) {
      return {
        texte: t.texte,
        statut: t.statut_id != null ? (statutsParId[t.statut_id] || null) : null,
        important: !!t.important,
        serieId: t.serie_id || null,
        // chantier (round du 16.09.2026, sql/0010_taches_chantier_id.sql —
        // Lionel : "plusieurs chantier sur la même case ... actuellement si
        // une tâche est affecté à un chantier, la tâche déjà en place change
        // de chantier") : AVANT ce round, le chantier était un attribut de LA
        // CASE (via `assignations`, cf. celluleVue_ ci-dessous), partagé de
        // force par toutes les tâches empilées dessus — poser un chantier sur
        // une nouvelle tâche recolorait donc TOUTES les autres. `chantier_id`
        // est désormais une vraie colonne de `taches` (comme statut_id) :
        // chaque tâche porte son propre chantier, indépendamment des autres
        // tâches de la même case.
        chantier: t.chantier_id != null ? (chantiersParId[t.chantier_id] || null) : null,
        // Round du 14.09.2026 (bug signalé par Lionel, vidéo à l'appui : « une
        // absence sur plusieurs jours est attribuée à un chantier et prend la
        // couleur grise ») : `taches` gagne une vraie colonne est_absence
        // (sql/0009_taches_est_absence.sql) — avant ce round, RIEN ne
        // distinguait une absence d'une tâche côté serveur (aucune colonne
        // `type`, cf. commentaire de creerSerieServeur plus bas) : le client
        // décidait seul, à CHAQUE reconstruction depuis le cache
        // (construireVueDepuisCache), en appliquant estAbsence() au texte —
        // "Congé"/"Vacances"/tout texte contenant "absent" passait, mais une
        // absence au descriptif libre ("test", un motif personnalisé...)
        // repassait "tâche" dès la synchronisation suivante (synchroniser()
        // recharge systématiquement depuis le serveur après écriture, cf.
        // plus bas) — d'où le passage au gris (repli "chantier introuvable",
        // bulleEl) puis, en rouvrant la fiche, un chantier par défaut
        // proposé/enregistré comme pour une vraie tâche. absence ci-dessous
        // est désormais la source de vérité ; estAbsence(texte) ne reste
        // qu'un FILET DE SÉCURITÉ (OR, cf. construireVueDepuisCache) pour les
        // lignes écrites avant ce round et non couvertes par le backfill SQL.
        absence: !!t.est_absence
      };
    }
    // Une case = une liste de tâches (via taches, chacune avec son PROPRE
    // chantier désormais, cf. tacheVue_ ci-dessus), indexée par
    // (personne, demi, date). `chantier` au niveau de la case redevient un
    // simple REPLI : `assignations` (round du 16.09.2026 — plus jamais écrite
    // par aucun chemin du code, cf. sql/0010_taches_chantier_id.sql) ne peut
    // plus, en pratique, décrire qu'une case sans aucune tâche ; gardé
    // uniquement pour lire d'éventuelles vieilles lignes orphelines encore en
    // base (jamais produites par l'UI actuelle : champChantierHTML n'offre
    // jamais une case vide).
    function celluleVue_(personneId, demi, date) {
      var a = assignationParCle[cle_(personneId, demi, date)];
      var taches = (tachesParCle[cle_(personneId, demi, date)] || []).map(tacheVue_);
      return { chantier: (!taches.length && a) ? (chantiersParId[a.chantier_id] || null) : null, taches: taches };
    }

    var jalons = infos.isoDates.map(function (iso) {
      var j = jalonParDate[iso];
      // demi (round du 08.09.2026, suite — sql/0006_jalons_demi.sql) : un
      // jalon porte désormais lui aussi sa propre demi-journée, exactement
      // comme une note (cf. n.demi juste en dessous).
      return { texte: j ? j.texte : "", serieId: j ? (j.serie_id || null) : null, demi: j ? (j.demi || null) : null };
    });
    var notes = infos.isoDates.map(function (iso) {
      return (notesParDate[iso] || []).map(function (n) {
        return { texte: n.texte, important: !!n.important, serieId: n.serie_id || null, demi: n.demi || null };
      });
    });

    var personnes = (brut.personnes || []).map(function (p) {
      var matin = [], aprem = [];
      for (var j = 0; j < 5; j++) {
        matin.push(celluleVue_(p.id, "matin", infos.isoDates[j]));
        aprem.push(celluleVue_(p.id, "aprem", infos.isoDates[j]));
      }
      // Week-end : toujours demi="matin" (cf. construireVueDepuisCache plus
      // bas, qui pose systématiquement ces 2 cases avec demi:"matin" — seule
      // ligne interactive côté client pour le week-end). weekendDates[0]/[1]
      // = Samedi/Dimanche.
      return {
        ancre: p.id, nom: p.nom, sousTraitant: !!p.sous_traitant,
        matin: matin, aprem: aprem,
        weekend: [celluleVue_(p.id, "matin", infos.weekendDates[0]), celluleVue_(p.id, "matin", infos.weekendDates[1])]
      };
    });

    return {
      labG: labG, numero: String(numeroSemaineIsoUTC(infos.debut)),
      dates: infos.dates, mois: infos.mois, isoDates: infos.isoDates, weekendDates: infos.weekendDates,
      jalons: jalons, notes: notes, personnes: personnes
    };
  }

  // Seule fonction de cette section à parler au réseau : requête les 4
  // tables sur la plage Monday..Sunday du labG donné, filtrées aux personnes
  // actives connues (etat.personnesActives, chargées une fois par
  // demarrer()), puis délègue toute la remise en forme à
  // construireDonneesSemaine ci-dessus. `.in("personne_id", [])` est évité
  // explicitement (tableau vide) : un planning sans personne active ne doit
  // pas déclencher une requête malformée, juste renvoyer des cases vides.
  function chargerSemaineDepuisServeur(labG) {
    var infos = infosSemaineDepuisLabG(labG);
    var idsPersonnes = (etat.personnesActives || []).map(function (p) { return p.id; });
    var qTaches = idsPersonnes.length
      ? sbClient.from("taches").select("*").gte("date", infos.debut).lte("date", infos.fin).in("personne_id", idsPersonnes)
      : Promise.resolve({ data: [], error: null });
    var qAssignations = idsPersonnes.length
      ? sbClient.from("assignations").select("*").gte("date", infos.debut).lte("date", infos.fin).in("personne_id", idsPersonnes)
      : Promise.resolve({ data: [], error: null });
    var qJalons = sbClient.from("jalons").select("*").gte("date", infos.debut).lte("date", infos.fin);
    var qNotes = sbClient.from("notes").select("*").gte("date", infos.debut).lte("date", infos.fin);
    return Promise.all([qTaches, qAssignations, qJalons, qNotes]).then(function (r) {
      r.forEach(function (res) { if (res.error) throw res.error; });
      return construireDonneesSemaine(labG, {
        personnes: etat.personnesActives,
        taches: r[0].data || [],
        assignations: r[1].data || [],
        jalons: r[2].data || [],
        notes: r[3].data || []
      }, { chantiersParId: etat.chantiersParId, statutsParId: etat.statutsParId });
    });
  }

  /* ============ DÉMARRAGE ============ */
  // Remplace apiDemarrer() (WebApp.gs) : plus un seul aller-retour serveur
  // mais 4 petites requêtes Supabase en parallèle (personnes/chantiers/
  // statuts/fériés — les données "de référence", indépendantes de la
  // semaine affichée) suivies d'un premier chargement de semaine
  // (chargerSemaineDepuisServeur), au lieu d'un unique apiDemarrer() qui
  // renvoyait tout d'un bloc. Pas d'équivalent à `creation`/annoncerCreation
  // (WebApp.gs) : il n'y a plus de semaines à "créer" à l'avance (cf.
  // genererSemaines ci-dessus), ce concept disparaît avec le classeur.
  function demarrer() {
    afficherChargement();
    etat.aujourdhui = new Date().toISOString().slice(0, 10); // date du jour, UTC — même convention que le reste du chargement

    Promise.all([
      sbClient.from("personnes").select("id, nom, sous_traitant, ordre").eq("actif", true).order("ordre", { ascending: true }),
      // actif/ordre (sql/0008) : la requête reste volontairement SANS
      // .eq("actif", true) — contrairement à celle des personnes juste
      // au-dessus — pour que chantiersParId (juste en dessous) reste
      // complet, cf. commentaire de listerChantiersDepuisServeur plus bas.
      sbClient.from("chantiers").select("id, nom, couleur, actif, ordre").order("ordre", { ascending: true }),
      sbClient.from("statuts").select("id, cle, nom, couleur, ordre"),
      sbClient.from("feries").select("date, libelle, categorie"),
      // À part des 4 précédentes (cf. juste en dessous) : la table
      // `categories_feries` n'existe que depuis la migration 0005 (étape 3
      // du §6bis) — tant que Lionel ne l'a pas encore collée dans l'Éditeur
      // SQL, cette requête échoue seule ("relation does not exist"), sans
      // empêcher le reste de l'appli de démarrer (cf. plus bas).
      sbClient.from("categories_feries").select("id, nom, couleur")
    ]).then(function (r) {
      r.slice(0, 4).forEach(function (res) { if (res.error) throw res.error; }); // ces 4-là restent bloquantes, comme avant
      var personnesBrutes = r[0].data || [], chantiersBruts = r[1].data || [], statutsBruts = r[2].data || [], feriesBruts = r[3].data || [];
      var categoriesFeriesBrutes = (r[4] && !r[4].error) ? (r[4].data || []) : [];

      etat.personnesActives = personnesBrutes;

      etat.chantiersParId = {};
      chantiersBruts.forEach(function (c) { etat.chantiersParId[c.id] = c.nom; });
      etat.statutsParId = {};
      statutsBruts.forEach(function (s) { etat.statutsParId[s.id] = s.cle; });
      // Sens inverse (étape 4 du §6bis) : gerer-serie/enregistrer-serie
      // attendent un statutId, alors que la vue ne connaît le statut que par
      // sa clé (STATUTS[cle]) — nécessaire pour traduire avant l'appel.
      etat.statutIdParCle = {};
      statutsBruts.forEach(function (s) { etat.statutIdParCle[s.cle] = s.id; });

      // .ligne = chantiers.id (Supabase) — identité utilisée par la page de
      // config "Chantiers" (CRUD direct, cf. section "CONFIG SIMPLE" plus
      // bas, étape 3 du §6bis).
      etat.chantiers = chantiersBruts.map(function (c) { return { nom: c.nom, couleur: c.couleur, ligne: c.id, actif: c.actif !== false, ordre: c.ordre || 0 }; });
      etat.chantierParNom = {};
      etat.chantiers.forEach(function (c) { etat.chantierParNom[c.nom] = c; });
      etat.palette = CHANTIER_PALETTE.slice();
      etat.statutsServeur = statutsBruts.map(function (s) { return { cle: s.cle, nom: s.nom, couleur: s.couleur, ordre: s.ordre }; });
      etat.feriesServeur = feriesBruts.map(function (f) { return { iso: f.date, libelle: f.libelle, categorie: f.categorie }; });
      // [] si la table est absente ou vide : catsFeries() (plus bas) retombe
      // alors sur CATEGORIES_FERIES_DEFAUT — jamais bloquant, cf. le
      // commentaire de la requête ci-dessus.
      etat.categoriesFeriesServeur = categoriesFeriesBrutes.map(function (c) { return { id: c.id, nom: c.nom, couleur: c.couleur }; });
      reconstruireFeriesParIso();

      etat.cache = {}; etat.cacheTs = {};
      etat.semaines = genererSemaines(etat.aujourdhui, FENETRE_SEMAINES, FENETRE_SEMAINES);
      etat.indexSemaine = indexSemaineAujourdhui_(); // réutilise la règle existante (semaine du jour, sinon prochaine, sinon dernière)

      return chargerSemaineDepuisServeur(etat.semaines[etat.indexSemaine].labG);
    }).then(function (data) {
      mettreEnCache(data);
      appliquerStatutsEtFormulaires();
      idc = 1;
      // Coquille de navigation (sidebar + 9 pages) : construite une seule
      // fois ici, APRÈS un premier chargement réussi — #racine n'existe
      // qu'à partir de maintenant, d'où le re-fetch juste après (racineEl
      // était resté null, cf. sa déclaration).
      construireCoquille();
      racineEl = document.getElementById("racine");
      construireVueDepuisCache();
      construireSelectChantier();
      render();
      // Planning déjà affiché à ce stade : le reste (formulaires rapides,
      // cf. chargerFormulairesRapides) se charge maintenant en arrière-plan,
      // sans bloquer davantage l'écran de chargement.
      chargerFormulairesRapides();
    }).catch(erreurFatale);
  }

  function appliquerStatutsEtFormulaires() {
    STATUTS = {}; STATUTS_ORDRE = [];
    etat.statutsServeur.slice().sort(function (a, b) { return (a.ordre || 0) - (b.ordre || 0); }).forEach(function (s) {
      STATUTS[s.cle] = { nom: s.nom, couleur: s.couleur };
      STATUTS_ORDRE.push(s.cle);
    });
    // Bug corrigé le 03.09.2026 (retour de Lionel : "menu ajout rapide a des
    // absences en double") : ce .map() ne gardait que {nom, champs} et
    // perdait donc `typeEntree`/`assigneA` — pourtant bien renvoyés par
    // apiListerFormulairesRapides (WebApp.gs) et lus un peu partout ailleurs
    // (formulaireVisiblePour, ouvrirFormulaireDynamique, la page "Formulaires").
    // Conséquence concrète dans le menu "Ajouter" (boutonsMenuAjout) :
    // `f.typeEntree` valant toujours undefined, `aDesAbsencesConfigurees`
    // n'était jamais vrai -> les boutons "Congé"/"Vacances" historiques
    // (repli codé en dur) continuaient de s'afficher MÊME après que Lionel
    // ait configuré ses propres absences dans les formulaires rapides,
    // à côté du bouton fraîchement configuré portant le même nom : d'où le
    // doublon. Deuxième conséquence, plus grave quoique invisible depuis le
    // menu : un formulaire rapide configuré en type "Absence" (avec ou sans
    // champ) était malgré tout enregistré comme une TÂCHE (ajoutRapide/
    // ouvrirFormulaireDynamique retombent sur "tache" par défaut quand
    // typeEntree est absent).
    FORMULAIRES_RAPIDES = etat.formulairesRapidesServeur.slice().sort(function (a, b) { return (a.ordre || 0) - (b.ordre || 0); })
      .map(function (f) { return { nom: f.nom, champs: f.champs || [], typeEntree: f.typeEntree, assigneA: f.assigneA || "" }; });
  }

  // PERFORMANCE (round audit, 02.09.2026 — retour de Lionel : "les temps de
  // chargement me semble long") : apiDemarrer() ne renvoie plus
  // formulairesRapides (cf. WebApp.gs, commentaire sur apiDemarrer) — cette
  // donnée ne sert que dans le menu "Ajouter" d'un intervenant et la page
  // "Entrée rapide", jamais pour afficher le planning lui-même. Chargée à
  // part ici, en ARRIÈRE-PLAN : démarrée juste après le premier rendu du
  // planning (cf. demarrer() plus bas — l'écran de chargement est déjà
  // fermé à ce moment-là, l'appel ne bloque plus rien), et de nouveau,
  // sans effet si déjà chargé/en cours (mémorisé dans promesseFormulairesRapides),
  // à l'ouverture du menu "Ajouter" d'un intervenant ou de la page "Entrée
  // rapide" — au cas rare où l'un des deux serait ouvert avant que le
  // chargement d'arrière-plan soit terminé.
  var formulairesRapidesCharges = false;
  var promesseFormulairesRapides = null;
  function chargerFormulairesRapides() {
    if (formulairesRapidesCharges || promesseFormulairesRapides) return promesseFormulairesRapides;
    promesseFormulairesRapides = listerFormulairesRapidesDepuisServeur().then(function (r) {
      etat.formulairesRapidesServeur = r || [];
      formulairesRapidesCharges = true;
      appliquerStatutsEtFormulaires();
      renderFormulaires(); // no-op si la page "Entrée rapide" n'est pas construite (zone introuvable)
    }).catch(function () {
      promesseFormulairesRapides = null; // échec : retenté au prochain appel (menu "Ajouter" ou page "Entrée rapide")
    });
    return promesseFormulairesRapides;
  }

  /* ============================================================
     CONFIG SIMPLE — LECTURE/ÉCRITURE DIRECTE DES TABLES (phase 4, étape 3
     du §6bis). Remplace les 14 apiXxx "mécaniques" de WebApp.gs
     (apiAjouterPersonne/apiRenommerPersonne/apiSupprimerPersonne/
     apiCompterTachesPersonnes, apiEnregistrerChantiers/apiRenommerChantier/
     apiCompterUtilisationsChantier/apiSupprimerChantier,
     apiEnregistrerStatuts, apiListerFormulairesRapides/
     apiEnregistrerFormulaireRapide/apiSupprimerFormulaireRapide,
     apiEnregistrerFeriesV3/apiEnregistrerCategoriesFeries) par de simples
     appels sbClient.from(...) — aucune de ces opérations n'a besoin d'une
     Edge Function (§5 du plan), toutes vivent déjà entièrement côté client
     une fois RLS + GRANT en place (sql/0002_rls.sql, sql/0004).

     Portage volontairement PAS littéral : la plupart des paramètres
     "labG"/"portée" de l'ancien contrat n'ont plus de sens une fois qu'une
     personne/un chantier est une vraie ligne de table, identifiée par un
     vrai id, au lieu d'une position de cellule partagée par toutes les
     semaines. Détail des déviations dans FRONTEND-CHANGELOG.md (étape 3).
     ============================================================ */

  // ---- PERSONNEL / INTERVENANTS --------------------------------------
  // labG n'est plus envoyé : une personne est une seule ligne `personnes`,
  // valable pour toutes les semaines passées et futures — il n'y a plus de
  // "semaine visée" à laquelle rattacher l'ajout/le renommage.
  function prochainOrdrePersonne_() {
    var max = 0;
    (etat.personnesActives || []).forEach(function (p) { if ((p.ordre || 0) > max) max = p.ordre; });
    return max + 1;
  }
  // Recharge etat.personnesActives depuis la table — même requête que
  // demarrer(), réutilisée après tout ajout/renommage/suppression pour que
  // chargerSemaineDepuisServeur (qui filtre `.in("personne_id", ...)` sur
  // cette liste) reste synchrone avec ce qui vient d'être écrit.
  function rechargerPersonnesActives_() {
    return sbClient.from("personnes").select("id, nom, sous_traitant, ordre").eq("actif", true).order("ordre", { ascending: true })
      .then(function (res) {
        if (res.error) throw res.error;
        etat.personnesActives = res.data || [];
      });
  }
  function ajouterPersonneServeur(nom, sousTraitant) {
    return sbClient.from("personnes").insert({ nom: nom, sous_traitant: !!sousTraitant, ordre: prochainOrdrePersonne_() })
      .then(function (res) { if (res.error) throw res.error; });
  }
  // sousTraitant repris tel quel (jamais togglé depuis l'UI actuelle, cf.
  // ouvrirModifierPersonne) — simple mise à jour de la ligne, portée = "tout"
  // par construction : plus de distinction "cette semaine"/"et les
  // suivantes" (cf. commentaire de tête ci-dessus), la personne n'a qu'un nom.
  function renommerPersonneServeur(id, nom, sousTraitant) {
    return sbClient.from("personnes").update({ nom: nom, sous_traitant: !!sousTraitant }).eq("id", id)
      .then(function (res) { if (res.error) throw res.error; });
  }
  // Désactiver/réactiver (round du 14.09.2026 — auparavant, seule la
  // désactivation existait, sous le nom desactiverPersonneServeur, jamais
  // togglable en sens inverse) : simple update actif, jamais un DELETE — la
  // personne et son historique (taches/assignations déjà écrites, passées
  // comme futures) restent en base, seulement invisibles ailleurs tant
  // qu'elle est désactivée (etat.personnesActives ne la contient plus, donc
  // plus aucune requête de semaine ne la ramène — même principe que l'ancien
  // classeur, "la feuille ne supprime jamais une ligne, seulement son
  // contenu", cf. WebApp.gs). Pour un vrai DELETE (irréversible, cascade sur
  // taches/assignations/series, cf. sql/0001 "on delete cascade"), voir
  // supprimerPersonnePermanenceServeur ci-dessous — jamais confondu avec
  // celle-ci.
  function basculerActifPersonneServeur(id, actif) {
    return sbClient.from("personnes").update({ actif: !!actif }).eq("id", id)
      .then(function (res) { if (res.error) throw res.error; });
  }
  // Vraie suppression (round du 14.09.2026, Lionel : « possibilité de
  // supprimer des éléments car certains chantier ou ouvriers peuvent ne plus
  // revenir ») — CASCADE en base sur taches/assignations/series (sql/0001 :
  // "on delete cascade" sur les 3 FK vers personnes) : contrairement à
  // basculerActifPersonneServeur, ceci efface bel et bien tout l'historique
  // de la personne, sans retour possible. Jamais proposée que sur une ligne
  // déjà désactivée (cf. cablerListePersonnes, ".lien-supprimer-def"),
  // toujours après confirmation explicite côté UI.
  function supprimerPersonnePermanenceServeur(id) {
    return sbClient.from("personnes").delete().eq("id", id)
      .then(function (res) { if (res.error) throw res.error; });
  }
  // Page de gestion (Personnel/Intervenants, cf. renderListePersonnes) :
  // liste COMPLÈTE (actifs + désactivés), triée par ordre — contrairement à
  // rechargerPersonnesActives_ ci-dessus, qui reste actifs seulement (la
