<!DOCTYPE html>
<html>
<head>
<base target="_top">
<meta charset="utf-8">
<!-- Round du 12.09.2026 — Lionel, capture d'écran à l'appui : « le format
     mobile ne fonctionne pas [...] le formulaire s'ouvre ainsi » (une petite
     carte flottante mal placée au lieu du plein écran attendu). Cause
     racine : il manquait purement et simplement cette balise viewport.
     SANS elle, un navigateur mobile rend la page dans une largeur virtuelle
     d'environ 980px (comportement historique "pages pensées pour desktop"),
     PUIS zoome toute la page pour la faire tenir à l'écran — la grille
     paraît alors miniaturisée et, surtout, aucune règle @media (max-width:
     600px) (ex. .form-pop plein écran téléphone, cf. plus bas) ne peut
     jamais s'appliquer puisque 980px > 600px : le CSS "voit" un écran large,
     jamais un téléphone. Cette balise force au contraire le navigateur à
     utiliser la largeur RÉELLE de l'écran comme référence CSS (donc <600px
     sur un téléphone), ce qui active enfin ces règles. -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Planning Chantiers</title>
<!-- Round du 16.09.2026 — suggestion de Lionel : transformer le site en PWA
     pour que les collègues puissent l'« Ajouter à l'écran d'accueil » sur
     leur téléphone (icône propre, ouverture en plein écran, sans passer par
     un store). Portée volontairement limitée à manifest.json + icônes +
     ces balises meta (pas de service worker à ce stade — pas d'installation
     automatique Android ni de résilience hors-ligne, mais rien à maintenir
     de plus et "Ajouter à l'écran d'accueil" fonctionne déjà très bien sur
     iOS ET Android via le menu du navigateur). Fonctionne quel que soit
     l'hébergeur HTTPS réel (Netlify aujourd'hui, GitHub Pages plus tard si
     ça change un jour) : aucune de ces balises ne dépend d'un domaine en
     particulier. Icône générée (motif "mur de briques", cf. icons/), pas
     encore un vrai logo d'entreprise — à remplacer facilement plus tard si
     Lionel en obtient un (cf. FRONTEND-CHANGELOG.md §76). -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1f4d8f">
<link rel="icon" type="image/png" sizes="512x512" href="icons/icon-512.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="icon" type="image/png" sizes="32x32" href="icons/icon-32.png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Planning">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
  /* ============================================================
     Planning à bulles — V3, portage complet sur le backend réel
     (Google Sheets, via google.script.run). Palette/typo reprises du
     prototype prototype-bulles.html (V3), lui-même repris de l'app V2
     (Index.html d'origine) — ce n'est pas une nouvelle identité visuelle.
     ============================================================ */
  /* [hidden] réellement caché, TOUJOURS (round du 03.09.2026, signalé par
     Lionel : "au niveau des formulaire ne pas afficher les entrées des
     séries quand pas coché" — les champs de la série [.serie-options,
     .form-pop .chk-ligne] restaient visibles même la case "Série (se
     répète)" décochée). Cause : n'importe quelle règle d'auteur qui pose
     `display` sur un élément l'emporte TOUJOURS sur le `[hidden] { display:
     none }` du navigateur, quelle que soit sa spécificité — l'origine de la
     règle (auteur > navigateur) prime sur la spécificité dans la cascade.
     `.serie-options`, `.form-pop .chk-ligne` et `.champ-ligne` (ce dernier
     touchait aussi "Pour qui"/"Chantier"/"Quand dans la journée" dans le
     formulaire d'ajout lointain) posent chacun un `display` qui gagnait
     ainsi contre le `hidden` JS. Un seul filet de sécurité générique, plutôt
     que corriger chaque règle une par une : tout `[hidden]` présent dans le
     document reste cache, même si une règle plus bas pose un `display`. */
  [hidden] { display: none !important; }
  :root {
    --bg: #eef0ec; --surface: #fbfaf7; --surface-2: #ffffff;
    --ink: #1a2129; --ink-muted: #57616b; --ink-faint: #8b93a0;
    --border: #d7dad2; --border-strong: #1a2129;
    --accent: #1f4d8f; --accent-ink: #ffffff; --accent-soft: #e3ecf7;
    --important-ink: #93362b;
    --status-confirme-bg: #cdf1ea; --status-confirme-ink: #0b6459;
    --danger: #b3372f; --danger-ink: #ffffff;
    --shadow: rgba(24, 33, 41, 0.16); --shadow-lg: rgba(15, 21, 27, 0.32);
    --bubble-ink: rgba(20, 24, 20, 0.82);
    --absence-bg: #f6c893; --jalon-bg: #d7cdf0; --note-bg: #f7e6ab;
    --interdit-bg: #f6dcd7;
    --avertissement-bg: #f9d4b0; --avertissement-ink: #8a3d00;
    --succes-bg: #cdeccb; --succes-ink: #1f6b2c;
    --weekend-bg: #cdcfc9;
    color-scheme: light;
  }
  /* Round du 16.09.2026 (suite, suite, suite, encore) — nettoyage suite à
     une relecture externe du fichier signalant une "duplication" des
     variables sombres entre ce bloc et un second sélecteur
     :root[data-theme="dark"] (supprimé ici). Ce n'était pas une simple
     duplication à fusionner : les 2 sélecteurs couvrent normalement 2 cas
     différents d'un système de thème à 3 états (auto/clair/sombre) —
     :not([data-theme="light"]) suit la préférence système sauf choix
     explicite clair, [data-theme="dark"] force le sombre quel que soit le
     système. Mais cette appli n'a JAMAIS posé l'attribut data-theme nulle
     part (aucun bouton de bascule thème, confirmé par recherche dans tout
     le fichier) : seul le bloc @media ci-dessous s'applique un jour, l'autre
     était du code mort depuis l'origine. Gardé uniquement celui qui sert
     réellement (thème sombre = préférence système, sans bascule manuelle).
     Si une bascule manuelle est ajoutée un jour, il faudra réintroduire le
     2e bloc ET le JS qui pose data-theme. */
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #10161d; --surface: #171f28; --surface-2: #1c2530;
      --ink: #eef1f4; --ink-muted: #9aa7b3; --ink-faint: #66717c;
      --border: #2b3540; --border-strong: #4a5661;
      --accent: #6fa6e8; --accent-ink: #0b1622; --accent-soft: #223247;
      --important-ink: #f2a89c;
      --status-confirme-bg: #123f38; --status-confirme-ink: #7ee0cf;
      --danger: #e0685f; --danger-ink: #2a0e0c;
      --shadow: rgba(0, 0, 0, 0.4); --shadow-lg: rgba(0, 0, 0, 0.6);
      --interdit-bg: #4a2620;
      --avertissement-bg: #5a3110; --avertissement-ink: #f2a565;
      --succes-bg: #1c3a20; --succes-ink: #7fd88c;
      --weekend-bg: #232b34;
      color-scheme: dark;
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  /* Apps Script sert cette page dans une iframe : le document ne défile
     jamais lui-même (cf. Index.html V2) — seule la zone .scroller défile. */
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; }
  body {
    background: var(--bg); color: var(--ink);
    font-family: 'Archivo', 'Helvetica Neue', Arial, sans-serif;
    -webkit-font-smoothing: antialiased; overscroll-behavior: none;
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .001ms !important; transition-duration: .001ms !important; }
  }
  button { font-family: inherit; }
  :focus-visible { outline: 2.5px solid var(--accent); outline-offset: 2px; }
  body.en-glissement .bulle:not(.dragging) { pointer-events: none; }

  /* ---------- chargement / erreur (repris de V2) ---------- */
  .loading-screen, .error-screen {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 12px; height: 100dvh; padding: 32px; text-align: center;
  }
  .loading-screen .spin {
    width: 28px; height: 28px; border-radius: 50%;
    border: 3px solid var(--border); border-top-color: var(--accent);
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .loading-screen div.msg { color: var(--ink-muted); font-size: 13.5px; }
  .error-screen .mark-err {
    width: 42px; height: 42px; border-radius: 11px; background: var(--danger); color: var(--danger-ink);
    display: grid; place-items: center; flex-shrink: 0;
  }
  .error-screen h2 { font-size: 16.5px; margin: 2px 0 0; }
  .error-screen p { color: var(--ink-muted); font-size: 13.5px; max-width: 320px; line-height: 1.5; margin: 0; }
  .error-screen button { margin-top: 8px; }

  /* ---------- écran de connexion (phase 4, migration Supabase) ---------- */
  .login-screen {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    height: 100dvh; padding: 32px;
  }
  .login-card {
    width: 100%; max-width: 320px; background: var(--surface); border: 1px solid var(--border);
    border-radius: 14px; padding: 28px 24px; box-shadow: 0 8px 28px var(--shadow);
  }
  .login-card h1 { font-size: 17px; margin: 0 0 4px; }
  .login-card .sous-titre { color: var(--ink-muted); font-size: 13px; margin: 0 0 20px; }
  .login-card label { display: block; font-size: 12.5px; font-weight: 600; margin: 14px 0 5px; color: var(--ink-muted); }
  .login-card input {
    width: 100%; box-sizing: border-box; padding: 9px 11px; border-radius: 8px;
    border: 1px solid var(--border); background: var(--surface-2); color: var(--ink); font-size: 14px;
  }
  .login-card input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  .login-card .erreur { color: var(--danger); font-size: 12.5px; margin-top: 10px; min-height: 16px; }
  .login-card button {
    width: 100%; margin-top: 18px; padding: 10px; border-radius: 9px; border: 1px solid var(--border-strong);
    background: var(--accent); color: var(--accent-ink); font-weight: 600; font-size: 14px; cursor: pointer;
  }
  .login-card button:disabled { opacity: .6; cursor: default; }
  /* Round du 16.09.2026 (encore un autre, suite, suite — §80) : cette
     version FIXE de "Se déconnecter" ne sert plus qu'à la brève fenêtre
     entre la connexion réussie et la construction de la vraie coquille
     (construireCoquille) — pendant que demarrer() charge les données, ou si
     ce chargement échoue (erreurFatale, qui reste utile pour se
     déconnecter/changer de compte). Une fois la coquille construite, elle
     rejoint la barre d'onglets elle-même (.lien-deconnexion-nav, cf. son
     commentaire juste au-dessus de .onglets-nav) et cette version flottante
     est retirée du DOM par construireCoquille — elle ne reste donc plus
     jamais indéfiniment superposée à l'écran comme avant, d'où la
     suppression du padding-top:44 qui la compensait sur .onglets-nav. */
  .lien-deconnexion {
    position: fixed; top: 10px; right: 12px; z-index: 50; font-size: 11.5px; color: var(--ink-faint);
    background: var(--surface); border: 1px solid var(--border); border-radius: 7px; padding: 4px 9px; cursor: pointer;
  }

  /* ---------- barre de progression (hors #app, cf. bug corrigé côté V2) --- */
  .progress {
    position: fixed; left: 0; right: 0; top: 0; height: 2.5px; z-index: 210;
    overflow: hidden; pointer-events: none; opacity: 0; transition: opacity .18s;
  }
  .progress.on { opacity: 1; }
  .progress::after {
    content: ""; position: absolute; top: 0; bottom: 0; width: 38%;
    background: var(--accent); animation: glisse 1.1s ease-in-out infinite;
  }
  @keyframes glisse { 0% { left: -40%; } 100% { left: 100%; } }

  /* ---------- page (#app défile, seul) ---------- */
  #app { position: fixed; inset: 0; overflow-y: auto; overflow-x: hidden; -webkit-overflow-scrolling: touch; }
  /* padding-top réduit de 14 à 6 (round du 16.09.2026, suite, encore —
     Lionel, croquis annoté : « réduire les espaces roses ») : cette marge
     haute, entre le bas de .onglets-nav (fixe) et le 1er élément de chaque
     page, faisait partie des 3 espaces jugés trop généreux une fois
     l'en-tête de la page Planning fixé (cf. .legende-barre plus bas) — la
     réduire ici (classe partagée par TOUTES les pages, cf. htmlPageJalons
     etc.) resserre l'ensemble de l'appli de façon cohérente plutôt que de
     n'agir que sur Planning en isolant un cas particulier. */
  .page-scroll { padding: 6px 18px 40px; }

  /* ---------- bandeau de statut serveur, tout en haut ---------- */
  .topbar {
    display: flex; align-items: center; gap: 10px; padding: 8px 16px;
    background: var(--surface-2); border-bottom: 1px solid var(--border);
    font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: var(--ink-muted);
  }
  .topbar .brand-mini { display: flex; align-items: center; gap: 7px; font-family: 'Archivo', sans-serif; font-weight: 800; font-size: 13px; color: var(--ink); }
  .topbar .brand-mini .mark-mono {
    width: 20px; height: 20px; border-radius: 6px; background: var(--accent); color: var(--accent-ink);
    display: grid; place-items: center; font-size: 10px; font-weight: 800; flex-shrink: 0;
  }
  .topbar .sync-dot { width: 6px; height: 6px; border-radius: 50%; background: #3fa15a; flex-shrink: 0; animation: pulse 2.4s ease-in-out infinite; }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .35; } }
  .topbar .spacer { flex: 1; }
  .topbar button {
    display: inline-flex; align-items: center; gap: 6px;
    background: var(--surface); border: 1px solid var(--border); color: var(--ink);
    border-radius: 8px; padding: 6px 11px; font-size: 12px; font-weight: 600; cursor: pointer;
    font-family: 'Archivo', sans-serif; transition: background .12s, border-color .12s;
  }
  .topbar button:hover { background: var(--accent-soft); border-color: var(--accent); }

  /* Round du 12.09.2026 — Lionel : « beaucoup de place vide autour de l'écran
     sur desktop. » .wrap ne bornait la page Planning qu'à 1180px alors que
     .app-shell (ci-dessous) la recentrait déjà dans une bande de 1380px : sur
     un écran large, les deux marges cumulées laissaient un vide important de
     chaque côté. La grille elle-même n'a jamais eu besoin de cette limite —
     ses colonnes sont déjà en `minmax(_, 1fr)` (cf. construireGrille) : elles
     s'étirent proportionnellement dès qu'on leur laisse la place, sans jamais
     descendre sous leur largeur minimale. Rien d'autre dans .wrap n'a besoin
     d'être borné pour rester lisible (le titre/aide qui gardait sa propre
     limite de 60ch a été retiré dans le round suivant, cf. header ci-dessous). */
  .wrap { max-width: none; }
  header { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 4px; }
  h1 { font-size: 17px; font-weight: 800; letter-spacing: -0.01em; margin: 0; }

  /* .header-actions a disparu avec son dernier occupant : "1/2 semaines" et
     "Imprimer" avaient déjà rejoint .semaine-titre (Round D), et "Recharger"
     (#btnReset) est supprimé à son tour (Lionel : « le bouton recharger doit
     disparaitre »). .btn-reset reste défini ci-dessous : c'est aussi le
     style générique des boutons "Annuler" d'autres panneaux (cc-annuler,
     nf-annuler plus bas), donc on le garde. */
  .btn-reset {
    flex-shrink: 0; display: inline-flex; align-items: center; gap: 6px;
    background: var(--surface-2); border: 1px solid var(--border); color: var(--ink);
    border-radius: 9px; padding: 8px 13px; font-size: 12.5px; font-weight: 600; cursor: pointer;
    transition: background .12s, border-color .12s;
  }
  .btn-reset:hover { background: var(--accent-soft); border-color: var(--accent); }
  .btn-ajout-st {
    flex-shrink: 0; display: inline-flex; align-items: center; gap: 6px;
    background: var(--accent-soft); border: 1px solid var(--accent); color: var(--accent);
    border-radius: 9px; padding: 8px 13px; font-size: 12.5px; font-weight: 700; cursor: pointer;
    transition: filter .12s;
  }
  .btn-ajout-st:hover { filter: brightness(1.05); }

  .glisse-groupe { opacity: .4; }
  .fantome-glisse {
    z-index: 90 !important; box-shadow: 0 12px 26px var(--shadow-lg) !important;
    transform: scale(1.045) rotate(-1.2deg); pointer-events: none !important;
  }
  .bulle.dragging.posee, .fantome-glisse.posee {
    pointer-events: auto !important; cursor: grab;
    transform: none !important; box-shadow: 0 2px 6px var(--shadow) !important;
    transition: box-shadow .15s, transform .15s, left .18s, top .18s, width .15s;
  }
  .badge-glisse {
    position: fixed; z-index: 200; pointer-events: none; background: var(--accent); color: var(--accent-ink);
    font-size: 12px; font-weight: 700; padding: 6px 11px; border-radius: 999px; box-shadow: 0 8px 18px var(--shadow-lg);
    white-space: nowrap;
  }
  .zone-planning { position: relative; }
  .barre-action {
    position: sticky; bottom: 22px; width: 100%;
    display: flex; align-items: center; justify-content: center; gap: 10px; z-index: 97;
    flex-wrap: wrap; margin-top: 14px;
  }
  .barre-action[hidden] { display: none; }
  .barre-action button {
    font: inherit; font-size: 13px; font-weight: 700; padding: 9px 22px; border-radius: 999px;
    cursor: pointer; box-shadow: 0 8px 18px var(--shadow-lg); transition: opacity .12s, background .12s, border-color .12s, transform .12s;
  }
  .barre-action .ovale-neutre { border: 1.5px solid var(--border); background: var(--surface); color: var(--ink); }
  .barre-action .ovale-neutre:hover { background: var(--accent-soft); border-color: var(--accent); }
  .barre-action .ovale-danger { border: 1.5px solid var(--important-ink); background: var(--important-ink); color: #fff; }
  .barre-action .ovale-danger:hover { opacity: .88; }
  .barre-action .ovale-danger.cible-suppr { transform: scale(1.12); box-shadow: 0 0 0 4px var(--interdit-bg); }
  .barre-action .ovale-bleu { border: 1.5px solid var(--accent); background: var(--accent); color: var(--accent-ink); }
  .barre-action .ovale-bleu:hover { opacity: .88; }

  /* .barre-undo (case vide à gauche des jours) et sa CSS ont vécu : §83
     (round du 16.09.2026, encore un autre, suite×7) — Lionel, mockup
     mockup-sous-menu-outils.html à l'appui, « toolbar et menu ok » : les
     boutons annuler/refaire rejoignent la nouvelle barre d'outils façon
     Sheets sous les onglets (cf. .toolbar-sheets/.toolbar-btn plus bas, et
     htmlPagePlanning/construireGrille) — la cellule coin de la ligne des
     jours redevient donc simplement vide (.th.coin), comme avant le round
     du 16.09.2026 précédent qui l'y avait installée. */

  /* .toolbar-sheets — §83 (round du 16.09.2026, encore un autre, suite×7).
     Remplace .legende-barre : Lionel, mockup mockup-sous-menu-outils.html à
     l'appui (« comme la barre d'icônes de Sheets, sous sa barre de menus »),
     « toolbar et menu ok » — une seule ligne dense regroupe maintenant
     Annuler/Refaire (ex-.barre-undo, cf. son historique ci-dessus), Imprimer
     (déjà ici depuis le round précédent), le chantier par défaut (ex-clic
     sur un swatch de la légende, cf. .select-chantier plus bas) et les 4
     icônes masquer/afficher (ex-.btn-affichage texte du §82) — chaque groupe
     séparé par .toolbar-separateur, exactement comme le mockup validé. La
     légende des chantiers elle-même DISPARAÎT (Lionel : « on ne réaffiche
     pas la légende des chantiers ») : les bulles du planning restent
     identifiables par leur couleur + l'infobulle au survol (cf.
     bulleEl plus bas), comme avant, simplement sans ce rappel permanent.
     Reste conteneur FIXÉ en haut d'écran (même principe que .onglets-nav :
     sticky + fond opaque) — top posé dynamiquement en JS (cf.
     ajusterEnteteFixe()), padding/fond repris tels quels de .legende-barre
     (cf. son historique, FRONTEND-CHANGELOG §73.2/73.4, pour le pourquoi du
     padding plutôt qu'une marge ici). background: var(--bg) (pas
     var(--surface-2) du mockup, pensé comme une carte autonome) pour
     continuer à former UN SEUL panneau visuel avec .onglets-nav/
     .entete-planning-figee, comme ces 3 bandes sticky l'ont toujours fait —
     d'où aussi le hover de .toolbar-btn/.toolbar-toggle ci-dessous en
     var(--surface-2) (inverse du mockup), même logique que .onglet:hover
     juste au-dessus. */
  .toolbar-sheets {
    display: flex; align-items: center; gap: 2px; flex-wrap: wrap;
    margin: 0; padding-top: 8px; padding-bottom: 2px;
    position: sticky; z-index: 39; background: var(--bg);
  }
  .toolbar-groupe { display: flex; align-items: center; gap: 2px; }
  .toolbar-separateur { width: 1px; height: 22px; background: var(--border); margin: 0 8px; flex-shrink: 0; }
  .toolbar-btn {
    width: 30px; height: 30px; display: grid; place-items: center; border-radius: 7px; border: none;
    background: none; color: var(--ink-muted); cursor: pointer; transition: background .12s, color .12s; flex-shrink: 0;
    font-family: inherit;
  }
  .toolbar-btn:hover:not(:disabled) { background: var(--surface-2); color: var(--ink); }
  .toolbar-btn:disabled { opacity: .32; cursor: default; }
  .toolbar-btn svg { width: 16px; height: 16px; }
  /* Chantier par défaut des formulaires (round du 03.09.2026, ré-habillé en
     sélecteur explicite au §83 — Lionel : plus proche d'un menu déroulant
     classique qu'un clic sur un swatch de légende, cf. construireSelectChantier
     ex-construireLegende). Un swatch + le nom + un caret, ouverture d'un
     petit panneau listant les chantiers actifs (mêmes swatches que la
     grille réelle). */
  .select-chantier { position: relative; flex-shrink: 0; }
  .select-chantier-btn {
    display: flex; align-items: center; gap: 7px; padding: 5px 9px 5px 7px; border-radius: 7px;
    border: 1px solid transparent; background: none; cursor: pointer; font: inherit; font-size: 12px;
    font-weight: 600; color: var(--ink); transition: background .12s, border-color .12s;
  }
  .select-chantier-btn:hover, .select-chantier.ouvert .select-chantier-btn { background: var(--surface-2); border-color: var(--border); }
  .select-chantier-btn .swatch { width: 12px; height: 12px; border-radius: 4px; flex-shrink: 0; }
  .select-chantier-btn .caret { color: var(--ink-faint); font-size: 9px; margin-left: 1px; }
  .select-chantier-panneau {
    position: absolute; top: calc(100% + 4px); left: 0; z-index: 10; min-width: 168px;
    background: var(--surface-2); border: 1px solid var(--border); border-radius: 10px;
    box-shadow: 0 6px 20px var(--shadow-lg); padding: 5px; display: none;
  }
  .select-chantier.ouvert .select-chantier-panneau { display: block; }
  .select-chantier-item {
    display: flex; align-items: center; gap: 8px; width: 100%; padding: 7px 8px; border-radius: 7px;
    border: none; background: none; cursor: pointer; font: inherit; font-size: 12.5px; color: var(--ink); text-align: left;
  }
  .select-chantier-item:hover { background: var(--accent-soft); }
  .select-chantier-item .swatch { width: 12px; height: 12px; border-radius: 4px; flex-shrink: 0; }
  .select-chantier-item.actif { font-weight: 700; color: var(--accent); }
  .select-chantier-item .coche { margin-left: auto; color: var(--accent); font-size: 12px; visibility: hidden; }
  .select-chantier-item.actif .coche { visibility: visible; }
  /* Icônes de masquage — ex-.btn-affichage texte (§82). Lionel : « je
     préfèrerai des icones pour les 4 sous-groupes » puis « toolbar et menu
     ok ». Une icône DIFFÉRENTE par sous-groupe (plutôt que 4× la même icône
     œil, qui obligerait à survoler chacune pour savoir laquelle est
     laquelle) : reconnaissables sans hésitation, comme Annuler/Refaire/
     Imprimer ci-dessus. .actif teinte la case du fond DÉJÀ associé à cette
     ligne dans la grille (--jalon-bg violet, --note-bg jaune) — Personnel/
     Intervenants n'ayant pas de teinte propre, ils reprennent l'accent bleu
     du reste de la barre (même logique que l'onglet actif). .desactive
     reprend le même principe que .ligne-desactivee (opacité réduite) —
     jamais un gris plat, juste l'icône qui s'estompe, exactement comme le
     mockup validé. */
  .toolbar-toggle {
    width: 30px; height: 30px; display: grid; place-items: center; border-radius: 7px; border: none;
    background: none; color: var(--ink-muted); cursor: pointer; flex-shrink: 0; font-family: inherit;
    transition: background .12s, color .12s, opacity .12s;
  }
  .toolbar-toggle svg { width: 16px; height: 16px; }
  .toolbar-toggle:hover { background: var(--surface-2); }
  .toolbar-toggle.actif[data-affichage-cible="jalon"] { background: var(--jalon-bg); color: #4a3d78; }
  .toolbar-toggle.actif[data-affichage-cible="note"] { background: var(--note-bg); color: #7a5d00; }
  .toolbar-toggle.actif[data-affichage-cible="personnel"], .toolbar-toggle.actif[data-affichage-cible="intervenants"] { background: var(--accent-soft); color: var(--accent); }
  .toolbar-toggle.desactive { opacity: .5; background: none; color: var(--ink-faint); }

  /* .outil-menu/.outil-menu-panneau/.outil-menu-item — §85 (round du
     17.09.2026), Lionel : « enlever le "+" des lignes personnel et
     intervenant [...] ajouter une icone "ligne +" [...] ainsi qu'une icone
     "+" pour rajouter un élément au planning ». Même habillage que
     .select-chantier/.select-chantier-panneau/.select-chantier-item
     ci-dessus (mêmes tokens, panneau posé sur var(--surface-2) quel que soit
     le fond du conteneur qui l'ouvre) — généralisé plutôt que dupliqué, pour
     les 2 nouveaux menus "ligne+" (#menuAjoutLigne) et "+" (#menuAjoutElement,
     qui a en plus une 2e "page" .outil-menu-page pour l'étape "pour qui ?"
     d'une Tâche/Absence, cf. cablerPagePlanning) — et pour le menu de la case
     de zoom juste plus bas. */
  .outil-menu { position: relative; flex-shrink: 0; }
  .outil-menu-panneau {
    position: absolute; top: calc(100% + 4px); left: 0; z-index: 10; min-width: 190px;
    background: var(--surface-2); border: 1px solid var(--border); border-radius: 10px;
    box-shadow: 0 6px 20px var(--shadow-lg); padding: 5px; display: none;
  }
  .outil-menu.ouvert .outil-menu-panneau { display: block; }
  .outil-menu-titre {
    font-size: 10.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .04em;
    color: var(--ink-faint); padding: 6px 8px 4px;
  }
  .outil-menu-item {
    display: flex; align-items: center; gap: 9px; width: 100%; padding: 7px 8px; border-radius: 7px;
    border: none; background: none; cursor: pointer; font: inherit; font-size: 12.5px; color: var(--ink); text-align: left;
  }
  .outil-menu-item:hover { background: var(--accent-soft); color: var(--accent); }
  .outil-menu-item svg { width: 15px; height: 15px; flex-shrink: 0; color: var(--ink-muted); }
  .outil-menu-item:hover svg { color: var(--accent); }
  .outil-menu-retour {
    display: flex; align-items: center; gap: 6px; width: 100%; padding: 6px 8px; margin-bottom: 2px; border-radius: 7px;
    border: none; background: none; cursor: pointer; font: inherit; font-size: 11.5px; font-weight: 700; color: var(--ink-muted); text-align: left;
  }
  .outil-menu-retour:hover { background: var(--surface); color: var(--ink); }

  /* Case de zoom façon Sheets, en bout de groupe entre Imprimer et le
     chantier par défaut (Lionel, retour sur le mockup : « place le zoom
     entre impression et chantier »). .zoom-pill reprend l'habillage des
     autres "pilules" cliquables du fichier plutôt que celui, plus discret,
     du mockup — mieux assorti au reste de CETTE barre précise, dont le fond
     (var(--bg)) diffère de celui du mockup. Réutilisée telle quelle au §87
     (round du 17.09.2026, suite×2) pour #btnSemainePill, juste à côté. */
  .zoom-ctrl { display: flex; align-items: center; gap: 2px; flex-shrink: 0; }
  .zoom-btn {
    width: 24px; height: 24px; display: grid; place-items: center; border-radius: 6px; border: none;
    background: none; color: var(--ink-muted); cursor: pointer; font-size: 15px; font-weight: 700; font-family: inherit; line-height: 1;
  }
  .zoom-btn:hover { background: var(--surface-2); color: var(--ink); }
  .zoom-pill {
    min-width: 58px; padding: 5px 8px; border-radius: 7px; border: 1px solid var(--border); background: var(--surface-2);
    font: inherit; font-size: 12px; font-weight: 700; color: var(--ink); cursor: pointer; text-align: center;
    font-family: 'IBM Plex Mono', monospace; transition: background .12s, border-color .12s, color .12s;
  }
  .zoom-pill:hover { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
  .zoom-panneau { min-width: 90px; }

  /* Bouton "pressé"/actif générique (§87, round du 17.09.2026, suite×2) —
     pour un bouton à 2 états qui ne sont PAS "visible/masqué" (auquel cas
     .toolbar-toggle.desactive, atténué à 50%, est le bon choix) mais 2 modes
     également valides (ici : 1 semaine / 2 semaines) — donc jamais atténué,
     seulement teinté quand actif. Utilisé par #btnDeuxSemaines. */
  .toolbar-btn.actif { background: var(--accent-soft); color: var(--accent); }
  .toolbar-btn.actif:hover { background: var(--accent-soft); }

  /* Case "Sem. N" (§87, round du 17.09.2026, suite×2) — #btnSemainePill
     réutilise .zoom-pill telle quelle (Lionel : « dans le style visuel du
     zoom »). #panneauSemaine réutilise .outil-menu-panneau/.outil-menu-item
     comme zoom/ligne+/+, avec un habillage dédié pour afficher le numéro ET
     les dates sur chaque ligne (Lionel : « quand menu déroulant ouvert on
     doit voir le numéro de semaine et les dates correspondantes ») — même
     finalité que l'ancienne popup centrée "Aller à…" (ouvrirAllerSemaine,
     supprimée ce round), amenée au langage visuel de cette barre. Hauteur
     plafonnée + défilement : etat.semaines contient jusqu'à 521 semaines
     (FENETRE_SEMAINES=260 avant/après aujourd'hui), jamais toutes affichées
     d'un coup (cf. cablerPagePlanning, fenêtre de 17 autour de la semaine
     choisie), mais le plafond reste une sécurité. */
  .semaine-panneau { min-width: 220px; max-height: 280px; overflow-y: auto; }
  .semaine-panneau .outil-menu-item { justify-content: space-between; gap: 14px; }
  .semaine-panneau .outil-menu-item.actif { font-weight: 700; color: var(--accent); background: var(--accent-soft); }
  .semaine-item-droite { display: flex; align-items: center; gap: 7px; flex-shrink: 0; }
  .semaine-dates-item { color: var(--ink-faint); font-weight: 500; font-size: 11px; }
  .semaine-panneau .outil-menu-item.actif .semaine-dates-item { color: var(--accent); }
  .semaine-panneau .coche { color: var(--accent); font-size: 12px; }

  /* .entete-planning-figee / .entete-planning-scroll — round du 16.09.2026
     (suite, encore) : Lionel, même croquis, « faire défiler la page après
     les notes ». Étend le principe de .onglets-nav/.legende-barre (sticky)
     à TOUTE la partie haute de la grille (nav de semaine, en-têtes de jour,
     ligne M/A compacte, Jalons, Notes) — seules les lignes Personnel/
     Intervenants (.grille-corps, cf. .grille-cadre plus bas) défilent
     encore réellement. Techniquement CE N'ÉTAIT PAS FAISABLE en rendant
     sticky chaque cellule concernée à l'intérieur de la grille unique
     d'origine : .scroller (ci-dessous) porte overflow-x:auto, et la règle
     CSS qui force le calcul de overflow-y à "auto" dès que overflow-x ne
     vaut pas "visible" aurait fait de .scroller — qui ne défile jamais
     verticalement lui-même — le référentiel de position:sticky de ses
     enfants, où un sticky top n'a alors plus aucun effet (rien à quoi se
     fixer). D'où la scission en DEUX grilles séparées (grille-entete et
     grille-corps, mêmes gridTemplateColumns/minWidth calculés une seule
     fois en JS pour rester pixel-identiques) : .entete-planning-figee
     (aucun overflow propre) est CE qui est sticky, fixé contre #app comme
     .onglets-nav/.legende-barre — top posé dynamiquement (ajusterEnteteFixe)
     = hauteur de .onglets-nav + hauteur de .legende-barre. Son enfant
     .entete-planning-scroll porte overflow:hidden (jamais de barre de
     défilement visible ni d'interaction directe) et voit son scrollLeft
     recopié en JS depuis le VRAI défilement horizontal, celui de .scroller
     (cf. construireGrille) — un enfant sticky de .entete-planning-figee,
     lui, n'a donc plus besoin d'être individuellement sticky : c'est le
     bloc entier qui reste fixe pendant que son contenu glisse
     horizontalement en phase avec le tableau du dessous. padding-top:6
     (même logique de fuite qu'au-dessus) absorbe le résidu d'espace rose
     entre .legende-barre et la grille. border-radius/border : coins hauts
     arrondis + bordure sans bord bas, pour former un seul panneau visuel
     avec .grille-cadre juste en dessous (coins bas arrondis, bord sans bord
     haut) — les deux se touchent désormais sans espace (3e espace rose du
     croquis, entre Notes et Personnel, supprimé par construction plutôt que
     par un réglage de marge). */
  .entete-planning-figee {
    position: sticky; z-index: 38; background: var(--bg); margin: 0; padding-top: 6px;
  }
  .entete-planning-scroll {
    overflow: hidden; width: 100%;
    border: 1px solid var(--border); border-bottom: none; border-radius: 12px 12px 0 0;
  }

  /* .semaine-titre/.coin-nav/.cellule-semaine-nav/.btn-titre/.btn-aujourdhui/
     .btn-deux-semaines/.fleche-semaine/.lien-aller/.semaine-dates/
     .sem-entete-dates (Aujourd'hui/2 semaines/‹ Semaine N › dans le coin de
     la grille, cf. leur historique dans une version antérieure du fichier)
     ont disparu au §87 (round du 17.09.2026, suite×2) avec la ligne
     coinNav/navSemaine de construireGrille (Lionel : « on enlève la première
     ligne du tableau qui ne sert plus ») — cette navigation vit désormais
     dans #legendeBarre (cf. .toolbar-btn.actif/.semaine-panneau plus haut,
     et htmlPagePlanning/cablerPagePlanning pour le HTML/câblage). */
  /* border-top:none/border-radius bas seulement (round du 16.09.2026, suite,
     encore) : .grille-cadre ne porte plus que le CORPS (Personnel/
     Intervenants, cf. .entete-planning-scroll ci-dessus pour l'en-tête
     désormais séparé et fixe) — les deux panneaux se touchent pile, sans
     espace, pour ne former qu'un seul cadre visuel continu. */
  .grille-cadre { border: 1px solid var(--border); border-top: none; border-radius: 0 0 12px 12px; overflow: hidden; }
  .scroller { overflow-x: auto; padding-bottom: 4px; }
  .grille { display: grid; gap: 1px; background: var(--border); }
  .th, .lbl, .cell { background: var(--surface-2); }
  .th {
    padding: 9px 10px; font-family: 'IBM Plex Mono', monospace; font-size: 11px; font-weight: 600;
    text-transform: uppercase; letter-spacing: .06em; color: var(--ink-muted); text-align: center;
  }
  .th.coin { background: var(--surface); }
  .th-ferie-label {
    display: block; font-size: 8.5px; font-weight: 700; margin-top: 3px;
    color: var(--ink); opacity: .78; text-transform: none; letter-spacing: 0;
  }
  .th-date { display: block; font-size: 14px; font-weight: 700; margin-top: 2px; color: var(--ink); text-transform: none; letter-spacing: normal; }
  .th.today { background: var(--accent-soft); }
  .th.today .th-date { color: var(--accent); }
  .lbl { padding: 9px 11px; display: flex; flex-direction: column; justify-content: center; gap: 1px; }
  .lbl b { font-size: 12.5px; font-weight: 700; }
  .lbl span { font-size: 10px; color: var(--ink-faint); font-family: 'IBM Plex Mono', monospace; text-transform: uppercase; letter-spacing: .04em; }
  .lbl-speciale { background: var(--surface); }
  .lbl-speciale b { color: var(--ink-muted); font-size: 11px; text-transform: uppercase; letter-spacing: .04em; }
  .th.coin, .lbl, .lbl-speciale { position: sticky; left: 0; z-index: 2; }
  .th.sem-frontiere, .cell.sem-frontiere, .lbl.sem-frontiere { border-left: 2px solid var(--border-strong); }
  .th-weekend { min-width: 46px; }
  .cell.case-weekend { background: var(--weekend-bg); }
  /* ---- Mode compact : 2 colonnes par jour, 1 ligne par personne ---------
     Round du 02.09.2026 (demande de Lionel). Repères visuels indispensables
     une fois les 2 demi-journées sur la même ligne : une étiquette M/A en
     en-tête, l'après-midi légèrement teinté ; plus aucun trait dédié entre
     deux JOURS (voir plus bas, round du 03.09.2026) ni entre matin et
     après-midi d'un même jour — seule la teinte de l'aprem les distingue. */
  .th.th-demi {
    padding: 2px 0 3px; font-size: 8.5px; letter-spacing: .1em; opacity: .75;
    background: var(--surface);
  }
  .cell.cell-aprem { background: color-mix(in srgb, var(--surface-2) 88%, var(--ink-faint)); }
  .th.th-demi-aprem { background: color-mix(in srgb, var(--surface) 92%, var(--ink-faint)); }
  /* Frontière entre deux JOURS : plus de trait dédié. Historique le même
     jour (03.09.2026) : d'abord épaissie (2px, var(--border-strong)) sur
     retour de Lionel ("il faudrait marquer un peu plus les bordures entre
     les jours"), puis amincie (1px, même couleur) sur un 2e retour ("les
     bordures épaisses... laisse les fine"), puis un 3e retour ("la bordure
     entre les jours est trop lourde") a demandé de l'aligner sur les autres
     traits du planning : `.jour-frontiere` n'a donc plus AUCUNE règle propre
     ici, et retombe simplement sur le quadrillage de base de `.grille`
     (`gap: 1px; background: var(--border)`, la même couleur claire que
     n'importe quel autre trait de la grille). Comme la séparation
     matin/après-midi est supprimée juste en dessous, ce fin trait de base
     n'apparaît plus QU'aux frontières de jour — il redevient donc lisible
     par lui-même, sans avoir besoin d'être plus sombre ou plus épais.
     TOUT est portée par .grille-compacte : le mode classique ne doit être
     affecté par aucune de ces règles, y compris celle de semaine ci-dessous. */
  /* La frontière de SEMAINE reste, elle, marquée plus fort — Lionel n'a
     jamais visé qu'elle, seule la frontière de JOUR posait problème. */
  .grille-compacte .th.sem-frontiere,
  .grille-compacte .cell.sem-frontiere { border-left: 3px solid var(--ink-faint); }
  /* Séparation matin/après-midi : supprimée (retour de Lionel du 03.09.2026,
     "enlève celle des demi jours") — le fin trait de quadrillage entre les
     deux colonnes d'un même jour disparaît complètement, la teinte de
     l'après-midi (.cell-aprem / .th-demi-aprem) restant seule à distinguer
     les deux demi-journées. Technique : la colonne "aprem" empiète de 1px sur
     le trait de grille à sa gauche (margin-left négatif) et compense par un
     padding-left égal pour ne pas déplacer son contenu ; ne touche jamais le
     trait à SA DROITE (frontière du jour suivant, gérée ci-dessus).
     Correctif du 03.09.2026 (suite) : cette technique ne couvrait QUE la case
     de fond (`.cell.cell-aprem`) — invisible quand la case est vide, mais dès
     qu'une tâche/absence ou une note occupe réellement l'après-midi, c'est la
     BULLE (élément séparé, posée directement sur la grille par poser(), pas
     un enfant de `.cell`) qui porte le bord gauche visible, et elle ne
     recevait pas ce même décalage — d'où le trait "bizarre" que Lionel
     signalait au milieu d'une case avec 2 tâches empilées matin+aprem. Toute
     bulle en après-midi porte donc désormais aussi la classe `.demi-aprem`
     (posée en JS : ligneGroupePersonnesCompact pour les tâches/absences,
     construireGrille pour les notes), avec le même empiètement — seul son
     padding-left de compensation diffère (padding gauche propre à `.bulle`,
     8px, donc 9px ici contre 7px pour `.cell`). */
  .grille-compacte .cell.cell-aprem { margin-left: -1px; padding-left: 7px; }
  .grille-compacte .th.th-demi-aprem { margin-left: -1px; padding-left: 1px; }
  .grille-compacte .bulle.demi-aprem { margin-left: -1px; padding-left: 9px; }
  .lbl-compacte { justify-content: center; }
  /* .bulle-suite/.bulle-continue (segments de continuation d'une tâche
     multi-jours en mode compact) : supprimées au round du 08.09.2026,
     suite (§48) — une tâche/absence multi-jours est désormais fusionnée en
     UNE SEULE bulle continue (cf. ligneGroupePersonnesCompact), il n'y a
     plus de segment par jour à distinguer visuellement. */

  .section-row { background: var(--bg); border-bottom: 1px solid var(--border); }
  .section-row-sticky { position: sticky; left: 0; display: inline-flex; align-items: center; gap: 6px; padding: 3px 12px; }
  .section-label { font-family: 'IBM Plex Mono', monospace; font-size: 9.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .07em; color: var(--ink-muted); }
  /* .btn-plage-ligne (le "+" de fin de ligne section) a vécu : §85 (round du
     17.09.2026) — Lionel, mockup mockup-sous-menu-outils.html à l'appui,
     « on peut aussi enlever le "+" des lignes personnel et intervenant » —
     remplacé par l'icône "ligne+" de la barre d'outils, cf. #btnAjoutLigne
     dans htmlPagePlanning/cablerPagePlanning. */

  .cell {
    position: relative;
    min-height: 52px; padding: 6px; display: flex; flex-direction: column; gap: 5px;
    transition: box-shadow .12s, background .5s; cursor: pointer; touch-action: none;
  }
  /* min-height réduit (round du 16.09.2026, encore un autre, suite, suite —
     §80, 3e/4e rectangles rouges du croquis) : Lionel repère une bande quasi
     vide sous les bulles JALONS/NOTES. Cause réelle, vérifiée en rejouant le
     calcul de pistes (assignerPistes) sur les vraies données de la semaine
     du croquis : une seule piste est occupée (nbPistes=1, pas un 2e créneau
     fantôme) — la bande vide vient simplement du min-height:52px COMMUN à
     .cell (pensé pour les cases Personnel/Intervenants, qui peuvent porter
     jusqu'à 2 lignes de texte de tâche, cf. .b-txt plus bas), alors qu'un
     jalon/une note tient quasiment toujours sur 1 seule ligne (align-self:
     start sur .bulle-plage, cf. son commentaire) : le fond .cell force la
     ligne de grille à 52px, la bulle plus courte laisse le reste visible en
     dessous. 36px (au lieu de 52) : juste assez pour une bulle d'une ligne +
     un peu de respiration, sans jamais BRIDER une bulle sur 2 lignes — un
     min-height est un plancher, pas un plafond, la grille grandit encore
     normalement si le texte déborde. Seuls .cell-jalon/.cell-note sont
     concernés : .cell-personne (Personnel/Intervenants) garde ses 52px. */
  .cell.cell-jalon, .cell.cell-note { background: var(--surface); min-height: 36px; }
  .cell.drop-hover { box-shadow: inset 0 0 0 2px var(--accent); background: var(--accent-soft); }
  /* selection-active/selection-add (round du 11.09.2026 — bug signalé par
     Lionel, vidéo à l'appui : « la sélection verte lors du glisser se
     comporte bizarrement ») : PLUS de box-shadow individuel par case ici —
     appliqué à CHAQUE case d'un rectangle de plusieurs cases, cet anneau de
     2px se dessinait aussi sur les bords INTÉRIEURS partagés entre 2 cases
     voisines sélectionnées (en plus du filet de 1px du fond de .grille,
     cf. "gap"), donnant l'impression d'un quadrillage de cases séparées au
     lieu d'un seul rectangle continu. Le contour continu est maintenant
     dessiné par UNE SEULE couche par-dessus tout le rectangle (cf.
     #selection-overlay, posée par surlignerRectangle) ; ces classes ne
     posent plus que le fond teinté (qui, lui, se fond correctement d'une
     case à l'autre, la même couleur unie des 2 côtés du filet de gap ne
     créant aucune coupure visible). */
  .cell.selection-active { background: var(--accent-soft); }
  .cell.selection-add { background: var(--succes-bg); }
  .cell.armement-selection { box-shadow: inset 0 0 0 2px var(--border-strong); }
  .cell.cell-interdite { box-shadow: inset 0 0 0 2px var(--avertissement-ink); background: var(--avertissement-bg); }
  #selection-overlay {
    position: fixed; display: none; pointer-events: none; z-index: 60;
    border-radius: 3px; box-sizing: border-box;
  }
  #selection-overlay.actif-defaut { border: 2px solid var(--accent); }
  #selection-overlay.actif-add { border: 2px solid var(--succes-ink); }
  .cell.just-dropped { background: var(--accent-soft); }
  /* Surbrillance de dépôt PRÉCISE (demi-journée), round du 07.09.2026, suite
     — Lionel : « la surbrillance ne se fait que sur les journée entière, je
     pense qu'on devrait plutôt parler de cases ». Élément dédié positionné
     par colonneEtSpanDemi() (comme la bulle réelle), pas une .cell entière —
     voir cibleNotePreciseCompacte()/survolerCible() dans le script. */
  /* align-self: start (round du 07.09.2026, suite — bug signalé par Lionel,
     2 vidéos à l'appui : « les notes sont vraiment bugée ») : posé À
     L'ÉPOQUE parce que, sans lui, cet élément (une simple div sans le reste
     des classes de .bulle-plage) s'étirait par défaut sur TOUTE la hauteur
     de sa ligne de grille (52px mesuré alors, contre 26px pour une vraie
     bulle) — au lieu de rester calé en haut comme les bulles elles-mêmes
     (cf. .bulle-plage un peu plus bas, qui a le même align-self). Ce
     débordement vers le bas donnait l'impression d'un 2e rectangle qui
     dépasse sous la bulle glissée dans les vidéos de Lionel de l'époque.
     RETIRÉ le 16.09.2026 (round suivant) — nouveau retour de Lionel, capture
     à l'appui : « la sur-brillance bleue... se perd d'une ligne à l'autre.
     elle est aussi trop petite, actuellement elle fait la taille de la
     bulle, je préfèrerai que la(les) case cible soient entièrement
     sur-brillée. » Le "bug" de 07.09 et la demande de 16.09 sont exactement
     la même chose vue sous deux angles différents : Lionel veut maintenant
     précisément ce débordement plein-hauteur, déjà éprouvé sans souci par
     .selection-precis (juste en dessous) depuis le 12.09.2026 — stretch
     redevient donc le comportement (défaut de .grille, cf. son
     display:grid sans align-items), comme pour .selection-precis. La
     hauteur n'est plus fixée en JS non plus, cf. survolerCible(). */
  .survol-precis { box-shadow: inset 0 0 0 2px var(--accent); background: var(--accent-soft); border-radius: 8px; z-index: 5; }
  /* .selection-precis (round du 12.09.2026 — refonte "case par case" de la
     sélection au glissé, demandée par Lionel) : jalon/note n'ont qu'UNE
     cellule DOM par jour (cf. creerCelluleFond, jamais scindée matin/aprem),
     donc impossible d'y teinter "juste une demi-case" via une classList sur
     une sous-cellule comme pour la grille personnel — élément dédié
     positionné en grid-column/grid-row par colonneEtSpanDemi(), même
     technique que .survol-precis, mais SANS align-self/height fixés : ici on
     veut au contraire qu'il remplace le fond teinté pleine hauteur d'une
     vraie case (stretch = comportement par défaut de .grille, cf. son
     display:grid sans align-items). */
  .selection-precis { box-shadow: inset 0 0 0 2px var(--accent); background: var(--accent-soft); border-radius: 6px; z-index: 4; pointer-events: none; }
  .selection-precis.precis-add { box-shadow: inset 0 0 0 2px var(--succes-ink); background: var(--succes-bg); }
  .cell.cell-ferie::before {
    content: ""; position: absolute; inset: 0; z-index: 0; pointer-events: none;
    border-radius: inherit; background: var(--ferie-tint);
  }

  .bulle {
    position: relative; z-index: 2; border-radius: 9px; padding: 6px 14px 6px 8px; display: flex; flex-direction: column; gap: 1px;
    justify-content: center;
    cursor: grab; touch-action: none; user-select: none; -webkit-user-select: none;
    box-shadow: 0 1px 2px var(--shadow);
    transition: box-shadow .15s, transform .12s;
    color: var(--bubble-ink);
  }
  .bulle-plage { z-index: 1; align-self: start; margin-bottom: 14px; }
  .bulle.selectionnee { box-shadow: 0 0 0 2.5px var(--accent), 0 1px 2px var(--shadow); }
  .bulle:active { cursor: grabbing; }
  .bulle.dragging {
    position: fixed; z-index: 60; box-shadow: 0 12px 26px var(--shadow-lg);
    transform: scale(1.045) rotate(-1.2deg); pointer-events: none;
  }
  /* Jusqu'à 2 lignes si le texte ne tient pas sur 1 (retour de Lionel du
     03.09.2026 : "autoriser les bulles a faire 2 hauteur de texte si
     nécessaire") — 1 seule ligne quand ça suffit (la bulle ne grandit pas
     pour rien), 2 lignes avec "…" au-delà pour les textes plus longs. La
     bulle et sa case n'ayant pas de hauteur fixe (`.bulle`/`.cell` en flex,
     `.cell` juste un `min-height`), la ligne de la grille s'agrandit toute
     seule pour cette case (CSS Grid dimensionne ses rangées sur leur
     contenu) — jamais les autres. */
  .b-txt {
    font-size: 12px; font-weight: 600;
    display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; line-clamp: 2;
    white-space: normal; overflow: hidden; text-overflow: ellipsis; overflow-wrap: anywhere;
  }
  .bulle.important .b-txt { color: var(--important-ink); }
  .b-statut {
    align-self: flex-start; margin-top: 1px; display: inline-flex; align-items: center; gap: 4px;
    font-family: 'IBM Plex Mono', monospace; font-size: 8.5px; font-weight: 600; text-transform: uppercase;
    padding: 1px 6px 1px 5px; border-radius: 999px; color: var(--ink);
  }
  .b-statut .dot { width: 4px; height: 4px; border-radius: 50%; background: currentColor; }
  .b-serie { align-self: flex-start; font-size: 9px; opacity: .55; }
  .poignee { position: absolute; top: 0; bottom: 0; width: 12px; cursor: ew-resize; touch-action: none; z-index: 2; }
  .poignee::after {
    content: ""; position: absolute; top: 50%; width: 3px; height: 16px; transform: translateY(-50%);
    border-radius: 2px; background: var(--bubble-ink); opacity: 0; transition: opacity .12s;
  }
  .poignee-g { left: 0; border-radius: 9px 0 0 9px; }
  .poignee-g::after { left: 3px; }
  .poignee-d { right: 0; border-radius: 0 9px 9px 0; }
  .poignee-d::after { right: 3px; }
  .poignee:hover::after, .poignee.actif::after { opacity: .55; }
  .poignee.actif { background: rgba(0, 0, 0, .08); }
  .ghost { border: 1.5px dashed var(--border-strong); border-radius: 9px; opacity: .5; }

  .pop {
    position: fixed; z-index: 80; background: var(--surface-2); border: 1px solid var(--border);
    border-radius: 12px; padding: 10px; box-shadow: 0 12px 26px var(--shadow-lg);
    display: flex; flex-direction: column; gap: 6px; width: 220px; max-height: calc(100vh - 20px); overflow-y: auto;
  }
  .pop .cp-titre { font-size: 11.5px; font-weight: 700; color: var(--ink-muted); padding: 0 2px 2px; }
  .pop button {
    text-align: left; background: var(--surface); border: 1px solid var(--border); color: var(--ink);
    border-radius: 8px; padding: 7px 10px; font-size: 12.5px; font-weight: 600; cursor: pointer;
    transition: background .12s, border-color .12s;
  }
  .pop button:hover { background: var(--accent-soft); border-color: var(--accent); }
  .pop button.danger { color: var(--important-ink); }
  .pop button.danger:hover { background: #f6dcd7; border-color: var(--important-ink); }

  .voile-confirm { position: fixed; inset: 0; background: rgba(15, 21, 27, .38); z-index: 95; }
  .confirm-pop { position: fixed; z-index: 96; left: 50%; top: 50%; transform: translate(-50%, -50%); width: 260px; text-align: center; }
  .confirm-texte { margin: 0; padding: 2px 2px 4px; font-size: 13px; color: var(--ink); line-height: 1.5; }
  .confirm-boutons { display: flex; gap: 8px; }
  .confirm-boutons button { flex: 1; text-align: center; }
  .confirm-pop-serie { width: 280px; }
  .confirm-boutons-serie { display: flex; flex-direction: column; gap: 6px; margin-top: 4px; }
  .confirm-boutons-serie button { text-align: center; }
  .cs-annuler { width: 100%; margin-top: 8px; }
  .form-pop { width: 280px; }
  .form-pop input[type=text], .form-pop input[type=date], .form-pop select {
    font: inherit; font-size: 13.5px; padding: 10px 12px; border-radius: 8px; border: 1px solid var(--border);
    background: var(--surface); color: var(--ink); width: 100%;
  }
  .serie-options { display: flex; flex-direction: column; gap: 8px; padding: 8px 10px; margin-top: -2px; border-radius: 9px; background: var(--surface-2); }
  .serie-intervalle-row { display: flex; align-items: center; gap: 7px; font-size: 12.5px; color: var(--ink-muted); white-space: nowrap; }
  .serie-intervalle-row input[type=number] { width: 52px; }
  .serie-intervalle-row select { font: inherit; font-size: 12.5px; padding: 6px 8px; border-radius: 7px; border: 1px solid var(--border); background: var(--surface); color: var(--ink); }
  .serie-fin-row { margin-bottom: 1px; }
  .serie-ligne-nb input[type=number] { width: 64px; }
  .serie-ligne-date input[type=date] { width: 152px; padding: 6px 9px; font-size: 12.5px; }
  /* Round D (11.09.2026) — Lionel : « modifier une série lors de l'ouverture
     d'un formulaire avec série ». La fiche d'un item déjà en série affiche
     désormais ce bandeau (au lieu de rien, cf. commentaire de champSerie
     dans ouvrirEdition/ouvrirEditionPlage) : rend visible, dans la fiche
     elle-même, que "Enregistrer" proposera un choix de portée (cet élément
     seul / les suivants / toute la série) — cf. demanderPorteeSerie, déjà en
     place mais jusqu'ici invisible avant le clic sur Enregistrer. Modifier la
     fréquence/l'intervalle/la fin d'une série déjà créée n'est pas encore
     possible (gerer-serie ne gère que texte/important/statut/chantier par
     occurrence, pas la définition de la série elle-même) : volontairement PAS
     de champs éditables ici tant que cette limitation serveur n'est pas levée.
  */
  .serie-info-existante { display: flex; align-items: flex-start; gap: 7px; padding: 8px 10px; border-radius: 9px; background: var(--surface-2); font-size: 12.5px; color: var(--ink-muted); line-height: 1.4; }
  .serie-info-existante .icone-serie { flex: none; opacity: .75; }
  .label-champ { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; color: var(--ink-faint); margin: 2px 0 -3px; }
  .chip-row { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip {
    font: inherit; font-size: 12px; font-weight: 700; padding: 7px 13px; border-radius: 999px;
    border: 1.5px solid var(--border); background: var(--surface); color: var(--ink-muted); cursor: pointer;
  }
  .chip.actif { border-color: var(--accent); background: var(--accent); color: var(--accent-ink); }
  .chip.sub { font-size: 11px; padding: 5px 11px; }
  .row3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; }
  .champ-unite { position: relative; }
  .champ-unite input[type=text] { padding-right: 30px; }
  .champ-unite .unite { position: absolute; right: 10px; top: 50%; transform: translateY(-50%); font-size: 11.5px; color: var(--ink-faint); font-weight: 700; pointer-events: none; }
  .apercu { margin-top: 2px; padding: 9px 11px; border-radius: 9px; background: var(--accent-soft); color: var(--accent); font-family: 'IBM Plex Mono', monospace; font-size: 12px; font-weight: 600; word-break: break-word; }
  .apercu .apercu-label { display: block; font-family: 'Archivo', sans-serif; font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; color: var(--ink-faint); margin-bottom: 3px; }
  .form-pop .chk { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--ink-muted); padding: 2px 1px; cursor: pointer; }
  .form-pop .chk-ligne { display: flex; align-items: center; justify-content: space-between; gap: 8px; font-size: 12px; color: var(--ink-muted); padding: 2px 1px; }
  .form-pop .chk-ligne input[type=number] { width: 56px; font: inherit; font-size: 12.5px; padding: 5px 7px; border-radius: 8px; border: 1px solid var(--border); background: var(--surface); color: var(--ink); }
  .form-pop .form-actions { display: flex; gap: 6px; margin-top: 2px; }
  .form-pop .form-actions button { flex: 1; text-align: center; }
  .form-pop .f-ok { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .form-pop .f-ok:hover { filter: brightness(1.06); }
  .form-pop .f-ok:disabled, .pop button:disabled { opacity: .55; cursor: default; }

  /* ============ Cartes tâche/absence/note/jalon — nouveau formulaire
     (rounds des 08-11.09.2026, validé par Lionel sur mockups.html) : bandeau
     coloré (couleur du chantier pour une tâche, teinte pastel fixe
     --note-bg/--jalon-bg/--absence-bg pour les 3 autres) portant la croix
     "Fermer" et le drapeau "Important" incrustés, 2 lignes de date (Début/
     Fin) avec flèches + 2 boutons A/P (matin/après-midi), descriptif
     cliquable ouvrant un petit éditeur, section "Plus d'options" dépliable
     (Statut : tâche + sous-traitant seulement ; Série : tâche/note/absence,
     jamais jalon). Réutilise .form-pop et son plein-écran téléphone/demi-page
     tablette déjà en place (cf. juste en dessous) via la classe .carte-item :
     .pop pose `display:flex;flex-direction:column;gap:6px` sur TOUS ses
     enfants directs (cf. tout en haut du fichier) — .carte-item remet `gap`
     à 0 et gère l'espacement par le padding de chaque bloc, comme dans
     mockups.html. */
  .form-pop.carte-item { padding: 0; gap: 0; width: 324px; }
  .carte-item .bandeau { position: relative; padding: 13px 44px 13px 16px; color: #fff; flex-shrink: 0; border-radius: 12px 12px 0 0; }
  .carte-item .bandeau.clair { color: var(--ink); }
  .carte-item .bandeau .fermer, .carte-item .bandeau .important-toggle {
    position: absolute; top: 10px; width: 30px; height: 30px; border-radius: 50%; padding: 0;
    display: grid; place-items: center; background: rgba(255, 255, 255, .2); color: #fff; cursor: pointer; border: none;
  }
  .carte-item .bandeau .fermer svg, .carte-item .bandeau .important-toggle svg {
    width: 14px; height: 14px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round;
  }
  .carte-item .bandeau .fermer { right: 10px; }
  .carte-item .bandeau .important-toggle { right: 52px; }
  .carte-item .bandeau.clair .fermer, .carte-item .bandeau.clair .important-toggle { background: rgba(20, 24, 20, .1); color: var(--ink); }
  .carte-item .bandeau .important-toggle.actif { background: #f2b134; color: #6b4400; }
  /* Round du 12.09.2026 — Lionel : « le chantier est cliquable pour le
     changer, mais la case est trop grande, réduit la à la taille du texte.
     La flèche type menu déroulant me dérange, supprime la. Souligne
     discrètement le nom du chantier type lien hypertexte à cliquer. »
     Avant : display:block + max-width:100% faisait déborder le <select>
     jusqu'au bord du bandeau (toute cette zone vide était cliquable, pas
     seulement le nom du chantier) et un chevron en data-URI (2 variantes
     clair/foncé) imitait une flèche de menu déroulant. display:inline-block
     (au lieu de block) fait reprendre au <select> la largeur de son texte,
     comme n'importe quel élément inline ; le chevron et son padding-droit
     réservé (16px) disparaissent ; un discret soulignement (comme un lien)
     remplace l'affordance visuelle "c'est cliquable" que donnait la flèche.
     -webkit-appearance/appearance:none restent nécessaires (sans eux, un
     select démasqué reviendrait avec la flèche native du navigateur). */
  .carte-item .bandeau .chantier-tag {
    display: inline-block; font: inherit; font-size: 10px; font-weight: 800; text-transform: uppercase; letter-spacing: .08em;
    opacity: .9; width: auto; max-width: 100%; background-color: transparent; border: none; color: inherit; cursor: pointer; margin: 0;
    padding: 0; -webkit-appearance: none; appearance: none;
    text-decoration: underline; text-decoration-color: currentColor; text-underline-offset: 3px;
  }
  .carte-item .bandeau .chantier-tag option { color: #000; }
  .carte-item .bandeau .nom-grand { font-size: 17px; font-weight: 800; margin-top: 4px; }
  .carte-item .bandeau .nom-grand:first-child { margin-top: 0; }

  .carte-item .dates-plage { display: flex; flex-direction: column; gap: 7px; padding: 13px 16px 3px; flex-shrink: 0; }
  .carte-item .date-ligne { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .carte-item .date-ligne-gauche { display: flex; align-items: center; gap: 10px; }
  .carte-item .label-date { font-size: 10px; font-weight: 800; text-transform: uppercase; letter-spacing: .05em; color: var(--ink-faint); width: 32px; flex-shrink: 0; }
  .carte-item .date-nav {
    display: inline-flex; align-items: center; gap: 8px; font-family: 'IBM Plex Mono', monospace; font-weight: 700;
    font-size: 12.5px; letter-spacing: .03em; color: var(--ink-muted); text-transform: uppercase;
  }
  .carte-item .date-nav .fleche {
    width: 24px; height: 24px; border-radius: 7px; border: 1px solid var(--border); background: var(--surface); padding: 0;
    color: var(--ink-muted); display: grid; place-items: center; cursor: pointer; flex-shrink: 0;
  }
  .carte-item .date-nav .fleche:disabled { opacity: .35; cursor: default; }
  .carte-item .date-nav .fleche svg { width: 13px; height: 13px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .carte-item .date-nav .date-val { color: var(--ink); padding: 3px 6px; border-radius: 6px; white-space: nowrap; }
  /* Round D — Lionel : « Cliquer sur la date dans les formulaires permet
     d'ouvrir un calendrier. » .date-val-cliquable est juste l'affordance
     visuelle (surlignage au survol, comme .lien-aller) ; le calendrier
     lui-même est un <input type="date"> natif positionné par-dessus (cf.
     cablerCalendrierDate), rendu invisible ici (opacity 0) puisque seul son
     calendrier natif (.showPicker()) doit apparaître, jamais son propre
     encart texte qui doublonnerait .date-val en dessous. */
  .carte-item .date-nav .date-val-cliquable:hover { background: var(--accent-soft); color: var(--accent); }
  /* §88 — bord de plage (jalon/note) dont la vraie date est hors de la
     semaine actuellement affichée à l'écran (cf. appliquerDateChoisieFormulaire) :
     italique + soulignage pointillé, pour rester lisible que ce jour-là n'est
     pas dans la grille en ce moment, sans pour autant ressembler à une erreur. */
  .carte-item .date-nav .date-val-hors-fenetre { font-style: italic; text-decoration: underline dotted var(--ink-faint); text-underline-offset: 2px; }
  .date-picker-natif { position: fixed; opacity: 0; z-index: 60; border: none; padding: 0; margin: 0; }
  .carte-item .demi-toggle { display: flex; gap: 5px; flex-shrink: 0; }
  .carte-item .demi-toggle .demi-btn {
    width: 26px; height: 26px; border-radius: 7px; border: 1px solid var(--border); background: var(--surface); padding: 0;
    color: var(--ink-muted); font-size: 11px; font-weight: 800; display: grid; place-items: center; cursor: pointer;
  }
  .carte-item .demi-toggle .demi-btn.actif { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
  .carte-item .demi-toggle .demi-btn:disabled { opacity: .3; cursor: default; }

  .carte-item .contenu-carte { display: flex; flex-direction: column; min-height: 0; }
  .carte-item .corps { padding: 14px 16px; display: flex; flex-direction: column; gap: 6px; }
  .carte-item .descriptif-texte {
    font-size: 15px; line-height: 1.45; color: var(--ink); cursor: pointer; padding: 0; border: none; background: transparent;
    text-align: left; font-family: inherit; white-space: pre-wrap; word-break: break-word; min-height: 1.45em;
  }
  .carte-item .descriptif-texte:empty::before { content: attr(data-placeholder); color: var(--ink-faint); }

  .carte-item .lien-plus {
    display: flex; align-items: center; justify-content: center; gap: 5px; padding: 7px 16px;
    font-size: 12px; font-weight: 700; color: var(--ink-muted); cursor: pointer; flex-shrink: 0;
  }
  .carte-item .lien-plus.ferme { border-top: 1px solid var(--border); }
  .carte-item .lien-plus svg { width: 11px; height: 11px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; vertical-align: -1px; }
  .carte-item .options-avancees { display: flex; flex-direction: column; gap: 12px; padding: 12px 16px 4px; margin: 0 16px 4px; border-top: 1px dashed var(--border); }
  .carte-item .options-avancees .label-champ { margin: 0 0 6px; }

  .carte-item .pied-principal { display: flex; gap: 10px; padding: 14px 16px; border-top: 1px solid var(--border); flex-shrink: 0; }
  .carte-item .pied-principal .btn-icon {
    flex: none; width: 48px; height: 48px; border-radius: 12px; border: 1px solid var(--border); background: var(--surface); padding: 0;
    color: var(--ink-muted); display: grid; place-items: center; cursor: pointer;
  }
  .carte-item .pied-principal .btn-icon svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .carte-item .pied-principal .btn-icon.supprimer { color: var(--important-ink); border-color: #e3c3bd; }
  .carte-item .pied-principal .f-ok {
    flex: 1; height: 48px; border-radius: 12px; background: var(--accent); border: none; color: var(--accent-ink); display: flex;
    align-items: center; justify-content: center; gap: 8px; font-weight: 700; font-size: 13.5px; cursor: pointer; font-family: inherit; padding: 0;
  }
  .carte-item .pied-principal .f-ok:hover { filter: brightness(1.06); }
  .carte-item .pied-principal .f-ok svg { width: 16px; height: 16px; stroke: #fff; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

  /* -- éditeur du descriptif : même balisage desktop/mobile, seule la CSS
     change (popup centré vs demi-fenêtre bas d'écran) — posé en ENFANT du
     .pop pour que fermerAuClicExterieur (qui ferme sur tout clic hors de
     `pop.contains(ev.target)`) ne le traite jamais comme "extérieur". -- */
  .desc-edit-overlay { position: absolute; inset: 0; background: rgba(15, 21, 27, .45); z-index: 5; border-radius: inherit; }
  .desc-edit-box {
    position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: 258px; z-index: 6;
    background: var(--surface-2); border: 1px solid var(--border); border-radius: 12px; box-shadow: 0 18px 40px var(--shadow-lg);
    padding: 16px; display: flex; flex-direction: column; gap: 10px;
  }
  .desc-edit-box .popup-head { display: flex; align-items: center; justify-content: space-between; }
  .desc-edit-box .popup-titre { font-size: 12.5px; font-weight: 800; color: var(--ink); }
  .desc-edit-box .popup-close {
    width: 26px; height: 26px; border-radius: 50%; border: 1px solid var(--border); background: var(--surface); padding: 0;
    color: var(--ink-muted); display: grid; place-items: center; cursor: pointer; flex-shrink: 0;
  }
  .desc-edit-box .popup-close svg { width: 13px; height: 13px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .desc-edit-box textarea {
    font: inherit; font-size: 13px; padding: 10px; border-radius: 8px; border: 1px solid var(--border);
    background: var(--surface); color: var(--ink); width: 100%; height: 80px; resize: none;
  }
  .desc-edit-box .popup-pied { display: flex; justify-content: flex-end; }
  .desc-edit-box .popup-valider {
    display: inline-flex; align-items: center; gap: 7px; padding: 9px 16px; border-radius: 9px; border: 1px solid var(--accent);
    background: var(--accent); color: var(--accent-ink); font: inherit; font-size: 12.5px; font-weight: 700; cursor: pointer;
  }
  .desc-edit-box .popup-valider svg { width: 15px; height: 15px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

  /* -- mobile (≤600px, cf. .form-pop plein écran plus bas) : bandeau carré
     (plus de coin arrondi à rogner), le bloc corps/options défile tandis que
     bandeau/dates/pied restent fixes, éditeur du descriptif en demi-fenêtre
     ancrée en bas (repris de mockups.html, .sheet). -- */
  @media (max-width: 600px) {
    .carte-item .bandeau { border-radius: 0; }
    .carte-item .contenu-carte { flex: 1; overflow-y: auto; }
    .desc-edit-box {
      left: 0; right: 0; top: auto; bottom: 0; transform: none; width: auto; max-width: none;
      border-radius: 20px 20px 0 0; box-shadow: 0 -12px 30px var(--shadow-lg);
    }
    .desc-edit-box textarea { flex: 1; height: 140px; }
  }

  /* Formulaires en plein écran sur téléphone, demi-page sur tablette (retour
     de Lionel du 03.09.2026 : "J'aimerais que tous les formulaires
     remplissent la page complète téléphone, comme si c'était une nouvelle
     fenêtre qui s'ouvrait, puis je pense la demi-page sur la tablette
     suffit"). Ne touche QUE `.form-pop` — les vrais formulaires (ajout/
     modification tâche, absence, note, personne, chantier, "Aller à…"…) — ni
     les menus contextuels (`.menu-pop`) ni les simples confirmations
     oui/non (`.confirm-pop`), déjà assez petits pour rester lisibles tels
     quels. `positionnerPop()` continue de poser `left`/`top` en px via JS
     (repositionnement près du clic, comportement desktop inchangé) : les
     `!important` ci-dessous sont nécessaires pour prendre le dessus sur ce
     style inline en dessous du seuil tablette. Coupures à 600px/1024px :
     approximation usuelle téléphone/tablette/desktop, aucune borne exacte
     de matériel n'existe de toute façon. */
  @media (max-width: 600px) {
    .form-pop {
      left: 0 !important; top: 0 !important;
      width: 100% !important; height: 100dvh !important; max-height: 100dvh !important;
      max-width: 100% !important; border-radius: 0;
    }
  }
  @media (min-width: 601px) and (max-width: 1024px) {
    .form-pop {
      left: 50% !important; top: 50% !important; transform: translate(-50%, -50%);
      width: 50vw !important; min-width: 320px; max-width: calc(100vw - 32px) !important;
      max-height: calc(100dvh - 32px) !important;
    }
  }

  .toast {
    position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%) translateY(8px);
    background: var(--ink); color: var(--bg); font-size: 12.5px; font-weight: 600;
    padding: 9px 16px; border-radius: 999px; box-shadow: 0 8px 20px var(--shadow-lg);
    opacity: 0; transition: opacity .18s, transform .18s; pointer-events: none; z-index: 220;
    max-width: 86vw; text-align: center;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  .note-bas { margin-top: 22px; padding: 12px 14px; border: 1.5px dashed var(--border); border-radius: 12px; color: var(--ink-muted); font-size: 12px; line-height: 1.6; max-width: 780px; }
  .note-bas b { color: var(--ink); }

  /* ---------- menu de gauche + pages ---------- */
  /* Round du 12.09.2026 — Lionel : « beaucoup de place vide autour de l'écran
     sur desktop. » 1380px, centré, laissait deux bandes vides grandissantes
     sur tout écran plus large (très courant aujourd'hui : 1920px et plus).
     Remonté à 2200px — assez large pour qu'un écran normal (jusqu'à un
     1920×1080 ou un 1440p) utilise vraiment toute sa largeur, tout en gardant
     un garde-fou raisonnable sur un très grand écran (4K, ultra-wide) pour ne
     pas étirer les colonnes de la grille à l'infini. Les autres pages
     (Personnel, Chantiers, Statuts…) ne sont pas affectées dans leur lisibilité
     : leur propre liste/formulaire garde sa limite de largeur dédiée
     (.liste-intervenants, .reglage-ligne, etc.), indépendante de ce cadre. */
  .app-shell { display: flex; flex-direction: column; max-width: 2200px; margin: 0 auto; }
  /* Round du 12.09.2026 — Lionel (mockup validé, « Option 2 — onglets ») :
     remplace l'ancienne sidebar (200px, à repli automatique sur Planning,
     cf. l'historique de ce fichier) par une barre d'onglets horizontale,
     identique sur les 9 pages — plus de panneau qui s'ouvre par-dessus le
     contenu, ni de largeur réservée en permanence sur les pages autres que
     Planning. overflow-x:auto fait défiler la barre au doigt plutôt que de
     tasser les onglets sur un écran étroit (vérifié mobile, cf. changelog).
     Round du 16.09.2026 (suite) — Lionel : « fixer la partie supérieure au
     tableau de tâches afin que les onglets et la légende des chantiers
     restent toujours à l'écran. » position:sticky top:0 + fond opaque : la
     barre reste désormais visible en permanence pendant le défilement de
     #app (seule zone qui défile réellement, cf. son commentaire plus haut),
     au lieu de disparaître avec le reste de la page. z-index:40 : au-dessus
     de la grille (bulles/cases, z-index ≤ 6) mais très en dessous des
     popups/modales (.voile-confirm z-index:95 et plus). margin-bottom réduit
     de 18 à 8 (round du 16.09.2026, suite, encore — Lionel : « réduire les
     espaces roses ») : cf. le commentaire de .page-scroll, même logique —
     resserre la barre d'onglets et le début de chaque page, absorbé plus bas
     par .legende-barre.

     Round du 16.09.2026 (encore un autre, suite, suite — §80, croquis
     annoté, 1er rectangle rouge) — Lionel : « on peut encore gagner de la
     place ». padding-top:44 a disparu : il ne servait qu'à réserver, en
     PERMANENCE sur toute la hauteur de l'appli, la bande que le lien "Se
     déconnecter" — alors en position:fixed, cf. l'ancien commentaire de
     .lien-deconnexion — venait survoler par-dessus. Ce lien rejoint
     maintenant la barre d'onglets elle-même (.onglets-liste ci-dessous pour
     les onglets défilants + le nouveau bouton .lien-deconnexion-nav, cf.
     construireCoquille) : plus besoin de lui réserver un espace séparé
     puisqu'il occupe désormais une place normale dans le flux, comme
     n'importe quel autre élément de la barre. .lien-deconnexion (fixed)
     reste utilisée par afficherLienDeconnexion() pour la toute première
     fraction de seconde après la connexion, le temps que demarrer() charge
     les données et que construireCoquille() construise la vraie barre —
     celle-ci retire alors le lien flottant devenu redondant (cf.
     construireCoquille). display:flex + align-items:center (remplace
     l'ancien display:flex simple, qui ne s'appliquait qu'aux onglets
     eux-mêmes) : la barre contient maintenant 2 enfants côte à côte
     (.onglets-liste qui défile seule au doigt sur mobile + le bouton
     déconnexion, toujours visible, jamais emporté par ce défilement). */
  .onglets-nav {
    display: flex; align-items: center; gap: 10px;
    border-bottom: 1px solid var(--border); margin-bottom: 4px; flex-shrink: 0;
    padding-top: 10px;
    position: sticky; top: 0; z-index: 40; background: var(--bg);
  }
  /* §81 (round du 16.09.2026, encore un autre, suite, suite, encore) —
     Lionel, mockup mockup-barre-onglets-pro.html à l'appui, option 2 retenue
     (« le 2 me plait plus ») : un repère de marque à gauche, l'icône PWA
     existante (icons/icon-32.png, motif "mur de briques", cf. §76 — pas de
     nouveau logo à inventer) SANS le nom "Planning Chantiers" à côté
     (Lionel : « l'icône suffit »). */
  .marque-nav {
    display: flex; align-items: center; flex-shrink: 0;
    padding-right: 10px; border-right: 1px solid var(--border);
  }
  .marque-nav img { width: 28px; height: 28px; border-radius: 7px; display: block; }
  .onglets-liste {
    display: flex; gap: 3px; overflow-x: auto; -webkit-overflow-scrolling: touch;
    flex: 1 1 auto; min-width: 0;
  }
  /* Avatar rond (initiale) à la place de l'ancien bouton texte "Se
     déconnecter" — même mockup, option 2. Un seul compte pour toute
     l'équipe (pas de gestion multi-utilisateur côté auth) : l'initiale "L"
     reste donc fixe plutôt que dérivée d'une session dont l'e-mail
     n'apporterait rien de plus ici. Le clic déconnecte directement, comme
     l'ancien bouton — un menu (déconnexion + réglages de compte) pourra
     s'ajouter plus tard si le besoin s'en fait sentir, cf. l'annotation du
     mockup. */
  .avatar-nav {
    flex-shrink: 0; width: 28px; height: 28px; border-radius: 50%;
    background: var(--accent-soft); color: var(--accent); border: 1px solid var(--border);
    display: grid; place-items: center; font-size: 12px; font-weight: 800;
    font-family: 'IBM Plex Mono', monospace; cursor: pointer; margin-right: 12px;
    transition: background .12s, border-color .12s, color .12s;
  }
  .avatar-nav:hover { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  /* Onglets en pilules (au lieu du trait sous le texte) — même mockup,
     langage visuel du bandeau Nolio pris en référence par Lionel. */
  .onglet {
    display: flex; align-items: center; gap: 6px;
    padding: 7px 14px; font-size: 12.5px; font-weight: 700; color: var(--ink-muted);
    border: none; border-radius: 8px; background: none; cursor: pointer;
    white-space: nowrap; flex-shrink: 0; font-family: inherit; transition: background .12s, color .12s;
  }
  /* §83 — Lionel : « profites-en pour ajouter les icones dans le menu ».
     Jalons/Personnel/Intervenants reprennent EXACTEMENT les icônes de
     .toolbar-toggle plus bas (cf. htmlPagePlanning/construireCoquille) pour
     que l'œil fasse tout de suite le lien entre l'onglet et son contrôle de
     masquage dans la barre d'outils. */
  .onglet svg { width: 14px; height: 14px; flex-shrink: 0; }
  .onglet:hover { background: var(--surface-2); color: var(--ink); }
  .onglet.actif { background: var(--accent-soft); color: var(--accent); }
  /* Pages de réglages (Général/Chantiers/Statuts/Fériés/Entrée rapide) : en
     retrait visuel plutôt que regroupées sous un sous-menu, comme validé sur
     le mockup — mais toujours accent quand actives, comme n'importe quel
     onglet (spécificité 3 classes, l'emporte sur .onglet.secondaire seul). */
  .onglet.secondaire { color: var(--ink-faint); font-weight: 600; }
  .onglet.secondaire:hover { background: var(--surface-2); color: var(--ink-muted); }
  .onglet.secondaire.actif { background: var(--accent-soft); color: var(--accent); font-weight: 700; }
  .app-main { min-width: 0; }
  .page { display: none; }
  .page.actif { display: block; }

  .page-titre { display: flex; align-items: center; justify-content: space-between; gap: 14px; margin-bottom: 4px; flex-wrap: wrap; }
  .page-titre h1 { font-size: 17px; font-weight: 800; letter-spacing: -0.01em; margin: 0; }
  .page-sous { color: var(--ink-muted); font-size: 12.5px; line-height: 1.55; margin: 3px 0 16px; max-width: 62ch; }
  .page-placeholder { padding: 28px 22px; border: 1.5px dashed var(--border); border-radius: 12px; color: var(--ink-muted); font-size: 13px; max-width: 60ch; }

  .reglage-ligne {
    display: flex; align-items: center; justify-content: space-between; gap: 20px;
    max-width: 540px; padding: 14px 16px; border: 1px solid var(--border); border-radius: 10px;
    background: var(--surface-2); cursor: pointer; transition: border-color .12s; margin-bottom: 10px;
  }
  .reglage-ligne:hover { border-color: var(--accent); }
  .reglage-texte { display: flex; flex-direction: column; gap: 3px; }
  .reglage-texte b { font-size: 13.5px; font-weight: 700; }
  .reglage-texte span { font-size: 12px; color: var(--ink-muted); line-height: 1.4; }
  .interrupteur { position: relative; flex-shrink: 0; width: 40px; height: 24px; }
  .interrupteur input { position: absolute; inset: 0; opacity: 0; margin: 0; cursor: pointer; }
  .interrupteur-piste { position: absolute; inset: 0; background: var(--border-strong); border-radius: 999px; transition: background .15s; opacity: .35; }
  .interrupteur-piste::before {
    content: ""; position: absolute; top: 3px; left: 3px; width: 18px; height: 18px;
    border-radius: 50%; background: var(--surface-2); box-shadow: 0 1px 3px var(--shadow); transition: transform .15s;
  }
  .interrupteur input:checked ~ .interrupteur-piste { background: var(--accent); opacity: 1; }
