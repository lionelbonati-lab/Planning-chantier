  // §23) — impossible d'atteindre "1 jour et demi" en tirant une poignée
  // depuis une note déjà en demi-journée, puisque le seul bord qu'elle
  // pouvait porter restait bloqué à sa valeur de départ. Désormais chaque
  // poignée ne gouverne QUE SON PROPRE bord (droite -> demiFin, gauche ->
  // demiDebut) ; l'autre bord n'est jamais touché, quelle que soit la durée
  // de l'aperçu — c'est exactement ce qui permet à l'aperçu de glisser en
  // continu "1 jour" -> "1 demi jour" -> "1 jour et demi".
  //   dureePrevisu === 1 : un seul jour restant, donc les 2 bords
  //     fusionnent forcément (invariant demiDebut === demiFin) — la position
  //     du pointeur DANS ce jour choisit alors la seule demi-journée de la
  //     note, quelle que soit la poignée tenue.
  //   dureePrevisu > 1, poignée "droite" : la position du pointeur dans le
  //     NOUVEAU dernier jour choisit demiFin (moitié gauche = rogné ->
  //     "matin" seul ; moitié droite = pas rogné -> journée entière) ;
  //     demiDebut ne bouge pas.
  //   dureePrevisu > 1, poignée "gauche" : symétrique sur demiDebut (moitié
  //     droite = rogné -> "aprem" seul ; moitié gauche = pas rogné ->
  //     journée entière) ; demiFin ne bouge pas.
  function demiPourRedimNote(cote, dureePrevisu, demiDebutOrig, demiFinOrig, demiAuPoint) {
    if (dureePrevisu === 1) {
      var demiUnique = cote === "droite" ? (demiAuPoint === "matin" ? "matin" : null) : (demiAuPoint === "aprem" ? "aprem" : null);
      return { demiDebut: demiUnique, demiFin: demiUnique };
    }
    if (cote === "droite") return { demiDebut: demiDebutOrig, demiFin: demiAuPoint === "matin" ? "matin" : null };
    return { demiDebut: demiAuPoint === "aprem" ? "aprem" : null, demiFin: demiFinOrig };
  }
  // Bords {demiDebut, demiFin} cibles d'une NOTE déplacée par glissement
  // (bulle entière, onPointerDownGroupeSelection ci-dessous) — même
  // principe : fonction pure, testable seule. Depuis le round du 08.09.2026
  // (suite), sert uniquement au mode CLASSIQUE (granularité jour entier pour
  // duree > 1, comme décrit ci-dessous) — le mode COMPACT passe désormais
  // systématiquement par bordsDeplacementNoteMultiJours (modèle demi-slot,
  // cf. son en-tête), y compris pour duree === 1.
  //   plusieurs jours (duree > 1) : un simple déplacement (qui ne change
  //     jamais la durée) reconduit la FORME des 2 bords telle quelle — un
  //     glissement n'a pas vocation à réinterpréter laquelle des 2
  //     extrémités le point de relâchement concerne.
  //   1 seul jour, même jour (delta === 0) : si la note était DÉJÀ en
  //     demi-journée, la position choisit la nouvelle demi-journée (bascule
  //     matin<->aprem, cf. round du 03.09.2026) ; si elle était en JOURNÉE
  //     ENTIÈRE, elle LE RESTE — exactement la même protection que la règle
  //     "jour différent" juste en dessous (round du 08.09.2026, suite :
  //     Lionel, « quand je déplace une note matin/aprem de 1/2 jour elle
  //     est retrecie en 1/2 journée » — avant ce correctif, le moindre
  //     micro-glissement d'une note en journée entière qui restait sur le
  //     même jour la rétrécissait en demi-journée, sans lien avec l'intention
  //     de l'utilisateur ; désormais les 2 cas "même jour" et "jour
  //     différent" suivent la même règle, cf. FRONTEND-CHANGELOG §42).
  //   1 seul jour, jour différent : si la note était déjà en demi-journée,
  //     la position choisit sa nouvelle demi-journée sur le jour d'arrivée ;
  //     si elle était en journée entière, elle LE RESTE (ne jamais réduire
  //     une note "normale" à une demi-journée par un simple déplacement).
  function demiCiblePourDeplacementNote(duree, delta, demiDebutActuel, demiFinActuel, demiAuPoint) {
    if (duree !== 1) return { demiDebut: demiDebutActuel, demiFin: demiFinActuel };
    var demiActuel = demiDebutActuel; // === demiFinActuel (duree === 1)
    var cible = demiActuel ? demiAuPoint : demiActuel;
    return { demiDebut: cible, demiFin: cible };
  }
  // Modèle "demi-slot" (round du 07.09.2026, suite — Lionel, après le §37 :
  // « toujours impossible de déplacer une note qui mesure 2 demi/journée de
  // 1 demi journée », clarifié en « un après-midi et un matin [...] je veux
  // le déplacer sur matin/après-midi »). Ci-dessus, demiCiblePourDeplacementNote
  // (round du 03.09.2026/§25) reconduit TOUJOURS la forme des 2 bords telle
  // quelle dès que duree > 1 — un déplacement de note à cheval sur plusieurs
  // jours ne pouvait donc bouger que par JOUR ENTIER, jamais par demi-journée :
  // ce n'était pas un bug caché, cette granularité n'avait simplement jamais
  // été construite pour le cas multi-jours.
  //
  // Un "demi-slot" est un entier qui numérote consécutivement les
  // demi-journées ouvrées : le jour `gi` a pour matin le slot `2*gi`, pour
  // après-midi le slot `2*gi+1`. Traduire une note en {halfStart, halfFinIncl}
  // (les 2 bornes INCLUSES, en demi-slots), translater cette paire d'un
  // nombre ENTIER de demi-slots puis reconvertir, donne exactement le
  // déplacement en demi-journée pour une note multi-jours — sans jamais
  // changer son NOMBRE TOTAL de demi-slots occupés (donc sa durée réelle de
  // travail), qu'elle soit concentrée sur un seul jour ou répartie sur
  // plusieurs jours calendaires.
  //
  // Round du 08.09.2026, suite — Lionel : « je n'arrive pas à placer ma note
  // sur lundi aprem [...] ce phénomène ne se produit que quand la bulle fait
  // un jour complet » / « une bulle de 2 case doit garder sa grandeur mais
  // doit pouvoir se déplacer de 1 case » : ce modèle gouverne désormais AUSSI
  // le déplacement en mode compact d'une note d'1 SEUL jour (duree === 1),
  // pas seulement duree > 1 comme avant ce round — cf. resoudreCibleGroupe.
  // Une note en JOURNÉE ENTIÈRE occupe exactement 2 demi-slots (autant
  // qu'une note "1 jour et demi" à cheval sur 2 jours calendaires) : rien ne
  // justifiait de la traiter différemment. demiCiblePourDeplacementNote
  // (round du 03.09.2026/§25) reste utilisée telle quelle, mais seulement en
  // mode CLASSIQUE désormais (pas de géométrie demi-jour pixel-précise dans
  // ce mode, cf. colonneEtSpanDemi) — cf. tests existants, comportement de ce
  // mode inchangé.
  function demiSlotsDepuisBornes(giDebut, duree, demiDebut, demiFin) {
    var halfStart = giDebut * 2 + (demiDebut === "aprem" ? 1 : 0);
    var halfFinIncl = (giDebut + Math.max(1, duree) - 1) * 2 + (demiFin === "matin" ? 0 : 1);
    return { halfStart: halfStart, halfFinIncl: halfFinIncl };
  }
  // Inverse de demiSlotsDepuisBornes : reconstruit {giDebut, duree, demiDebut,
  // demiFin} depuis une paire de bornes en demi-slots (incluses). Sur un seul
  // jour (les 2 bornes tombent dans le même `gi`), invariant maintenu partout
  // ailleurs dans le fichier : demiDebut === demiFin — soit la note tient sur
  // UN seul demi-slot (matin seul ou aprem seul), soit sur les 2 demi-slots du
  // jour (journée entière, demiDebut = demiFin = null). C'est précisément ce
  // cas qui permet au scénario de Lionel (2 demi-slots consécutifs à cheval
  // sur 2 jours -> 2 demi-slots du MÊME jour) de redevenir une journée pleine.
  function bornesDepuisDemiSlots(halfStart, halfFinIncl) {
    var giDebut = Math.floor(halfStart / 2), giFin = Math.floor(halfFinIncl / 2);
    var duree = giFin - giDebut + 1;
    if (duree === 1) {
      if (halfFinIncl === halfStart) {
        var demiUnique = (halfStart % 2 === 1) ? "aprem" : "matin";
        return { giDebut: giDebut, duree: 1, demiDebut: demiUnique, demiFin: demiUnique };
      }
      return { giDebut: giDebut, duree: 1, demiDebut: null, demiFin: null };
    }
    var demiDebut = (halfStart % 2 === 1) ? "aprem" : null;
    var demiFin = (halfFinIncl % 2 === 0) ? "matin" : null;
    return { giDebut: giDebut, duree: duree, demiDebut: demiDebut, demiFin: demiFin };
  }
  // Déplacement en demi-journée d'une note de PLUSIEURS jours (duree > 1) —
  // combine la position du CLIC initial dans la bulle (offsetHalvesClic, en
  // demi-slots — cf. onPointerDownGroupeSelection) et la position du
  // RELÂCHEMENT (giCibleBrut + demiSousPointeur) en un delta de demi-slots,
  // jamais un delta de jours entiers qui ne permettrait aucun décalage plus
  // fin qu'une journée complète. La fenêtre `[0, nTotal*2 - 1]` (bornes
  // incluses, en demi-slots) est la même limite que pour un déplacement en
  // jours entiers (`nTotal - duree` jours), simplement exprimée dans l'unité
  // demi-slot — la LONGUEUR occupée (`L`) ne change jamais, seule sa position
  // est bornée.
  function bordsDeplacementNoteMultiJours(giDebut, duree, demiDebut, demiFin, offsetHalvesClic, giCibleBrut, demiSousPointeur, nTotal) {
    var b = demiSlotsDepuisBornes(giDebut, duree, demiDebut, demiFin);
    var L = b.halfFinIncl - b.halfStart + 1;
    var halfSousPointeur = giCibleBrut * 2 + (demiSousPointeur === "aprem" ? 1 : 0);
    var nouveauHalfStart = halfSousPointeur - offsetHalvesClic;
    nouveauHalfStart = Math.max(0, Math.min(nTotal * 2 - L, nouveauHalfStart));
    return bornesDepuisDemiSlots(nouveauHalfStart, nouveauHalfStart + L - 1);
  }
  function appliquerTeinteFerie(cell, gi) {
    var fer = feriePourJour(gi);
    if (!fer) return;
    cell.classList.add("cell-ferie");
    cell.style.setProperty("--ferie-tint", hexToRgba(fer.couleur, .3));
    cell.title = fer.label;
  }
  function creerCell(gi, extra) {
    var cell = document.createElement("div");
    cell.className = "cell cell-personne";
    cell.dataset.kind = "personne"; cell.dataset.jour = String(gi);
    cell.dataset.personne = extra.personne; cell.dataset.demi = extra.demi;
    if (!estGiWeekend(gi) && gi > 0 && gi % 5 === 0) cell.classList.add("sem-frontiere");
    if (estGiWeekend(gi)) cell.classList.add("case-weekend");
    appliquerTeinteFerie(cell, gi);
    cablerAjoutCellule(cell);
    return cell;
  }
  // Cellule week-end "inerte" (fond seul, pas cliquable, pas de data-kind) —
  // posée sur la ligne Après-midi d'une personne (cf. ligneGroupePersonnes) :
  // contrairement aux jours ouvrés, il n'existe physiquement QU'UNE seule
  // cellule week-end par personne côté feuille (colonne jj=6 fusionnée sur
  // les 4 lignes du bloc, §2 du spec) — pas de ligne matin/aprem distincte.
  // Le client V3 affiche 2 lignes par personne ; pour ne jamais écrire 2 fois
  // (donc s'écraser l'un l'autre) la même cellule serveur depuis 2 cases
  // "actives" différentes, seule la ligne Matin porte la vraie cellule
  // interactive (cf. creerCell + construireVueDepuisCache, items posés avec
  // demi:"matin") ; celle-ci, posée sur Après-midi, est un simple filler
  // visuel (même teinte --weekend-bg) pour que la grille reste alignée.
  function creerCelluleWeekendInerte(gi) {
    var cell = document.createElement("div");
    cell.className = "cell case-weekend";
    cell.style.cursor = "default";
    return cell;
  }
  function creerCelluleFond(kind, gi) {
    var cell = document.createElement("div");
    cell.className = "cell cell-" + kind;
    cell.dataset.kind = kind; cell.dataset.jour = String(gi);
    if (!estGiWeekend(gi) && gi > 0 && gi % 5 === 0) cell.classList.add("sem-frontiere");
    if (estGiWeekend(gi)) cell.classList.add("case-weekend");
    // Jalons/notes n'existent que sur les jours ouvrés côté feuille réelle
    // (apiEnregistrerPlage ignore explicitement les colonnes week-end, cf.
    // §2 du spec — seule la cellule "personne" week-end est fusionnée). Une
    // case week-end de la ligne Jalons/Notes reste donc un simple fond
    // inerte, pas cliquable (déviation documentée dans FRONTEND-CHANGELOG.md).
    if (estGiWeekend(gi)) { cell.style.cursor = "default"; return cell; }
    appliquerTeinteFerie(cell, gi);
    cablerAjoutCellule(cell);
    return cell;
  }

  // Navigation semaine (flèches ‹ › du titre planning, cf. construireGrille
  // plus bas) — étaient déjà APPELÉES (fleche-semaine/lien-aller) mais
  // jamais définies, trou laissé par l'interruption précédente (comme
  // basculerSelection plus haut, cf. FRONTEND-CHANGELOG.md). §1 du spec :
  // navigue en dates réelles (etat.indexSemaine dans etat.semaines), jamais
  // en gi — la fenêtre affichée change, la vue est reconstruite depuis
  // etat.cache pour cette nouvelle fenêtre.
  function naviguerSemaine(dir) {
    var nouvel = etat.indexSemaine + dir;
    if (nouvel < 0 || nouvel >= etat.semaines.length) { toast(dir < 0 ? "Déjà la première semaine du planning." : "Déjà la dernière semaine du planning."); return; }
    etat.indexSemaine = nouvel;
    bullesSelectionnees = {};
    assurerFenetreChargee(function () { construireVueDepuisCache(); render(false); majBarreSelection(); });
  }
  // Bouton "Aujourd'hui" (retour de Lionel, 02.09.2026 : "il manque un
  // bouton aujourd'hui pour revenir à la semaine actuelle") — même règle que
  // indexSemaineDuJour_ côté serveur (WebApp.gs, apiDemarrer) : la semaine
  // contenant aujourd'hui, sinon la première à venir, sinon la dernière du
  // planning. Recalculée ici plutôt que renvoyée par le serveur : etat.semaines
  // et etat.aujourdhui sont déjà en main côté client depuis apiDemarrer, un
  // aller-retour réseau de plus n'aurait aucun sens pour ça.
  function indexSemaineAujourdhui_() {
    var iso = etat.aujourdhui;
    for (var i = 0; i < etat.semaines.length; i++) {
      var s = etat.semaines[i];
      if (iso >= s.debut && iso <= s.fin) return i;
    }
    for (var i2 = 0; i2 < etat.semaines.length; i2++) if (etat.semaines[i2].debut >= iso) return i2;
    return etat.semaines.length - 1;
  }
  // indexSemaineDeIso_ (généralisation d'indexSemaineAujourdhui_ à une date
  // ISO arbitraire, introduite pour cablerCalendrierDate) a disparu round du
  // 12.09.2026 : appliquerDateChoisieFormulaire ne navigue plus jamais vers
  // une autre semaine (cf. son commentaire — Lionel, « le planning ne doit
  // pas suivre en arrière-plan »), donc plus personne ne l'appelle.
  function allerAujourdhui() {
    var idx = indexSemaineAujourdhui_();
    if (idx < 0) return;
    if (idx === etat.indexSemaine) { toast("Déjà sur la semaine actuelle."); return; }
    etat.indexSemaine = idx;
    bullesSelectionnees = {};
    assurerFenetreChargee(function () { construireVueDepuisCache(); render(false); majBarreSelection(); });
  }
  // Round D — bouton unique "2 semaines" (remplace la paire .toggle-sem
  // "1 semaine"/"2 semaines", cf. commentaire de construireGrille) : bascule
  // simplement l'état, son rendu .actif suit deuxSemaines à chaque
  // reconstruction de .semaine-titre.
  function basculerDeuxSemaines() {
    deuxSemaines = !deuxSemaines;
    assurerFenetreChargee(function () { construireVueDepuisCache(); render(false); });
  }
  // Round D (11.09.2026) — « Ajout lointain » (poser une tâche/absence/
  // note/jalon à une date éloignée sans faire défiler le calendrier,
  // ex-round du 02.09.2026) a été RETIRÉ à la demande de Lionel : « ajout
  // lointain disparaît car on peut maintenant le faire via les nouveaux
  // formulaires » — ouvrirEdition/ouvrirEditionPlage permettent désormais
  // de choisir n'importe quelle date directement dans leur propre fiche
  // (bloc dates-plage, cf. cablerDatesPlage), ce que ce formulaire dédié
  // était seul à offrir avant cette refonte. Fonctions supprimées avec le
  // bouton (cf. FRONTEND-CHANGELOG.md) : joursOuvresDepuis,
  // construireLignesAjoutLointain, ajoutLointainTache, ouvrirAjoutLointain.
  //
  // ouvrirAllerSemaine() (choisir une semaine dans la liste plutôt que de
  // cliquer ‹ › plusieurs fois — popup centrée avec un <select>, ouverte par
  // le "Semaine N" du coin de la grille) a été supprimée au §87 (round du
  // 17.09.2026, suite×2) avec son unique déclencheur .lien-aller — la même
  // liste (etat.semaines) est désormais proposée par #menuSemaine/
  // #btnSemainePill dans #legendeBarre, en dropdown façon Sheets plutôt
  // qu'en popup centrée (cf. cablerPagePlanning).

  function construireGrille() {
    if (!racineEl) racineEl = document.getElementById("racine");
    if (!racineEl || !fenetrePrete()) return;
    var scrollerPrecedent = racineEl.querySelector(".scroller");
    var scrollLeftPrecedent = scrollerPrecedent ? scrollerPrecedent.scrollLeft : 0;
    var enteteScrollPrecedent = racineEl.querySelector(".entete-planning-scroll");
    // §83 (round du 16.09.2026, encore un autre, suite×7) : Annuler/Refaire
    // ont quitté la cellule coin de cette grille pour la nouvelle barre
    // d'outils fixe sous les onglets (cf. #btnDefaire/#btnRefaire dans
    // htmlPagePlanning, câblés une seule fois dans cablerPagePlanning comme
    // Imprimer) — plus besoin de les extraire/replacer à chaque rendu ici
    // (ancien va-et-vient .barre-undo, cf. son historique CSS plus haut).
    racineEl.innerHTML = "";
    var n = nbJoursAffiches();
    var nbSemainesAffichees = deuxSemaines ? 2 : 1;
    // La ligne "Aujourd'hui/2 semaines/‹ Semaine N ›" qui vivait ici (coinNav/
    // navSemaine, cf. leur historique avant suppression au §87, round du
    // 17.09.2026, suite×2) portait ses propres textes calculés à partir de
    // fenetreDonnees()/libelleJourGi() — donnees/num0/num1/texteSemaines/
    // deb0/fin0, plus utilisés nulle part ailleurs, disparaissent avec elle.
    // Lionel, à propos de la même navigation désormais dans #legendeBarre
    // (cf. htmlPagePlanning/cablerPagePlanning) : « on enlève la première
    // ligne du tableau qui ne sert plus » — entièrement redondante une fois
    // dupliquée dans la barre, cette cellule ne portait plus d'information
    // qu'on ne retrouve pas déjà là-haut.
    //
    // grilleEntete / grilleCorps (round du 16.09.2026, suite, encore) —
    // Lionel : « faire défiler la page après les notes ». La grille CSS
    // unique d'origine est scindée en DEUX grilles séparées, mêmes colonnes
    // (gabarit/largeurMiniTotale ci-dessous, calculées une seule fois et
    // appliquées aux deux pour rester pixel-alignées) : grilleEntete porte
    // tout ce qui doit rester FIXE à l'écran (nav de semaine, jours, M/A,
    // Jalons, Notes) et grilleCorps porte Personnel/Intervenants, qui
    // continue de défiler normalement. Cf. le commentaire CSS de
    // .entete-planning-figee pour le pourquoi (position:sticky ne peut pas
    // s'appliquer cellule par cellule ici, à cause de l'overflow-x:auto de
    // .scroller). enteteScroll.scrollLeft est recopié sur le défilement réel
    // de .scroller (seul à porter la barre de défilement visible) pour que
    // les deux grilles restent visuellement synchronisées horizontalement.
    var cadre = document.createElement("div"); cadre.className = "grille-cadre";
    var scroller = document.createElement("div"); scroller.className = "scroller";
    var grilleCorps = document.createElement("div"); grilleCorps.className = "grille" + (modeCompact ? " grille-compacte" : "");
    var enteteFigee = document.createElement("div"); enteteFigee.className = "entete-planning-figee";
    var enteteScroll = document.createElement("div"); enteteScroll.className = "entete-planning-scroll";
    var grilleEntete = document.createElement("div"); grilleEntete.className = "grille" + (modeCompact ? " grille-compacte" : "");
    // En compact, chaque jour est scindé en 2 colonnes : la largeur minimale
    // par demi-journée est donc réduite (58px au lieu de 108px), pour que la
    // semaine tienne dans la même largeur qu'avant plutôt que d'obliger à
    // scroller deux fois plus. C'est le compromis assumé du mode compact :
    // moitié moins de largeur pour le texte, moitié moins de hauteur.
    var largeurMin = modeCompact ? 58 : 108;
    var gabarit = "116px";
    for (var sTpl = 0; sTpl < nbSemainesAffichees; sTpl++) {
      gabarit += " repeat(" + (5 * colsParJour()) + ", minmax(" + largeurMin + "px, 1fr))";
      if (afficherWeekends) gabarit += " repeat(2, 46px)";
    }
    var largeurMiniTotale = (116 + nbSemainesAffichees * (5 * colsParJour() * largeurMin + (afficherWeekends ? 2 * 46 : 0))) + "px";
    grilleEntete.style.gridTemplateColumns = gabarit;
    grilleEntete.style.minWidth = largeurMiniTotale;
    grilleCorps.style.gridTemplateColumns = gabarit;
    grilleCorps.style.minWidth = largeurMiniTotale;
    // Case de zoom façon Sheets (§85, round du 17.09.2026) — CSS zoom (pas
    // transform:scale, qui ne changerait que le RENDU sans jamais toucher la
    // taille réelle occupée : largeur de scroll, hauteur de page) posé
    // directement sur les 2 grilles, JAMAIS sur enteteFigee (l'élément
    // sticky lui-même, cf. son historique CSS plus haut) — enteteFigee et
    // son "top" calculé par ajusterEnteteFixe() restent donc totalement
    // étrangers au niveau de zoom choisi, quel qu'il soit. Les 2 grilles
    // gardent le même gabarit/largeurMiniTotale ci-dessus (calculés une
    // seule fois, en px "réels") : le zoom s'applique ensuite identiquement
    // aux deux, donc enteteScroll et scroller restent pixel-alignés à
    // n'importe quel niveau (cf. la synchronisation de scrollLeft plus bas).
    grilleEntete.style.zoom = grilleCorps.style.zoom = (niveauZoomPlanning / 100);

    enteteScroll.appendChild(grilleEntete);
    enteteFigee.appendChild(enteteScroll);
    racineEl.appendChild(enteteFigee);
    scroller.appendChild(grilleCorps);
    cadre.appendChild(scroller);
    racineEl.appendChild(cadre);
    scroller.addEventListener("scroll", function () { enteteScroll.scrollLeft = scroller.scrollLeft; });

    function poserDans(cibleGrille) {
      return function (el, col, row, colSpan, rowSpan) {
        el.style.gridColumn = colSpan ? (col + " / span " + colSpan) : String(col);
        el.style.gridRow = rowSpan ? (row + " / span " + rowSpan) : String(row);
        cibleGrille.appendChild(el);
      };
    }
    function poserPleineLargeurDans(cibleGrille) {
      return function (el, ligne) {
        el.style.gridColumn = "1 / -1";
        el.style.gridRow = String(ligne);
        cibleGrille.appendChild(el);
      };
    }
    // poser()/poserPleineLargeur() ci-dessous visent grilleEntete jusqu'à la
    // ligne Notes ; ils sont ensuite RÉASSIGNÉS sur grilleCorps (cf. plus
    // bas, juste avant ligneSection) — ligneSection/ligneGroupePersonnesCompact
    // les référencent par fermeture (closure) et voient donc bien la valeur
    // en vigueur au moment de leur APPEL, pas de leur définition.
    var poser = poserDans(grilleEntete);
    var poserPleineLargeur = poserPleineLargeurDans(grilleEntete);

    // §87 (round du 17.09.2026, suite×2) — la ligne d'en-tête "Aujourd'hui/
    // 2 semaines/‹ Semaine N ›" qui vivait ici (coinNav + navSemaine, cf.
    // leur historique dans une version antérieure du fichier) disparaît :
    // Lionel, une fois cette navigation dupliquée dans #legendeBarre (cf.
    // htmlPagePlanning/cablerPagePlanning — ‹, la case "Sem. N", ›,
    // Aujourd'hui, 2 semaines, entre le zoom et le chantier) : « on enlève
    // la première ligne du tableau qui ne sert plus ». row démarre donc
    // directement sur la ligne des jours (avant : row 2, décalée d'une ligne
    // par coinNav/navSemaine).
    var row = 1;

    var aujIso = etat.aujourdhui;
    // Cellule coin de la ligne des jours : redevenue simplement vide au §83
    // (round du 16.09.2026, encore un autre, suite×7) — Annuler/Refaire, qui
    // l'occupaient depuis le round précédent, ont rejoint la nouvelle barre
    // d'outils fixe sous les onglets (cf. son historique plus haut).
    var coin = document.createElement("div"); coin.className = "th coin"; poser(coin, 1, row);
    for (var gi = 0; gi < n; gi++) {
      var th = document.createElement("div");
      var estAuj = isoDeGi(gi) === aujIso;
      // En-tête de jour : simple repère (jour + date), plus cliquable depuis
      // le retrait du décalage en masse (demande de Lionel — la sélection
      // multiple de bulles de V3 couvre désormais cet usage, cf.
      // FRONTEND-CHANGELOG.md §5).
      th.className = "th" + (gi > 0 && gi % 5 === 0 ? " sem-frontiere" : "")
        + (modeCompact && gi > 0 && gi % 5 !== 0 ? " jour-frontiere" : "")
        + (estAuj ? " today" : "");
      th.dataset.gi = gi;
      var infoJour = libelleJourGi(gi);
      var dateHTML = '<span class="th-date">' + infoJour.jour + "</span>";
      var ferJour = feriePourJour(gi);
      if (ferJour) {
        th.style.background = hexToRgba(ferJour.couleur, .55);
        th.title = ferJour.label;
        th.innerHTML = JOURS[gi % 5] + dateHTML + '<span class="th-ferie-label">' + esc(ferJour.label) + "</span>";
      } else {
        th.innerHTML = JOURS[gi % 5] + dateHTML;
      }
      poser(th, colonneGrille(gi), row, colsParJour());
      if (afficherWeekends && (gi + 1) % 5 === 0) {
        var semIdxTh = Math.floor(gi / 5);
        [0, 1].forEach(function (j) {
          var giWE = giWeekend(semIdxTh, j);
          var thWE = document.createElement("div");
          thWE.className = "th th-weekend";
          var infoWE = libelleJourGi(giWE);
          thWE.innerHTML = JOURS_WEEKEND[j] + '<span class="th-date">' + infoWE.jour + "</span>";
          poser(thWE, colonneGrille(giWE), row);
        });
      }
    }
    row++;
    // Mode compact : fine ligne d'en-tête "M | A" sous chaque jour. Sans elle,
    // rien ne dirait laquelle des deux colonnes d'un jour est le matin — le
    // reste de la grille ne porte plus l'étiquette "Matin"/"Après-midi",
    // puisque les deux demi-journées partagent désormais une seule ligne.
    if (modeCompact) {
      var coinDemi = document.createElement("div");
      coinDemi.className = "th coin th-demi";
      poser(coinDemi, 1, row);
      for (var giD = 0; giD < n; giD++) {
        DEMIS.forEach(function (demi) {
          var thD = document.createElement("div");
          thD.className = "th th-demi" + (demi === "aprem" ? " th-demi-aprem" : "")
            + (demi === "matin" && giD > 0 && giD % 5 === 0 ? " sem-frontiere" : "")
            + (demi === "matin" && giD > 0 && giD % 5 !== 0 ? " jour-frontiere" : "");
          thD.textContent = demi === "matin" ? "M" : "A";
          thD.title = demi === "matin" ? "Matin" : "Après-midi";
          poser(thD, colonneDemi(giD, demi), row);
        });
        if (afficherWeekends && (giD + 1) % 5 === 0) {
          var semIdxD = Math.floor(giD / 5);
          [0, 1].forEach(function (j) {
            var vide = document.createElement("div");
            vide.className = "th th-demi th-weekend";
            poser(vide, colonneGrille(giWeekend(semIdxD, j)), row);
          });
        }
      }
      row++;
    }

    [["jalon", JALONS, "Jalons"], ["note", NOTES, "Notes"]].forEach(function (spec) {
      var kind = spec[0], liste = spec[1], label = spec[2];
      // repliee (round du 16.09.2026, contrôle déplacé au §82 dans
      // .controles-affichage, icônes au §83) : Lionel, « avoir la
      // possibilité de masquer jalons et note ». §84 (round du 16.09.2026,
      // encore un autre, suite×8) — retour de Lionel : « les ligne
      // désactivées doivent etre totalement masqué et disparaitre du
      // planning, pas grisée ». La ligne ne réservait jusqu'ici qu'une seule
      // piste vide (nbPistes=1, sans aucune cellule de fond puisque la
      // boucle de pose plus bas tournait 0 fois) — sans cellule pour
      // couvrir ce fond, c'est le gris de `.grille { background:
      // var(--border) }` qui apparaissait tel quel sur toute la largeur,
      // lu comme "grisé" plutôt que "disparu". `return` ici évite
      // totalement de poser le libellé ET d'avancer `row` : la ligne
      // n'existe simplement plus dans cette grille, exactement comme les
      // lignes Personnel/Intervenants repliées (cf. plus bas,
      // ligneGroupePersonnes non appelée du tout quand repliée).
      var repliee = kind === "jalon" ? replierJalons : replierNotes;
      if (repliee) return;
      var visibles = liste.filter(function (it) { return giVisible(it.giDebut, n); });
      var nbPistes = Math.max(1, assignerPistes(visibles));
      // Titre de ligne ("Jalons"/"Notes") : retiré le 02.09.2026 (retour de
      // Lionel : "on peut réduire les hauteurs de ligne en enlevant... les
      // titres notes et jalons. on a déjà une légende"), puis REMIS le
      // 12.09.2026 (nouveau retour de Lionel : "ajouté les libellés jalon et
      // note dans la colonne de gauche" — sans repère textuel la colonne de
      // gauche ne dit plus quelle ligne est quoi une fois la légende hors du
      // premier écran). `title` conservé en plus pour le survol. Plus de
      // bouton de repli ici depuis le §82 (cf. .controles-affichage) : le
      // libellé redevient seul, comme avant le §80.
      var lbl = document.createElement("div");
      lbl.className = "lbl lbl-speciale";
      lbl.innerHTML = "<b>" + esc(label) + "</b>";
      lbl.title = label;
      poser(lbl, 1, row, null, nbPistes);
      for (var g = 0; g < n; g++) {
        // Jalons et notes restent des objets à la JOURNÉE (ligne 4 et 5 de la
        // feuille, jamais scindées en demi-journées) : en compact leur case
        // couvre donc les 2 colonnes du jour.
        poser(creerCelluleFond(kind, g), colonneGrille(g), row, colsParJour(), nbPistes);
        if (afficherWeekends && (g + 1) % 5 === 0) {
          var semG = Math.floor(g / 5);
          [0, 1].forEach(function (j) {
            poser(creerCelluleFond(kind, giWeekend(semG, j)), colonneGrille(giWeekend(semG, j)), row, null, nbPistes);
          });
        }
      }
      visibles.forEach(function (it) {
        var b = bulleEl(it);
        var dureeVisible = Math.min(it.duree, n - it.giDebut);
        // Bulle d'une DEMI-JOURNÉE (round du 02.09.2026, étendu aux jalons le
        // 08.09.2026 — §47 du FRONTEND-CHANGELOG : jalon et note partagent
        // maintenant demiDebut/demiFin et ce même rendu) :
        //  - en compact, chaque jour a déjà 2 colonnes -> l'entrée se pose
        //    exactement sur la bonne, largeur naturelle ;
        //  - en classique, un jour n'a qu'UNE colonne -> la bulle occupe la
        //    moitié de la case, calée à gauche (matin) ou à droite (aprem).
        //    Une classe CSS suffit : la géométrie de la grille ne change pas.
        // demiDebut/demiFin (round du 03.09.2026) : la classe CSS .bulle-demi
        // (largeur 50 % en mode classique) reste réservée aux notes d'UN SEUL
        // jour — sur plusieurs jours elle rétrécirait toute la largeur de la
        // bulle au lieu de son seul bord, cf. sa définition CSS pensée pour
        // une bulle d'un seul jour. Le rendu du bord d'une note multi-jours
        // reste donc correct côté géométrie (colonneEtSpanDemi, mode compact
        // uniquement) ; le mode classique affiche alors un simple rectangle
        // plein sans notch visuel sur le bord concerné — le texte du titre
        // continue de le signaler.
        var demiDebutIt = it.demiDebut || null, demiFinIt = it.demiFin || null;
        if (it.duree === 1 && (demiDebutIt === "matin" || demiDebutIt === "aprem")) {
          b.classList.add("bulle-demi", demiDebutIt === "matin" ? "bulle-demi-matin" : "bulle-demi-aprem");
          b.title = (b.title ? b.title + " — " : "") + (demiDebutIt === "matin" ? "Matin" : "Après-midi");
        } else if (it.duree > 1 && (demiDebutIt === "aprem" || demiFinIt === "matin")) {
          var bouts = [];
          if (demiDebutIt === "aprem") bouts.push("commence l'après-midi");
          if (demiFinIt === "matin") bouts.push("finit le matin");
          b.title = (b.title ? b.title + " — " : "") + bouts.join(", ");
        }
        // .demi-aprem (round du 03.09.2026, suite) : quelle que soit la durée,
        // colonneEtSpanDemi() pose le bord GAUCHE de la bulle sur la colonne
        // "aprem" dès que demiDebutIt === "aprem" (seul ce bord-là compte pour
        // la colonne de départ, cf. sa définition) — cette bulle a donc besoin
        // du même empiètement anti-trait que .cell.cell-aprem ci-dessus.
        if (modeCompact && demiDebutIt === "aprem") b.classList.add("demi-aprem");
        var csStatique = colonneEtSpanDemi(it.giDebut, dureeVisible, demiDebutIt, demiFinIt);
        poser(b, csStatique[0], row + it._piste, csStatique[1]);
      });
      row += nbPistes;
    });

    // ---- Bascule vers le CORPS de la grille (Personnel/Intervenants) : à
    // partir d'ici, poser()/poserPleineLargeur() visent grilleCorps — une
    // grille CSS séparée qui, elle, défile normalement sous l'en-tête figé
    // ci-dessus (cf. son commentaire plus haut) — row repart à 1, propre à
    // cette grille.
    poser = poserDans(grilleCorps);
    poserPleineLargeur = poserPleineLargeurDans(grilleCorps);
    row = 1;

    function ligneSection(cle, texte) {
      // §82 : le masquage/affichage de cette section ne se pilote plus
      // depuis une flèche posée ici (cf. .controles-affichage, regroupé dans
      // la barre légende/imprimer) — cette ligne ne garde donc plus que son
      // libellé. §85 (round du 17.09.2026) — Lionel : « on peut aussi enlever
      // le "+" des lignes personnel et intervenant » : le bouton .btn-plage-
      // ligne disparaît d'ici, remplacé par l'icône "ligne+" de la barre
      // d'outils (cf. #btnAjoutLigne dans htmlPagePlanning/cablerPagePlanning),
      // qui ouvre le même ouvrirAjoutPersonne(sousTraitant) — ex-.btn-plage-
      // ligne/.section-row-sticky gap conservés tels quels pour ne pas avoir à
      // toucher leur CSS, simplement plus jamais peuplés d'un bouton ici.
      var lg = document.createElement("div");
      lg.className = "section-row";
      lg.innerHTML =
        '<div class="section-row-sticky">' +
        '<span class="section-label">' + esc(texte) + '</span>' +
        '</div>';
      poserPleineLargeur(lg, row);
      row++;
    }

    // ---- Une seule ligne par personne : matin et après-midi occupent deux
    // colonnes voisines du même jour. -----------------------------------
    //
    // §49 (08.09.2026, suite, encore) — Lionel : « 1 tâche ne peut pas être
    // mise sur 2 case, elle s'étend de 1 jour (de 1 a 3, 5 ou 7 case) », puis
    // « on reste sur la seule vue compact qui devient la standard ». Le §48
    // avait tenté de résoudre le symptôme (bulles "découpées") en FUSIONNANT
    // au RENDU plusieurs items compact séparés (construireRunsCompacts,
    // data-membres/data-slots) — un pansement qui laissait la vraie cause
    // intacte : une tâche/absence portait un seul champ `demi` FIXE pour
    // toute sa durée, donc "matin+aprem jour1, matin jour2" restait
    // structurellement 2 items séparés, glués visuellement après coup
    // seulement quand ils se touchaient — jamais redimensionnables/
    // déplaçables à la demi-journée près (d'où le "de 1 a 3, 5 ou 7 case",
    // toujours par saut de 1 jour entier).
    //
    // Correctif de FOND (§49) : une tâche/absence porte désormais
    // demiDebut/demiFin PAR BORD, exactement comme un jalon ou une note (cf.
    // itemPlageTache et la fusion par demi-slot dans construireVueDepuisCache)
    // — un item EST déjà, nativement, sa propre plage continue. Le rendu
    // redevient donc aussi simple que celui des jalons/notes : 1 item = 1
    // bulle DOM, positionnée par colonneEtSpanDemi (déjà partagée avec eux) ;
    // plus besoin de fusionner quoi que ce soit après coup — construireRunsCompacts,
    // data-membres et data-slots disparaissent avec lui. Semaine/week-end :
    // case isolée à part (comme avant), toujours 1 seul demi-slot ("matin").
    function ligneGroupePersonnesCompact(groupe) {
      groupe.forEach(function (p) {
        var itemsLigne = TACHES.filter(function (it) { return it.personneId === p.id && giVisible(it.giDebut, n); });
        var nbPistes = Math.max(1, assignerPistesCompact(itemsLigne));
        var lbl = document.createElement("div");
        lbl.className = "lbl lbl-compacte";
        lbl.innerHTML = "<b>" + esc(p.nom) + "</b>";
        poser(lbl, 1, row, null, nbPistes);
        for (var gi4 = 0; gi4 < n; gi4++) {
          DEMIS.forEach(function (demi) {
            var c = creerCell(gi4, { personne: p.id, demi: demi });
            if (demi === "aprem") c.classList.add("cell-aprem");
            // Trait de séparation entre deux JOURS (retour de Lionel) : porté
            // par la colonne du matin, sauf en début de semaine où le trait de
            // semaine, plus fort, prend déjà le relais (posé par creerCell).
            else if (gi4 > 0 && gi4 % 5 !== 0) c.classList.add("jour-frontiere");
            poser(c, colonneDemi(gi4, demi), row, null, nbPistes);
          });
          if (afficherWeekends && (gi4 + 1) % 5 === 0) {
            var semGi4 = Math.floor(gi4 / 5);
            [0, 1].forEach(function (j) {
              // Une seule cellule serveur pour le week-end, portée par
              // "matin" — cf. construireVueDepuisCache, items week-end posés
              // avec demiDebut=demiFin="matin".
              poser(creerCell(giWeekend(semGi4, j), { personne: p.id, demi: "matin" }), colonneGrille(giWeekend(semGi4, j)), row, null, nbPistes);
            });
          }
        }
        itemsLigne.forEach(function (it) {
          var b = bulleEl(it);
          if (estGiWeekend(it.giDebut)) { poser(b, colonneGrille(it.giDebut), row + it._piste, 1); return; }
          var dureeVisible = Math.max(1, Math.min(it.duree, n - it.giDebut));
          var demiDebutIt = it.demiDebut || null, demiFinIt = it.demiFin || null;
          // .demi-aprem (cf. son commentaire CSS, partagé avec le rendu
          // jalon/note) : même empiètement anti-trait quand la bulle démarre
          // sur la colonne "aprem".
          if (demiDebutIt === "aprem") b.classList.add("demi-aprem");
          var cs = colonneEtSpanDemi(it.giDebut, dureeVisible, demiDebutIt, demiFinIt);
          poser(b, cs[0], row + it._piste, cs[1]);
        });
        row += nbPistes;
      });
    }
    function ligneGroupePersonnes(groupe) { ligneGroupePersonnesCompact(groupe); }

    var groupePersonnel = PERSONNES.filter(function (p) { return !p.sousTraitant; });
    var groupeIntervenants = PERSONNES.filter(function (p) { return p.sousTraitant; });

    // §86 (round du 17.09.2026, suite) — Lionel : « les lignes de séparation
    // "personnel" et "intervenant" doivent aussi être masquées quand le
    // groupe correspondant est masqué ». Jusqu'ici seule ligneGroupePersonnes
    // (les personnes elles-mêmes) était sautée quand repliée — ligneSection
    // (le libellé "PERSONNEL"/"INTERVENANTS", avec son .section-row et le
    // trait `border-bottom` qui le souligne) restait posée dans tous les cas,
    // comme un en-tête. Même principe que le §84 (Jalons/Notes) : la ligne
    // repliée ne doit plus exister DU TOUT dans la grille, libellé compris —
    // ligneSection() rejoint donc la même condition que le groupe qu'elle
    // annonce, au lieu d'être appelée inconditionnellement juste avant.
    if (!replierSectionPersonnel) {
      ligneSection("personnel", "Personnel");
      ligneGroupePersonnes(groupePersonnel);
    }
    if (!replierSectionIntervenants) {
      ligneSection("intervenants", "Intervenants");
      ligneGroupePersonnes(groupeIntervenants);
    }

    if (scrollerPrecedent) scroller.scrollLeft = scrollLeftPrecedent;
    // enteteScroll doit refléter le même défilement horizontal dès ce même
    // rendu (sans attendre l'événement "scroll" ci-dessus, asynchrone dans
    // certains navigateurs) — sans quoi l'en-tête figé afficherait un bref
    // instant les mauvaises colonnes après un changement de semaine/mode qui
    // conserve le défilement horizontal.
    enteteScroll.scrollLeft = enteteScrollPrecedent ? enteteScrollPrecedent.scrollLeft : scroller.scrollLeft;
    majBoutonsUndo();
    majBarreSelection();
    majControlesAffichage();
    majZoomAffichage();
    majSemaineAffichage();
    ajusterEnteteFixe();
  }

  // render(sync=true) : reconstruit la grille, puis lance la synchronisation
  // serveur (diff local <-> syncBaseline) sauf appel explicite render(false)
  // (utilisé après une reconstruction fraîche depuis le serveur, où il n'y a
  // par définition rien à synchroniser).
  function render(sync) {
    construireGrille();
    if (sync !== false) synchroniser();
  }

  function bulleEl(it) {
    var el = document.createElement("div");
    el.className = "bulle bulle-" + it.type + (it.important ? " important" : "") + " bulle-plage"
      + (bullesSelectionnees[it.id] ? " selectionnee" : "");
    el.dataset.id = it.id;
    var bg = it.type === "tache" ? (it.chantier && CHANTIERS[it.chantier] ? CHANTIERS[it.chantier].couleur : "#e5e5e5")
      : it.type === "absence" ? "var(--absence-bg)"
      : it.type === "jalon" ? "var(--jalon-bg)" : "var(--note-bg)";
    el.style.background = bg;
    // Étiquette (nom de chantier / "Absence"/"Jalon"/"Note") : n'est plus
    // affichée dans la bulle elle-même depuis le round du 02.09.2026 (retour
    // de Lionel : "on peut réduire les hauteurs de ligne en enlevant les
    // noms de chantier... on a déjà une légende") — la couleur de fond de la
    // bulle + la légende (construireLegende, qui couvre déjà chantiers ET
    // absence/jalon/note) suffisent à l'identifier sans ce 2e texte qui
    // forçait une ligne de plus par bulle. Gardée en mémoire (`tag`) pour
    // l'infobulle au survol (title ci-dessous), qui garde l'info accessible.
    var tag = it.type === "tache" ? (it.chantier && CHANTIERS[it.chantier] ? CHANTIERS[it.chantier].nom : "")
      : it.type === "absence" ? "Absence" : it.type === "jalon" ? "Jalon" : "Note";
    var html = '<span class="poignee poignee-g" data-poignee="gauche"></span><span class="poignee poignee-d" data-poignee="droite"></span>' +
      '<span class="b-txt">' + esc(it.texte) + '</span>';
    if (it.statut && STATUTS[it.statut]) html += '<span class="b-statut" style="background:' + STATUTS[it.statut].couleur + '"><span class="dot"></span>' + esc(STATUTS[it.statut].nom) + '</span>';
    if (it.serieId) html += '<span class="b-serie" title="Fait partie d\'une série">↻ série</span>';
    el.innerHTML = html;
    el.title = (tag ? tag + " — " : "") + it.texte;
    el.addEventListener("pointerdown", onPointerDownBulle);
    cablerPoigneeRedim(el.querySelector('[data-poignee="gauche"]'), el, it, "gauche");
    cablerPoigneeRedim(el.querySelector('[data-poignee="droite"]'), el, it, "droite");
    return el;
  }

  /* ============================================================
     DRAG / RESIZE / SÉLECTION — repris quasiment à l'identique du
     prototype (mécanique générique indépendante de la source des
     données). Les fonctions continuent de muter TACHES/JALONS/NOTES en
     mémoire ; render() se charge ensuite de synchroniser au serveur
     (cf. bloc "MOTEUR DE SYNCHRONISATION" plus haut).
     ============================================================ */
  // demiDebut/demiFin (round du 08.09.2026, suite, encore — §49) : plus de
  // comparaison sur un seul `it.demi` fixe — un redimensionnement peut
  // désormais faire passer une tâche d'une demi-journée à l'autre (comme un
  // jalon/note), donc survoler la cellule "aprem" alors que `it` était posé
  // le matin doit rester VALIDE (seuls kind+personne comptent ici).
  function kindEtPersonneOk(it, cel) {
    if (it.personneId !== undefined) return cel.dataset.kind === "personne" && cel.dataset.personne === it.personneId;
    return cel.dataset.kind === it.type;
  }

  // trouverScroller() — round du 16.09.2026 (suite, encore). Depuis la
  // scission grilleEntete/grilleCorps (cf. commentaire CSS de
  // .entete-planning-figee), une bulle/case de la ligne Jalons ou Notes vit
  // dans .entete-planning-scroll, PAS dans .scroller — un simple
  // el.closest(".scroller") n'y trouve donc plus rien pour ces 2 lignes
  // (panoramique tactile et défilement auto en bord d'écran pendant un
  // glissé restaient sans effet, sans planter grâce aux `if (scroller)` déjà
  // présents partout, cf. leurs sites d'appel). .entete-planning-scroll
  // n'ayant pas sa propre barre de défilement (son scrollLeft n'est qu'un
  // MIROIR, cf. l'écouteur "scroll" de .scroller dans construireGrille), lui
  // appliquer un défilement directement désynchroniserait l'en-tête du
  // corps ; on redirige donc systématiquement vers le VRAI .scroller (le
  // mirroring se charge ensuite de répercuter le mouvement sur l'en-tête).
  function trouverScroller(el) {
    var s = el.closest(".scroller, .entete-planning-scroll");
    if (s && s.classList.contains("entete-planning-scroll")) return document.querySelector(".scroller") || s;
    return s;
  }

  var BORD_ZONE = 46, BORD_VITESSE_MAX = 16;

        if (it.personneId === undefined) {
          var gis = gisParCle[it.type];
          if (!gis) return;
          for (var g in gis) { var gi = +g; if (gi >= it.giDebut && gi < it.giDebut + it.duree) { bullesSelectionnees[it.id] = true; break; } }
          return;
        }
        // Tâche/absence (§49) : le(s) demi(s) occupé(s) peu(ven)t varier
        // selon le jour (demiDebut sur le 1er jour, demiFin sur le
        // dernier, journée entière au milieu — cf. demisOccupeesTache) ;
        // plus une seule clé "personne|id|demi" valable pour tout l'item.
        for (var gT = it.giDebut; gT < it.giDebut + it.duree; gT++) {
          var demisT = demisOccupeesTache(it, gT);
          if (!demisT) continue;
          var trouveT = demisT.some(function (d) {
            var gisT = gisParCle["personne|" + it.personneId + "|" + d];
            return gisT && gisT[gT];
          });
          if (trouveT) { bullesSelectionnees[it.id] = true; break; }
        }
      });
    }
    ramasser(TACHES); ramasser(JALONS); ramasser(NOTES);
    render(false);
    majBarreSelection();
    var n = Object.keys(bullesSelectionnees).length;
    toast(n ? ("Sélectionné (" + n + ").") : "Rien à sélectionner dans cette zone.");
  }

  // Round du 12.09.2026 — Lionel : « En mode sélection, sortir du mode
  // sélection si on clique à côté d'une bulle. » Un pointerdown sur une CASE
  // (jamais sur une .bulle, cf. onPointerDownBulle qui intercepte celles-ci
  // séparément) alors que des bulles sont sélectionnées ne servait jusqu'ici
  // qu'à armer un panoramique tactile (demarrerDefilementSimple) — un simple
  // clic/tap SANS glissé n'y déclenchait donc rigoureusement rien. Il quitte
  // désormais le mode sélection ; un vrai glissé (panoramique) reste inchangé.
  function demarrerDefilementOuSortieSelection(e, cell) {
    var pointerId = e.pointerId;
    var sx = e.clientX, sy = e.clientY, dernierX = sx, dernierY = sy;
    var scroller = trouverScroller(cell);
    var bouge = false;
    function onMove(e2) {
      if (e2.pointerId !== pointerId) return;
      if (Math.abs(e2.clientX - sx) + Math.abs(e2.clientY - sy) > 4) bouge = true;
      if (scroller) scroller.scrollLeft -= (e2.clientX - dernierX); window.scrollBy(0, -(e2.clientY - dernierY));
      dernierX = e2.clientX; dernierY = e2.clientY;
    }
    function onUp(e2) { if (e2.pointerId !== pointerId) return; detacher(); if (!bouge) { quitterModeSelection(); render(false); } }
    function onCancel(e2) { if (e2.pointerId !== pointerId) return; detacher(); }
    function detacher() {
      document.removeEventListener("pointermove", onMove);
      document.removeEventListener("pointerup", onUp);
      document.removeEventListener("pointercancel", onCancel);
      try { cell.releasePointerCapture(pointerId); } catch (ex) {}
    }
    try { cell.setPointerCapture(pointerId); } catch (ex) {}
    // document (pas cell) — cf. §79.
    document.addEventListener("pointermove", onMove);
    document.addEventListener("pointerup", onUp);
    document.addEventListener("pointercancel", onCancel);
  }
  function demarrerDefilementSimple(e, cell) {
    var pointerId = e.pointerId;
    var dernierX = e.clientX, dernierY = e.clientY;
    var scroller = trouverScroller(cell);
    function onMove(e2) { if (e2.pointerId !== pointerId) return; if (scroller) scroller.scrollLeft -= (e2.clientX - dernierX); window.scrollBy(0, -(e2.clientY - dernierY)); dernierX = e2.clientX; dernierY = e2.clientY; }
    function onEnd(e2) { if (e2.pointerId !== pointerId) return; detacher(); }
    function detacher() {
      document.removeEventListener("pointermove", onMove);
      document.removeEventListener("pointerup", onEnd);
      document.removeEventListener("pointercancel", onEnd);
      try { cell.releasePointerCapture(pointerId); } catch (ex) {}
    }
    try { cell.setPointerCapture(pointerId); } catch (ex) {}
    // document (pas cell) — cf. §79.
    document.addEventListener("pointermove", onMove);
    document.addEventListener("pointerup", onEnd);
    document.addEventListener("pointercancel", onEnd);
  }

  /* ============ UNDO/REDO — session courante uniquement (cf. §8 du spec) ============
     Repris du prototype : sauvegarderUndo() est appelée en tout premier dans
     chaque fonction de mutation locale. render(), appelé ensuite, synchronise
     automatiquement l'état (annulé ou rétabli) vers le serveur — annuler
     revient donc à réécrire l'état précédent, pas à un simple undo visuel. */
  function clonerListe(liste) { return liste.map(function (x) { return Object.assign({}, x); }); }
  function snapshotEtat() { return { TACHES: clonerListe(TACHES), JALONS: clonerListe(JALONS), NOTES: clonerListe(NOTES) }; }
  function restaurerEtat(snap) { TACHES = snap.TACHES; JALONS = snap.JALONS; NOTES = snap.NOTES; }
  function sauvegarderUndo() {
    pileUndo.push(snapshotEtat());
    if (pileUndo.length > LIMITE_UNDO) pileUndo.shift();
    pileRedo = [];
  }
  function defaire() {
    if (!pileUndo.length) { toast("Rien à annuler (cette session seulement)."); return; }
    pileRedo.push(snapshotEtat());
    restaurerEtat(pileUndo.pop());
    bullesSelectionnees = {};
    render(); majBarreSelection();
    toast("Annulé.");
  }
  function refaire() {
    if (!pileRedo.length) { toast("Rien à refaire."); return; }
    pileUndo.push(snapshotEtat());
    restaurerEtat(pileRedo.pop());
    bullesSelectionnees = {};
    render(); majBarreSelection();
    toast("Rétabli.");
  }
  function majBoutonsUndo() {
    var d = document.getElementById("btnDefaire"), r = document.getElementById("btnRefaire");
    if (!d) return;
    d.disabled = !pileUndo.length;
    r.disabled = !pileRedo.length;
  }

  // §82, icônes au §83 (round du 16.09.2026, encore un autre, suite×7) —
  // synchronise l'apparence (teintée/active ou atténuée/désactivée) des 4
  // icônes .toolbar-toggle (cf. htmlPagePlanning) sur les 4 variables de
  // repli, à chaque rendu — même idée que majBoutonsUndo() ci-dessus. Ces
  // boutons sont câblés une seule fois (cablerPagePlanning, le conteneur
  // est statique), donc rien ici ne recrée ou ne recâble quoi que ce soit,
  // juste des classes posées/retirées.
  function majControlesAffichage() {
    var cont = document.getElementById("controlesAffichage");
    if (!cont) return;
    var etats = {
      jalon: replierJalons, note: replierNotes,
      personnel: replierSectionPersonnel, intervenants: replierSectionIntervenants
    };
    Object.keys(etats).forEach(function (cle) {
      var btn = cont.querySelector('[data-affichage-cible="' + cle + '"]');
      if (btn) {
        btn.classList.toggle("actif", !etats[cle]);
        btn.classList.toggle("desactive", etats[cle]);
      }
    });
  }

  // §85 (round du 17.09.2026) — synchronise le texte de la case de zoom
  // ("100% ▾") sur niveauZoomPlanning, à chaque rendu — même idée que
  // majControlesAffichage() juste au-dessus (bouton statique, câblé une
  // seule fois dans cablerPagePlanning ; le niveau réel est déjà appliqué
  // par construireGrille sur grilleEntete/grilleCorps, ceci ne touche que
  // l'étiquette affichée).
  function majZoomAffichage() {
    var btn = document.getElementById("btnZoom");
    if (btn) btn.textContent = niveauZoomPlanning + "% ▾";
  }

  // §87 (round du 17.09.2026, suite×2) — synchronise la case "Sem. N" et
  // l'icône "2 semaines" de la barre sur etat.indexSemaine/deuxSemaines, à
  // chaque rendu — même idée que majZoomAffichage() juste au-dessus (boutons
  // statiques, câblés une seule fois dans cablerPagePlanning). Remplace
  // l'ancien affichage "Semaine N" de coinNav/navSemaine, reconstruit à
  // chaque rendu DANS construireGrille (retiré ce round) ; la case étant
  // désormais hors de la grille, un aller-retour séparé est nécessaire.
  function majSemaineAffichage() {
    var pill = document.getElementById("btnSemainePill");
    if (pill && etat.semaines[etat.indexSemaine]) pill.textContent = "Sem. " + etat.semaines[etat.indexSemaine].num + " ▾";
    var btn2s = document.getElementById("btnDeuxSemaines");
    if (btn2s) btn2s.classList.toggle("actif", deuxSemaines);
  }

  /* ============================================================
     SÉLECTION MULTIPLE / BARRE D'ACTION — repris du prototype (§3.3 de
     v3-inventory.md) : ces fonctions étaient déjà APPELÉES un peu partout
     dans le fichier (resoudreClicBulle, drag Déplacer/Copier tactile,
     construireGrille…) mais jamais définies — trou laissé par
     l'interruption précédente, cf. FRONTEND-CHANGELOG.md. `barreActionEl`
     etc. sont assignés une fois par cablerBarreAction() (appelée depuis
     construireCoquille(), après la construction du DOM de la page
     Planning). Adaptation serveur : supprimer une bulle qui porte un
     serieId passe par apiSupprimerSerie (portée "unique" — seule cette
     occurrence ; pour une portée plus large, éditer l'item seul, qui
     propose le choix à 3 portées comme d'habitude) ; les autres bulles
     sont retirées localement et laissées au moteur de diff générique
     (render() -> synchroniser()), comme le reste du fichier. ============ */
  var barreActionEl, baAnnulerEl, baSupprimerEl, baCopierEl, baDeplacerEl;
  var onAnnulerActuel = null, onCopierActuel = null, onDeplacerActuel = null;
  function cablerBarreAction() {
    barreActionEl = document.getElementById("barreAction");
    baAnnulerEl = document.getElementById("baAnnuler");
    baSupprimerEl = document.getElementById("baSupprimer");
    baCopierEl = document.getElementById("baCopier");
    baDeplacerEl = document.getElementById("baDeplacer");
    if (!barreActionEl) return;
    baAnnulerEl.addEventListener("click", function () { if (onAnnulerActuel) onAnnulerActuel(); });
    baSupprimerEl.addEventListener("click", supprimerSelection);
    baCopierEl.addEventListener("click", function () { if (onCopierActuel) onCopierActuel(); });
    baDeplacerEl.addEventListener("click", function () { if (onDeplacerActuel) onDeplacerActuel(); });
  }
  function basculerSelection(id) {
    var activer = !bullesSelectionnees[id];
    if (activer) bullesSelectionnees[id] = true; else delete bullesSelectionnees[id];
    var dom = document.querySelector('.bulle[data-id="' + id + '"]');
    if (dom) dom.classList.toggle("selectionnee", activer);
    majBarreSelection();
  }
  // Remet la barre d'action dans son état "au repos" : Supprimer (rouge)
  // seul visible, caché s'il n'y a rien de sélectionné. Sert aussi à
  // revenir à cet état après un choix Déplacer/Copier résolu.
  function majBarreSelection() {
    if (!barreActionEl) return;
    var n = Object.keys(bullesSelectionnees).length;
    choixDeplacerCopierEnCours = false;
    onAnnulerActuel = function () { quitterModeSelection(); render(false); };
    baSupprimerEl.hidden = false;
    baCopierEl.hidden = true;
    baDeplacerEl.hidden = true;
    barreActionEl.hidden = !(n > 0);
  }
  // Affiche, à la même place, "Copier" + "Déplacer" (bleus) à la place de
  // "Supprimer" — utilisé pour le choix Déplacer/Copier/Annuler après un
  // glisser tactile (bulle seule ou groupe), qu'on soit ou non en mode
  // "Sélection".
  function afficherChoixDeplacerCopier(onAnnuler, onCopier, onDeplacer) {
    if (!barreActionEl) return;
    choixDeplacerCopierEnCours = true;
    onAnnulerActuel = onAnnuler; onCopierActuel = onCopier; onDeplacerActuel = onDeplacer;
    baSupprimerEl.hidden = true;
    baCopierEl.hidden = false;
    baDeplacerEl.hidden = false;
    barreActionEl.hidden = false;
  }
  // Sortie automatique de la sélection une fois l'action terminée
  // (suppression, déplacement ou copie du groupe) : il suffit ensuite de
  // recliquer une bulle (ou double-tap/clic droit) pour une nouvelle
  // sélection.
  // Nettoie aussi la classe .selectionnee posée sur chaque bulle DOM (round
  // du 12.09.2026) : les appelants historiques (onAnnulerActuel, defaire/
  // refaire) enchaînaient déjà avec un render() qui reconstruit toute la
  // grille et fait donc disparaître ces classes de fait, mais le nouvel
  // appelant (fermerAuClicExterieur, cf. plus bas — Lionel : « lors de
  // l'enregistrement/annulation/suppression d'un formulaire le mode
  // sélection reste actif, sortir du mode ») ne re-render pas toujours
  // (Annuler seul, notamment) : sans ce nettoyage direct, la bulle resterait
  // visuellement teintée "sélectionnée" bien que bullesSelectionnees soit
  // déjà vide.
  function quitterModeSelection() {
    Object.keys(bullesSelectionnees).forEach(function (id) {
      var dom = document.querySelector('.bulle[data-id="' + id + '"]');
      if (dom) dom.classList.remove("selectionnee");
    });
    bullesSelectionnees = {};
    majBarreSelection();
  }
  // Suppression groupée depuis la sélection : toujours confirmée avant
  // d'agir. Les bulles "de série" sont supprimées côté serveur une à une
  // (apiSupprimerSerie, portée "unique") ; les autres sont retirées
  // localement, le moteur de diff générique (render()) s'occupe du reste.
  function supprimerSelection() {
    var ids = Object.keys(bullesSelectionnees);
    if (!ids.length) return;
    var texte = "Supprimer " + ids.length + " bulle" + (ids.length > 1 ? "s" : "") + " sélectionnée" + (ids.length > 1 ? "s" : "") + " ?";
    demanderConfirmation(texte, function () {
      var chaine = Promise.resolve();
      sauvegarderUndo();
      ids.forEach(function (id) {
        // itemParId, pas de lookup DOM : résolution par id pure, plus
        // simple et plus sûre qu'un document.querySelector.
        var plage = itemParId(id);
        if (!plage) return;
        if (plage.item.serieId) {
          var sid = plage.item.serieId, refIso = plage.item.dateDebutIso;
          chaine = chaine.then(function () {
            return invoquerFonctionServeur("gerer-serie", { action: "supprimer", portee: "unique", serieId: sid, dateRefIso: refIso });
          }).then(function () { apresEcritureSerie(); });
        } else {
          var i = plage.liste.indexOf(plage.item);
          if (i >= 0) plage.liste.splice(i, 1);
        }
      });
      quitterModeSelection();
      chaine.then(function () {
        render();
        toast("Supprimé (" + ids.length + ").");
      }).catch(function (err) {
        toast("Échec de la suppression : " + (err && err.message ? err.message : err));
        render(false);
      });
    });
  }

  // ---- Raccourcis clavier (ordinateur) — Échap sort de la sélection ET
  // ferme un popup ouvert (ajout/édition) sans enregistrer ; Suppr/Retour
  // arrière supprime la sélection (confirmation) ; Entrée ouvre l'édition
  // quand une seule bulle est cochée (comme un double clic), ou valide un
  // popup ouvert ; Ctrl+Z/Ctrl+Y annulent/refont ; Ctrl+X/C/V coupent/
  // copient/collent la sélection. Tout, sauf Échap et Entrée-valide-popup,
  // est ignoré quand on tape dans un champ de texte (couper/copier/coller/
  // annuler natif du navigateur DANS ce champ ne doit pas être court-circuité).
  document.addEventListener("keydown", function (e) {
    var cible = e.target, tag = cible && cible.tagName;
    var dansChamp = tag === "INPUT" || tag === "TEXTAREA" || (cible && cible.isContentEditable);

    if (e.key === "Escape") {
      if (popFermerActuel) { popFermerActuel(); e.preventDefault(); return; }
      if (Object.keys(bullesSelectionnees).length > 0) { quitterModeSelection(); render(false); e.preventDefault(); }
      return;
    }
    if (e.key === "Enter" && popValiderActuel) { popValiderActuel(); e.preventDefault(); return; }
    if (dansChamp) return;

    if (e.key === "Delete" || e.key === "Backspace") {
      if (Object.keys(bullesSelectionnees).length === 0) return;
      e.preventDefault();
      supprimerSelection();
      return;
    }
    if (e.key === "Enter") {
      var idsSel = Object.keys(bullesSelectionnees);
      if (idsSel.length !== 1) return;
      var plage = itemParId(idsSel[0]);
      if (!plage) return;
      e.preventDefault();
      ouvrirBulle(plage.item, plage, Math.round(window.innerWidth / 2 - 110), Math.round(window.innerHeight / 2 - 90));
      return;
    }

    var ctrl = e.ctrlKey || e.metaKey;
    if (!ctrl) return;
    var touche = e.key.toLowerCase();
    if (touche === "z") { e.preventDefault(); if (e.shiftKey) refaire(); else defaire(); return; }
    if (touche === "y") { e.preventDefault(); refaire(); return; }
    if (touche === "c") { e.preventDefault(); copierSelection(); return; }
    if (touche === "x") { e.preventDefault(); couperSelection(); return; }
    if (touche === "v") { e.preventDefault(); collerPressePapier(); return; }
  });

  function copierSelection() {
    var ids = Object.keys(bullesSelectionnees);
    if (!ids.length) { toast("Rien à copier."); return; }
    pressePapier = ids.map(function (id) {
      var plage = itemParId(id);
      return plage ? Object.assign({}, plage.item) : null;
    }).filter(Boolean);
    toast("Copié (" + pressePapier.length + ").");
  }
  function couperSelection() {
    var ids = Object.keys(bullesSelectionnees);
    if (!ids.length) { toast("Rien à couper."); return; }
    copierSelection();
    sauvegarderUndo();
    ids.forEach(function (id) {
      var plage = itemParId(id);
      if (!plage) return;
      var i = plage.liste.indexOf(plage.item);
      if (i >= 0) plage.liste.splice(i, 1);
    });
    quitterModeSelection();
    render();
    toast("Coupé (" + ids.length + ").");
  }
  function collerPressePapier() {
    if (!pressePapier.length) { toast("Presse-papier vide."); return; }
    sauvegarderUndo();
    var nouveauxIds = [];
    pressePapier.forEach(function (it) {
      var nouveau;
      if (it.personneId !== undefined) {
        nouveau = itemPlageTache(it.type, it.texte, it.personneId, it.giDebut, it.duree, { chantier: it.chantier, important: it.important, statut: it.statut, demiDebut: it.demiDebut, demiFin: it.demiFin });
        TACHES.push(nouveau);
      } else if (it.type === "jalon" || it.type === "note") {
        nouveau = itemPlage(it.type, it.texte, it.giDebut, it.duree, { important: it.important, demiDebut: it.demiDebut, demiFin: it.demiFin });
        nouveau.dateDebutIso = isoDeGi(it.giDebut);
        (it.type === "jalon" ? JALONS : NOTES).push(nouveau);
      } else return;
      nouveauxIds.push(nouveau.id);
    });
    bullesSelectionnees = {};
    nouveauxIds.forEach(function (id) { bullesSelectionnees[id] = true; });
    render();
    majBarreSelection();
    toast("Collé (" + nouveauxIds.length + ").");
  }

  /* ============ POPUPS GÉNÉRIQUES ============ */
  function demanderConfirmation(texte, confirme, avant) {
    var overlay = document.createElement("div");
    overlay.className = "voile-confirm";
    var pop = document.createElement("div");
    pop.className = "pop confirm-pop";
    pop.innerHTML = '<div class="cp-titre">Confirmer</div>' +
      '<p class="confirm-texte">' + esc(texte) + '</p>' +
      '<div class="confirm-boutons">' +
      '<button type="button" class="c-annuler">Annuler</button>' +
      '<button type="button" class="c-ok danger">Confirmer</button>' +
      '</div>';
    document.body.appendChild(overlay);
    document.body.appendChild(pop);
    function nettoyer() {
      overlay.remove(); pop.remove();
      if (popFermerActuel === nettoyer) popFermerActuel = null;
      if (popValiderActuel === validerConfirm) popValiderActuel = null;
      if (avant) avant();
    }
    function validerConfirm() { nettoyer(); confirme(); }
    overlay.addEventListener("pointerdown", nettoyer);
    pop.querySelector(".c-annuler").addEventListener("click", nettoyer);
    pop.querySelector(".c-ok").addEventListener("click", validerConfirm);
    popFermerActuel = nettoyer;
    popValiderActuel = validerConfirm;
  }
  function positionnerPop(pop, x, y) {
    pop.style.left = "-999px"; pop.style.top = "-999px";
    document.body.appendChild(pop);
    var pr = pop.getBoundingClientRect();
    pop.style.left = Math.max(6, Math.min(x, window.innerWidth - pr.width - 10)) + "px";
    pop.style.top = Math.max(6, Math.min(y, window.innerHeight - pr.height - 10)) + "px";
    // Round du 14.09.2026 — Lionel : « les popup sont trop en bas et si je
    // sélectionne les séries, je ne vois pas les séries qui sont hors
    // écran. » Le clamp ci-dessus n'a lieu qu'UNE FOIS, à l'ouverture — mais
    // plusieurs popups grandissent ENSUITE selon ce qu'on y coche (ex.
    // « Série (se répète) » révèle .serie-options, cf. cablerSerieChamps ;
    // « options avancées » révèle son bloc, cf. optionsAvanceesHTML) sans
    // jamais rappeler positionnerPop(). Un popup ouvert près du bas de
    // l'écran (fréquent : on clique une case du planning, pas forcément
    // tout en haut de la fenêtre) grandit alors PAR LE BAS, hors écran —
    // `max-height`/`overflow-y:auto` (cf. règle .pop) plafonnent la hauteur
    // de la boîte mais pas SA POSITION : une boîte trop basse peut dépasser
    // l'écran même hauteur plafonnée, sans aucun moyen de faire défiler la
    // PAGE jusqu'à elle (position:fixed). Un ResizeObserver reclampe donc le
    // popup (même formule que ci-dessus, mais sur sa position ACTUELLE
    // plutôt que x/y d'origine) à chaque changement réel de sa taille —
    // couvre tous les cas présents ET futurs, sans avoir à penser à
    // rappeler un reclamp depuis chaque bascule .hidden au cas par cas
    // (c'est justement l'oubli d'un de ces cas qui a produit ce bug).
    // Ignoré sur mobile/tablette (.form-pop y est repositionné en CSS avec
    // !important — cf. les 2 @media plus haut — donc ces style.top/left
    // posés en JS y sont déjà sans effet visuel, inoffensif).
    // Auto-nettoyage paresseux plutôt qu'un disconnect() explicite à la
    // fermeture (trop de chemins de fermeture différents dans ce fichier
    // pour être sûr de tous les retrouver sans en oublier un — même défaut
    // que le bug corrigé ici) : l'observer se déconnecte de lui-même au 1er
    // redimensionnement constaté après la disparition du popup du DOM.
    if (window.ResizeObserver) {
      var ro = new ResizeObserver(function () {
        if (!pop.isConnected) { ro.disconnect(); return; }
        var r = pop.getBoundingClientRect();
        pop.style.top = Math.max(6, Math.min(r.top, window.innerHeight - r.height - 10)) + "px";
        pop.style.left = Math.max(6, Math.min(r.left, window.innerWidth - r.width - 10)) + "px";
      });
      ro.observe(pop);
    }
  }
  function fermerAuClicExterieur(pop, celluleSurbrillance, valider) {
    if (celluleSurbrillance) celluleSurbrillance.classList.add("selection-add");
    function surClic(ev) { if (!pop.contains(ev.target)) fermer(); }
    function fermer() {
      pop.remove();
      document.removeEventListener("pointerdown", surClic, true);
      if (celluleSurbrillance) celluleSurbrillance.classList.remove("selection-add");
      if (popFermerActuel === fermer) popFermerActuel = null;
      if (valider && popValiderActuel === valider) popValiderActuel = null;

      // suppression d'un formulaire le mode sélection reste actif, sortir du
      // mode. » fermer() est le point de sortie COMMUN à Enregistrer/

      // f-annuler/f-suppr dans ouvrirEdition/ouvrirEditionPlage et les
      // formulaires historiques) et au clic extérieur — un seul endroit
      // suffit donc à couvrir les 3 cas demandés, sans rien dupliquer par
      // formulaire.
      if (Object.keys(bullesSelectionnees).length) quitterModeSelection();

    if (valider) popValiderActuel = valider;

  var JOURS_ABBR = ["Dim", "Lun", "Mar", "Mer", "Jeu", "Ven", "Sam"];

  // state : { giDebut, giFin, demiDebut, demiFin, ... } muté en place ;

  // isoDeGi/nbJoursAffiches pour les bornes de la fenêtre chargée, seul
  // espace où `gi` a un sens (pas de conversion date calendaire libre).
  function cablerDatesPlage(pop, state, rafraichir) {
    var conteneur = pop.querySelector(".dates-plage");
    conteneur.querySelectorAll(".f-fleche").forEach(function (btn) {
      btn.addEventListener("click", function () {
        var ligne = btn.closest(".date-ligne");

        // Round du 12.09.2026 — retour de Lionel sur le round précédent :
        // « les curseurs sont liés mais pas correctement [...] augmenter la
        // date de fin ne doit pas augmenter la date de début [...] diminuer
        // la date de début ne doit pas diminuer la date de fin ». L'ancien
        // code liait les 2 bornes dans TOUS les sens dès qu'elles étaient
        // égales (donc aussi "Fin suivant"/"Début précédent", à tort) parce
        // qu'il recalculait le gi À LA MAIN au lieu de réutiliser
        // appliquerDateChoisieFormulaire, dont le calcul giAutre >= /<=
        // giChoisi ne recolle l'AUTRE borne que quand la garder créerait un

        // silencieusement l'autre borne dès qu'elle ne rentrait plus dans la

        // commentaire). isoBorneEtat (§88) plutôt que isoDeGi direct : sinon

        var isoActuel = isoBorneEtat(state, bord);

  // Round D — Lionel : « Cliquer sur la date dans les formulaires permet

  // autre semaine (cf. appliquerDateChoisieFormulaire, appelée juste en
  // dessous) — une date hors de la fenêtre actuellement affichée est

  // dans ce même round D en le disant redondant avec CE calendrier) — cette
  // affirmation ne tient donc plus depuis ce correctif. "Ajout lointain"
  // n'a pas été réintroduit ici (pas demandé), mais si Lionel a besoin

  // main, il faudra soit ramener une variante d'"Ajout lointain", soit
  // construire le vrai enregistrement en plage évoqué dans le commentaire de

  function cablerCalendrierDate(conteneur, state, rafraichir) {
    conteneur.querySelectorAll(".date-val").forEach(function (span) {
      span.classList.add("date-val-cliquable");

      // dateLigneHTML (§88) sur une borne hors fenêtre — on le complète
      // plutôt que de le remplacer.

      span.addEventListener("click", function () {
        if (conteneur.querySelector(".date-picker-natif")) return; // déjà ouvert (ex. double-clic)

        if (input.showPicker) { try { input.showPicker(); } catch (ex) { input.focus(); } }
        else input.focus();

    });

  // Applique la date choisie (calendrier OU flèches, cf. cablerDatesPlage) au
  // bord `bord` ("debut"|"fin") d'une plage tâche/absence/jalon/note.
  //
  // Round du 12.09.2026 — 2 retours de Lionel sur la version précédente de
  // cette fonction (qui naviguait vers la semaine cible quand la date sortait
  // de la fenêtre affichée) :
  // 1. « le planning ne doit pas suivre en arrière-plan » : changer la date
  //    dans une fiche ne doit JAMAIS faire bouger la grille affichée
  //    derrière — même quand la fiche reste ouverte pendant la navigation,
  //    voir la grille "sauter" de semaine en arrière-plan est déroutant.
  // 2. « cette manière limite une tâche à 1 semaine, il ne doit pas y avoir
  //    de limite » : naviguer vers la semaine de la borne éditée ne réglait
  //    d'ailleurs qu'à moitié le problème — dès que l'AUTRE borne (non
  //    éditée) ne rentrait plus dans cette nouvelle fenêtre, elle était
  //    ramenée de force sur la date choisie (repli de la ligne juste
