  //    au lieu de vraiment l'étendre.
  // Cause racine commune aux 2 : `giDebut`/`giFin` sont des coordonnées
  // relatives à la fenêtre CHARGÉE (cf. §1 du spec) — pour qu'une plage soit
  // représentable en gi, ses 2 bornes doivent être visibles EN MÊME TEMPS
  // dans cette fenêtre (max 2 semaines). Ce n'est pas qu'une limite
  // d'affichage : le moteur de synchronisation (calculerEtatLocal, cellules
  // "personne" ET jalons) ne diffuse QUE les jours de la fenêtre
  // actuellement chargée (giVisibleFenetre) — un jour au-delà serait de
  // toute façon silencieusement ignoré à l'enregistrement, PAS écrit sur le
  // serveur. Faire "voyager" la fenêtre en arrière-plan pour contourner ça
  // n'aurait fait que déplacer le problème (et perdre le fil visuel de
  // Lionel avec la grille, cf. retour 1) sans jamais lever la vraie limite.
  //
  // §88 (round du 17.09.2026, suite×3) — MISE À JOUR IMPORTANTE du
  // raisonnement ci-dessus, suite au retour de Lionel : « L'ajout hors
  // semaine active est bloqué par les formulaires de saisie » (après avoir
  // testé §87 en conditions réelles). Le blocage décrit plus haut reste
  // ENTIÈREMENT réel pour une Tâche/Absence (aucun enregistrement en plage
  // côté serveur pour elles — cf. le paragraphe ci-dessus, toujours valable
  // pour ces 2 types, un chantier séparé à faire). Pour un Jalon ou une
  // Note en revanche, ce "chantier séparé" n'en est plus un : le serveur
  // (planPlage, functions/enregistrer-plage/logic.js) sait DÉJÀ écrire une
  // plage entière à partir de vraies dates ISO, sans jamais dépendre de ce
  // qui est chargé côté client — cf. diffsNotes, qui l'utilise déjà ainsi.
  // Le vrai blocage pour ces 2 types n'était donc QUE dans cette fonction
  // (et le moteur de diff associé, cf. jalonsParId/diffsJalons plus bas) —
  // purement un choix d'implémentation, pas une limite du serveur.
  //
  // state.kind ("jalon"|"note"|"tache"|"absence", posé par
  // ouvrirEditionPlage/ouvrirEdition) distingue donc maintenant les 2 cas :
  // - jalon/note : une date hors fenêtre n'est plus refusée. La borne
  //   choisie est gardée comme une vraie date ISO à part
  //   (state.debutHorsFenetreIso/finHorsFenetreIso), le gi correspondant
  //   étant calé ("clampé") sur le bord VISIBLE le plus proche pour que le
  //   reste du code qui a besoin d'une position d'affichage (surbrillance de
  //   la grille essentiellement — cf. surbrillancePreciseJalonNote) garde
  //   quelque chose de valide à lire. La comparaison Début/Fin ci-dessous se
  //   fait donc sur de VRAIES dates ISO (jamais des gi, qui n'existent que
  //   DANS la fenêtre) pour rester juste même quand l'une des 2 bornes est
  //   hors fenêtre.
  // - tâche/absence : comportement INCHANGÉ, la date est toujours refusée
  //   (toast) — cf. le paragraphe précédent, toujours vrai pour ces 2 types.
  //
  // La borne éditée (`bord`) garde TOUJOURS exactement la date choisie —
  // l'AUTRE borne n'est recollée dessus que si la garder créerait un
  // intervalle invalide (Début > Fin) ; sinon elle reste inchangée (cf.
  // cablerDatesPlage pour le détail de cette asymétrie).
  function appliquerDateChoisieFormulaire(state, bord, isoChoisi, rafraichir) {
    var supportePlageServeur = state.kind === "jalon" || state.kind === "note";
    var giChoisi = giDepuisIso(isoChoisi);
    if (giChoisi == null && !supportePlageServeur) {
      toast("Cette date sort de la semaine affichée : la durée d’un élément ne peut pas dépasser la fenêtre actuellement chargée.");
      return;
    }
    var autreEstFin = bord === "debut";
    var isoAutre = autreEstFin
      ? (state.finHorsFenetreIso || isoDeGi(state.giFin))
      : (state.debutHorsFenetreIso || isoDeGi(state.giDebut));
    var isoDebutFinal, isoFinFinal;
    if (bord === "debut") {
      isoDebutFinal = isoChoisi;
      isoFinFinal = (isoAutre >= isoChoisi) ? isoAutre : isoChoisi;
    } else {
      isoFinFinal = isoChoisi;
      isoDebutFinal = (isoAutre <= isoChoisi) ? isoAutre : isoChoisi;
    }
    var giD = giDepuisIso(isoDebutFinal), giF = giDepuisIso(isoFinFinal);
    var n = nbJoursAffiches();
    state.giDebut = giD != null ? giD : 0;
    state.giFin = giF != null ? giF : (n - 1);
    if (state.giDebut > state.giFin) { var tmp = state.giDebut; state.giDebut = state.giFin; state.giFin = tmp; }
    state.debutHorsFenetreIso = giD != null ? null : isoDebutFinal;
    state.finHorsFenetreIso = giF != null ? null : isoFinFinal;
    if (state.giDebut === state.giFin && !state.debutHorsFenetreIso && !state.finHorsFenetreIso) state.demiFin = state.demiDebut;
    rafraichir();
  }
  // Descriptif affiché en texte simple, cliquable pour ouvrir un petit
  // éditeur (popup centré desktop/tablette, demi-fenêtre bas d'écran
  // téléphone — même balisage, seule la CSS change, cf. .desc-edit-box) posé
  // en enfant de `pop` (jamais "extérieur" au sens de fermerAuClicExterieur).
  // getTexte/setTexte lisent/écrivent une simple variable JS locale à
  // l'appelant — aucun appel serveur ici, l'enregistrement se fait comme
  // avant au clic sur "Enregistrer" du formulaire entier.
  function cablerDescriptifEdit(pop, getTexte, setTexte, placeholderVide) {
    var span = pop.querySelector(".descriptif-texte");
    function afficher() {
      var t = getTexte();
      span.textContent = t;
      if (!t && placeholderVide) span.setAttribute("data-placeholder", placeholderVide);
    }
    afficher();
    span.addEventListener("click", function () {
      if (pop.querySelector(".desc-edit-overlay")) return;
      var overlay = document.createElement("div");
      overlay.className = "desc-edit-overlay";
      var box = document.createElement("div");
      box.className = "desc-edit-box";
      box.innerHTML = '<div class="popup-head"><div class="popup-titre">Modifier le descriptif</div>' +
        '<button type="button" class="popup-close" title="Fermer">' + ICONE_FERMER + '</button></div>' +
        '<textarea>' + esc(getTexte()) + '</textarea>' +
        '<div class="popup-pied"><button type="button" class="popup-valider">' + ICONE_CHECK + ' Enregistrer</button></div>';
      pop.appendChild(overlay); pop.appendChild(box);
      var ta = box.querySelector("textarea");
      ta.focus(); ta.setSelectionRange(ta.value.length, ta.value.length);
      function fermerEdit() { overlay.remove(); box.remove(); }
      function validerEdit() { setTexte(ta.value.trim()); afficher(); fermerEdit(); }
      overlay.addEventListener("pointerdown", fermerEdit);
      box.querySelector(".popup-close").addEventListener("click", fermerEdit);
      box.querySelector(".popup-valider").addEventListener("click", validerEdit);
      // Round du 12.09.2026 — Lionel : « appuis sur entré doit enregistrer le
      // texte du descriptif, esc ferme sans enregistrer. actuellement
      // appuyer sur entrer sort du formulaire sans enregistrer le texte du
      // descriptif. » Sans ceci, Entrée/Échap tapés dans CE textarea
      // remontaient jusqu'au raccourci clavier global (cf. plus haut,
      // popValiderActuel/popFermerActuel), qui valide/ferme le FORMULAIRE
      // ENTIER (la carte tâche/absence/note/jalon) sans jamais committer ce
      // texte via setTexte() — d'où le texte perdu. stopPropagation()
      // empêche ce document.addEventListener("keydown") de les revoir.
      // Maj+Entrée reste un retour à la ligne normal dans le textarea.
      ta.addEventListener("keydown", function (e) {
        if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); e.stopPropagation(); validerEdit(); return; }
        if (e.key === "Escape") { e.preventDefault(); e.stopPropagation(); fermerEdit(); }
      });
    });
    return afficher;
  }

  /* ============ SÉRIE (RÉCURRENCE) — création/modification/suppression
     directement côté serveur (apiEnregistrerSerie/apiModifierSerie/
     apiSupprimerSerie), §4 du spec : occurrences matérialisées, pas de
     règle "live" — le calcul des dates se fait côté serveur (pasCalendaire_),
     jamais en espace `gi` côté client (contrairement au prototype V3 isolé).
     ============ */
  function demanderPorteeSerie(titre, callback) {
    var overlay = document.createElement("div");
    overlay.className = "voile-confirm";
    var pop = document.createElement("div");
    pop.className = "pop confirm-pop confirm-pop-serie";
    pop.innerHTML = '<div class="cp-titre">' + esc(titre) + ' — série</div>' +
      '<p class="confirm-texte">Cet élément fait partie d’une série.</p>' +
      '<div class="confirm-boutons-serie">' +
      '<button type="button" class="cs-unique">Cet élément seul</button>' +
      '<button type="button" class="cs-suivant">Cet élément et les suivants</button>' +
      '<button type="button" class="cs-serie">Toute la série</button>' +
      '</div>' +
      '<button type="button" class="c-annuler cs-annuler">Annuler</button>';
    document.body.appendChild(overlay);
    document.body.appendChild(pop);
    function nettoyer() { overlay.remove(); pop.remove(); if (popFermerActuel === nettoyer) popFermerActuel = null; }
    overlay.addEventListener("pointerdown", nettoyer);
    pop.querySelector(".cs-annuler").addEventListener("click", nettoyer);
    pop.querySelector(".cs-unique").addEventListener("click", function () { nettoyer(); callback("unique"); });
    pop.querySelector(".cs-suivant").addEventListener("click", function () { nettoyer(); callback("suivant"); });
    pop.querySelector(".cs-serie").addEventListener("click", function () { nettoyer(); callback("serie"); });
    popFermerActuel = nettoyer;
  }
  function serieChampsHTML() {

  // Round D — bandeau affiché à la place de serieChampsHTML() dans la fiche
  // d'un item qui est DÉJÀ en série (cf. commentaire CSS .serie-info-existante
  // ci-dessus) : rend visible, avant même de cliquer "Enregistrer", que la
  // modification proposera un choix de portée.
  function serieInfoExistanteHTML() {
    return '<div class="serie-info-existante"><span class="icone-serie">↻</span><span>Fait partie d’une série. En enregistrant, un choix sera proposé : cet élément seul, celui-ci et les suivants, ou toute la série.</span></div>';
  }
  // Renvoie une fonction lireChoixSerie() -> null (pas coché) ou
  // {frequence, intervalle, finType, finValeur} — finValeur est un ISO
  // (finType="date") ou un entier (finType="occurrences"), prêt pour
  // apiEnregistrerSerie.
  function cablerSerieChamps(pop, isoBase) {
    var chk = pop.querySelector(".f-serie");
    if (!chk) return function () { return null; };
    var options = pop.querySelector(".serie-options");
    var ligneNb = pop.querySelector(".serie-ligne-nb");
    var ligneDate = pop.querySelector(".serie-ligne-date");
    var dateInput = pop.querySelector(".serie-date");
    var intervalleInput = pop.querySelector(".serie-intervalle");
    var uniteSelect = pop.querySelector(".serie-unite");
    var finActuel = "occurrences";
    chk.addEventListener("change", function () { options.hidden = !chk.checked; });
    var JOURS_DEFAUT_PAR_OCCURRENCE = { jour: 3.5, semaine: 7, mois: 30, annee: 365 };
    var OCCURRENCES_DEFAUT = 4;
    function majDateDefaut() {
      var freq = uniteSelect.value;
      var intervalle = Math.max(1, parseInt(intervalleInput.value, 10) || 1);
      var d = new Date((isoBase || isoDeDate(new Date())) + "T00:00:00");
      d.setDate(d.getDate() + Math.round((JOURS_DEFAUT_PAR_OCCURRENCE[freq] || 7) * intervalle * OCCURRENCES_DEFAUT));
      dateInput.value = isoDeDate(d);
    }
    intervalleInput.addEventListener("input", majDateDefaut);
    uniteSelect.addEventListener("change", majDateDefaut);
    pop.querySelectorAll(".serie-fin-row .chip").forEach(function (btn) {
      btn.addEventListener("click", function () {
        pop.querySelectorAll(".serie-fin-row .chip").forEach(function (b) { b.classList.remove("actif"); });
        btn.classList.add("actif");
        finActuel = btn.dataset.fin;
        ligneNb.hidden = finActuel !== "occurrences";
        ligneDate.hidden = finActuel !== "date";
      });
    });
    majDateDefaut();
    return function lireChoixSerie() {
      if (!chk.checked) return null;
      var freq = uniteSelect.value;
      var intervalle = Math.max(1, Math.min(365, parseInt(intervalleInput.value, 10) || 1));
      if (finActuel === "date") return { frequence: freq, intervalle: intervalle, finType: "date", finValeur: dateInput.value || isoBase };
      var n = Math.max(2, Math.min(366, parseInt(pop.querySelector(".serie-nb").value, 10) || 4));
      return { frequence: freq, intervalle: intervalle, finType: "occurrences", finValeur: n };
    };
  }
  // Applique la réponse d'une API "série" (enregistrer-serie/gerer-serie,
  // étape 4 du §6bis, migration hors Google) : contrairement aux anciennes
  // apiEnregistrerSerie/apiModifierSerie/apiSupprimerSerie (WebApp.gs), ces
  // deux Edge Functions ne renvoient plus la semaine affichée rafraîchie ni
  // la liste des semaines touchées ({semaine, semainesTouchees}) — une série
  // peut de toute façon poser des occurrences n'importe où dans le temps
  // (plus de plafond "5 semaines créées", cf. genererSemaines côté client,
  // étape 2) : borner le rechargement à "les semaines touchées" n'aurait
  // plus de sens. On oublie tout le cache et on recharge simplement la
  // fenêtre affichée — même filet que la synchronisation (cf. synchroniser()
  // juste au-dessus), le paramètre `r` n'est donc plus utilisé ici.
  function apresEcritureSerie() {

  }
  function labGCourant() { return etat.semaines[etat.indexSemaine].labG; }

  /* ============================================================
     FORMULAIRES AJOUT / ÉDITION — tâches, absences, jalons, notes.
     ============================================================ */
  // creerGroupeTaches (round du 12.09.2026 — refonte "case par case" de la
  // sélection, cf. cablerAjoutCellule/surlignerPlagePersonnes) : 1 SEUL item
  // par personne concernée, sur exactement {giDebut,duree,demiDebut,demiFin}
  // — les bords précis de la plage sélectionnée (bornesDepuisDemiSlots côté
  // appelant), désormais partagés par TOUT type de bulle (tâche, absence,
  // congé, vacances...), plus de traitement spécial pour les absences.
  // Remplace 2 anciens comportements :
  //  - le cas "absence, duree>1" (round du 11.09.2026, §51.2.2) posait déjà
  //    1 item/personne en journée entière — devenu le cas général ici ;
  //  - le cas "tâche" fragmentait 1 item PAR JOUR avec une demi-journée FIXE
  //    par ligne de sélection (matin/aprem "figé" pour toute la durée, cf.
  //    lignesSecteur) — Lionel a explicitement rejeté ce modèle : « Ce
  //    comportement doit être pareil pour tout type des bulles. on ne
  //    sélectionne pas que les matin ou que les après midi. » Le payload
  //    porte donc maintenant demiDebut/demiFin (bords de plage), plus une
  //    demi-journée par ligne — ouvrirEdition (formulaire "Tâche"/"Absence"
  //    avec descriptif) créait déjà 1 item fusionné par cible de cette façon
  //    (cf. son commentaire) ; ceci aligne les boutons rapides/formulaires
  //    historiques (Armature/Béton/Livraison/Entrée dynamique/Absence
  //    rapide) sur le même modèle.
  function creerGroupeTaches(cibles, giDebut, duree, payload) {
    var demiDebut = payload.demiDebut !== undefined ? payload.demiDebut : null;
    var demiFin = payload.demiFin !== undefined ? payload.demiFin : null;
    var personnesVues = {};
    cibles.forEach(function (c) {
      if (personnesVues[c.personne]) return;
      personnesVues[c.personne] = true;
      var ta = itemPlageTache(payload.type, payload.texte, c.personne, giDebut, duree, {
        chantier: payload.chantier, important: payload.important, statut: payload.statut,
        demiDebut: demiDebut, demiFin: demiFin
      });
      ta.dateDebutIso = isoDeGi(giDebut);
      TACHES.push(ta);
    });
  }
  function ajoutRapide(cibles, giDebut, duree, texte, type, demiDebut, demiFin) {
    sauvegarderUndo();
    creerGroupeTaches(cibles, giDebut, duree, { type: type, texte: texte, important: false, chantier: null, statut: null, demiDebut: demiDebut, demiFin: demiFin });
    render();
    toast("Ajouté.");
  }

  // Crée une série (§4 du spec) — un appel serveur par cible (ancre, demi)
  // touchée, cf. FRONTEND-CHANGELOG.md : apiEnregistrerSerie ne prend qu'UNE
  // seule cible {ancre,demi} par appel, contrairement au moteur du prototype
  // qui partageait un seul serieId entre toutes les lignes d'une sélection
  // multi-personnes — ici chaque ligne reçoit sa propre série.
  //
  // duree/demiDebut/demiFin (round du 15.09.2026 — bug Lionel : « si je
  // sélectionne 2 case ou plus, la bulle vient uniquement dans la première
  // case de chaque répétition ») : AJOUTÉS en fin de signature plutôt
  // qu'insérés au milieu, pour ne risquer de décaler aucun des arguments
  // positionnels déjà en place aux 3 sites d'appel existants. Avant ce
  // round, cette fonction ne recevait QUE `giDebut` (l'ancre) — la largeur
  // de la sélection d'origine (plusieurs jours et/ou les 2 demis d'un même
  // jour, cf. bornesDepuisDemiSlots côté appelant) était silencieusement
  // perdue : chaque occurrence ne posait jamais qu'UNE seule case (le jour
  // et la demi de l'ancre), jamais tout le reste de la plage sélectionnée.
  // Optionnels (undefined si un futur 4e site d'appel ne les fournit pas)
  // pour que le serveur puisse retomber sur son ancien comportement à 1
  // seule demi (cible_demi) — cf. le commentaire de champsSerie/
  // construireOccurrencesSerie (enregistrer-serie/logic.js).
  function creerSerieServeur(type, cibles, giDebut, texte, important, chantier, statut, choixSerie, apresChaqueAppel, duree, demiDebut, demiFin) {
    var isoDebut = isoDeGi(giDebut);
    // enregistrer-serie n'a que 3 types ("tache"|"jalon"|"note", cf.
    // champsSerie côté fonction) : "absence" n'a jamais été une vraie
    // catégorie de la table `series`/`taches.type` — traduite ici en "tache",
    // comme le reste du formulaire d'édition le fait déjà. Round du
    // 14.09.2026 (bug Lionel : une absence en série retombait "tâche" au
    // premier rechargement, même défaut que le chemin non-série corrigé
    // ailleurs ce même round, cf. tacheVue_) : `estAbsence` ci-dessous porte
    // désormais cette information jusqu'à taches.est_absence
    // (sql/0009_taches_est_absence.sql) sans toucher au type envoyé à
    // `series` (qui reste "tache", cf. plus haut — colonne inchangée).
    var typeServeur = (type === "absence") ? "tache" : type;
    var chaine = Promise.resolve();
    var dernier = null;
    (cibles.length ? cibles : [{}]).forEach(function (c) {
      chaine = chaine.then(function () {
        var payload = {
          type: typeServeur, personneId: c.personne != null ? ancreDe(c.personne) : undefined, demi: c.demi,
          texte: texte,
          // statut/chantier restent des NOMS/CLÉS côté vue (CHANTIERS/STATUTS,
          // cf. étape 3 du §6bis) — enregistrer-serie veut de vrais id,
          // traduits ici via les lookups posés au bootstrap (demarrer()).
          statutId: statut ? (etat.statutIdParCle[statut] || null) : null,
          important: !!important,
          chantierId: chantier ? ((etat.chantierParNom[chantier] && etat.chantierParNom[chantier].ligne) || null) : null,
          dateDebutIso: isoDebut, frequence: choixSerie.frequence, intervalle: choixSerie.intervalle,
          finType: choixSerie.finType, finValeur: choixSerie.finValeur,
          estAbsence: type === "absence",
          // Largeur de la sélection d'origine (round du 15.09.2026, cf.
          // commentaire de tête de fonction) — toujours envoyés explicitement
          // (même `null`) dès que cette fonction en reçoit, pour que chaque
          // occurrence de la série reproduise exactement la même plage que
          // la 1ère case posée, au lieu de la seule ancre.
          duree: Math.max(1, duree || 1),
          demiDebut: demiDebut !== undefined ? demiDebut : null,
          demiFin: demiFin !== undefined ? demiFin : null
        };
        return invoquerFonctionServeur("enregistrer-serie", payload).then(function (r) { dernier = r; });
      });
    });
    return chaine.then(function () { if (dernier) apresChaqueAppel(dernier); });
  }

  function boutonsMenuAjout(personneId) {
    var estIntervenant = secteurPersonne(personneId) === "sous-traitant";
    var html = '<button type="button" data-t="tache">Tâche</button>';
    // "Absence" (qui ouvre l'éditeur, pour saisir un motif) reste proposée
    // telle quelle au personnel : ce n'est pas une entrée rapide mais un type
    // de bulle à part entière.
    if (!estIntervenant) html += '<button type="button" data-t="absence">Absence</button>';
    // Congé / Vacances : codés en dur jusqu'ici, donc ni renommables, ni
    // assignables, ni supprimables (Lionel : "il faut ajouter les absences aux
    // ajouts rapides à éditer"). Ils viennent maintenant de la liste
    // configurable, comme n'importe quel formulaire — repli sur les 2 boutons
    // historiques TANT QU'aucune entrée rapide de type "absence" n'existe,
    // pour que rien ne disparaisse de son menu avant qu'il ne les ait créées.
    var aDesAbsencesConfigurees = FORMULAIRES_RAPIDES.some(function (f) { return f.typeEntree === "absence"; });
    if (!estIntervenant && !aDesAbsencesConfigurees) {
      html += '<button type="button" data-rapide="Congé">Congé</button>';
      html += '<button type="button" data-rapide="Vacances">Vacances</button>';
    }
    // "Assigné à" (restauré round "reverifie 1x que tu a tout fait" du
    // 02.09.2026, cf. FORMULAIRES_RAPIDES[].assigneA côté serveur) : "" =
    // tout le monde, sinon réservé à cette seule personne. L'index `i` reste
    // celui du tableau GLOBAL non filtré — cablerBoutonsMenuAjout relit
    // FORMULAIRES_RAPIDES[+btn.dataset.form], donc filtrer le tableau
    // lui-même déciderait un mauvais formulaire au clic.
    FORMULAIRES_RAPIDES.forEach(function (f, i) {
      if (!formulaireVisiblePour(f, personneId)) return;
      html += '<button type="button" data-form="' + i + '">' + esc(f.nom) + '</button>';
    });
    return html;
  }
  function cablerBoutonsMenuAjout(pop, fermer, cell, x, y, cibles, giDebut, duree, plageInit, demiDebut, demiFin) {
    pop.querySelectorAll("button[data-t]").forEach(function (btn) {
      btn.addEventListener("click", function () { var type = btn.dataset.t; fermer(); ouvrirEdition(cell, null, type, x, y, plageInit, demiDebut, demiFin); });
    });
    pop.querySelectorAll("button[data-rapide]").forEach(function (btn) {
      btn.addEventListener("click", function () { var texte = btn.dataset.rapide; fermer(); ajoutRapide(cibles, giDebut, duree, texte, "absence", demiDebut, demiFin); });
    });
    pop.querySelectorAll("button[data-form]").forEach(function (btn) {
      btn.addEventListener("click", function () {
        var f = FORMULAIRES_RAPIDES[+btn.dataset.form]; fermer();
        if (!f) return;
        if (f.nom === "Armature") { ouvrirFormulaireArmature(cibles, giDebut, duree, x, y, plageInit, demiDebut, demiFin); return; }
        if (f.nom === "Béton") { ouvrirFormulaireBeton(cibles, giDebut, duree, x, y, plageInit, demiDebut, demiFin); return; }
        if (f.nom === "Livraison armature") { ouvrirFormulaireLivraisonArmature(cibles, giDebut, duree, x, y, plageInit, demiDebut, demiFin); return; }
        // Un formulaire sans champ s'ajoute en un clic, avec SON type :
        // "Congé" configuré en absence pose bien un congé, pas une tâche.
        if (!f.champs || !f.champs.length) { ajoutRapide(cibles, giDebut, duree, f.nom, f.typeEntree === "absence" ? "absence" : "tache", demiDebut, demiFin); return; }
        ouvrirFormulaireDynamique(f, cibles, giDebut, duree, x, y, plageInit, demiDebut, demiFin);
      });
    });
  }
  function ouvrirAjout(cell, x, y) {
    var kind = cell.dataset.kind;
    // Clic simple (sans glissé) sur jalon/note (round du 12.09.2026 — Lionel :
    // « je les veux case par case, une case = une demi journée ») : la
    // demi-journée visée est désormais celle sous le POINTEUR (moitié
    // gauche/droite de la case pleine largeur, cf. demiDepuisPointeur — déjà
    // utilisée pour le glissement d'une note existante), pas systématiquement
    // la journée entière comme avant ce round.
    if (kind !== "personne") {
      var demiClicPlein = demiDepuisPointeur(cell, x);
      ouvrirEditionPlage(kind, null, +cell.dataset.jour, 1, x, y, cell, demiClicPlein, demiClicPlein);
      return;

  // ---- ouvrirEdition (tâche/absence) — adaptation du prototype : la case

  // dans TACHES par optimisme (cf. FRONTEND-CHANGELOG.md). Un item SANS
  // serieId se comporte exactement comme dans le prototype : mutation locale
  // de TACHES + render() (qui synchronise ensuite via le moteur de diff).
  function ouvrirEdition(cell, itemExisting, typeIfNew, x, y, plageInit, demiDebutArg, demiFinArg) {
    var extraCell = cell ? { personne: cell.dataset.personne, demi: cell.dataset.demi } : null;
    var giDebut0 = plageInit ? plageInit.giDebut : (cell ? +cell.dataset.jour : (itemExisting ? itemExisting.giDebut : 0));
    var duree0 = plageInit ? plageInit.duree : (itemExisting ? (itemExisting.duree || 1) : 1);
    var cibles = plageInit ? plageInit.cibles : (extraCell ? [extraCell] : []);
    var typeAffiche = itemExisting ? itemExisting.type : typeIfNew;

    // rafraichirDates) : la demi-journée initiale d'une NOUVELLE tâche/
    // absence reprend désormais les bords PRÉCIS de la plage sélectionnée au
    // glissé (demiDebutArg/demiFinArg, cf. bornesDepuisDemiSlots côté
    // cablerAjoutCellule — round du 12.09.2026, corrige Lionel : « Les
    // boutons A/P ne sont pas automatiquement en surbrillance suivant la
    // bulle »), plutôt qu'une seule demi-journée reprise de la case cliquée
    // (ancien demiInit, conservé comme repli pour un simple clic — cellule
    // unique, sans plage précise transmise).
    var demiInit = (!itemExisting && extraCell && (extraCell.demi === "matin" || extraCell.demi === "aprem")) ? extraCell.demi : null;
    var state = {
      kind: typeAffiche, // §88 — "tache"|"absence" : appliquerDateChoisieFormulaire continue donc à refuser toute date hors fenêtre ici, aucun changement de comportement pour ces 2 types (cf. son commentaire — pas encore de vrai enregistrement en plage côté serveur pour eux).
      giDebut: giDebut0, giFin: giDebut0 + duree0 - 1,

      demiFin: itemExisting ? (itemExisting.demiFin || null) : (demiFinArg !== undefined ? demiFinArg : demiInit),

    };

    var pop = document.createElement("div");

    if (typeAffiche === "tache") {

      // dans la case ciblée s'il y en a un (round du 03.09.2026, cf.

      // qui en a déjà une change silencieusement le chantier de la 1ère à la

      defautNouveau = chantierExistantDansCase(cibles, state.giDebut, state.giFin - state.giDebut + 1) || chantierParDefautValide();

      // désactivé n'est plus proposé pour du NOUVEAU) — MAIS repéré comme un

      // le chantier déjà en place sur l'item existant modifié, OU celui déjà
      // présent sur une autre tâche de la même case ciblée (defautNouveau,

      // déjà utilisé juste sous les yeux de Lionel.
      var options = Object.keys(CHANTIERS).filter(function (k) {

    // affiche désormais le bandeau serieInfoExistanteHTML (au lieu de rien

    // sera demandée à l'enregistrement (cf. demanderPorteeSerie plus bas,
    // déjà en place). serieChampsHTML() (case à cocher "Série (se répète)")
    // reste réservée à la CRÉATION (nouvelle tâche/absence) : la proposer
    // aussi pour un item existant qui n'est PAS encore en série créerait un
    // doublon serveur (enregistrer-serie insère toujours une occurrence à sa
    // date de départ SANS jamais remplacer ce qui existe déjà ce jour-là, cf.
    // construireOccurrencesSerie côté fonctions/enregistrer-serie/logic.js) —

    var fermer = fermerAuClicExterieur(pop, !itemExisting ? surbrillancePrecisePersonnes(cibles, state.giDebut, state.giFin - state.giDebut + 1, state.demiDebut, state.demiFin) : null, function () { pop.querySelector(".f-ok").click(); });

    if (statutRow) cablerChipsExclusifs(statutRow, "statut", function (v) { statutActuel = v || null; });

        creerSerieServeur(typeAffiche, cibles, giDebutFinal, texte, important, chantier, statutFinal, choixSerie, function (r) {

        // différent en début/fin. Même trajet que le glissement/

        // synchroniser()/calculerEtatLocal, qui reconstruit l'état désiré

        sauvegarderUndo();

          });

  // serieId pour les jalons/notes (contrairement aux tâches, dont la cellule

  function ouvrirEditionPlage(kind, itemExisting, giDebut, duree, x, y, celluleSurbrillance, demiDebutArg, demiFinArg) {

    var champSerie = kind === "jalon" ? "" : (itemExisting ? (itemExisting.serieId ? serieInfoExistanteHTML() : "") : serieChampsHTML());

    var fermer = fermerAuClicExterieur(pop, !itemExisting ? surbrillancePreciseJalonNote(kind, state.giDebut, state.giFin - state.giDebut + 1, state.demiDebut, state.demiFin) : null, function () { pop.querySelector(".f-ok").click(); });

    cablerDatesPlage(pop, state, rafraichirDates);
    var texteActuel = texteInit;
    cablerDescriptifEdit(pop, function () { return texteActuel; }, function (v) { texteActuel = v; }, "Cliquer pour ajouter un descriptif…");

    var lireChoixSerie = cablerSerieChamps(pop, itemExisting ? itemExisting.dateDebutIso : isoBorneEtat(state, "debut"));
    cablerLienPlus(pop);

    var suppr = pop.querySelector(".f-suppr");
    if (suppr) suppr.addEventListener("click", function () {
      function supprimerUnique() {
        sauvegarderUndo();
        var idx = liste.indexOf(itemExisting);
        if (idx >= 0) liste.splice(idx, 1);
        fermer(); render(); toast("Supprimé.");
      }
      if (itemExisting.serieId) {
        demanderPorteeSerie("Supprimer", function (portee) {
          fermer();
          invoquerFonctionServeur("gerer-serie", { action: "supprimer", portee: portee, serieId: itemExisting.serieId, dateRefIso: itemExisting.dateDebutIso }).then(function () {
            apresEcritureSerie(); toast("Supprimé.");
          }).catch(function (err) {
            toast("Échec de la suppression : " + (err && err.message ? err.message : err));
          });
        });
        return;
      }
      supprimerUnique();
    });
    pop.querySelector(".f-ok").addEventListener("click", function () {
      var texte = texteActuel.trim();
      if (!texte) { fermer(); return; }
      var important = state.important;
      // §88 — isoDebutVrai/isoFinVrai (jamais isoDeGi(giDebutFinal) seul,
      // qui donnerait la date du bord VISIBLE clampé, pas la vraie date,
      // dès que l'une des 2 bornes est hors fenêtre) + dureeFinal en jours
      // ouvrés RÉELS entre ces 2 dates (giFin-giDebut+1 ne veut plus rien
      // dire dans ce cas, ces gi n'étant que des positions d'affichage).
      var isoDebutVrai = isoBorneEtat(state, "debut"), isoFinVrai = isoBorneEtat(state, "fin");
      var giDebutFinal = state.giDebut, dureeFinal = nbJoursOuvresEntre(isoDebutVrai, isoFinVrai);
      var demiDebutFinal = state.demiDebut, demiFinFinal = state.demiFin;
      // Sur 1 seul jour, Début=matin + Fin=aprem est une combinaison valide
      // côté fiche (cf. cablerDatesPlage) mais équivaut à une journée
      // entière — ramenée ici à la forme canonique (null/null) qu'attend
      // tout le reste du fichier (demisOccupeesTache, rendu des bulles,
      // glissé/redimensionnement...), qui suppose encore demiDebut ===
      // demiFin dès que la durée vaut 1. Le garde-fou "hors fenêtre" (§88)
      // évite de déclencher ça à tort quand giDebut === giFin uniquement
      // parce que les 2 bornes sont clampées sur le même jour visible tout
      // en restant réellement différentes (ex. début un vendredi, fin des
      // semaines plus tard).
      if (state.giDebut === state.giFin && !state.debutHorsFenetreIso && !state.finHorsFenetreIso && demiDebutFinal === "matin" && demiFinFinal === "aprem") { demiDebutFinal = null; demiFinFinal = null; }
      if (itemExisting) {
        function appliquerModifUnique() {
          sauvegarderUndo();
          itemExisting.texte = texte; itemExisting.important = important;
          itemExisting.giDebut = giDebutFinal; itemExisting.duree = dureeFinal;
          itemExisting.demiDebut = demiDebutFinal; itemExisting.demiFin = demiFinFinal;
          itemExisting.dateDebutIso = isoDebutVrai;
          fermer(); render(); toast("Modifié.");
        }
        if (itemExisting.serieId) {
          demanderPorteeSerie("Modifier", function (portee) {
            fermer();
            // Jalon/note : pas de chantierId/statutId, ces champs n'existent
            // pas sur ces tables (cf. sql/0001_schema.sql) — modifs se limite
            // à texte/important, exactement comme l'ancien apiModifierSerie
            // ici (jamais de champ chantier/statut envoyé pour ces types) ;
            // les dates/demi-journée ne sont pas envoyées non plus, gerer-
            // serie ne sachant pas déplacer une série entière (même limite
            // que côté tâche, cf. ouvrirEdition ci-dessus).
            var modifs = { texte: texte, important: important };
            invoquerFonctionServeur("gerer-serie", { action: "modifier", portee: portee, serieId: itemExisting.serieId, dateRefIso: itemExisting.dateDebutIso, modifs: modifs }).then(function () {
              apresEcritureSerie(); toast("Modifié.");
            }).catch(function (err) {
              toast("Échec de la modification : " + (err && err.message ? err.message : err));
            });
          });
          return;
        }
        appliquerModifUnique();
      } else {
        var choixSerie = lireChoixSerie();
        if (choixSerie) {
          fermer();
          // dureeFinal/demiDebutFinal/demiFinFinal (round du 15.09.2026) :
          // même correctif que côté ouvrirEdition ci-dessus, pour un
          // jalon/note en série couvrant plusieurs jours.
          creerSerieServeur(kind, [{}], giDebutFinal, texte, important, null, null, choixSerie, function (r) {
            apresEcritureSerie(r); toast("Série ajoutée.");
          }, dureeFinal, demiDebutFinal, demiFinFinal).catch(function (err) {
            toast("Échec de la création de la série : " + (err && err.message ? err.message : err));
          });
        } else {
          sauvegarderUndo();
          liste.push(itemPlage(kind, texte, giDebutFinal, dureeFinal, { important: important, demiDebut: demiDebutFinal, demiFin: demiFinFinal }));
          liste[liste.length - 1].dateDebutIso = isoDebutVrai;
          fermer(); render(); toast("Ajouté.");
        }
      }
    });
  }

  /* ============================================================
     RÉINTÉGRATION V2 — aperçu d'impression / PDF
     ------------------------------------------------------------
     Fonctionnalité réelle de production (usage hebdomadaire de Lionel) que
     le portage V3 avait fait disparaître : le prototype V3 (bulles)
     n'avait jamais eu à la concevoir, donc rien à en porter — elle est
     reprise depuis l'ancien Index.html V2 (conservé dans le Projet Claude,
     chemin claude/Index.html) et adaptée aux conventions de ce fichier
     (TACHES/JALONS/NOTES reconstruits depuis etat.cache, modale
     .pop/.voile-confirm au lieu des "sheets" plein écran de V2,
     gsP()/toast() au lieu de gs()/showToast()). Logique métier ET contrat
     serveur INCHANGÉS (apiGenererPdf, toujours présente telle quelle dans
     WebApp.gs) — seul l'habillage client change.
     Le décalage en masse et l'assignation groupée, réintégrés au même
     moment depuis V2, ont ensuite été retirés à la demande explicite de
     Lionel : *"plus besoin du décalage en masse grâce à la sélection
     multiple de la nouvelle feuille. plus besoin de l'assignation groupée
     non plus."* — la sélection multiple de bulles de V3 (copier/déplacer
     un groupe de bulles, cf. la barre d'action) couvre désormais ces deux
     usages. `apiApercuDecalage`/`apiAppliquerDecalage`/
     `apiAttribuerChantierGroupe` restent intactes côté serveur (WebApp.gs)
     mais ne sont plus appelées par ce fichier — cf. FRONTEND-CHANGELOG.md
     §5 pour le détail.
     ============================================================ */

  // Une case (forme serveur brute — cf. apiChargerSemaine, PAS une bulle
  // TACHES/JALONS/NOTES) est "vide" si elle n'a ni chantier ni tâche avec
  // du texte. Utilisé par l'aperçu d'impression pour masquer les personnes
  // sans rien cette semaine-là (cf. openPrintSheet).
  function personneVide(p) {
    var cells = (p.matin || []).concat(p.aprem || []);
    for (var i = 0; i < cells.length; i++) {
      if (cells[i].chantier || (cells[i].taches && cells[i].taches.length > 0)) return false;
    }
    return true;
  }
  // detailJoint/fondCase (couleur de fond UNIQUE par case, absence > chantier
  // > transparent) ont existé jusqu'au round du 16.09.2026 — retirées avec
  // le passage à Option A (bande de couleur par tâche, cf. infoCase plus
  // bas) : la couleur ne se décide plus au niveau de LA CASE mais de CHAQUE
  // tâche individuellement, `detailJoint` (texte joint de toutes les tâches,
  // pour une détection d'absence globale à la case) n'a donc plus de sens.

  /* ============ DÉCALER LE PLANNING EN MASSE — RETIRÉ ============
     Fonctionnalité retirée à la demande de Lionel (cf. commentaire en tête
     de cette section) : la sélection multiple de bulles de V3 couvre
     désormais ce besoin. Fonctions supprimées : apresEcritureDepuis,
     ouvrirDecalagePlanning_, ouvrirApercuDecalage_. apiApercuDecalage/
     apiAppliquerDecalage restent intactes côté serveur si jamais ce choix
     était reconsidéré plus tard. */
  /* ============ APERÇU D'IMPRESSION + GÉNÉRATION PDF ============
     Déclenché par le bouton "Imprimer" de la barre du planning. Travaille
     directement sur la forme serveur brute de la semaine affichée
     (etat.cache[labG] — PAS les bulles TACHES/JALONS/NOTES reconstruites)
     : c'est exactement ce que la vraie feuille imprime, donc c'est la
     source la plus sûre pour un aperçu fidèle, indépendante du moteur de
     bulles. apiGenererPdf(labG) est INCHANGÉE côté serveur — ce fichier
     relaie juste son résultat. */
  function openPrintSheet() {
    var labG = labGCourant();
    var data = etat.cache[labG];
    if (!data) { toast("Cette semaine n’est pas encore chargée — réessaie."); return; }
    var jl = JOURS.map(function (j, i) { return { j: j, d: data.dates[i], m: data.mois[i], iso: data.isoDates[i] }; });

    // round du 15.09.2026 — Lionel, sur l'aperçu impression : "les dates ne
    // sont pas complètes, on ne voit ni le mois ni l'année [...] rajouter
    // une ligne mois, l'année peut être placée dans la cellule haut
    // gauche". data.mois[i]/data.isoDates[i] existaient déjà (repris tels
    // quels d'infosSemaineDepuisLabG) mais n'étaient jusqu'ici affichés
    // nulle part dans l'aperçu — seul "Lun 14" apparaissait, ambigu dès
    // qu'on ressort une impression après coup (quel mois ? quelle année ?).
    // Regroupe les jours CONSÉCUTIFS du même mois (une semaine de 5 jours
    // ouvrés ne chevauche 2 mois qu'en fin de mois — ex. jeu 30/ven 31 août
    // -> lun 1er/mar 2/mer 3 septembre) pour un colspan par groupe plutôt
    // qu'un mois répété identique sur chaque colonne.
    var groupesMois = [];
    jl.forEach(function (j) {
      var moisPlein = MOIS_FR[parseInt(j.iso.slice(5, 7), 10) - 1];
      var dernier = groupesMois[groupesMois.length - 1];
      if (dernier && dernier.mois === moisPlein) dernier.span++;
      else groupesMois.push({ mois: moisPlein, span: 1 });
    });
    // Année(s) de la cellule en haut à gauche : la quasi-totalité du temps
    // une seule ("2026") ; à cheval sur le nouvel an (semaine du dernier
    // lundi de décembre), les 2 sont affichées ("2026 / 2027") plutôt que
    // de trancher arbitrairement pour l'une des deux.
    var anneesSemaine = [];
    jl.forEach(function (j) { var a = j.iso.slice(0, 4); if (anneesSemaine.indexOf(a) === -1) anneesSemaine.push(a); });

    // round du 15.09.2026 (suite) — Lionel : "L'ordre sur le pdf doit être
    // celui à l'écran". La grille compacte affiche 2 sections successives,
    // Personnel puis Intervenants (cf. construireGrille : groupePersonnel/
    // groupeIntervenants juste avant ligneSection, lignes ~6237) — alors
    // que data.personnes est simplement trié par le champ "ordre" côté
    // serveur, qui peut très bien entremêler personnel et sous-traitants.
    // On reproduit ici le même regroupement (p.sousTraitant est déjà
    // disponible sur cette forme de données, cf. construireVueDepuisCache).
    var imprimesTous = (data.personnes || []).filter(function (p) { return !personneVide(p); });
    var sautees = (data.personnes || []).length - imprimesTous.length;
    var imprPersonnel = imprimesTous.filter(function (p) { return !p.sousTraitant; });
    var imprIntervenants = imprimesTous.filter(function (p) { return p.sousTraitant; });
    var imprimes = imprPersonnel.concat(imprIntervenants);
    // Index (dans `imprimes`) du dernier "Personnel" avant le 1er
    // "Intervenant" — sert plus bas à insérer une séparation plus large que
    // le spacer ordinaire entre 2 personnes du même groupe (cf.
    // "print-spacer-section" dans le CSS), seulement quand les 2 groupes
    // sont représentés cette semaine-là.
    var indexFrontiereSection = (imprPersonnel.length > 0 && imprIntervenants.length > 0) ? (imprPersonnel.length - 1) : -1;
    // Round du 16.09.2026 (sql/0010_taches_chantier_id.sql — Option A,
    // choisie par Lionel via AskUserQuestion : "bande de couleur par
    // tâche") : chaque tâche de la case a désormais son PROPRE chantier
    // (cell.chantier lui-même n'est plus qu'un repli pour une case sans
    // aucune tâche, cf. celluleVue_) — la légende doit donc parcourir
    // cell.taches, pas seulement cell.chantier, pour ne manquer aucun
    // chantier utilisé quelque part sur la semaine.
    var chantiersUtilises = {};
    imprimes.forEach(function (p) {
      (p.matin || []).concat(p.aprem || []).forEach(function (cell) {
        var taches = (cell && cell.taches) || [];
        if (taches.length) {
          taches.forEach(function (t) {
            var estAbs = !!t.absence || estAbsence(t.texte);
            if (t.chantier && !estAbs) chantiersUtilises[t.chantier] = true;
          });
        } else if (cell && cell.chantier) {
          chantiersUtilises[cell.chantier] = true;
        }
      });
    });
    var notesRemplies = (data.notes || []).some(function (n) { return n && n.length > 0; });

    var overlay = document.createElement("div");
    overlay.className = "voile-confirm";
    var pop = document.createElement("div");
    pop.className = "pop confirm-pop impression-modal";
    var h = '<div class="cp-titre">Aperçu impression — semaine ' + esc(data.numero) + '</div>';
    // NB_COLS : 1 colonne "nom" + 2 sous-colonnes (matin/aprem) par jour —
    // toute cellule qui doit couvrir la largeur entière du tableau
    // (spacers, colspan de secours) s'appuie sur cette constante plutôt
    // qu'un nombre en dur, pour ne plus jamais désynchroniser un colspan
    // si le nombre de jours affichés change un jour.
    var NB_COLS = 1 + jl.length * 2;
    h += '<div class="print-doc"><table class="print-table"><thead>';
    // round du 15.09.2026 (suite) — Lionel : "j'aimerai bien l'affichage
    // matin/après-midi côte à côte, comme le planning". La grille compacte
    // (planning à l'écran) place déjà matin et aprem à côté l'un de
    // l'autre plutôt que sur 2 lignes — l'aperçu impression, jusqu'ici,
    // faisait l'inverse (cf. plus bas : 1 ligne "matin" + 1 ligne "aprem"
    // par personne). Reprend le même principe qu'à l'écran : chaque jour
    // devient 2 SOUS-COLONNES ("th colspan=2" pour son en-tête), chaque
    // personne tient sur UNE SEULE ligne. Jalons/notes restent au niveau
    // du JOUR (data.jalons[i]/data.notes[i] n'ont pas de granularité demi
    // côté forme serveur brute, contrairement aux cases personne — cf.
    // personneVide juste au-dessus) : leur cellule s'étale sur
    // les 2 sous-colonnes de son jour (colspan=2), comme une plage en
    // "journée entière" dans la grille à l'écran.
    h += '<tr class="print-mois"><th class="coin-annee">' + esc(anneesSemaine.join(" / ")) + '</th>';
    groupesMois.forEach(function (g) { h += '<th colspan="' + (g.span * 2) + '">' + esc(g.mois) + '</th>'; });
    h += '</tr>';
    // round du 15.09.2026 (suite) — Lionel : "Inscription semaine N dans la
    // case sous l'année". Cette case de coin (rowspan=2, sous "2026")
    // était vide jusqu'ici ; elle prend maintenant le numéro de semaine —
    // d'autant plus utile que "Aperçu impression — semaine N" (le titre de
    // la modale, cf. cp-titre plus haut) ne s'imprime plus (cf. @media
    // print, "pas besoin de aperçu avant impression - semaine N") : sans
    // ça, le numéro de semaine aurait disparu du document imprimé.
    h += '<tr><th rowspan="2" class="coin-semaine">Semaine ' + esc(data.numero) + '</th>';
    jl.forEach(function (j) { h += '<th colspan="2">' + j.j + ' ' + j.d + '</th>'; });
    h += '</tr>';
    h += '<tr class="print-demis">';
    jl.forEach(function () { h += '<th>Matin</th><th class="demi-aprem">Aprem</th>'; });
    h += '</tr></thead><tbody>';

    // round du 15.09.2026 (suite, suite, suite) — Lionel : "ajoute les
    // libellé jalon et note dans la colonne gauche" (même demande, et
    // mêmes libellés "Jalons"/"Notes", que sur la grille compacte à
    // l'écran — cf. construireGrille, "Titre de ligne" — pour la même
    // raison : sans repère textuel, la colonne de gauche ne dit plus quelle
    // ligne est quoi une fois qu'on ne voit plus la légende de couleurs).
    // Round du 16.09.2026 (suite) — Lionel : "il reste le mot 'note' dans
    // l'imprimé. le supprimer." Revient uniquement sur "Notes" (cf. plus bas,
    // print-notes) : "Jalons" reste, lui, toujours demandé et donc affiché.
    h += '<tr class="print-jalons"><td style="font-weight:700;white-space:nowrap">Jalons</td>';
    // round du 16.09.2026 — Lionel : "tout jalons identique doit être lié".
    // Jusqu'ici chaque JOUR avait sa propre cellule (colspan=2, un jalon
    // n'ayant qu'un texte par jour, pas de granularité demi comme les cases
    // personne) — 2 jours consécutifs portant le même texte de jalon (ex:
    // "Maçonnerie" 3 jours de suite) s'affichaient donc comme des cases
    // identiques mais séparées par une bordure de jour banale, comme si
    // c'étaient 2 jalons différents qui coïncidaient par hasard. Même
    // principe de fusion que celui déjà utilisé pour matin/aprem d'une case
    // personne (infoCase/celluleTache un peu plus bas, portage mockup round
    // 12) mais appliqué ici ENTRE PLUSIEURS JOURS consécutifs plutôt
    // qu'entre les 2 demis d'un même jour : une seule cellule fusionnée
    // (colspan = 2 × nombre de jours du groupe) recouvre toute la série,
    // sans bordure interne — un seul jalon continu plutôt que des jalons
    // identiques mais visuellement découpés jour par jour. Comme pour la
    // fusion matin/aprem, seuls les jalons NON VIDES se fusionnent : 2 jours
    // sans jalon ne "partagent" rien, donc restent des cases distinctes
    // (mêmes choix, même raisonnement que le commentaire de infoCase plus
    // bas).
    var jalonsImpr = data.jalons || [];
    for (var ij = 0; ij < jalonsImpr.length; ij++) {
      var txtJ = jalonsImpr[ij] ? jalonsImpr[ij].texte : "";
      if (!txtJ) {
        h += '<td colspan="2"></td>';
        continue;
      }
      var runLen = 1;
      while (ij + runLen < jalonsImpr.length && jalonsImpr[ij + runLen] && jalonsImpr[ij + runLen].texte === txtJ) {
        runLen++;
      }
      h += '<td colspan="' + (runLen * 2) + '" class="filled">' + esc(txtJ) + '</td>';
      ij += runLen - 1;
    }
    h += '</tr>';

    // Portage mockup (rounds 7-9) — classes print-spacer-jalons/personne
    // (cf. leur commentaire CSS) : le PREMIER spacer qui suit la ligne
    // Jalons porte toujours print-spacer-jalons, que ce soit le spacer
    // avant Notes (si elle est remplie) ou, sinon, directement le spacer
    // avant la 1ère personne juste en dessous — ces 2 cas ne peuvent pas
    // survenir en même temps, donc jamais posée 2 fois.
    if (notesRemplies) {
      h += '<tr class="print-spacer print-spacer-jalons"><td colspan="' + NB_COLS + '"></td></tr>';
      h += '<tr class="print-notes"><td style="font-weight:700;white-space:nowrap"></td>';
      (data.notes || []).forEach(function (entries) {
        var rempli = entries && entries.length > 0;
        var txt = (entries || []).map(function (n) {
          var ouvre = n.important ? '<span class="print-important">' : "";
          var ferme = n.important ? '</span>' : "";
          return ouvre + esc(n.texte) + ferme;
        }).join("<br>");
        h += '<td colspan="2" class="' + (rempli ? "filled" : "") + '">' + txt + '</td>';
      });
      h += '</tr>';
    }

    // print-spacer-personne (round 8) : ce spacer précède TOUJOURS la 1ère
    // personne, donc porte toujours cette classe. print-spacer-jalons SE
    // CUMULE dessus seulement si Notes n'a pas déjà pris ce rôle juste
    // au-dessus (sinon ce spacer-ci n'est plus le premier après Jalons).
    h += '<tr class="print-spacer print-spacer-personne' + (notesRemplies ? '' : ' print-spacer-jalons') + '"><td colspan="' + NB_COLS + '"></td></tr>';

    // classeDemi (round du 15.09.2026, suite — "traitillé entre aprèm et
    // matin") : posée uniquement côté aprem, pour que le CSS (.demi-aprem)
    // ne mette en traitillé QUE la frontière interne matin→aprem, jamais
    // la frontière entre 2 jours (bordure gauche de la case matin du jour
    // suivant, qui elle n'a pas cette classe et reste pleine). Round du
    // 16.09.2026 : portée maintenant sur chaque `.print-bande` plutôt que
    // sur le `<td>` lui-même (cf. commentaire détaillé sur celluleTache
    // ci-dessous) — le sélecteur CSS `.demi-aprem` (générique, sans égard
    // au type d'élément) continue de matcher sans le moindre changement.
    //
    // infoCase/celluleTache (portage mockup round 12 — Lionel : "fait de
    // même entre les matins et après-midi. Fusionner les cases qui
    // comportent la même tâche" — réécrit round du 16.09.2026 pour Option A,
    // "bande de couleur par tâche", choisie par Lionel via AskUserQuestion
    // pour représenter plusieurs chantiers sur une même case à
    // l'impression) : infoCase calcule maintenant un FRAGMENT (bg + texte)
    // par TÂCHE de la case plutôt qu'un seul fond+texte pour toute la case
    // — chaque tâche empilée garde sa propre couleur de chantier, exactement
    // comme sur la grille à l'écran (bulleEl). celluleTache sérialise un
    // <td> unique contenant UN <div class="print-bande"> par fragment
    // (padding déplacé du <td> vers chaque bande, cf. CSS table.print-table
    // td.td-tache/.print-bande) ; la comparaison matin/aprem qui décide de
    // la fusion (fusionnee) porte donc sur le tableau COMPLET des fragments
    // (JSON.stringify), plus seulement sur un texte+fond uniques.
    function infoCase(p, cell) {
      var taches = (cell && cell.taches) || [];
      if (!taches.length) {
        // Case sans aucune tâche : au mieux un chantier de repli (vieille
        // ligne `assignations` jamais réécrite, cf. celluleVue_), sinon
        // fond neutre — toujours UN SEUL fragment, comme n'importe quelle
        // case avant Option A.
        var bg0 = "transparent";
        if (cell && cell.chantier) {
          var ch0 = etat.chantierParNom[cell.chantier];
          bg0 = ch0 ? ch0.couleur : "#e5e5e5";
        }
        return { fragments: [{ bg: bg0 === "transparent" ? "var(--surface-2)" : bg0, txt: "" }], empty: true };
      }
      var fragments = taches.map(function (t) {
        // Absence (round du 16.09.2026) : désormais détectée PAR TÂCHE
        // (t.absence, la vraie colonne — cf. tacheVue_), avec le même filet
        // de sécurité estAbsence(texte) qu'ailleurs dans ce fichier, plutôt
        // que sur le texte JOINT de toute la case (l'ancien fondCase/
        // detailJoint, qui ne regardait d'ailleurs jamais la vraie colonne) —
        // cohérent avec la fusion écran (construireVueDepuisCache) et
        // correct puisque chaque tâche a maintenant sa PROPRE bande.
        var estAbs = !!t.absence || estAbsence(t.texte);
        var bg = "transparent";
        if (estAbs) {
          bg = "var(--absence-bg)";
        } else if (t.chantier) {
          var ch = etat.chantierParNom[t.chantier];
          bg = ch ? ch.couleur : "#e5e5e5";
        }
        var badge = (p.sousTraitant && t.statut && STATUTS[t.statut]) ? ' <span class="print-statut" style="background:' + STATUTS[t.statut].couleur + '">' + esc(STATUTS[t.statut].nom) + '</span>' : "";
        var ouvre = t.important ? '<span class="print-important">' : "";
        var ferme = t.important ? '</span>' : "";
        return { bg: bg === "transparent" ? "var(--surface-2)" : bg, txt: ouvre + esc(t.texte) + ferme + badge };
      });
      return { fragments: fragments, empty: false };
    }
    // Fond du <td> = couleur de la DERNIÈRE bande (round du 16.09.2026,
    // 2e essai — un premier essai avec un wrapper flex height:100% s'est
    // avéré ne PAS marcher : dans un tableau à hauteur de ligne "auto",
    // aucun descendant statique ne peut se dimensionner en % contre la
    // hauteur d'une cellule, celle-ci n'étant définitive qu'une fois le
    // contenu de TOUTES les cellules de la ligne connu — confirmé par un
    // test isolé où même un simple <div style="height:100%"> restait
    // cantonné à sa propre hauteur de contenu). Un <td>, lui, REMPLIT
    // toujours la hauteur de sa ligne — propriété native de n'importe
    // quelle cellule de tableau, jamais soumise à ce problème. Poser la
    // couleur de la dernière bande directement sur le <td> fait donc
    // "déborder" cette couleur sur tout espace restant sous les bandes
    // (les bandes, opaques, restent dessus et gardent leur propre couleur
    // pour leur propre hauteur) — sans ça, une case à peu de bandes (voire
    // une seule, ex. "Pose parpaings") laissait un bloc blanc parasite sous
    // sa bande dès qu'une AUTRE case du même jour empilait plusieurs tâches
    // et étirait la ligne entière (bug constaté au premier rendu réel de ce
    // round, cf. FRONTEND-CHANGELOG.md). Imperfection mineure acceptée :
    // sur une case à PLUSIEURS bandes de couleurs différentes ET côté aprem
    // (classeDemi), le pointillé .demi-aprem (cf. son commentaire CSS,
    // background-color:inherit) peut reprendre cette couleur de dernière
    // bande sur toute la hauteur plutôt que celle, différente, d'une bande
    // du dessus — un artefact d'1px de large, au bord partagé avec la case
    // voisine, jugé négligeable face à la complexité d'un vrai découpage
    // par bande.
    function celluleTache(info, classeDemi, fusionnee) {
      var bandes = info.fragments.map(function (f) {
        return '<div class="print-bande" style="background:' + f.bg + '">' + f.txt + '</div>';
      }).join("");
      var lastBg = info.fragments[info.fragments.length - 1].bg;
      return '<td class="td-tache' + (classeDemi ? ' ' + classeDemi : '') + '"' + (fusionnee ? ' colspan="2"' : '') + ' style="background:' + lastBg + '">' + bandes + '</td>';
    }

    imprimes.forEach(function (p, idx) {
      h += '<tr>';
      h += '<td style="font-weight:700;white-space:nowrap">' + esc(p.nom) + '</td>';
      for (var i = 0; i < jl.length; i++) {
        var infoMatin = infoCase(p, (p.matin || [])[i]);
        var infoAprem = infoCase(p, (p.aprem || [])[i]);
        // Fusion (round 12 ; étendue au tableau COMPLET de fragments round
        // du 16.09.2026, Option A) seulement si le contenu est RÉELLEMENT
        // identique des 2 côtés (mêmes tâches, mêmes chantiers, même ordre)
        // ET non vide — 2 cases vides ne "comportent" aucune tâche, donc pas
        // de fusion entre elles (choix de Lionel dans le mockup, jamais
        // amendé depuis).
        if (!infoMatin.empty && JSON.stringify(infoMatin.fragments) === JSON.stringify(infoAprem.fragments)) {
          h += celluleTache(infoMatin, null, true);
        } else {
          h += celluleTache(infoMatin, null, false);
          h += celluleTache(infoAprem, "demi-aprem", false);
        }
      }
      h += '</tr>';
      if (idx < imprimes.length - 1) {
        // round du 15.09.2026 (suite) — Lionel : "Ligne entre personnel et
        // intervenants, vide et sans couleur aussi, un peu plus large que
        // celle entre le personnel" — même spacer invisible partout, avec
        // en plus la classe "print-spacer-section" (juste plus haute)
        // seulement à la frontière calculée plus haut. print-spacer-personne
        // (portage mockup, rounds 8-9) : posée sur TOUS ces spacers, cf. son
        // commentaire CSS pour le raisonnement complet.
        var classeSpacer = "print-spacer print-spacer-personne" + (idx === indexFrontiereSection ? " print-spacer-section" : "");
        h += '<tr class="' + classeSpacer + '"><td colspan="' + NB_COLS + '"></td></tr>';
      }
    });

    h += '</tbody></table>';

    var legendKeys = Object.keys(chantiersUtilises);
    if (legendKeys.length) {
      h += '<div class="print-legend">';
      legendKeys.forEach(function (nomChantier) {
        var ch = etat.chantierParNom[nomChantier];
        h += '<div class="legend-item"><span class="sw" style="background:' + (ch ? ch.couleur : "#e5e5e5") + '"></span>' + esc(nomChantier) + '</div>';
      });
      h += '</div>';
    }
    if (sautees > 0) {
      h += '<div class="skip-note">' + sautees + ' personne(s) sans rien cette semaine — masquée(s) à l’impression.</div>';
    }
    h += '</div>'; // .print-doc

    h += '<div class="impression-actions"><button type="button" class="f-fermer">Fermer</button><button type="button" class="btn-primaire f-genpdf">Imprimer / PDF</button></div>';
    pop.innerHTML = h;
    document.body.appendChild(overlay);
    document.body.appendChild(pop);
    function nettoyer() { overlay.remove(); pop.remove(); if (popFermerActuel === nettoyer) popFermerActuel = null; }
    overlay.addEventListener("pointerdown", nettoyer);
    pop.querySelector(".f-fermer").addEventListener("click", nettoyer);
    popFermerActuel = nettoyer;

    // round du 15.09.2026 — Lionel : "on peut travailler sur la page
    // d'impression ?". Ce bouton appelait gs("apiGenererPdf", ...), donc
    // google.script.run — plus rien depuis l'hébergement sur GitHub Pages
    // (§8 du plan de migration, resté ouvert) : l'appel levait une
    // exception systématiquement rattrapée par le catch ci-dessous depuis
    // le 07.09.2026 (message clair, mais aucun PDF produit). Plutôt qu'une
    // nouvelle fonction serveur pour reconstruire un PDF depuis zéro
    // (Edge Function), choix de Lionel : s'appuyer sur l'impression du
    // NAVIGATEUR, directement sur cet aperçu (cf. @media print,
    // .impression-modal, plus haut dans <style>) — "Enregistrer en PDF"
    // dans la boîte qui s'ouvre donne le même fichier, sans aller-retour
    // serveur ni dépendance nouvelle.
    var genBtn = pop.querySelector(".f-genpdf");
    genBtn.addEventListener("click", function () { window.print(); });
  }

  verifierSessionEtDemarrer();
})();
</script>
</body>
</html>
