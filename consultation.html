<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<!-- ============================================================
     CONSULTATION EN LECTURE SEULE — round du 25.09.2026 (suite 51)
     ------------------------------------------------------------
     Proposition 10 retenue par Lionel (« 8,9,10,13,14,15 m'intéressent ») :
     « Lien de consultation : un lien en lecture seule à donner aux ouvriers
     ou aux sous-traitants pour qu'ils voient leur planning sur leur
     téléphone, sans pouvoir rien modifier. »

     Page autonome : ni connexion, ni supabase-js, ni le code de l'appli.
     consultation.html?j=<jeton> — le jeton (32 caractères aléatoires) est
     créé depuis l'onglet Personnel (bouton « Lien », js/page-personnel.js).
     Tout passe par UNE fonction serveur, consultation_planning(jeton,
     lundi) (sql/0018_liens_consultation.sql), qui ne renvoie que la semaine
     de cette personne. Logique : js/consultation.js.
     Suite 69 (27.09.2026) : le personnel peut aussi y DEMANDER une absence
     (sql/0020_demandes_absence.sql), que Lionel valide dans son planning.
     Suite 83 : barre du bas (demande + cloche), modifier / retirer /
     annuler ses demandes (sql/0021_demandes_absence_modifier.sql).
     ============================================================ -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#1f4d8f">
<title>Mon planning</title>
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;700;800&display=swap">
<style>
  :root {
    --bg: #eef0ec; --surface: #ffffff; --surface-2: #f0f0f0;
    --ink: #1a2129; --ink-muted: #57616b; --ink-faint: #8b93a0;
    --border: #d7dad2; --accent: #1f4d8f; --accent-ink: #ffffff; --accent-soft: #e3ecf7;
    --ferie: #fbe3e3; --ferie-ink: #8a2b2b; --danger: #c0392b;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #10161d; --surface: #171f28; --surface-2: #1c2530;
      --ink: #eef1f4; --ink-muted: #9aa7b3; --ink-faint: #66717c;
      --border: #2b3540; --accent: #6fa6e8; --accent-ink: #0b1622; --accent-soft: #223247;
      --ferie: #3a2224; --ferie-ink: #f1b3b3; --danger: #ef7d6f;
      color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg); color: var(--ink);
    font-family: 'Archivo', 'Helvetica Neue', Arial, sans-serif; font-size: 15px; line-height: 1.35;
    -webkit-text-size-adjust: 100%;
  }
  button { font: inherit; color: inherit; }
  .entete {
    position: sticky; top: 0; z-index: 5; background: var(--accent); color: var(--accent-ink);
    padding: calc(10px + env(safe-area-inset-top, 0px)) 16px 10px;
  }
  .entete h1 { margin: 0; font-size: 19px; font-weight: 800; letter-spacing: -0.01em; }
  .entete .sous { font-size: 12.5px; opacity: .85; margin-top: 1px; }
  .nav {
    display: flex; align-items: center; gap: 8px; margin-top: 10px;
  }
  .nav button {
    border: 0; border-radius: 10px; background: rgba(255,255,255,.16); color: inherit;
    height: 40px; min-width: 44px; padding: 0 12px; font-weight: 700; cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  .nav button:disabled { opacity: .35; cursor: default; }
  .nav .semaine { flex: 1; text-align: center; font-weight: 700; font-size: 14.5px; }
  .nav .semaine small { display: block; font-weight: 400; font-size: 12px; opacity: .85; }
  @media (hover: hover) and (pointer: fine) { .nav button:not(:disabled):hover { background: rgba(255,255,255,.26); } }
  main { max-width: 640px; margin: 0 auto; padding: 12px 12px calc(28px + env(safe-area-inset-bottom, 0px)); }
  .message { text-align: center; color: var(--ink-muted); padding: 40px 16px; }
  .message b { display: block; color: var(--ink); font-size: 17px; margin-bottom: 6px; }
  .jour {
    background: var(--surface); border: 1px solid var(--border); border-radius: 14px;
    margin-bottom: 10px; overflow: hidden;
  }
  .jour.aujourdhui { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent) inset; }
  .jour-titre {
    display: flex; align-items: baseline; justify-content: space-between; gap: 8px;
    padding: 9px 12px; background: var(--surface-2); font-weight: 800; font-size: 15px;
  }
  .jour.aujourdhui .jour-titre { background: var(--accent-soft); }
  .jour-titre .etiquette { font-size: 11px; font-weight: 700; color: var(--accent); text-transform: uppercase; letter-spacing: .04em; }
  .jour-titre .heures { font-size: 12px; font-weight: 400; color: var(--ink-muted); white-space: nowrap; }
  .ferie { padding: 7px 12px; background: var(--ferie); color: var(--ferie-ink); font-weight: 700; font-size: 13.5px; }
  .demi { display: grid; grid-template-columns: 68px 1fr; gap: 8px; padding: 8px 12px; border-top: 1px solid var(--border); }
  .demi:first-of-type { border-top: 0; }
  .demi-nom { font-size: 12px; font-weight: 700; color: var(--ink-faint); text-transform: uppercase; letter-spacing: .03em; padding-top: 3px; }
  .demi-nom small { display: block; font-weight: 400; text-transform: none; letter-spacing: 0; }
  .taches { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
  .vide { color: var(--ink-faint); padding-top: 2px; }
  .tache {
    border-radius: 9px; padding: 7px 10px; background: var(--c, var(--surface-2)); color: #1a2129;
    border-left: 4px solid rgba(0,0,0,.18); overflow-wrap: anywhere;
  }
  .tache .texte { font-weight: 700; }
  .tache .details { font-size: 12.5px; margin-top: 2px; display: flex; flex-wrap: wrap; gap: 4px 10px; opacity: .85; }
  .tache .statut { display: inline-flex; align-items: center; gap: 4px; font-size: 11px; font-weight: 700; text-transform: uppercase;
    border-radius: 999px; padding: 1px 7px; background: var(--cs, rgba(255,255,255,.6)); }
  .tache.absence { background: repeating-linear-gradient(135deg, var(--surface-2) 0 8px, var(--surface) 8px 16px); color: var(--ink); }
  .tache .important { color: var(--danger); font-weight: 800; }
  /* Demandes d'absence (round du 27.09.2026, suite 69 — js/consultation.js).
     Suite 83 : le bloc « Mes absences » en tête de page est remplacé par
     la barre du bas (« Demander une absence » + cloche) et deux feuilles
     qui montent du bas : le formulaire et « Mes demandes ». */
  .btn-demander, .btn-secondaire, .btn-action {
    border: 0; border-radius: 10px; height: 38px; padding: 0 14px; font-weight: 700; cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  .btn-demander { background: var(--accent); color: var(--accent-ink); }
  .btn-demander:disabled { opacity: .5; cursor: default; }
  .btn-secondaire { background: var(--surface-2); }
  .btn-action { height: 32px; padding: 0 10px; background: var(--surface); border: 1px solid var(--border); font-size: 13px; }
  .btn-action:disabled { opacity: .5; cursor: default; }
  .btn-action.danger { color: var(--danger); }
  .form-absence { display: flex; flex-direction: column; gap: 10px; }
  .form-absence label { display: flex; flex-direction: column; gap: 4px; font-size: 13px; font-weight: 700; color: var(--ink-muted); flex: 1; min-width: 0; }
  .form-absence label small { font-weight: 400; }
  .form-absence input, .form-absence select, .form-absence textarea {
    font: inherit; font-size: 16px; color: var(--ink); background: var(--surface-2); border: 1px solid var(--border);
    border-radius: 9px; padding: 8px 10px; min-height: 40px; width: 100%;
  }
  .form-absence textarea { resize: vertical; }
  .fa-ligne { display: flex; align-items: flex-end; gap: 8px; }
  .fa-ligne select { width: auto; flex: 0 0 auto; }
  .fa-actions { display: flex; justify-content: flex-end; gap: 8px; }
  .fa-erreur { margin: 0; color: var(--danger); font-weight: 700; font-size: 13.5px; }
  .fa-aide { margin: 0; color: var(--ink-faint); font-size: 12px; }
  .fa-origine { margin: 0; padding: 7px 10px; border-radius: 9px; background: var(--surface-2); font-size: 13px; color: var(--ink-muted); }
  .demandes { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
  .demandes li { display: flex; flex-wrap: wrap; align-items: flex-start; gap: 6px 8px; padding: 9px 10px; border-radius: 11px; background: var(--surface-2); font-size: 13.5px; }
  .demandes .dq-texte { flex: 1; min-width: 0; overflow-wrap: anywhere; display: flex; flex-direction: column; gap: 1px; }
  .demandes .dq-texte small { color: var(--ink-faint); font-size: 12px; }
  .demandes .dq-actions { flex-basis: 100%; display: flex; justify-content: flex-end; gap: 6px; }
  .demandes .dq-actions:empty { display: none; }
  .demandes .etat { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .03em; border-radius: 999px; padding: 2px 8px;
    background: var(--surface); border: 1px solid var(--border); white-space: nowrap; }
  .demandes li.non-vu { box-shadow: 0 0 0 2px var(--accent) inset; }
  .demande-acceptee .etat { color: #1e7a3c; border-color: currentColor; }
  .demande-refusee .etat, .demande-supprimee .etat, .demande-annulee .etat { color: var(--danger); border-color: currentColor; }
  .demande-en_attente .etat { color: var(--accent); border-color: currentColor; }
  .demandes-vide { margin: 4px 0; color: var(--ink-faint); font-size: 13.5px; text-align: center; }
  .tache.demande { background: transparent; color: var(--ink); border: 1.5px dashed var(--ink-faint); border-left-width: 1.5px; }
  .chargement main { opacity: .55; transition: opacity .15s; }
  /* Barre du bas (suite 83) — Lionel : « Faire une barre de menu en bas.
     Y placer le bouton pour le formulaire de demande de congé. Cloche
     Notifications à droite pour voir l'état des demande de vacances. » */
  body.avec-barre-bas main { padding-bottom: calc(84px + env(safe-area-inset-bottom, 0px)); }
  .barre-bas {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; background: var(--surface); border-top: 1px solid var(--border);
    padding: 8px 12px calc(8px + env(safe-area-inset-bottom, 0px)); box-shadow: 0 -4px 14px rgba(0,0,0,.06);
  }
  .barre-bas[hidden] { display: none; }
  .barre-bas-interieur { max-width: 640px; margin: 0 auto; display: flex; align-items: center; gap: 10px; }
  .bb-demander {
    flex: 1; min-width: 0; height: 46px; border: 0; border-radius: 12px; background: var(--accent); color: var(--accent-ink);
    display: inline-flex; align-items: center; justify-content: center; gap: 8px; font-weight: 800; font-size: 15px; cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  .bb-demander svg { width: 18px; height: 18px; flex: 0 0 auto; }
  .bb-cloche {
    position: relative; flex: 0 0 auto; width: 52px; height: 46px; border: 1px solid var(--border); border-radius: 12px;
    background: var(--surface-2); color: var(--ink); display: inline-flex; align-items: center; justify-content: center; cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  .bb-cloche svg { width: 22px; height: 22px; }
  .bb-compte {
    position: absolute; top: -6px; right: -6px; min-width: 20px; height: 20px; padding: 0 5px; border-radius: 999px;
    background: var(--danger); color: #fff; font-size: 11.5px; font-weight: 800; line-height: 20px; text-align: center;
    box-shadow: 0 0 0 2px var(--surface);
  }
  .bb-compte[hidden] { display: none; }
  @media (hover: hover) and (pointer: fine) { .bb-demander:hover { filter: brightness(1.08); } .bb-cloche:hover { background: var(--accent-soft); } }
  /* Feuilles qui montent du bas (formulaire, « Mes demandes »). */
  body.feuille-ouverte { overflow: hidden; }
  .feuille-fond { position: fixed; inset: 0; z-index: 10; background: rgba(10,16,22,.45); }
  .feuille-fond[hidden], .feuille[hidden] { display: none; }
  .feuille {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 11; max-width: 640px; margin: 0 auto; max-height: calc(100% - 40px);
    display: flex; flex-direction: column; background: var(--surface); border-radius: 18px 18px 0 0; box-shadow: 0 -8px 30px rgba(0,0,0,.25);
  }
  .feuille-entete { display: flex; align-items: center; gap: 8px; padding: 14px 14px 8px 16px; }
  .feuille-entete h2 { flex: 1; margin: 0; font-size: 17px; font-weight: 800; }
  .feuille-fermer { border: 0; background: var(--surface-2); border-radius: 999px; width: 34px; height: 34px; font-size: 20px; line-height: 1; cursor: pointer; }
  .feuille-corps { overflow-y: auto; padding: 4px 16px calc(16px + env(safe-area-inset-bottom, 0px)); overscroll-behavior: contain; }
</style>
</head>
<body>
<header class="entete">
  <h1 id="nom">Mon planning</h1>
  <!-- Suite 83 — Lionel : « Commentaire "recharge la page pour voir les derniers changements." en haut à la place de " le planning est tenu par le bureau" » -->
  <div class="sous">Recharge la page pour voir les derniers changements.</div>
  <div class="nav">
    <button type="button" id="btnPrecedente" aria-label="Semaine précédente">‹</button>
    <div class="semaine" id="titreSemaine">…</div>
    <button type="button" id="btnSuivante" aria-label="Semaine suivante">›</button>
    <button type="button" id="btnAujourdhui">Auj.</button>
  </div>
</header>
<main id="contenu"><p class="message">Chargement…</p></main>
<!-- Barre du bas et feuilles (suite 83, js/consultation.js) : personnel
     seulement (peut_demander), comme les demandes d'absence. -->
<nav class="barre-bas" id="barreBas" hidden><div class="barre-bas-interieur">
  <button type="button" class="bb-demander" id="btnDemanderAbsence"><svg viewBox="0 0 20 20" fill="none" aria-hidden="true"><rect x="2.5" y="4" width="15" height="13" rx="1.5" stroke="currentColor" stroke-width="1.6"/><path d="M2.5 8h15M6 2.5v3M14 2.5v3" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><path d="M10 10.3v4.4M7.8 12.5h4.4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg><span>Demander une absence</span></button>
  <button type="button" class="bb-cloche" id="btnNotifications" aria-label="Mes demandes d’absence" title="Mes demandes d’absence"><svg viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="M5 14.5V9a5 5 0 0 1 10 0v5.5l1.3 1.5H3.7L5 14.5z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/><path d="M8.2 16.5a1.9 1.9 0 0 0 3.6 0" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><path d="M10 2.3V4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg><span class="bb-compte" id="compteNotifications" hidden></span></button>
</div></nav>
<div class="feuille-fond" id="feuilleFond" hidden></div>
<section class="feuille" id="feuille" role="dialog" aria-modal="true" aria-labelledby="feuilleTitre" hidden>
  <div class="feuille-entete"><h2 id="feuilleTitre"></h2><button type="button" class="feuille-fermer" id="feuilleFermer" aria-label="Fermer">×</button></div>
  <div class="feuille-corps" id="feuilleCorps"></div>
</section>
<script src="js/rotation.js"></script>
<script src="js/consultation.js"></script>
</body>
</html>
