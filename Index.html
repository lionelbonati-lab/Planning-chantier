    return { id: "b" + (idc++), type: type, texte: texte, important: !!opts.important, giDebut: giDebut, duree: Math.max(1, duree), serieId: opts.serieId || null, demiDebut: opts.demiDebut || null, demiFin: opts.demiFin || null };
  }
  // demiDebut/demiFin (round du 08.09.2026, suite — §49) : une tâche/absence
  // porte désormais sa demi-journée PAR BORD, exactement comme un jalon/note
  // (cf. itemPlage ci-dessus) — plus un seul champ `demi` fixe pour toute sa
  // durée. C'est ce qui permet "matin+aprem jour1, matin jour2" (1.5 jour)
  // d'être NATIVEMENT un seul item continu plutôt que 2 items collés
  // visuellement après coup (l'ancienne approche du §48, abandonnée — cf.
  // FRONTEND-CHANGELOG §49 : Lionel, "1 tâche ne peut pas être mise sur 2
  // case, elle s'étend de 1 jour").
  function itemPlageTache(type, texte, personneId, giDebut, duree, opts) {
    opts = opts || {};
    return {
      id: "b" + (idc++), type: type, texte: texte, chantier: opts.chantier || null,
      important: !!opts.important, statut: opts.statut || null,
      personneId: personneId, giDebut: giDebut, duree: Math.max(1, duree),
      demiDebut: opts.demiDebut || null, demiFin: opts.demiFin || null,
      serieId: opts.serieId || null
    };
  }

  function construireVueDepuisCache() {
    var donnees = fenetreDonnees();
    var d0 = donnees[0];

    // PERSONNES : ancre = identité stable (indépendante du nom, cf. §6 du
    // spec) ; la liste vient de la 1ère semaine affichée, chaque ligne est
    // recherchée par ancre dans l'éventuelle 2e semaine.
    PERSONNES = (d0.personnes || []).map(function (p) {
      return { id: String(p.ancre), nom: p.nom, sousTraitant: !!p.sousTraitant };
    });

    // CHANTIERS : clé = NOM (c'est la clé de reconnaissance réelle côté
    // feuille — cf. §6/§7 du spec, apiListerChantiers n'a pas d'id).
    CHANTIERS = {};
    etat.chantiers.forEach(function (c) { CHANTIERS[c.nom] = { nom: c.nom, couleur: c.couleur, ligne: c.ligne }; });

    TACHES = []; JALONS = []; NOTES = [];
    var nJoursFenetre = donnees.length * 5;

    // ---- jalons/notes : un item par jour non vide, fusionné avec ses
    // voisins immédiats de contenu strictement identique (même principe que
    // cellulesFusionnees() de V2). Jalon = 1 texte par jour ; note = liste
    // indépendante par jour, fusionnée "slot par slot" (position dans le
    // tableau du jour) — cf. FRONTEND-CHANGELOG.md pour les cas limites.
    donnees.forEach(function (data, s) {
      for (var j = 0; j < 5; j++) {
        var gi = s * 5 + j;
        var jd = jalonAuGi(donnees, gi); // {texte, serieId, demi} ou null
        var txt = jd ? jd.texte : "";
        if (txt && !dejaCouvertPlage(JALONS, gi)) {
          // Fusion d'un jalon avec sa demi-journée (round du 08.09.2026,
          // suite — parité avec les notes, cf. §47 du FRONTEND-CHANGELOG) :
          // MÊME principe que la fusion des notes juste plus bas
          // (demiN/demiCourant) — seuls les 2 BORDS de la plage fusionnée
          // peuvent porter une demi-journée, tout jour du MILIEU doit être
          // une journée entière (sinon la fusion s'arrête là, ce jour
          // devient le bord de fin du run).
          var demiJ = jd.demi || null;
          var demiCourantJ = demiJ;
          var fin = gi;
          while (fin + 1 < nJoursFenetre) {
            if (fin !== gi && demiCourantJ !== null) break;
            var jsuiv = jalonAuGi(donnees, fin + 1);
            if (!jsuiv || jsuiv.texte !== txt) break;
            fin++;
            demiCourantJ = jsuiv.demi || null;
          }
          var it = itemPlage("jalon", txt, gi, fin - gi + 1, { demiDebut: demiJ, demiFin: demiCourantJ });
          it.serieId = jd.serieId || null;
          it.dateDebutIso = isoDeGiFenetre(donnees, gi);
          JALONS.push(it);
        }
      }
    });
    // notes : jusqu'à N notes simultanées par jour (empilement) fusionnées en
    // une seule bulle continue avec le(s) jour(s) voisin(s) de même texte +
    // important.
    //
    // Round du 08.09.2026 — bug signalé par Lionel, capture d'écran à
    // l'appui : « les bulles se retrouvent scindée ou retrecie après
    // certains déplacmement ». AVANT ce correctif, la fusion appariait le
    // jour gi et le jour gi+1 en comparant le MÊME INDEX dans leur tableau
    // de notes respectif (l'ancienne noteSlotAuGi(donnees, gi, slot)) — un
    // raccourci qui suppose qu'une note à cheval sur 2 jours occupe toujours
    // le même rang parmi les notes de CHAQUE jour. Ce n'est vrai que tant
    // qu'aucune AUTRE note ne partage l'un des 2 jours avec un rang
    // différent — ce que enregistrer-plage peut désormais casser à chaque
    // déplacement en demi-journée (§38 ci-dessus) : chaque jour touché est
    // reconstruit par delete-puis-insert (cf. functions/enregistrer-plage/logic.js,
    // planPlage), donc l'ID (et donc le rang par ID croissant, cf.
    // construireDonneesSemaine un peu plus haut) d'une même note change à
    // chaque écriture, sans lien garanti avec son rang sur le jour voisin.
    // Reproduit en isolant le cas exact : une note "autre" seule sur un
    // jour, une note à cheval AUSSI présente sur ce jour-là mais avec un ID
    // plus grand (donc 2e du tableau ce jour-là) tandis qu'elle est SEULE
    // sur le jour suivant (donc 1ère, indice 0) — les 2 moitiés de la note à
    // cheval tombaient alors sur des indices différents et se rendaient
    // comme 2 bulles indépendantes d'un seul jour chacune (repliées sur
    // elles-mêmes, d'où le « rétrécie » de Lionel), au lieu d'une seule
    // bulle continue.
    //
    // Correctif : on ne suit plus un rang FIXE entre les jours — chaque jour
    // garde son propre ensemble d'indices déjà « consommés » par une bulle
    // déjà construite (consommes[gi]), et prolonger une bulle vers le jour
    // suivant cherche, PARMI LES INDICES NON ENCORE CONSOMMÉS de ce
    // jour-là, une note de même texte + même important — où qu'elle se
    // trouve dans le tableau, peu importe son rang. Le cas « 2 notes
    // indépendantes de même texte le même jour » (cf. commentaire plus haut
    // sur planPlage, "Livraison" matin/après-midi) reste géré correctement :
    // chaque note n'est consommée qu'une fois, donc si l'une sert à
    // prolonger une bulle qui vient de la veille, l'autre reste disponible
    // pour démarrer (ou prolonger) sa propre bulle indépendante.
    var consommes = {}; // gi -> Set(index) déjà utilisés par une bulle déjà construite
    function notesArrayAuGi_(gi) {
      var data = donnees[Math.floor(gi / 5)];
      return (data && data.notes && data.notes[gi % 5]) || [];
    }
    function indexNonConsommeCorrespondant_(gi, texte, important) {
      var arr = notesArrayAuGi_(gi);
      var used = consommes[gi];
      for (var i = 0; i < arr.length; i++) {
        if (used && used[i]) continue;
        if (arr[i].texte === texte && !!arr[i].important === !!important) return i;
      }
      return -1;
    }
    function marquerConsomme_(gi, idx) {
      if (!consommes[gi]) consommes[gi] = {};
      consommes[gi][idx] = true;
    }
    for (var giStart = 0; giStart < nJoursFenetre; giStart++) {
      var arrStart = notesArrayAuGi_(giStart);
      for (var idxStart = 0; idxStart < arrStart.length; idxStart++) {
        if (consommes[giStart] && consommes[giStart][idxStart]) continue;
        var entree = arrStart[idxStart];
        marquerConsomme_(giStart, idxStart);
        // demiDebut/demiFin (round du 03.09.2026) : seuls les 2 BORDS d'une
        // note fusionnée peuvent porter une demi-journée, tout jour du
        // MILIEU doit être une journée entière — sinon la fusion s'arrête
        // là (ce jour devient le bord de fin du run). `demiCourant` est la
        // demi du DERNIER jour inclus jusqu'ici ; tant qu'il n'est pas
        // encore le seul jour du run (fin2 === giStart), avoir une demi non
        // nulle ne bloque rien : ce jour-là est justement le bord de
        // départ, pas un jour du milieu.
        var demiN = entree.demi || null;
        var demiCourant = demiN;
        var fin2 = giStart;
        while (fin2 + 1 < nJoursFenetre) {
          if (fin2 !== giStart && demiCourant !== null) break;
          var idxSuiv = indexNonConsommeCorrespondant_(fin2 + 1, entree.texte, entree.important);
          if (idxSuiv === -1) break;
          var suiv = notesArrayAuGi_(fin2 + 1)[idxSuiv];
          fin2++;
          marquerConsomme_(fin2, idxSuiv);
          demiCourant = suiv.demi || null;
        }
        var itn = itemPlage("note", entree.texte, giStart, fin2 - giStart + 1, { important: entree.important, demiDebut: demiN, demiFin: demiCourant });
        itn.serieId = entree.serieId || null;
        itn.dateDebutIso = isoDeGiFenetre(donnees, giStart);
        NOTES.push(itn);
      }
    }

    // ---- tâches/absences personnel+intervenants : fusion par DEMI-SLOT
    // (round du 08.09.2026, suite, encore — §49), même principe que les
    // notes ci-dessus (appariement par CONTENU, indices "non consommés" —
    // jamais par position fixe dans le tableau) mais étendu à TOUTE la
    // séquence matin/aprem d'une personne, pas seulement une demi-journée
    // fixe. Avant ce round, la boucle groupait séparément "matin" et
    // "aprem" (2 passes indépendantes, jamais de pont entre les deux) : une
    // tâche à cheval matin/aprem ne pouvait donc JAMAIS être un seul item —
    // exactement la limite que Lionel signalait ("1 tâche ne peut pas être
    // mise sur 2 case, elle s'étend de 1 jour"). Le chantier d'une case (cf.
    // FRONTEND-CHANGELOG, limite structurelle : 1 seul chantier par case
    // réelle) est répliqué sur chaque tâche de cette case-là, exactement
    // comme avant.
    //
    // Un "demi-slot" numérote consécutivement les demi-journées OUVRÉES
    // d'une personne : hi=2*gi est le matin du jour gi, hi=2*gi+1 son
    // après-midi (même convention que demiSlotsDepuisBornes/
    // bornesDepuisDemiSlots, réutilisées ici pour reconvertir la paire de
    // bornes fusionnée en {giDebut, duree, demiDebut, demiFin}). Le
    // week-end (case isolée, jamais de plage) reste géré par sa propre
    // boucle séparée juste après, comme avant ce round.
    PERSONNES.forEach(function (p) {
      function tableauAuHalfSlot_(hi) {
        var gi = Math.floor(hi / 2), demi = (hi % 2 === 0) ? "matin" : "aprem";
        var data = donnees[Math.floor(gi / 5)];
        var pd = data && trouverPersonneDonnees(data, p.id);
        var cell = pd ? pd[demi][gi % 5] : null;
        return (cell && cell.taches) || [];
      }
      function chantierAuHalfSlot_(hi) {
        var gi = Math.floor(hi / 2), demi = (hi % 2 === 0) ? "matin" : "aprem";
        return chantierCelluleAuGi(donnees, p.id, demi, gi);
      }
      var consommesT = {}; // hi -> Set(index déjà utilisé par un item déjà construit)
      function indexNonConsommeCorrespondantT_(hi, texte, important, statut, chantier) {
        var arr = tableauAuHalfSlot_(hi);
        var used = consommesT[hi];
        var chIci = chantierAuHalfSlot_(hi) || null;
        for (var i = 0; i < arr.length; i++) {
          if (used && used[i]) continue;
          if (arr[i].texte === texte && !!arr[i].important === !!important && (arr[i].statut || null) === (statut || null) && chIci === (chantier || null)) return i;
        }
        return -1;
      }
      function marquerConsommeT_(hi, idx) { (consommesT[hi] = consommesT[hi] || {})[idx] = true; }

      var nHalfFenetre = nJoursFenetre * 2;
      for (var hiStart = 0; hiStart < nHalfFenetre; hiStart++) {
        if (estGiWeekend(Math.floor(hiStart / 2))) continue;
        var arrStart = tableauAuHalfSlot_(hiStart);
        for (var idxStart = 0; idxStart < arrStart.length; idxStart++) {
          if (consommesT[hiStart] && consommesT[hiStart][idxStart]) continue;
          var entreeT = arrStart[idxStart];
          var chantierT = chantierAuHalfSlot_(hiStart) || null;
          marquerConsommeT_(hiStart, idxStart);
          var finHi = hiStart;
          while (finHi + 1 < nHalfFenetre && !estGiWeekend(Math.floor((finHi + 1) / 2))) {
            var idxSuivT = indexNonConsommeCorrespondantT_(finHi + 1, entreeT.texte, entreeT.important, entreeT.statut, chantierT);
            if (idxSuivT === -1) break;
            finHi++;
            marquerConsommeT_(finHi, idxSuivT);
          }
          var bornesT = bornesDepuisDemiSlots(hiStart, finHi);
          var typT = estAbsence(entreeT.texte) ? "absence" : "tache";
          var ittT = itemPlageTache(typT, entreeT.texte, p.id, bornesT.giDebut, bornesT.duree, {
            chantier: typT === "absence" ? null : chantierT, important: entreeT.important, statut: entreeT.statut || null,
            demiDebut: bornesT.demiDebut, demiFin: bornesT.demiFin
          });
          ittT.serieId = entreeT.serieId || null;
          ittT.dateDebutIso = isoDeGiFenetre(donnees, bornesT.giDebut);
          TACHES.push(ittT);
        }
      }
    });

    // ---- week-end (colonne fusionnée jj=6/7, §2 du spec) : UNE seule
    // cellule serveur par personne, que apiChargerSemaine scinde déjà en 2
    // entrées {chantier,taches} (Samedi = weekend[0], Dimanche = weekend[1]).
    // Toujours posées avec demi:"matin" — seule ligne interactive côté
    // client pour le week-end (cf. ligneGroupePersonnes/creerCelluleWeekendInerte) :
    // si les 2 lignes matin/aprem écrivaient toutes les deux, elles
    // écraseraient alternativement la même cellule serveur. Durée toujours 1
    // (case isolée, jamais de plage sur le week-end — cf. estGiWeekend un peu
    // partout dans le moteur de drag/redim).
    PERSONNES.forEach(function (p) {
      donnees.forEach(function (data, s) {
        var pd = trouverPersonneDonnees(data, p.id);
        if (!pd || !pd.weekend) return;
        [0, 1].forEach(function (j) {
          var vueJour = pd.weekend[j];
          if (!vueJour) return;
          var giWE = giWeekend(s, j);
          (vueJour.taches || []).forEach(function (t) {
            var typ = estAbsence(t.texte) ? "absence" : "tache";
            var itwe = itemPlageTache(typ, t.texte, p.id, giWE, 1, {
              chantier: typ === "absence" ? null : (vueJour.chantier || null), important: t.important, statut: t.statut || null,
              demiDebut: "matin", demiFin: "matin"
            });
            itwe.serieId = t.serieId || null;
            itwe.dateDebutIso = isoDeGi(giWE);
            TACHES.push(itwe);
          });
        });
      });
    });

    syncBaseline = calculerEtatLocal();
  }
  function trouverPersonneDonnees(data, ancre) {
    var a = String(ancre);
    for (var i = 0; i < data.personnes.length; i++) if (String(data.personnes[i].ancre) === a) return data.personnes[i];
    return null;
  }
  // {texte, serieId} ou null — round "idem pour les modifications de
  // série" (01.09.2026) : le serveur renvoie désormais un objet décodé par
  // jour (cf. apiChargerSemaine, WebApp.gs) au lieu d'une simple chaîne, ce
  // qui permet enfin au client de connaître le serieId d'un jalon.
  function jalonAuGi(donnees, gi) {
    var data = donnees[Math.floor(gi / 5)];
    var j = data && data.jalons ? data.jalons[gi % 5] : null;
    return (j && j.texte) ? j : null;
  }
  function tacheSlotAuGi(donnees, ancre, demi, gi, slot) {
    var data = donnees[Math.floor(gi / 5)];
    var pd = data && trouverPersonneDonnees(data, ancre);
    var cell = pd ? pd[demi][gi % 5] : null;
    return (cell && cell.taches && cell.taches[slot]) ? cell.taches[slot] : null;
  }
  function chantierCelluleAuGi(donnees, ancre, demi, gi) {
    var data = donnees[Math.floor(gi / 5)];
    var pd = data && trouverPersonneDonnees(data, ancre);
    var cell = pd ? pd[demi][gi % 5] : null;
    return cell ? (cell.chantier || null) : null;
  }
  function isoDeGiFenetre(donnees, gi) {
    var data = donnees[Math.floor(gi / 5)];
    return data ? data.isoDates[gi % 5] : null;
  }
  function dejaCouvertPlage(liste, gi) {
    return liste.some(function (it) { return gi >= it.giDebut && gi < it.giDebut + it.duree; });
  }
  // Alignée sur estAbsence() de Planning_Format.gs (cf. Index.html V2) : même
  // règle de détection, pour ne jamais diverger de ce que la vraie feuille
  // colore en absence.
  function estAbsence(txt) {
    var t = (txt || "").toLowerCase();
    return t.indexOf("absent") !== -1 || t.indexOf("cong") !== -1 || t.indexOf("vacance") !== -1;
  }

  /* ============ MOTEUR DE SYNCHRONISATION (diff local <-> serveur) ============
     calculerEtatLocal() prend une "photo" de TACHES/JALONS/NOTES telle
     qu'affichée (gi -> jour réel via isoDeGi/labGDeGi/jourIdxDeGi). Après
     toute mutation locale + render(), synchroniser() compare cette photo à
     syncBaseline (la dernière photo connue du serveur) et n'envoie QUE ce qui
     a changé — cf. commentaire d'architecture en tête de fichier. ============ */
  var syncBaseline = null;
  var syncEnCours = false, syncRelance = false;

  function calculerEtatLocal() {
    var cellules = {};   // "ancre|demi|labG|jourIdx" -> {chantier, taches:[{texte,statut,important,serieId}]}
    var n = nbJoursAffiches();
    // demiDebut/demiFin par BORD (round du 08.09.2026, suite, encore — §49) :
    // une tâche/absence n'a plus un seul `demi` fixe pour toute sa durée —
    // même règle de bord que les jalons juste au-dessus (d===0 -> demiDebut,
    // d===duree-1 -> demiFin, tout jour du MILIEU reste une journée entière,
    // donc projeté sur LES 2 tableaux matin+aprem de ce jour-là). Un jalon
    // n'a qu'UN texte par jour (un seul tableau `jalonsMap`) ; une tâche a
    // une LISTE par case (empilement), d'où la projection sur "1 ou 2"
    // tableaux de cellule plutôt que sur "1 ou 2" valeurs d'un seul champ.
    PERSONNES.forEach(function (p) {
      TACHES.filter(function (t) { return t.personneId === p.id && giVisibleFenetre(t.giDebut, n); }).forEach(function (t) {
        for (var d = 0; d < t.duree; d++) {
          var gi = t.giDebut + d;
          if (!giVisibleFenetre(gi, n)) continue;
          var lab = labGDeGi(gi), ji = jourIdxDeGi(gi);
          if (lab == null) continue;
          // demiIciT (round du 11.09.2026 — bug signalé par Lionel, vidéo à
          // l'appui : « en tirant test 2 il se scinde en plusieurs ») : DOIT
          // appliquer EXACTEMENT la même règle de bord que demisOccupeesTache
          // (cf. plus bas) — sur une plage de PLUSIEURS jours, demiDebut ===
          // "matin" au 1er jour et demiFin === "aprem" au dernier jour sont
          // visuellement identiques à une journée entière (cf.
          // colonneEtSpanDemi : "matin" est déjà le bord gauche du jour,
          // "aprem" ne raccourcit jamais une fin de plage) — AVANT ce
          // correctif, cette fonction réimplémentait sa PROPRE version (sans
          // cette équivalence) au lieu d'appeler demisOccupeesTache comme le
          // documente pourtant déjà son commentaire (cf. test_grille_compacte.js,
          // "demisOccupeesTache(it, gi) est la fonction PARTAGÉE ... utilisée
          // par le moteur de synchronisation (calculerEtatLocal)" — affirmation
          // fausse dans les faits jusqu'à ce correctif). Résultat concret du
          // bug : sur le jour de bord d'une plage multi-jours, une seule des 2
          // demi-journées serveur était écrite, l'autre restant vide. Au
          // rechargement suivant (construireVueDepuisCache), cette moitié
          // manquante cassait la continuité de la plage reconstruite
          // (l'algorithme de fusion exige un contenu identique sur CHAQUE
          // demi-slot consécutif) : la tâche revenait scindée en 2+ bulles au
          // lieu d'une seule, dès sa création ou dès le premier
          // redimensionnement — sans qu'aucun geste supplémentaire ne soit
          // nécessaire pour le déclencher. Appeler directement
          // demisOccupeesTache(t, gi) élimine la duplication ET garantit qu'un
          // futur ajustement de cette règle de bord ne puisse plus diverger
          // entre affichage et écriture serveur.
          var demisAAppliquer = demisOccupeesTache(t, gi);
          demisAAppliquer.forEach(function (demi) {
            var cle = p.id + "|" + demi + "|" + lab + "|" + ji;
            if (!cellules[cle]) cellules[cle] = { chantier: null, taches: [] };
            cellules[cle].taches.push({ texte: t.texte, statut: t.statut || null, important: !!t.important, serieId: t.serieId || null });
            if (t.chantier) cellules[cle].chantier = t.chantier;
          });
        }
      });
    });
    // "labG|jourIdx" -> "demi\u0000texte". La demi-journée fait partie de la
    // VALEUR comparée (round du 02.09.2026) : sans ça, faire passer un jalon
    // du matin à l'après-midi laisserait le texte identique et ne
    // déclencherait aucune écriture — la modification serait perdue au
    // rechargement, sans le moindre message.
    var jalonsMap = {};
    JALONS.filter(function (j) { return giVisibleFenetre(j.giDebut, n); }).forEach(function (j) {
      for (var d = 0; d < j.duree; d++) {
        var gi = j.giDebut + d; if (!giVisibleFenetre(gi, n) || estGiWeekend(gi)) continue;
        var lab = labGDeGi(gi); if (lab == null) continue;
        // demiIci (round du 08.09.2026, suite — un jalon porte désormais
        // lui aussi une demi-journée par bord, cf. FRONTEND-CHANGELOG §47) :
        // `d === 0`/`d === j.duree - 1` retrouvent le bord concerné, même
        // règle que demiPourJourDePlage_ côté serveur (seuls les 2 bords
        // d'une plage fusionnée peuvent porter une demi-journée, tout jour
        // du milieu reste toujours une journée entière).
        var demiIciJalon = d === 0 ? (j.demiDebut || null) : (d === j.duree - 1 ? (j.demiFin || null) : null);
        jalonsMap[lab + "|" + jourIdxDeGi(gi)] = (demiIciJalon || "") + "\u0000" + j.texte;
      }
    });
    return { cellules: cellules, jalonsMap: jalonsMap, notesById: notesParId(), tachesSeriePayload: null };
  }
  function notesParId() {
    var out = {};
    NOTES.forEach(function (n) { out[n.id] = { texte: n.texte, important: !!n.important, giDebut: n.giDebut, duree: n.duree, dateDebutIso: n.dateDebutIso, demiDebut: n.demiDebut || null, demiFin: n.demiFin || null }; });
    return out;
  }
  function nbJoursAffiches() { return deuxSemaines ? 10 : 5; }
  function giVisibleFenetre(gi, n) {
    if (estGiWeekend(gi)) return afficherWeekends && semaineDuGiWeekend(gi) < (n / 5);
    return gi < n;
  }

  // Diffs des cellules "personne" (tâches/absences) : comparaison intégrale
  // cellule par cellule (simple et robuste — cf. FRONTEND-CHANGELOG pour le
  // choix "diff plein" plutôt qu'un suivi fin par item).
  function diffsCellulesPersonne(local, base) {
    var cles = {};
    Object.keys(local.cellules).forEach(function (k) { cles[k] = true; });
    Object.keys(base.cellules).forEach(function (k) { cles[k] = true; });
    var out = [];
    Object.keys(cles).forEach(function (cle) {
      var a = local.cellules[cle] || { chantier: null, taches: [] };
      var b = base.cellules[cle] || { chantier: null, taches: [] };
      if (JSON.stringify(a) === JSON.stringify(b)) return;
      var parts = cle.split("|");
      out.push({ ancre: +parts[0], demi: parts[1], labG: +parts[2], jourIdx: +parts[3], payload: { chantier: a.chantier || null, taches: a.taches } });
    });
    return out;
  }
  // Diff des jalons : par (labG,jourIdx), un texte simple.
  function diffsJalons(local, base) {
    var cles = {};
    Object.keys(local.jalonsMap).forEach(function (k) { cles[k] = true; });
    Object.keys(base.jalonsMap).forEach(function (k) { cles[k] = true; });
    var out = [];
    Object.keys(cles).forEach(function (cle) {
      var a = local.jalonsMap[cle] || "", b = base.jalonsMap[cle] || "";
      if (a === b) return;
      var parts = cle.split("|");
      var sep = a.indexOf("\u0000");
      out.push({
        labG: +parts[0], jourIdx: +parts[1],
        texte: sep === -1 ? a : a.slice(sep + 1),
        demi: sep === -1 ? null : (a.slice(0, sep) || null)
      });
    });
    return out;
  }
  // Diff des notes : par identité d'item JS (stable entre deux render()
  // consécutifs tant qu'aucun rechargement serveur n'a eu lieu entre-temps).
  function diffsNotes(local, base) {
    var out = [];
    Object.keys(local.notesById).forEach(function (id) {
      var a = local.notesById[id], b = base.notesById[id];
      if (b && a.texte === b.texte && !!a.important === !!b.important && a.giDebut === b.giDebut && a.duree === b.duree && (a.demiDebut || null) === (b.demiDebut || null) && (a.demiFin || null) === (b.demiFin || null)) return;
      out.push({ action: b ? "modifier" : "creer", id: id, avant: b || null, apres: a });
    });
    Object.keys(base.notesById).forEach(function (id) {
      if (!local.notesById[id]) out.push({ action: "supprimer", id: id, avant: base.notesById[id], apres: null });
    });
    return out;
  }

  // (labG, jourIdx) -> date ISO, pour les jalons du moteur de diff : jourIdx
  // y est TOUJOURS 0..4 (lundi..vendredi, cf. diffsJalons — un jalon week-end
  // n'existe pas, cf. estGiWeekend plus haut dans calculerEtatLocal), donc
  // infosSemaineDepuisLabG() (pure, réutilisée telle quelle depuis le
  // chargement — cf. étape 2 du §6bis) suffit sans passer par le cache.
  function isoDeLabGJourIdx(labG, jourIdx) { return infosSemaineDepuisLabG(labG).isoDates[jourIdx]; }
  // Variante "case personnel" : jourIdx y va de 0 à 7 (0..4 = lundi..vendredi,
  // 6/7 = Samedi/Dimanche — cf. commentaire de tête d'apiEnregistrerCellulePersonne,
  // WebApp.gs ; jourIdx 5 n'existe jamais, hérité de l'ancien classeur où les
  // colonnes physiques sautaient de jj=5 à jj=6 pour le bloc week-end fusionné).
  // infosSemaineDepuisLabG().weekendDates = [Samedi, Dimanche].
  function isoDeLabGJourIdxCase_(labG, jourIdx) {
    var infos = infosSemaineDepuisLabG(labG);
    if (jourIdx === 6) return infos.weekendDates[0];
    if (jourIdx === 7) return infos.weekendDates[1];
    return infos.isoDates[jourIdx];
  }

  // ---- ÉCRITURE D'UNE CASE PERSONNEL (§5 du plan : "pas de fonction dédiée,
  // écriture directe des tables taches/assignations") — remplace l'ancien
  // apiEnregistrerCellulePersonne (WebApp.gs), oublié lors de l'étape 4
  // (branchement des Edge Functions) car ce n'en est justement pas une.
  // Repéré par Lionel : "échec de la synchronisation : google is not
  // defined" à l'ajout d'une tâche (round du 07.09.2026).
  //
  // Même règle métier que l'ancien code : une case (personne, demi, jour) a
  // un état COMPLET envoyé à chaque fois par le moteur de diff (payload =
  // {chantier, taches}, cf. diffsCellulesPersonne plus haut) — jamais un
  // ajout incrémental. On remplace donc tout le contenu de la case : les
  // anciennes lignes `taches`/`assignations` de ce (personne_id, date, demi)
  // sont retirées, les nouvelles insérées à la place (ordre = position dans
  // le tableau `payload.taches`, cf. construireDonneesSemaine qui relit cet
  // ordre à la relecture). `chantier`/`statut` arrivent en NOM/CLÉ côté
  // client (comme tout le reste de la vue, cf. étape 2) : traduits ici en
  // chantier_id/statut_id via les lookups déjà construits au bootstrap
  // (etat.chantierParNom, etat.statutIdParCle).
  //
  // Ordre delete-puis-insert (pas l'inverse) : sbClient.from(...).insert()
  // ne renvoie pas les id insérés sans .select() explicite, donc aucun moyen
  // fiable d'exclure ensuite SEULEMENT les nouvelles lignes lors du nettoyage
  // — écrire d'abord aurait exigé soit ce .select() en plus (un aller-retour
  // de plus), soit vivre avec des doublons transitoires visibles. Une case a
  // rarement plus de 2-3 tâches : le risque d'un état transitoirement vide en
  // cas d'échec entre le delete et l'insert est jugé acceptable — même
  // limite déjà assumée par enregistrer-plage/enregistrer-serie/gerer-serie
  // (opérations non transactionnelles, cf. leurs en-têtes).
  //
  // Simplification permise par le nouveau schéma, pas un choix pris ici :
  // le week-end (jourIdx 6/7) n'a plus besoin de la mécanique de cellule
  // fusionnée Samedi/Dimanche de l'ancien classeur (tag [S]/[D], une seule
  // colonne physique pour les 2 jours) — chaque jour a sa propre date, donc
  // sa propre ligne, exactement comme un jour de semaine ; jourIdx 6 et 7
  // s'écrivent donc chacun indépendamment, avec la même fonction.
  function enregistrerCellulePersonneServeur(labG, ancre, demi, jourIdx, payload) {
    if (demi !== "matin" && demi !== "aprem") return Promise.reject(new Error("Demi-journée invalide."));
    var personneId = parseInt(ancre, 10);
    var iso = isoDeLabGJourIdxCase_(labG, jourIdx);
    var chantierNom = payload && payload.chantier;
    var chantier = chantierNom ? etat.chantierParNom[chantierNom] : null;
    var chantierId = chantier ? chantier.ligne : null;
    var taches = (payload && payload.taches) || [];
    var lignesTaches = taches.map(function (t, i) {
      return {
        personne_id: personneId, date: iso, demi: demi, ordre: i,
        texte: t.texte, statut_id: t.statut ? (etat.statutIdParCle[t.statut] || null) : null,
        important: !!t.important, serie_id: t.serieId || null
      };
    });
    return sbClient.from("taches").delete().eq("personne_id", personneId).eq("date", iso).eq("demi", demi).then(function (res) {
      if (res.error) throw res.error;
      return sbClient.from("assignations").delete().eq("personne_id", personneId).eq("date", iso).eq("demi", demi);
    }).then(function (res) {
      if (res.error) throw res.error;
      return lignesTaches.length ? sbClient.from("taches").insert(lignesTaches) : { error: null };
    }).then(function (res) {
      if (res.error) throw res.error;
      return chantierId ? sbClient.from("assignations").insert({ personne_id: personneId, date: iso, demi: demi, chantier_id: chantierId }) : { error: null };
    }).then(function (res) {
      if (res.error) throw res.error;
    });
  }

  // Repousse un rechargement de la grille (construireVueDepuisCache + render)
  // tant qu'un glissement/redimensionnement est ACTIF (round du 08.09.2026,
  // suite — Lionel, photo à l'appui : « la bulle fantôme apparue quand la
  // bulle s'est replacé sans que j'ai soulevé le doigt de la souris » + vidéo
  // « impossible de déplacer de 1 case une bulle qui fait 2 cases »).
  // render() (appelé ici juste après CHAQUE synchronisation réussie, y
  // compris celle d'un geste précédent qui vient tout juste de se terminer)
  // appelle construireGrille(), qui recrée TOUS les noeuds .bulle depuis
  // zéro. Si ce rechargement survient PENDANT qu'un nouveau geste de
  // glissement est en cours (l'utilisateur a démarré un 2e geste avant que
  // la synchro réseau du 1er n'ait fini de retomber — tout à fait possible
  // avec la latence réelle d'un serveur Supabase), le noeud bulleDom sur
  // lequel pointermove/pointerup sont câblés est remplacé : la spec Pointer
  // Events relâche alors SILENCIEUSEMENT la capture du pointeur dès qu'un
  // élément qui la détient quitte le DOM. Le geste en cours est abandonné
  // sans qu'onUp/onCancel ne soit jamais appelé : le fantôme de glissement
  // (.fantome-glisse, posé sous document.body, donc lui-même pas détruit
  // par le rechargement) reste alors figé à l'écran — le bug du ghost — et
  // toute résolution de cible ultérieure du même geste se fait contre un
  // état qui n'est plus le bon. document.body porte la classe
  // "en-glissement" pendant TOUT geste de ce type (armer()/armerSelection()
  // dans onPointerDownGroupeSelection, cablerPoigneeRedim,
  // demarrerSelectionRapide, etc.) : on s'en sert ici comme signal pour
  // repousser le rechargement de quelques ms plutôt que de reconstruire la
  // grille sous les pieds d'un geste en cours. Sans effet sur le geste
  // lui-même (qui continue de suivre le pointeur normalement) ; le
  // rechargement finit par s'appliquer dès que le geste se termine.
  function differerSiEnGlissement(rechargerVue) {
    if (!document.body.classList.contains("en-glissement")) { rechargerVue(); return; }
    setTimeout(function () { differerSiEnGlissement(rechargerVue); }, 120);
  }
  function synchroniser() {
    if (!fenetrePrete() || !syncBaseline) return;
    if (syncEnCours) { syncRelance = true; return; }
    var local = calculerEtatLocal();
    var dCel = diffsCellulesPersonne(local, syncBaseline);
    var dJal = diffsJalons(local, syncBaseline);
    var dNot = diffsNotes(local, syncBaseline);
    if (!dCel.length && !dJal.length && !dNot.length) return;
    syncEnCours = true;
    occupe(true);
    var chaine = Promise.resolve();
    dCel.forEach(function (d) {
      chaine = chaine.then(function () {
        return enregistrerCellulePersonneServeur(d.labG, d.ancre, d.demi, d.jourIdx, d.payload);
      });
    });
    // Étape 4 du §6bis (migration hors Google) : chaque jalon diffé est TOUJOURS
    // un seul jour (dateDebut === dateFin), en mode "remplacement" — un
    // enregistrement diffé représente l'état COMPLET du jour, jamais un ajout
    // (cf. l'ancien apiEnregistrerJalonNote, qui écrasait sans condition la
    // cellule entière). Pas de notion de "déplacement" ici (une seule case à
    // la fois) : origine reste toujours null. `d.demi` (round du 08.09.2026,
    // suite — cf. diffsJalons/calculerEtatLocal ci-dessus) : demiDebut et
    // demiFin valent la même chose puisque dateDebut === dateFin (un seul
    // jour, exactement comme pour une note d'un seul jour).
    dJal.forEach(function (d) {
      chaine = chaine.then(function () {
        var iso = isoDeLabGJourIdx(d.labG, d.jourIdx);
        return invoquerFonctionServeur("enregistrer-plage", {
          kind: "jalon", dateDebut: iso, dateFin: iso, demiDebut: d.demi, demiFin: d.demi,
          texte: d.texte, important: false, mode: "remplacement", origine: null
        });
      });
    });
    dNot.forEach(function (d) {
      chaine = chaine.then(function () {
        var dateDeb, dateFin, texte, important, origine, mode;
        // demiDebut/demiFin (round du 03.09.2026) : l'ORIGINE porte aussi les
        // siens (nécessaires côté serveur pour ne retirer que l'entrée qui
        // portait vraiment cette demi-journée-là, cf. enregistrer-plage/logic.js
        // — planPlage lit origine.demiDebut/demiFin).
        var demiDebNote = d.apres ? (d.apres.demiDebut || null) : null;
        var demiFinNote = d.apres ? (d.apres.demiFin || null) : null;
        if (d.action === "supprimer") {
          dateDeb = d.avant.dateDebutIso; dateFin = isoDeApres(d.avant); texte = ""; important = false; mode = "remplacement";
          origine = { dateDebut: dateDeb, dateFin: dateFin, texte: d.avant.texte, important: d.avant.important, demiDebut: d.avant.demiDebut || null, demiFin: d.avant.demiFin || null };
        } else {
          dateDeb = d.apres.dateDebutIso || isoDeGi(d.apres.giDebut); dateFin = isoDeApres(d.apres); texte = d.apres.texte; important = d.apres.important;
          mode = d.action === "creer" ? "ajout" : "remplacement";
          origine = d.avant ? { dateDebut: d.avant.dateDebutIso, dateFin: isoDeApres(d.avant), texte: d.avant.texte, important: d.avant.important, demiDebut: d.avant.demiDebut || null, demiFin: d.avant.demiFin || null } : null;
        }
        return invoquerFonctionServeur("enregistrer-plage", {
          kind: "note", dateDebut: dateDeb, dateFin: dateFin, demiDebut: demiDebNote, demiFin: demiFinNote,
          texte: texte, important: important, mode: mode, origine: origine
        });
      });
    });
    chaine.then(function () {
      occupe(false);
      syncEnCours = false;
      // Ni enregistrer-plage ni apiEnregistrerCellulePersonne (une fois
      // portée) ne renvoient plus la semaine entière rafraîchie (contrairement
      // à l'ancien apiXxx, cf. commentaire de tête d'apiEnregistrerJalonNote,
      // WebApp.gs) : on relit simplement la fenêtre affichée depuis Supabase,
      // même mécanisme (oublierCache + assurerFenetreChargee) que le filet de
      // rattrapage du .catch juste en dessous — un aller-retour de plus par
      // synchronisation, mais un seul chemin de code pour "l'état affiché
      // doit refléter ce que le serveur vient d'accepter".
      oublierCache();
      differerSiEnGlissement(function () {
        assurerFenetreChargee(function () {
          construireVueDepuisCache();
          if (syncRelance) { syncRelance = false; synchroniser(); }
          else render(false);
        });
      });
    }).catch(function (err) {
      occupe(false);
      syncEnCours = false; syncRelance = false;
      toast("Échec de la synchronisation : " + (err && err.message ? err.message : err) + " — rechargement…");
      oublierCache();
      differerSiEnGlissement(function () {
        assurerFenetreChargee(function () { construireVueDepuisCache(); render(false); });
      });
    });
  }
  function isoDeApres(item) {
    if (!item.dateDebutIso) return isoDeGi(item.giDebut + item.duree - 1);
    var d = new Date(item.dateDebutIso + "T00:00:00");
    d.setDate(d.getDate() + item.duree - 1);
    return isoDeDate(d);
  }

  /* ============================================================
     MOTEUR DE RENDU / INTERACTION — repris du prototype prototype-bulles.html
     (V3), quasiment inchangé : il ne connaît que TACHES/JALONS/NOTES/
     PERSONNES/CHANTIERS/STATUTS en mémoire (cf. bloc "ÉTAT VUE" plus haut).
     ============================================================ */
  function hexToRgba(hex, alpha) {
    var h = String(hex || "#999999").replace("#", "");
    if (h.length === 3) h = h.split("").map(function (c) { return c + c; }).join("");
    var r = parseInt(h.substring(0, 2), 16), g = parseInt(h.substring(2, 4), 16), b = parseInt(h.substring(4, 6), 16);
    return "rgba(" + r + "," + g + "," + b + "," + alpha + ")";
  }
  // Fériés : source unique désormais (§5 du spec, fusion FERIES/FERIES_ETAT
  // du prototype) — etat.feriesServeur, indexé par date ISO. Couleur par
  // catégorie : recherche dans catsFeries() (etat.categoriesFeriesServeur,
  // cf. WebApp.gs/apiListerCategoriesFeries) — plus fixe depuis le round du
  // 02.09.2026 (suite), couleurs éditables par Lionel via renderFerieCategories.
  var feriesParIso = {};
  function reconstruireFeriesParIso() {
    feriesParIso = {};
    (etat.feriesServeur || []).forEach(function (f) { feriesParIso[f.iso] = f; });
  }
  function feriePourJour(gi) {
    var iso = isoDeGi(gi);
    if (!iso) return null;
    var f = feriesParIso[iso];
    if (!f) return null;
    var cat = catsFeries().filter(function (c) { return c.id === f.categorie; })[0];
    // Filet de sécurité neutre (gris), PAS la couleur de "Férié" (round du
    // 02.09.2026, suite, bug remonté par Lionel) : si jamais categorie ne
    // correspond à aucune catégorie connue (donnée corrompue, ou classeur
    // pas encore sur cette version du script), autant que ce soit visible
    // comme "quelque chose ne va pas" plutôt que de se faire passer pour un
    // vrai jour "Férié" — l'ancien filet retombait justement sur la couleur
    // de "Férié" (#e8a3a3), ce qui maquillait le problème en résultat plausible.
    return { label: f.libelle, couleur: cat ? cat.couleur : "#c9c9c9" };
  }

  // legendeEl/racineEl : fetchés PARESSEUSEMENT (jamais au chargement du
  // script) — au moment où ce script s'exécute, #app est encore vide (la
  // coquille de navigation, #legende/#racine compris, n'est construite
  // qu'après un premier apiDemarrer() réussi, cf. construireCoquille()).
  var legendeEl;
  document.addEventListener("contextmenu", function (e) { e.preventDefault(); });
  var racineEl;

  function construireLegende() {
    if (!legendeEl) legendeEl = document.getElementById("legende");
    if (!legendeEl) return;
    legendeEl.innerHTML = "";
    var defautActuel = chantierParDefautValide();
    Object.keys(CHANTIERS).forEach(function (k) {
      var c = CHANTIERS[k];
      var it = document.createElement("div");
      // Cliquable (round du 03.09.2026, demande de Lionel) : choisit ce
      // chantier comme valeur PRÉ-COCHÉE de tous les selects "Chantier" des
      // formulaires (cf. chantierParDefaut, champChantierHTML) — cliquer le

  // sur 2 jours -> 2 demi-slots du MÊME jour) de redevenir une journée pleine.
  function bornesDepuisDemiSlots(halfStart, halfFinIncl) {
    var giDebut = Math.floor(halfStart / 2), giFin = Math.floor(halfFinIncl / 2);
    var duree = giFin - giDebut + 1;
    if (duree === 1) {
      if (halfFinIncl === halfStart) {
        var demiUnique = (halfStart % 2 === 1) ? "aprem" : "matin";
        return { giDebut: giDebut, duree: 1, demiDebut: demiUnique, demiFin: demiUnique };
      }
      return { giDebut: giDebut, duree: 1, demiDebut: null, demiFin: null };
    }
    var demiDebut = (halfStart % 2 === 1) ? "aprem" : null;
    var demiFin = (halfFinIncl % 2 === 0) ? "matin" : null;
    return { giDebut: giDebut, duree: duree, demiDebut: demiDebut, demiFin: demiFin };
  }
  // Déplacement en demi-journée d'une note de PLUSIEURS jours (duree > 1) —
  // combine la position du CLIC initial dans la bulle (offsetHalvesClic, en
  // demi-slots — cf. onPointerDownGroupeSelection) et la position du
  // RELÂCHEMENT (giCibleBrut + demiSousPointeur) en un delta de demi-slots,
  // jamais un delta de jours entiers qui ne permettrait aucun décalage plus
  // fin qu'une journée complète. La fenêtre `[0, nTotal*2 - 1]` (bornes
  // incluses, en demi-slots) est la même limite que pour un déplacement en
  // jours entiers (`nTotal - duree` jours), simplement exprimée dans l'unité
  // demi-slot — la LONGUEUR occupée (`L`) ne change jamais, seule sa position
  // est bornée.
  function bordsDeplacementNoteMultiJours(giDebut, duree, demiDebut, demiFin, offsetHalvesClic, giCibleBrut, demiSousPointeur, nTotal) {
    var b = demiSlotsDepuisBornes(giDebut, duree, demiDebut, demiFin);
    var L = b.halfFinIncl - b.halfStart + 1;
    var halfSousPointeur = giCibleBrut * 2 + (demiSousPointeur === "aprem" ? 1 : 0);
    var nouveauHalfStart = halfSousPointeur - offsetHalvesClic;
    nouveauHalfStart = Math.max(0, Math.min(nTotal * 2 - L, nouveauHalfStart));
    return bornesDepuisDemiSlots(nouveauHalfStart, nouveauHalfStart + L - 1);
  }

  function naviguerSemaine(dir) {

    if (nouvel < 0 || nouvel >= etat.semaines.length) { toast(dir < 0 ? "Déjà la première semaine du planning." : "Déjà la dernière semaine du planning."); return; }

  // indexSemaineDuJour_ côté serveur (WebApp.gs, apiDemarrer) : la semaine
  // contenant aujourd'hui, sinon la première à venir, sinon la dernière du

  // et etat.aujourdhui sont déjà en main côté client depuis apiDemarrer, un

  function indexSemaineDeIso_(iso) {
    for (var i = 0; i < etat.semaines.length; i++) {

    }
    return null;

    [["jalon", JALONS, "Jalons"], ["note", NOTES, "Notes"]].forEach(function (spec) {

      // note dans la colonne de gauche" — sans repère textuel la colonne de
      // gauche ne dit plus quelle ligne est quoi une fois la légende hors du

        if (afficherWeekends && (g + 1) % 5 === 0) {

          [0, 1].forEach(function (j) {
            poser(creerCelluleFond(kind, giWeekend(semG, j)), colonneGrille(giWeekend(semG, j)), row, null, nbPistes);

        }
      }
      visibles.forEach(function (it) {

        // 08.09.2026 — §47 du FRONTEND-CHANGELOG : jalon et note partagent
        // maintenant demiDebut/demiFin et ce même rendu) :

        // continue de le signaler.
        var demiDebutIt = it.demiDebut || null, demiFinIt = it.demiFin || null;
        if (it.duree === 1 && (demiDebutIt === "matin" || demiDebutIt === "aprem")) {
          b.classList.add("bulle-demi", demiDebutIt === "matin" ? "bulle-demi-matin" : "bulle-demi-aprem");
          b.title = (b.title ? b.title + " — " : "") + (demiDebutIt === "matin" ? "Matin" : "Après-midi");
        } else if (it.duree > 1 && (demiDebutIt === "aprem" || demiFinIt === "matin")) {
          var bouts = [];
          if (demiDebutIt === "aprem") bouts.push("commence l'après-midi");
          if (demiFinIt === "matin") bouts.push("finit le matin");
          b.title = (b.title ? b.title + " — " : "") + bouts.join(", ");
        }
        // .demi-aprem (round du 03.09.2026, suite) : quelle que soit la durée,
        // colonneEtSpanDemi() pose le bord GAUCHE de la bulle sur la colonne
        // "aprem" dès que demiDebutIt === "aprem" (seul ce bord-là compte pour
        // la colonne de départ, cf. sa définition) — cette bulle a donc besoin
        // du même empiètement anti-trait que .cell.cell-aprem ci-dessus.
        if (modeCompact && demiDebutIt === "aprem") b.classList.add("demi-aprem");
        var csStatique = colonneEtSpanDemi(it.giDebut, dureeVisible, demiDebutIt, demiFinIt);
        poser(b, csStatique[0], row + it._piste, csStatique[1]);
      });
      row += nbPistes;
    });

    function ligneSection(cle, texte) {
      var repliee = cle === "personnel" ? replierSectionPersonnel : replierSectionIntervenants;
      var lg = document.createElement("div");
      lg.className = "section-row";
      lg.innerHTML =
        '<div class="section-row-sticky">' +
        '<span class="section-label">' + esc(texte) + '</span>' +
        '<button type="button" class="btn-section-toggle' + (repliee ? " replie" : "") + '" data-section="' + cle + '" aria-label="Masquer/afficher la section ' + esc(texte) + '">▾</button>' +
        '<button type="button" class="btn-plage-ligne" data-add-personne="' + cle + '" title="Ajouter">+</button>' +
        '</div>';
      poserPleineLargeur(lg, row);
      lg.querySelector(".btn-section-toggle").addEventListener("click", function () {
        if (cle === "personnel") replierSectionPersonnel = !replierSectionPersonnel;
        else replierSectionIntervenants = !replierSectionIntervenants;
        render(false);
      });
      lg.querySelector(".btn-plage-ligne").addEventListener("click", function () { ouvrirAjoutPersonne(cle === "intervenants"); });
      row++;
    }

    // ---- Une seule ligne par personne : matin et après-midi occupent deux
    // colonnes voisines du même jour. -----------------------------------
    //
    // §49 (08.09.2026, suite, encore) — Lionel : « 1 tâche ne peut pas être
    // mise sur 2 case, elle s'étend de 1 jour (de 1 a 3, 5 ou 7 case) », puis
    // « on reste sur la seule vue compact qui devient la standard ». Le §48
    // avait tenté de résoudre le symptôme (bulles "découpées") en FUSIONNANT
    // au RENDU plusieurs items compact séparés (construireRunsCompacts,
    // data-membres/data-slots) — un pansement qui laissait la vraie cause
    // intacte : une tâche/absence portait un seul champ `demi` FIXE pour
    // toute sa durée, donc "matin+aprem jour1, matin jour2" restait
    // structurellement 2 items séparés, glués visuellement après coup
    // seulement quand ils se touchaient — jamais redimensionnables/
    // déplaçables à la demi-journée près (d'où le "de 1 a 3, 5 ou 7 case",
    // toujours par saut de 1 jour entier).
    //
    // Correctif de FOND (§49) : une tâche/absence porte désormais
    // demiDebut/demiFin PAR BORD, exactement comme un jalon ou une note (cf.
    // itemPlageTache et la fusion par demi-slot dans construireVueDepuisCache)
    // — un item EST déjà, nativement, sa propre plage continue. Le rendu
    // redevient donc aussi simple que celui des jalons/notes : 1 item = 1
    // bulle DOM, positionnée par colonneEtSpanDemi (déjà partagée avec eux) ;
    // plus besoin de fusionner quoi que ce soit après coup — construireRunsCompacts,
    // data-membres et data-slots disparaissent avec lui. Semaine/week-end :
    // case isolée à part (comme avant), toujours 1 seul demi-slot ("matin").
    function ligneGroupePersonnesCompact(groupe) {
      groupe.forEach(function (p) {
        var itemsLigne = TACHES.filter(function (it) { return it.personneId === p.id && giVisible(it.giDebut, n); });
        var nbPistes = Math.max(1, assignerPistesCompact(itemsLigne));
        var lbl = document.createElement("div");
        lbl.className = "lbl lbl-compacte";
        lbl.innerHTML = "<b>" + esc(p.nom) + "</b>";
        poser(lbl, 1, row, null, nbPistes);
        for (var gi4 = 0; gi4 < n; gi4++) {
          DEMIS.forEach(function (demi) {
            var c = creerCell(gi4, { personne: p.id, demi: demi });
            if (demi === "aprem") c.classList.add("cell-aprem");
            // Trait de séparation entre deux JOURS (retour de Lionel) : porté
            // par la colonne du matin, sauf en début de semaine où le trait de
            // semaine, plus fort, prend déjà le relais (posé par creerCell).
            else if (gi4 > 0 && gi4 % 5 !== 0) c.classList.add("jour-frontiere");
            poser(c, colonneDemi(gi4, demi), row, null, nbPistes);
          });
          if (afficherWeekends && (gi4 + 1) % 5 === 0) {
            var semGi4 = Math.floor(gi4 / 5);
            [0, 1].forEach(function (j) {
              // Une seule cellule serveur pour le week-end, portée par
              // "matin" — cf. construireVueDepuisCache, items week-end posés
              // avec demiDebut=demiFin="matin".
              poser(creerCell(giWeekend(semGi4, j), { personne: p.id, demi: "matin" }), colonneGrille(giWeekend(semGi4, j)), row, null, nbPistes);
            });
          }
        }
        itemsLigne.forEach(function (it) {
          var b = bulleEl(it);
          if (estGiWeekend(it.giDebut)) { poser(b, colonneGrille(it.giDebut), row + it._piste, 1); return; }
          var dureeVisible = Math.max(1, Math.min(it.duree, n - it.giDebut));
          var demiDebutIt = it.demiDebut || null, demiFinIt = it.demiFin || null;
          // .demi-aprem (cf. son commentaire CSS, partagé avec le rendu
          // jalon/note) : même empiètement anti-trait quand la bulle démarre
          // sur la colonne "aprem".
          if (demiDebutIt === "aprem") b.classList.add("demi-aprem");
          var cs = colonneEtSpanDemi(it.giDebut, dureeVisible, demiDebutIt, demiFinIt);
          poser(b, cs[0], row + it._piste, cs[1]);
        });
        row += nbPistes;
      });
    }
    function ligneGroupePersonnes(groupe) { ligneGroupePersonnesCompact(groupe); }

    var groupePersonnel = PERSONNES.filter(function (p) { return !p.sousTraitant; });
    var groupeIntervenants = PERSONNES.filter(function (p) { return p.sousTraitant; });

    ligneSection("personnel", "Personnel");
    if (!replierSectionPersonnel) ligneGroupePersonnes(groupePersonnel);
    ligneSection("intervenants", "Intervenants");
    if (!replierSectionIntervenants) ligneGroupePersonnes(groupeIntervenants);

    if (scrollerPrecedent) scroller.scrollLeft = scrollLeftPrecedent;
    majBoutonsUndo();
    majBarreSelection();
  }

  // render(sync=true) : reconstruit la grille, puis lance la synchronisation
  // serveur (diff local <-> syncBaseline) sauf appel explicite render(false)
  // (utilisé après une reconstruction fraîche depuis le serveur, où il n'y a
  // par définition rien à synchroniser).
  function render(sync) {
    construireGrille();
    if (sync !== false) synchroniser();
  }

  function bulleEl(it) {
    var el = document.createElement("div");
    el.className = "bulle bulle-" + it.type + (it.important ? " important" : "") + " bulle-plage"
      + (bullesSelectionnees[it.id] ? " selectionnee" : "");
    el.dataset.id = it.id;
    var bg = it.type === "tache" ? (it.chantier && CHANTIERS[it.chantier] ? CHANTIERS[it.chantier].couleur : "#e5e5e5")
      : it.type === "absence" ? "var(--absence-bg)"
      : it.type === "jalon" ? "var(--jalon-bg)" : "var(--note-bg)";
    el.style.background = bg;
    // Étiquette (nom de chantier / "Absence"/"Jalon"/"Note") : n'est plus
    // affichée dans la bulle elle-même depuis le round du 02.09.2026 (retour
    // de Lionel : "on peut réduire les hauteurs de ligne en enlevant les
    // noms de chantier... on a déjà une légende") — la couleur de fond de la
    // bulle + la légende (construireLegende, qui couvre déjà chantiers ET
    // absence/jalon/note) suffisent à l'identifier sans ce 2e texte qui
    // forçait une ligne de plus par bulle. Gardée en mémoire (`tag`) pour
    // l'infobulle au survol (title ci-dessous), qui garde l'info accessible.
    var tag = it.type === "tache" ? (it.chantier && CHANTIERS[it.chantier] ? CHANTIERS[it.chantier].nom : "")
      : it.type === "absence" ? "Absence" : it.type === "jalon" ? "Jalon" : "Note";
    var html = '<span class="poignee poignee-g" data-poignee="gauche"></span><span class="poignee poignee-d" data-poignee="droite"></span>' +
      '<span class="b-txt">' + esc(it.texte) + '</span>';
    if (it.statut && STATUTS[it.statut]) html += '<span class="b-statut" style="background:' + STATUTS[it.statut].couleur + '"><span class="dot"></span>' + esc(STATUTS[it.statut].nom) + '</span>';
    if (it.serieId) html += '<span class="b-serie" title="Fait partie d\'une série">↻ série</span>';
    el.innerHTML = html;
    el.title = (tag ? tag + " — " : "") + it.texte;
    el.addEventListener("pointerdown", onPointerDownBulle);
    cablerPoigneeRedim(el.querySelector('[data-poignee="gauche"]'), el, it, "gauche");
    cablerPoigneeRedim(el.querySelector('[data-poignee="droite"]'), el, it, "droite");
    return el;
  }

  /* ============================================================
     DRAG / RESIZE / SÉLECTION — repris quasiment à l'identique du
     prototype (mécanique générique indépendante de la source des
     données). Les fonctions continuent de muter TACHES/JALONS/NOTES en
     mémoire ; render() se charge ensuite de synchroniser au serveur
     (cf. bloc "MOTEUR DE SYNCHRONISATION" plus haut).
     ============================================================ */
  // demiDebut/demiFin (round du 08.09.2026, suite, encore — §49) : plus de
  // comparaison sur un seul `it.demi` fixe — un redimensionnement peut
  // désormais faire passer une tâche d'une demi-journée à l'autre (comme un
  // jalon/note), donc survoler la cellule "aprem" alors que `it` était posé
  // le matin doit rester VALIDE (seuls kind+personne comptent ici).
  function kindEtPersonneOk(it, cel) {
    if (it.personneId !== undefined) return cel.dataset.kind === "personne" && cel.dataset.personne === it.personneId;
    return cel.dataset.kind === it.type;
  }

  var BORD_ZONE = 46, BORD_VITESSE_MAX = 16;
  function creerAutoDefilement(scroller) {
    var raf = null, dx = 0;
    function tick() { if (dx !== 0 && scroller) { scroller.scrollLeft += dx; raf = requestAnimationFrame(tick); } else raf = null; }
    return {
      maj: function (clientX) {
        if (!scroller) return;
        var r = scroller.getBoundingClientRect();
        if (clientX < r.left + BORD_ZONE) dx = -BORD_VITESSE_MAX * (1 - Math.max(0, clientX - r.left) / BORD_ZONE);
        else if (clientX > r.right - BORD_ZONE) dx = BORD_VITESSE_MAX * (1 - Math.max(0, r.right - clientX) / BORD_ZONE);
        else dx = 0;
        if (dx !== 0 && raf === null) raf = requestAnimationFrame(tick);
      },
      arreter: function () { dx = 0; if (raf) { cancelAnimationFrame(raf); raf = null; } }
    };
  }

  // demiDebut/demiFin (round du 08.09.2026, suite, encore — §49) : depuis
  // que TOUS les types de bulle (jalon/note/tâche/absence) portent
  // désormais leur propre demiDebut/demiFin par bord (plus de champ `demi`
  // fixe réservé aux tâches/absences), le redimensionnement en
  // demi-journée s'applique uniformément à tous — plus de distinction
  // "note ou jalon" (`estNoteOuJalon`), plus de repli `demiFixePourItem`, et
  // plus d'`ancrageAffichage` (mécanisme du §48 pour une bulle "fusionnée" —
  // devenu sans objet : une tâche/absence est maintenant nativement 1 seul
  // item continu, cf. FRONTEND-CHANGELOG §49). Chaque poignée gouverne son
  // PROPRE bord (demiDebutPrevisu pour la gauche, demiFinPrevisu pour la
  // droite, cf. demiPourRedimNote) ; l'autre bord n'est jamais touché — ce
  // qui permet d'atteindre "1 jour et demi" en tirant une poignée depuis
  // une bulle déjà en demi-journée (round du 03.09.2026, étendu au jalon au
  // §47, aux tâches/absences ici).
  function cablerPoigneeRedim(handleEl, bulleDom, it, cote) {
    handleEl.addEventListener("pointerdown", function (e) {
      if (bullesSelectionnees[bulleDom.dataset.id]) { basculerSelection(bulleDom.dataset.id); e.preventDefault(); e.stopPropagation(); return; }
      if (estGiWeekend(it.giDebut)) { e.preventDefault(); e.stopPropagation(); return; } // isolée, jamais redimensionnable
      e.preventDefault(); e.stopPropagation();
      var sx = e.clientX, sy = e.clientY, dernierX = sx, dernierY = sy;
      var pointerId = e.pointerId;
      var scroller = bulleDom.closest(".scroller");
      var nTotal = nbJoursAffiches();
      var giDebutOrig = it.giDebut, dureeOrig = it.duree;
      var giFinExclusifFixe = giDebutOrig + dureeOrig;
      var arme = false, enDefilement = false;
      var giDebutPrevisu = giDebutOrig, dureePrevisu = dureeOrig;
      var demiDebutOrig = it.demiDebut || null, demiFinOrig = it.demiFin || null;
      var demiDebutPrevisu = demiDebutOrig, demiFinPrevisu = demiFinOrig;

      // spanColonnes (pas dureePrevisu directement) : même correctif que le
      // rendu statique (cf. FRONTEND-CHANGELOG.md §7) — sans lui, étirer la
      // poignée d'un jalon/note/tâche du vendredi jusqu'au lundi avec les
      // week-ends affichés arrêtait l'aperçu au milieu du week-end au lieu
      // d'atteindre lundi (3e site du même bug, trouvé lors de l'audit du
      // 02.09.2026 — les données enregistrées restaient correctes, seul
      // l'aperçu en direct était faux).
      //
      // colonneEtSpanDemi (round du 03.09.2026) : même correctif, un 4e
      // site du même problème — désormais PARTAGÉ avec le rendu statique
      // (cf. sa définition, juste après spanColonnes ci-dessus) pour que
      // les deux ne puissent plus jamais diverger.
      function appliquerPrevisu() {
        var giAff = (cote === "droite") ? giDebutOrig : giDebutPrevisu;
        var giFinAff = (cote === "droite") ? (giDebutPrevisu + dureePrevisu) : giFinExclusifFixe;
        var demiDebAff = (cote === "droite") ? demiDebutOrig : demiDebutPrevisu;
        var demiFinAff = (cote === "droite") ? demiFinPrevisu : demiFinOrig;
        var cs = colonneEtSpanDemi(giAff, giFinAff - giAff, demiDebAff, demiFinAff);
        bulleDom.style.gridColumn = cs[0] + " / span " + cs[1];
      }
      function armer() { arme = true; document.body.classList.add("en-glissement"); handleEl.classList.add("actif"); }
      function detacher() {
        clearTimeout(minuteur);
        document.body.classList.remove("en-glissement");
        handleEl.classList.remove("actif");
        handleEl.removeEventListener("pointermove", onMove);
        handleEl.removeEventListener("pointerup", onUp);
        handleEl.removeEventListener("pointercancel", onCancel);
        try { handleEl.releasePointerCapture(pointerId); } catch (ex) {}
      }
      function onMove(e2) {
        if (!arme) {
          var dist = Math.abs(e2.clientX - sx) + Math.abs(e2.clientY - sy);
          if (!enDefilement && dist > SEUIL_DEFILEMENT) { enDefilement = true; clearTimeout(minuteur); }
          if (enDefilement) { if (scroller) scroller.scrollLeft -= (e2.clientX - dernierX); window.scrollBy(0, -(e2.clientY - dernierY)); }
          dernierX = e2.clientX; dernierY = e2.clientY;
          return;
        }
        bulleDom.style.visibility = "hidden";
        var sous = document.elementFromPoint(e2.clientX, e2.clientY);
        bulleDom.style.visibility = "";
        var cel = sous && sous.closest(".cell");
        if (!cel || !kindEtPersonneOk(it, cel)) return;
        var giSurvol = +cel.dataset.jour;
        if (estGiWeekend(giDebutOrig) || estGiWeekend(giSurvol)) return;
        if (cote === "droite") {
          dureePrevisu = Math.max(1, Math.min(nTotal - giDebutOrig, giSurvol - giDebutOrig + 1));
          giDebutPrevisu = giDebutOrig;
          var bordsD = demiPourRedimNote(cote, dureePrevisu, demiDebutOrig, demiFinOrig, demiDepuisPointeur(cel, e2.clientX));
          demiDebutPrevisu = bordsD.demiDebut; demiFinPrevisu = bordsD.demiFin;
        } else {
          giDebutPrevisu = Math.max(0, Math.min(giFinExclusifFixe - 1, giSurvol));
          dureePrevisu = giFinExclusifFixe - giDebutPrevisu;
          var bordsG = demiPourRedimNote(cote, dureePrevisu, demiDebutOrig, demiFinOrig, demiDepuisPointeur(cel, e2.clientX));
          demiDebutPrevisu = bordsG.demiDebut; demiFinPrevisu = bordsG.demiFin;
        }
        appliquerPrevisu();
      }
      // Remet la bulle EXACTEMENT sur sa forme d'origine (round du
      // 08.09.2026, suite — Lionel : « bug visuel récurant ou l'apercu de
      // déplacement reste visible a l'ecran après dépose ») : appliquerPrevisu()
      // écrit directement sur bulleDom.style.gridColumn pendant le
      // glissement (ce n'est PAS un clone séparé, contrairement au
      // fantome-glisse du déplacement de bulle entière) — tout chemin de
      // sortie qui n'appelle pas render() doit donc explicitement remettre
      // ce style à sa valeur d'origine, sinon la bulle RÉELLE reste affichée
      // à la taille de l'aperçu alors que la donnée sous-jacente (it), elle,
      // n'a pas changé. Seul onCancel() le faisait ; onUp() avait 2 sorties
      // anticipées (enDefilement, !arme) qui ne le faisaient pas — un
      // survol/pointerup un peu particulier (auto-défilement déclenché, ou
      // un clic sans geste après tout) pouvait donc laisser la bulle
      // visuellement rétrécie/étendue sans que rien n'ait réellement changé.
      function reappliquerFormeOrigine() {
        var cs = colonneEtSpanDemi(giDebutOrig, giFinExclusifFixe - giDebutOrig, demiDebutOrig, demiFinOrig);
        bulleDom.style.gridColumn = cs[0] + " / span " + cs[1];
      }
      function onUp() {
        detacher();
        if (enDefilement) { reappliquerFormeOrigine(); return; }
        if (!arme) { reappliquerFormeOrigine(); return; }
        if (giDebutPrevisu === giDebutOrig && dureePrevisu === dureeOrig && demiDebutPrevisu === demiDebutOrig && demiFinPrevisu === demiFinOrig) { reappliquerFormeOrigine(); return; }
        sauvegarderUndo();
        it.giDebut = giDebutPrevisu; it.duree = dureePrevisu;
        // dateDebutIso (round du 07.09.2026, cf. plus bas appliquerDelta/
        // appliquerDeltaNote/appliquerCibleUnitaire) : à rafraîchir à CHAQUE
        // mutation de giDebut, jamais laissé en l'état.
        it.dateDebutIso = isoDeGi(it.giDebut);
        it.demiDebut = demiDebutPrevisu; it.demiFin = demiFinPrevisu;
        render(); toast("Étendu.");
      }
      function onCancel() {
        detacher();
        reappliquerFormeOrigine();
      }

      var immediat = e.pointerType !== "touch";
      var minuteur = immediat ? null : setTimeout(armer, DELAI_SELECTION);
      if (immediat) armer();
      handleEl.setPointerCapture(pointerId);
      handleEl.addEventListener("pointermove", onMove);
      handleEl.addEventListener("pointerup", onUp);
      handleEl.addEventListener("pointercancel", onCancel);
    });
  }

  var dernierClicBulle = null, dernierClicTemps = 0;
  function ouvrirBulle(itemData, plage, x, y) {
    if (plage && plage.liste === TACHES) ouvrirEdition(null, itemData, null, x, y);
    else if (plage) ouvrirEditionPlage(itemData.type, itemData, null, null, x, y);
  }
  function resoudreClicBulle(id, itemData, plage, x, y) {
    var maintenant = Date.now();
    var estDouble = dernierClicBulle === id && (maintenant - dernierClicTemps) < DELAI_DOUBLE_CLIC;
    dernierClicBulle = estDouble ? null : id;
    dernierClicTemps = maintenant;
    if (estDouble) ouvrirBulle(itemData, plage, x, y);
    else basculerSelection(id);
  }

  function onPointerDownGroupeSelection(e) {
    var bulleDom = e.currentTarget;
    var idClic = bulleDom.dataset.id;
    var plageClic = itemDepuisBulle(bulleDom);
    if (!plageClic) { basculerSelection(idClic); return; }
    var itemClic = plageClic.item;
    // offsetJoursClic (round du 08.09.2026, suite — Lionel : "applique cela
    // aux jalons, tâches et absence, toutes les bulles doivent avoir le même
    // comportement" ; §49 — tâches/absences désormais dotées nativement de
    // demiDebut/demiFin comme les notes/jalons, cf. FRONTEND-CHANGELOG) :
    // 1 item = 1 seule bulle DOM continue de TOUJOURS itemClic.duree jours
    // de large, quel que soit son type — fraction de pixel -> jour, rapportée
    // à itemClic.giDebut.
    var offsetJoursClic = 0;
    if (itemClic.duree > 1 && !estGiWeekend(itemClic.giDebut)) {
      var rectClic = bulleDom.getBoundingClientRect();
      if (rectClic.width > 0) offsetJoursClic = Math.max(0, Math.min(itemClic.duree - 1, Math.floor((e.clientX - rectClic.left) / (rectClic.width / itemClic.duree))));
    }
    // offsetHalvesClic (round du 07.09.2026, suite ; étendu au round du
    // 08.09.2026, suite ; puis §49 — Lionel : "1 tâche ne peux pas etre mise
    // sur 2 case, elle s'étent de 1 jour (de 1 a 3 ,5 ou 7 case)", cf.
    // bordsDeplacementNoteMultiJours plus bas pour le détail) : équivalent en
    // demi-slots d'offsetJoursClic ci-dessus, pour le déplacement en
    // demi-journée de N'IMPORTE QUELLE bulle (note, jalon, tâche, absence —
    // depuis §49 toutes portent demiDebut/demiFin) en mode compact à la
    // souris — seul cas où la géométrie pixel-précise par demi-jour existe
    // (cf. colonneEtSpanDemi). Le tactile n'en a pas besoin (repli sur le
