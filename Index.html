      var pIndexCourant = pIndexDebut;
      var etendu = false, arme = false, enDefilement = false;
      var pointerId = e.pointerId;
      var scroller = cell.closest(".scroller");

      function armerSelection() { arme = true; cell.classList.add("armement-selection"); document.body.classList.add("en-glissement"); }
      function detacher() {
        clearTimeout(minuteur);
        cell.classList.remove("armement-selection");
        document.body.classList.remove("en-glissement");
        cell.removeEventListener("pointermove", onMove);
        cell.removeEventListener("pointerup", onUp);
        cell.removeEventListener("pointercancel", onCancel);
        try { cell.releasePointerCapture(pointerId); } catch (ex) {}
      }
      function onMove(e2) {
        if (!arme) {
          var dist = Math.abs(e2.clientX - sx) + Math.abs(e2.clientY - sy);
          if (!enDefilement && dist > SEUIL_DEFILEMENT) { enDefilement = true; clearTimeout(minuteur); }
          if (enDefilement) { if (scroller) scroller.scrollLeft -= (e2.clientX - dernierX); window.scrollBy(0, -(e2.clientY - dernierY)); }
          dernierX = e2.clientX; dernierY = e2.clientY;
          return;
        }
        var d2 = Math.abs(e2.clientX - sx) + Math.abs(e2.clientY - sy);
        if (d2 > 4) etendu = true;
        if (!etendu) return;
        var sous = document.elementFromPoint(e2.clientX, e2.clientY);
        var c2 = sous && sous.closest(".cell");
        if (c2 && c2.dataset.kind === kind) {
          var giCandidat = +c2.dataset.jour;
          if (estGiWeekend(giCandidat)) return;
          var halfCandidat = demiSlotCellule(kind, c2, e2.clientX);
          if (kind === "personne") {
            var pIdxCandidat = personnesListe.indexOf(c2.dataset.personne);
            if (pIdxCandidat === -1) return;
            pIndexCourant = pIdxCandidat; halfCourant = halfCandidat;
            surlignerPlagePersonnes(personnesListe, pIndexDebut, pIndexCourant, halfDebut, halfCourant, "selection-add");
          } else {
            halfCourant = halfCandidat;
            surlignerPlageJalonNote(kind, halfDebut, halfCourant, "selection-add");
          }
        }
      }
      function onUp(e2) {
        detacher();
        effacerSurlignage();
        if (enDefilement) return;
        if (arme && etendu) {
          var bornes = bornesDepuisDemiSlots(Math.min(halfDebut, halfCourant), Math.max(halfDebut, halfCourant));
          if (kind === "personne") {
            var pMin = Math.min(pIndexDebut, pIndexCourant), pMax = Math.max(pIndexDebut, pIndexCourant);
            if (pMin === pMax && halfDebut === halfCourant) { ouvrirAjout(cell, e2.clientX, e2.clientY); return; }
            var repDemi = bornes.demiDebut || bornes.demiFin || "matin";
            var cibles = [];
            for (var pi = pMin; pi <= pMax; pi++) cibles.push({ personne: personnesListe[pi], demi: repDemi });
            ouvrirAjoutPlage(kind, cibles, bornes.giDebut, bornes.duree, bornes.demiDebut, bornes.demiFin);
          } else {
            if (halfDebut === halfCourant) { ouvrirAjout(cell, e2.clientX, e2.clientY); return; }
            ouvrirEditionPlage(kind, null, bornes.giDebut, bornes.duree, e2.clientX, e2.clientY, cell, bornes.demiDebut, bornes.demiFin);
          }
          return;
        }
        if (e.pointerType === "touch" && !arme) return;
        ouvrirAjout(cell, e2.clientX, e2.clientY);
      }
      function onCancel() { detacher(); effacerSurlignage(); }

      var immediat = e.pointerType !== "touch";
      var minuteur = immediat ? null : setTimeout(armerSelection, DELAI_SELECTION);
      if (immediat) armerSelection();
      cell.setPointerCapture(pointerId);
      cell.addEventListener("pointermove", onMove);
      cell.addEventListener("pointerup", onUp);
      cell.addEventListener("pointercancel", onCancel);
    });
  }

  function demarrerSelectionRapide(e, celluleDebut) {
    var pointerId = e.pointerId;
    var scroller = celluleDebut.closest(".scroller");
    var autoDefil = creerAutoDefilement(scroller);
    var kind = celluleDebut.dataset.kind;
    // Même modèle "case par case" que cablerAjoutCellule (round du
    // 12.09.2026) : demi-slot de départ + personne de départ (au lieu d'une
    // "ligne" personne+demi figée).
    var halfDebut = demiSlotCellule(kind, celluleDebut, e.clientX);
    var halfCourant = halfDebut;
    var personnesListe = kind === "personne" ? personnesSecteurListe(secteurPersonne(celluleDebut.dataset.personne)) : null;
    var pIndexDebut = kind === "personne" ? personnesListe.indexOf(celluleDebut.dataset.personne) : 0;
    var pIndexCourant = pIndexDebut;
    document.body.classList.add("en-glissement");
    if (kind === "personne") surlignerPlagePersonnes(personnesListe, pIndexDebut, pIndexDebut, halfDebut, halfDebut);
    else surlignerPlageJalonNote(kind, halfDebut, halfDebut);
    function onMove(e2) {
      var sous = document.elementFromPoint(e2.clientX, e2.clientY);
      var c2 = sous && sous.closest(".cell");
      if (c2 && c2.dataset.kind === kind) {
        var giCandidat = +c2.dataset.jour;
        if (!estGiWeekend(giCandidat)) {
          var halfCandidat = demiSlotCellule(kind, c2, e2.clientX);
          if (kind === "personne") {
            var pIdxCandidat = personnesListe.indexOf(c2.dataset.personne);
            if (pIdxCandidat !== -1) {
              pIndexCourant = pIdxCandidat; halfCourant = halfCandidat;
              surlignerPlagePersonnes(personnesListe, pIndexDebut, pIndexCourant, halfDebut, halfCourant);
            }
          } else {
            halfCourant = halfCandidat;
            surlignerPlageJalonNote(kind, halfDebut, halfCourant);
          }
        }
      }
      autoDefil.maj(e2.clientX);
    }
    function detacher() {
      document.body.classList.remove("en-glissement");
      autoDefil.arreter();
      celluleDebut.removeEventListener("pointermove", onMove);
      celluleDebut.removeEventListener("pointerup", onUp);
      celluleDebut.removeEventListener("pointercancel", onCancel);
      try { celluleDebut.releasePointerCapture(pointerId); } catch (ex) {}
    }
    function onUp() {
      var bornes = bornesDepuisDemiSlots(Math.min(halfDebut, halfCourant), Math.max(halfDebut, halfCourant));
      detacher(); effacerSurlignage();
      var cells = [];
      if (kind === "personne") {
        var pMin = Math.min(pIndexDebut, pIndexCourant), pMax = Math.max(pIndexDebut, pIndexCourant);
        for (var pi = pMin; pi <= pMax; pi++) cells = cells.concat(cellulesPersonnePourDemis(personnesListe[pi], Math.min(halfDebut, halfCourant), Math.max(halfDebut, halfCourant)));
      } else {
        // Jalon/note : la sélection d'un item EXISTANT reste par JOUR (cf.
        // selectionnerDepuisCellules/ramasser, qui ne distingue pas de demi
        // pour ces 2 types) — seule la surbrillance pendant le geste est
        // désormais demi-précise (surlignerPlageJalonNote ci-dessus).
        cells = trouverCellules(kind, {}, bornes.giDebut, bornes.giDebut + bornes.duree - 1);
      }
      selectionnerDepuisCellules(cells);
    }
    function onCancel() { detacher(); effacerSurlignage(); }
    celluleDebut.setPointerCapture(pointerId);
    celluleDebut.addEventListener("pointermove", onMove);
    celluleDebut.addEventListener("pointerup", onUp);
    celluleDebut.addEventListener("pointercancel", onCancel);
  }

  function selectionnerDepuisCellules(cells) {
    if (!cells.length) return;
    var gisParCle = {};
    cells.forEach(function (c) {
      var cle = c.dataset.kind === "personne" ? ("personne|" + c.dataset.personne + "|" + c.dataset.demi) : c.dataset.kind;
      if (!gisParCle[cle]) gisParCle[cle] = {};
      gisParCle[cle][c.dataset.jour] = true;
    });
    function ramasser(liste) {
      liste.forEach(function (it) {
        if (it.personneId === undefined) {
          var gis = gisParCle[it.type];
          if (!gis) return;
          for (var g in gis) { var gi = +g; if (gi >= it.giDebut && gi < it.giDebut + it.duree) { bullesSelectionnees[it.id] = true; break; } }
          return;
        }
        // Tâche/absence (§49) : le(s) demi(s) occupé(s) peu(ven)t varier
        // selon le jour (demiDebut sur le 1er jour, demiFin sur le
        // dernier, journée entière au milieu — cf. demisOccupeesTache) ;
        // plus une seule clé "personne|id|demi" valable pour tout l'item.
        for (var gT = it.giDebut; gT < it.giDebut + it.duree; gT++) {
          var demisT = demisOccupeesTache(it, gT);
          if (!demisT) continue;
          var trouveT = demisT.some(function (d) {
            var gisT = gisParCle["personne|" + it.personneId + "|" + d];
            return gisT && gisT[gT];
          });
          if (trouveT) { bullesSelectionnees[it.id] = true; break; }
        }
      });
    }
    ramasser(TACHES); ramasser(JALONS); ramasser(NOTES);
    render(false);
    majBarreSelection();
    var n = Object.keys(bullesSelectionnees).length;
    toast(n ? ("Sélectionné (" + n + ").") : "Rien à sélectionner dans cette zone.");
  }

  // Round du 12.09.2026 — Lionel : « En mode sélection, sortir du mode
  // sélection si on clique à côté d'une bulle. » Un pointerdown sur une CASE
  // (jamais sur une .bulle, cf. onPointerDownBulle qui intercepte celles-ci
  // séparément) alors que des bulles sont sélectionnées ne servait jusqu'ici
  // qu'à armer un panoramique tactile (demarrerDefilementSimple) — un simple
  // clic/tap SANS glissé n'y déclenchait donc rigoureusement rien. Il quitte
  // désormais le mode sélection ; un vrai glissé (panoramique) reste inchangé.
  function demarrerDefilementOuSortieSelection(e, cell) {
    var pointerId = e.pointerId;
    var sx = e.clientX, sy = e.clientY, dernierX = sx, dernierY = sy;
    var scroller = cell.closest(".scroller");
    var bouge = false;
    function onMove(e2) {
      if (Math.abs(e2.clientX - sx) + Math.abs(e2.clientY - sy) > 4) bouge = true;
      if (scroller) scroller.scrollLeft -= (e2.clientX - dernierX); window.scrollBy(0, -(e2.clientY - dernierY));
      dernierX = e2.clientX; dernierY = e2.clientY;
    }
    function onUp() { detacher(); if (!bouge) { quitterModeSelection(); render(false); } }
    function detacher() {
      cell.removeEventListener("pointermove", onMove);
      cell.removeEventListener("pointerup", onUp);
      cell.removeEventListener("pointercancel", detacher);
      try { cell.releasePointerCapture(pointerId); } catch (ex) {}
    }
    cell.setPointerCapture(pointerId);
    cell.addEventListener("pointermove", onMove);
    cell.addEventListener("pointerup", onUp);
    cell.addEventListener("pointercancel", detacher);
  }
  function demarrerDefilementSimple(e, cell) {
    var pointerId = e.pointerId;
    var dernierX = e.clientX, dernierY = e.clientY;
    var scroller = cell.closest(".scroller");
    function onMove(e2) { if (scroller) scroller.scrollLeft -= (e2.clientX - dernierX); window.scrollBy(0, -(e2.clientY - dernierY)); dernierX = e2.clientX; dernierY = e2.clientY; }
    function detacher() {
      cell.removeEventListener("pointermove", onMove);
      cell.removeEventListener("pointerup", detacher);
      cell.removeEventListener("pointercancel", detacher);
      try { cell.releasePointerCapture(pointerId); } catch (ex) {}
    }
    cell.setPointerCapture(pointerId);
    cell.addEventListener("pointermove", onMove);
    cell.addEventListener("pointerup", detacher);
    cell.addEventListener("pointercancel", detacher);
  }

  /* ============ UNDO/REDO — session courante uniquement (cf. §8 du spec) ============
     Repris du prototype : sauvegarderUndo() est appelée en tout premier dans
     chaque fonction de mutation locale. render(), appelé ensuite, synchronise
     automatiquement l'état (annulé ou rétabli) vers le serveur — annuler
     revient donc à réécrire l'état précédent, pas à un simple undo visuel. */
  function clonerListe(liste) { return liste.map(function (x) { return Object.assign({}, x); }); }
  function snapshotEtat() { return { TACHES: clonerListe(TACHES), JALONS: clonerListe(JALONS), NOTES: clonerListe(NOTES) }; }
  function restaurerEtat(snap) { TACHES = snap.TACHES; JALONS = snap.JALONS; NOTES = snap.NOTES; }
  function sauvegarderUndo() {
    pileUndo.push(snapshotEtat());
    if (pileUndo.length > LIMITE_UNDO) pileUndo.shift();
    pileRedo = [];
  }
  function defaire() {
    if (!pileUndo.length) { toast("Rien à annuler (cette session seulement)."); return; }
    pileRedo.push(snapshotEtat());
    restaurerEtat(pileUndo.pop());
    bullesSelectionnees = {};
    render(); majBarreSelection();
    toast("Annulé.");
  }
  function refaire() {
    if (!pileRedo.length) { toast("Rien à refaire."); return; }
    pileUndo.push(snapshotEtat());
    restaurerEtat(pileRedo.pop());
    bullesSelectionnees = {};
    render(); majBarreSelection();
    toast("Rétabli.");
  }
  function majBoutonsUndo() {
    var d = document.getElementById("btnDefaire"), r = document.getElementById("btnRefaire");
    if (!d) return;
    d.disabled = !pileUndo.length;
    r.disabled = !pileRedo.length;
  }

  /* ============================================================
     SÉLECTION MULTIPLE / BARRE D'ACTION — repris du prototype (§3.3 de
     v3-inventory.md) : ces fonctions étaient déjà APPELÉES un peu partout
     dans le fichier (resoudreClicBulle, drag Déplacer/Copier tactile,
     construireGrille…) mais jamais définies — trou laissé par
     l'interruption précédente, cf. FRONTEND-CHANGELOG.md. `barreActionEl`
     etc. sont assignés une fois par cablerBarreAction() (appelée depuis
     construireCoquille(), après la construction du DOM de la page
     Planning). Adaptation serveur : supprimer une bulle qui porte un
     serieId passe par apiSupprimerSerie (portée "unique" — seule cette
     occurrence ; pour une portée plus large, éditer l'item seul, qui
     propose le choix à 3 portées comme d'habitude) ; les autres bulles
     sont retirées localement et laissées au moteur de diff générique
     (render() -> synchroniser()), comme le reste du fichier. ============ */
  var barreActionEl, baAnnulerEl, baSupprimerEl, baCopierEl, baDeplacerEl;
  var onAnnulerActuel = null, onCopierActuel = null, onDeplacerActuel = null;
  function cablerBarreAction() {
    barreActionEl = document.getElementById("barreAction");
    baAnnulerEl = document.getElementById("baAnnuler");
    baSupprimerEl = document.getElementById("baSupprimer");
    baCopierEl = document.getElementById("baCopier");
    baDeplacerEl = document.getElementById("baDeplacer");
    if (!barreActionEl) return;
    baAnnulerEl.addEventListener("click", function () { if (onAnnulerActuel) onAnnulerActuel(); });
    baSupprimerEl.addEventListener("click", supprimerSelection);
    baCopierEl.addEventListener("click", function () { if (onCopierActuel) onCopierActuel(); });
    baDeplacerEl.addEventListener("click", function () { if (onDeplacerActuel) onDeplacerActuel(); });
  }
  function basculerSelection(id) {
    var activer = !bullesSelectionnees[id];
    if (activer) bullesSelectionnees[id] = true; else delete bullesSelectionnees[id];
    var dom = document.querySelector('.bulle[data-id="' + id + '"]');
    if (dom) dom.classList.toggle("selectionnee", activer);
    majBarreSelection();
  }
  // Remet la barre d'action dans son état "au repos" : Supprimer (rouge)
  // seul visible, caché s'il n'y a rien de sélectionné. Sert aussi à
  // revenir à cet état après un choix Déplacer/Copier résolu.
  function majBarreSelection() {
    if (!barreActionEl) return;
    var n = Object.keys(bullesSelectionnees).length;
    choixDeplacerCopierEnCours = false;
    onAnnulerActuel = function () { quitterModeSelection(); render(false); };
    baSupprimerEl.hidden = false;
    baCopierEl.hidden = true;
    baDeplacerEl.hidden = true;
    barreActionEl.hidden = !(n > 0);
  }
  // Affiche, à la même place, "Copier" + "Déplacer" (bleus) à la place de
  // "Supprimer" — utilisé pour le choix Déplacer/Copier/Annuler après un
  // glisser tactile (bulle seule ou groupe), qu'on soit ou non en mode
  // "Sélection".
  function afficherChoixDeplacerCopier(onAnnuler, onCopier, onDeplacer) {
    if (!barreActionEl) return;
    choixDeplacerCopierEnCours = true;
    onAnnulerActuel = onAnnuler; onCopierActuel = onCopier; onDeplacerActuel = onDeplacer;
    baSupprimerEl.hidden = true;
    baCopierEl.hidden = false;
    baDeplacerEl.hidden = false;
    barreActionEl.hidden = false;
  }
  // Sortie automatique de la sélection une fois l'action terminée
  // (suppression, déplacement ou copie du groupe) : il suffit ensuite de
  // recliquer une bulle (ou double-tap/clic droit) pour une nouvelle
  // sélection.
  // Nettoie aussi la classe .selectionnee posée sur chaque bulle DOM (round
  // du 12.09.2026) : les appelants historiques (onAnnulerActuel, defaire/
  // refaire) enchaînaient déjà avec un render() qui reconstruit toute la
  // grille et fait donc disparaître ces classes de fait, mais le nouvel
  // appelant (fermerAuClicExterieur, cf. plus bas — Lionel : « lors de
  // l'enregistrement/annulation/suppression d'un formulaire le mode
  // sélection reste actif, sortir du mode ») ne re-render pas toujours
  // (Annuler seul, notamment) : sans ce nettoyage direct, la bulle resterait
  // visuellement teintée "sélectionnée" bien que bullesSelectionnees soit
  // déjà vide.
  function quitterModeSelection() {
    Object.keys(bullesSelectionnees).forEach(function (id) {
      var dom = document.querySelector('.bulle[data-id="' + id + '"]');
      if (dom) dom.classList.remove("selectionnee");
    });
    bullesSelectionnees = {};
    majBarreSelection();
  }
  // Suppression groupée depuis la sélection : toujours confirmée avant
  // d'agir. Les bulles "de série" sont supprimées côté serveur une à une
  // (apiSupprimerSerie, portée "unique") ; les autres sont retirées
  // localement, le moteur de diff générique (render()) s'occupe du reste.
  function supprimerSelection() {
    var ids = Object.keys(bullesSelectionnees);
    if (!ids.length) return;
    var texte = "Supprimer " + ids.length + " bulle" + (ids.length > 1 ? "s" : "") + " sélectionnée" + (ids.length > 1 ? "s" : "") + " ?";
    demanderConfirmation(texte, function () {
      var chaine = Promise.resolve();
      sauvegarderUndo();
      ids.forEach(function (id) {
        // itemParId, pas de lookup DOM : résolution par id pure, plus
        // simple et plus sûre qu'un document.querySelector.
        var plage = itemParId(id);
        if (!plage) return;
        if (plage.item.serieId) {
          var sid = plage.item.serieId, refIso = plage.item.dateDebutIso;
          chaine = chaine.then(function () {
            return invoquerFonctionServeur("gerer-serie", { action: "supprimer", portee: "unique", serieId: sid, dateRefIso: refIso });
          }).then(function () { apresEcritureSerie(); });
        } else {
          var i = plage.liste.indexOf(plage.item);
          if (i >= 0) plage.liste.splice(i, 1);
        }
      });
      quitterModeSelection();
      chaine.then(function () {
        render();
        toast("Supprimé (" + ids.length + ").");
      }).catch(function (err) {
        toast("Échec de la suppression : " + (err && err.message ? err.message : err));
        render(false);
      });
    });
  }

  // ---- Raccourcis clavier (ordinateur) — Échap sort de la sélection ET
  // ferme un popup ouvert (ajout/édition) sans enregistrer ; Suppr/Retour
  // arrière supprime la sélection (confirmation) ; Entrée ouvre l'édition
  // quand une seule bulle est cochée (comme un double clic), ou valide un
  // popup ouvert ; Ctrl+Z/Ctrl+Y annulent/refont ; Ctrl+X/C/V coupent/
  // copient/collent la sélection. Tout, sauf Échap et Entrée-valide-popup,
  // est ignoré quand on tape dans un champ de texte (couper/copier/coller/
  // annuler natif du navigateur DANS ce champ ne doit pas être court-circuité).
  document.addEventListener("keydown", function (e) {
    var cible = e.target, tag = cible && cible.tagName;
    var dansChamp = tag === "INPUT" || tag === "TEXTAREA" || (cible && cible.isContentEditable);

    if (e.key === "Escape") {
      if (popFermerActuel) { popFermerActuel(); e.preventDefault(); return; }
      if (Object.keys(bullesSelectionnees).length > 0) { quitterModeSelection(); render(false); e.preventDefault(); }
      return;
    }
    if (e.key === "Enter" && popValiderActuel) { popValiderActuel(); e.preventDefault(); return; }
    if (dansChamp) return;

    if (e.key === "Delete" || e.key === "Backspace") {
      if (Object.keys(bullesSelectionnees).length === 0) return;
      e.preventDefault();
      supprimerSelection();
      return;
    }
    if (e.key === "Enter") {
      var idsSel = Object.keys(bullesSelectionnees);
      if (idsSel.length !== 1) return;
      var plage = itemParId(idsSel[0]);
      if (!plage) return;
      e.preventDefault();
      ouvrirBulle(plage.item, plage, Math.round(window.innerWidth / 2 - 110), Math.round(window.innerHeight / 2 - 90));
      return;
    }

    var ctrl = e.ctrlKey || e.metaKey;
    if (!ctrl) return;
    var touche = e.key.toLowerCase();
    if (touche === "z") { e.preventDefault(); if (e.shiftKey) refaire(); else defaire(); return; }
    if (touche === "y") { e.preventDefault(); refaire(); return; }
    if (touche === "c") { e.preventDefault(); copierSelection(); return; }
    if (touche === "x") { e.preventDefault(); couperSelection(); return; }
    if (touche === "v") { e.preventDefault(); collerPressePapier(); return; }
  });

  function copierSelection() {
    var ids = Object.keys(bullesSelectionnees);
    if (!ids.length) { toast("Rien à copier."); return; }
    pressePapier = ids.map(function (id) {
      var plage = itemParId(id);
      return plage ? Object.assign({}, plage.item) : null;
    }).filter(Boolean);
    toast("Copié (" + pressePapier.length + ").");
  }
  function couperSelection() {
    var ids = Object.keys(bullesSelectionnees);
    if (!ids.length) { toast("Rien à couper."); return; }
    copierSelection();
    sauvegarderUndo();
    ids.forEach(function (id) {
      var plage = itemParId(id);
      if (!plage) return;
      var i = plage.liste.indexOf(plage.item);
      if (i >= 0) plage.liste.splice(i, 1);
    });
    quitterModeSelection();
    render();
    toast("Coupé (" + ids.length + ").");
  }
  function collerPressePapier() {
    if (!pressePapier.length) { toast("Presse-papier vide."); return; }
    sauvegarderUndo();
    var nouveauxIds = [];
    pressePapier.forEach(function (it) {
      var nouveau;
      if (it.personneId !== undefined) {
        nouveau = itemPlageTache(it.type, it.texte, it.personneId, it.giDebut, it.duree, { chantier: it.chantier, important: it.important, statut: it.statut, demiDebut: it.demiDebut, demiFin: it.demiFin });
        TACHES.push(nouveau);
      } else if (it.type === "jalon" || it.type === "note") {
        nouveau = itemPlage(it.type, it.texte, it.giDebut, it.duree, { important: it.important, demiDebut: it.demiDebut, demiFin: it.demiFin });
        nouveau.dateDebutIso = isoDeGi(it.giDebut);
        (it.type === "jalon" ? JALONS : NOTES).push(nouveau);
      } else return;
      nouveauxIds.push(nouveau.id);
    });
    bullesSelectionnees = {};
    nouveauxIds.forEach(function (id) { bullesSelectionnees[id] = true; });
    render();
    majBarreSelection();
    toast("Collé (" + nouveauxIds.length + ").");
  }

  /* ============ POPUPS GÉNÉRIQUES ============ */
  function demanderConfirmation(texte, confirme, avant) {
    var overlay = document.createElement("div");
    overlay.className = "voile-confirm";
    var pop = document.createElement("div");
    pop.className = "pop confirm-pop";
    pop.innerHTML = '<div class="cp-titre">Confirmer</div>' +
      '<p class="confirm-texte">' + esc(texte) + '</p>' +
      '<div class="confirm-boutons">' +
      '<button type="button" class="c-annuler">Annuler</button>' +
      '<button type="button" class="c-ok danger">Confirmer</button>' +
      '</div>';
    document.body.appendChild(overlay);
    document.body.appendChild(pop);
    function nettoyer() {
      overlay.remove(); pop.remove();
      if (popFermerActuel === nettoyer) popFermerActuel = null;
      if (popValiderActuel === validerConfirm) popValiderActuel = null;
      if (avant) avant();
    }
    function validerConfirm() { nettoyer(); confirme(); }
    overlay.addEventListener("pointerdown", nettoyer);
    pop.querySelector(".c-annuler").addEventListener("click", nettoyer);
    pop.querySelector(".c-ok").addEventListener("click", validerConfirm);
    popFermerActuel = nettoyer;
    popValiderActuel = validerConfirm;
  }
  function positionnerPop(pop, x, y) {
    pop.style.left = "-999px"; pop.style.top = "-999px";
    document.body.appendChild(pop);
    var pr = pop.getBoundingClientRect();
    pop.style.left = Math.max(6, Math.min(x, window.innerWidth - pr.width - 10)) + "px";
    pop.style.top = Math.max(6, Math.min(y, window.innerHeight - pr.height - 10)) + "px";
  }
  function fermerAuClicExterieur(pop, celluleSurbrillance, valider) {
    if (celluleSurbrillance) celluleSurbrillance.classList.add("selection-add");
    function surClic(ev) { if (!pop.contains(ev.target)) fermer(); }
    function fermer() {
      pop.remove();
      document.removeEventListener("pointerdown", surClic, true);
      if (celluleSurbrillance) celluleSurbrillance.classList.remove("selection-add");
      if (popFermerActuel === fermer) popFermerActuel = null;
      if (valider && popValiderActuel === valider) popValiderActuel = null;
      // Round du 12.09.2026 — Lionel : « lors de l'enregistrement/annulation/
      // suppression d'un formulaire le mode sélection reste actif, sortir du
      // mode. » fermer() est le point de sortie COMMUN à Enregistrer/
      // Annuler/Supprimer (tous l'appellent, cf. leurs handlers f-ok/
      // f-annuler/f-suppr dans ouvrirEdition/ouvrirEditionPlage et les
      // formulaires historiques) et au clic extérieur — un seul endroit
      // suffit donc à couvrir les 3 cas demandés, sans rien dupliquer par
      // formulaire.
      if (Object.keys(bullesSelectionnees).length) quitterModeSelection();
    }
    setTimeout(function () { document.addEventListener("pointerdown", surClic, true); }, 0);
    popFermerActuel = fermer;
    if (valider) popValiderActuel = valider;
    return fermer;
  }

  /* ============ FABRIQUES PARTAGÉES — cartes tâche/absence/note/jalon

  var JOURS_ABBR = ["Dim", "Lun", "Mar", "Mer", "Jeu", "Ven", "Sam"];

  // opts: { clair, fondStyle, important, chantierHTML, nomGrand }

  function datesPlageHTML(giDebut, giFin, demiDebut, demiFin) {

      dateLigneHTML("Début", giDebut, "debut", demiDebut) +

  // state : { giDebut, giFin, demiDebut, demiFin, ... } muté en place ;
  // rafraichir() est rappelée après chaque changement pour re-rendre le bloc
  // dates-plage (texte de date, état actif des boutons A/P) — cf.
  // isoDeGi/nbJoursAffiches pour les bornes de la fenêtre chargée, seul
  // espace où `gi` a un sens (pas de conversion date calendaire libre).
  function cablerDatesPlage(pop, state, rafraichir) {
    var conteneur = pop.querySelector(".dates-plage");
    conteneur.querySelectorAll(".f-fleche").forEach(function (btn) {
      btn.addEventListener("click", function () {
        var ligne = btn.closest(".date-ligne");
        var bord = ligne.dataset.bord;
        var sens = +btn.dataset.sens;
        // Round du 12.09.2026 — retour de Lionel sur le round précédent :
        // « les curseurs sont liés mais pas correctement [...] augmenter la
        // date de fin ne doit pas augmenter la date de début [...] diminuer
        // la date de début ne doit pas diminuer la date de fin » — et « je
        // dois pouvoir voyager en dehors de la semaine affichée ». L'ancien
        // code (a) liait les 2 bornes dans TOUS les sens dès qu'elles
        // étaient égales (donc aussi "Fin suivant"/"Début précédent", à
        // tort) et (b) plafonnait au gi de la fenêtre chargée (nMax) sans
        // jamais changer de semaine. Les 2 bugs viennent du même endroit :
        // cette branche recalculait le gi À LA MAIN au lieu de réutiliser
        // appliquerDateChoisieFormulaire, qui gère déjà correctement les 2
        // — son calcul giAutre >= /<= giChoisi ne recolle l'AUTRE borne que
        // quand la garder créerait un intervalle invalide (Début > Fin),
        // donc uniquement "Début suivant"/"Fin précédent" quand elles sont
        // égales, jamais "Fin suivant"/"Début précédent" — et elle sait
        // déjà naviguer vers une autre semaine si la date visée en sort
        // (cf. son propre commentaire plus bas). Reste ici uniquement le
        // calcul du jour ouvré voisin (isoJourOuvreVoisin) : les flèches
        // avancent/reculent d'un jour ouvré, jamais sur un week-end.
        var isoActuel = isoDeGi(bord === "debut" ? state.giDebut : state.giFin);
        if (!isoActuel) return;
        appliquerDateChoisieFormulaire(state, bord, isoJourOuvreVoisin(isoActuel, sens), rafraichir);
      });
    });
    conteneur.querySelectorAll(".f-demi-btn").forEach(function (btn) {
      if (btn.disabled) return;
      btn.addEventListener("click", function () {
        var ligne = btn.closest(".date-ligne");
        var bord = ligne.dataset.bord;
        var v = btn.dataset.demi;
        // Round du 12.09.2026 — Lionel : « impossible de sélectionner A et P
        // si la date de début correspond à la date de fin [...] on doit
        // pouvoir faire A/P ou A/A ou PP, mais pas P/A ». Avant ce correctif,
        // les 2 lignes étaient forcées à toujours porter la MÊME valeur dès
        // que Début === Fin (1 seul jour) : impossible d'avoir Début=matin
        // ET Fin=aprem en même temps. Les 2 lignes basculent maintenant
        // indépendamment, EXACTEMENT comme sur plusieurs jours (plus aucune
        // condition sur state.giDebut === state.giFin ici) — seule la
        // combinaison Début=aprem + Fin=matin reste bloquée sur 1 seul jour :
        // elle ferait "commencer après-midi, finir le matin" du MÊME jour,
        // ce qui n'a pas de sens (contrairement à plusieurs jours, où cette
        // même combinaison est parfaitement valide). Début=matin + Fin=aprem
        // reste normalisé en journée entière (null/null) à l'enregistrement,
        // cf. la sauvegarde de la fiche plus bas — ça n'a donc pas besoin
        // d'être bloqué ici.
        var unSeulJour = state.giDebut === state.giFin;
        if (bord === "debut") {
          var nvD = state.demiDebut === v ? null : v;
          if (unSeulJour && nvD === "aprem" && state.demiFin === "matin") return;
          state.demiDebut = nvD;
        } else {
          var nvF = state.demiFin === v ? null : v;
          if (unSeulJour && nvF === "matin" && state.demiDebut === "aprem") return;
          state.demiFin = nvF;
        }
        rafraichir();
      });
    });
    cablerCalendrierDate(conteneur, state, rafraichir);
  }
  // Round D — Lionel : « Cliquer sur la date dans les formulaires permet
  // d'ouvrir un calendrier. » Un <input type="date"> natif invisible,
  // positionné juste au-dessus du texte de la date (.date-val), sert de
  // calendrier — pas de composant "date picker" maison à écrire/maintenir.
  // .showPicker() (Chrome/Edge) ouvre le calendrier natif au clic ; navigateur
  // sans support -> repli sur .focus() (l'utilisateur ouvre alors le
  // calendrier lui-même via le petit icône natif du champ, toujours visible
  // puisque l'input, bien qu'habillé pour être discret, n'est jamais
  // display:none). Comme les flèches ‹ › (cf. le bloc juste au-dessus, qui
  // délègue lui aussi à appliquerDateChoisieFormulaire depuis le round du
  // 12.09.2026), choisir une date au calendrier peut viser N'IMPORTE QUELLE
  // date du planning (~5 ans devant/derrière, cf. genererSemaines) : navigue
  // d'abord jusqu'à la semaine qui la contient si besoin (appliquerDateChoisieFormulaire
  // ci-dessous) — c'est précisément ce qui rend "Ajout lointain" redondant
  // (Lionel : "ajout lointain disparaît car on peut maintenant le faire via
  // les nouveaux formulaires", cf. FRONTEND-CHANGELOG.md).
  function cablerCalendrierDate(conteneur, state, rafraichir) {
    conteneur.querySelectorAll(".date-val").forEach(function (span) {
      span.classList.add("date-val-cliquable");
      span.title = "Cliquer pour choisir une date dans le calendrier";
      span.addEventListener("click", function () {
        if (conteneur.querySelector(".date-picker-natif")) return; // déjà ouvert (ex. double-clic)
        var ligne = span.closest(".date-ligne");
        var bord = ligne.dataset.bord;
        var isoActuel = isoDeGi(bord === "debut" ? state.giDebut : state.giFin);
        if (!isoActuel) return;
        var input = document.createElement("input");
        input.type = "date";
        input.className = "date-picker-natif";
        input.value = isoActuel;
        var r = span.getBoundingClientRect();
        input.style.left = r.left + "px"; input.style.top = r.top + "px";
        input.style.width = Math.max(r.width, 90) + "px"; input.style.height = r.height + "px";
        ligne.appendChild(input);
        var nettoye = false;
        function nettoyer() { if (nettoye) return; nettoye = true; if (input.parentElement) input.remove(); }
        input.addEventListener("change", function () {
          var iso = input.value;
          nettoyer();
          if (iso) appliquerDateChoisieFormulaire(state, bord, iso, rafraichir);
        });
        input.addEventListener("blur", function () { setTimeout(nettoyer, 200); });
        if (input.showPicker) { try { input.showPicker(); } catch (ex) { input.focus(); } }
        else input.focus();
      });
    });
  }
  // Applique la date choisie au calendrier (bord: "debut"|"fin") : navigue
  // d'abord vers la semaine qui la contient si elle est hors de la fenêtre
  // actuellement affichée, puis recalcule les 2 bornes en gi une fois cette
  // fenêtre chargée. L'AUTRE borne (non éditée) est préservée par sa date
  // ABSOLUE tant qu'elle rentre encore dans la nouvelle fenêtre affichée (1
  // ou 2 semaines, jamais changé ici) ET qu'elle reste du bon côté de la
  // date choisie (une plage reste toujours Début <= Fin) ; sinon elle est
  // ramenée sur la date choisie (la plage redevient 1 seul jour — dépôt "à
  // cet endroit précis" plutôt qu'une plage invalide ou un mode 2-semaines
  // forcé en silence). Attention : la borne éditée (`bord`) garde TOUJOURS
  // exactement la date choisie — un simple tri min/max des 2 bornes ferait
  // parfois atterrir la date choisie sur la MAUVAISE ligne (ex. cliquer
  // "Début" et choisir une date après l'ancienne Fin doit avancer Début
  // jusque-là — pas repousser Fin en gardant l'ancienne Fin comme nouveau
  // Début).
  function appliquerDateChoisieFormulaire(state, bord, isoChoisi, rafraichir) {
    var isoAutreAvant = isoDeGi(bord === "debut" ? state.giFin : state.giDebut);
    function terminer() {
      var giChoisi = giDepuisIso(isoChoisi);
      if (giChoisi == null) { toast("Cette date est hors du planning."); return; }
      var giAutre = isoAutreAvant ? giDepuisIso(isoAutreAvant) : null;
      if (giAutre == null) giAutre = giChoisi;
      if (bord === "debut") {
        state.giDebut = giChoisi;
        state.giFin = (giAutre >= giChoisi) ? giAutre : giChoisi;
      } else {
        state.giFin = giChoisi;
        state.giDebut = (giAutre <= giChoisi) ? giAutre : giChoisi;
      }
      if (state.giDebut === state.giFin) state.demiFin = state.demiDebut;
      rafraichir();
    }
    var idxCible = indexSemaineDeIso_(isoChoisi);
    if (idxCible == null) { toast("Cette date est hors du planning."); return; }
    if (idxCible === etat.indexSemaine || (deuxSemaines && idxCible === etat.indexSemaine + 1)) { terminer(); return; }
    etat.indexSemaine = idxCible;
    assurerFenetreChargee(function () { construireVueDepuisCache(); render(false); terminer(); });
  }
  // Descriptif affiché en texte simple, cliquable pour ouvrir un petit
  // éditeur (popup centré desktop/tablette, demi-fenêtre bas d'écran
  // téléphone — même balisage, seule la CSS change, cf. .desc-edit-box) posé
  // en enfant de `pop` (jamais "extérieur" au sens de fermerAuClicExterieur).
  // getTexte/setTexte lisent/écrivent une simple variable JS locale à
  // l'appelant — aucun appel serveur ici, l'enregistrement se fait comme
  // avant au clic sur "Enregistrer" du formulaire entier.
  function cablerDescriptifEdit(pop, getTexte, setTexte, placeholderVide) {
    var span = pop.querySelector(".descriptif-texte");
    function afficher() {
      var t = getTexte();
      span.textContent = t;
      if (!t && placeholderVide) span.setAttribute("data-placeholder", placeholderVide);
    }
    afficher();
    span.addEventListener("click", function () {
      if (pop.querySelector(".desc-edit-overlay")) return;
      var overlay = document.createElement("div");
      overlay.className = "desc-edit-overlay";
      var box = document.createElement("div");
      box.className = "desc-edit-box";
      box.innerHTML = '<div class="popup-head"><div class="popup-titre">Modifier le descriptif</div>' +
        '<button type="button" class="popup-close" title="Fermer">' + ICONE_FERMER + '</button></div>' +
        '<textarea>' + esc(getTexte()) + '</textarea>' +
        '<div class="popup-pied"><button type="button" class="popup-valider">' + ICONE_CHECK + ' Enregistrer</button></div>';
      pop.appendChild(overlay); pop.appendChild(box);
      var ta = box.querySelector("textarea");
      ta.focus(); ta.setSelectionRange(ta.value.length, ta.value.length);
      function fermerEdit() { overlay.remove(); box.remove(); }
      function validerEdit() { setTexte(ta.value.trim()); afficher(); fermerEdit(); }
      overlay.addEventListener("pointerdown", fermerEdit);
      box.querySelector(".popup-close").addEventListener("click", fermerEdit);
      box.querySelector(".popup-valider").addEventListener("click", validerEdit);
      // Round du 12.09.2026 — Lionel : « appuis sur entré doit enregistrer le
      // texte du descriptif, esc ferme sans enregistrer. actuellement
      // appuyer sur entrer sort du formulaire sans enregistrer le texte du
      // descriptif. » Sans ceci, Entrée/Échap tapés dans CE textarea
      // remontaient jusqu'au raccourci clavier global (cf. plus haut,
      // popValiderActuel/popFermerActuel), qui valide/ferme le FORMULAIRE
      // ENTIER (la carte tâche/absence/note/jalon) sans jamais committer ce
      // texte via setTexte() — d'où le texte perdu. stopPropagation()
      // empêche ce document.addEventListener("keydown") de les revoir.
      // Maj+Entrée reste un retour à la ligne normal dans le textarea.
      ta.addEventListener("keydown", function (e) {
        if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); e.stopPropagation(); validerEdit(); return; }
        if (e.key === "Escape") { e.preventDefault(); e.stopPropagation(); fermerEdit(); }
      });
    });
    return afficher;
  }

  /* ============ SÉRIE (RÉCURRENCE) — création/modification/suppression
     directement côté serveur (apiEnregistrerSerie/apiModifierSerie/
     apiSupprimerSerie), §4 du spec : occurrences matérialisées, pas de
     règle "live" — le calcul des dates se fait côté serveur (pasCalendaire_),
     jamais en espace `gi` côté client (contrairement au prototype V3 isolé).
     ============ */
  function demanderPorteeSerie(titre, callback) {
    var overlay = document.createElement("div");
    overlay.className = "voile-confirm";
    var pop = document.createElement("div");

  // Round D — bandeau affiché à la place de serieChampsHTML() dans la fiche

  // Renvoie une fonction lireChoixSerie() -> null (pas coché) ou
  // {frequence, intervalle, finType, finValeur} — finValeur est un ISO
  // (finType="date") ou un entier (finType="occurrences"), prêt pour
  // apiEnregistrerSerie.
  function cablerSerieChamps(pop, isoBase) {
    var chk = pop.querySelector(".f-serie");
    if (!chk) return function () { return null; };
    var options = pop.querySelector(".serie-options");
    var ligneNb = pop.querySelector(".serie-ligne-nb");
    var ligneDate = pop.querySelector(".serie-ligne-date");
    var dateInput = pop.querySelector(".serie-date");
    var intervalleInput = pop.querySelector(".serie-intervalle");
    var uniteSelect = pop.querySelector(".serie-unite");
    var finActuel = "occurrences";
    chk.addEventListener("change", function () { options.hidden = !chk.checked; });
    var JOURS_DEFAUT_PAR_OCCURRENCE = { jour: 3.5, semaine: 7, mois: 30, annee: 365 };
    var OCCURRENCES_DEFAUT = 4;
    function majDateDefaut() {
      var freq = uniteSelect.value;
      var intervalle = Math.max(1, parseInt(intervalleInput.value, 10) || 1);
      var d = new Date((isoBase || isoDeDate(new Date())) + "T00:00:00");
      d.setDate(d.getDate() + Math.round((JOURS_DEFAUT_PAR_OCCURRENCE[freq] || 7) * intervalle * OCCURRENCES_DEFAUT));
      dateInput.value = isoDeDate(d);
    }
    intervalleInput.addEventListener("input", majDateDefaut);
    uniteSelect.addEventListener("change", majDateDefaut);
    pop.querySelectorAll(".serie-fin-row .chip").forEach(function (btn) {
      btn.addEventListener("click", function () {
        pop.querySelectorAll(".serie-fin-row .chip").forEach(function (b) { b.classList.remove("actif"); });
        btn.classList.add("actif");
        finActuel = btn.dataset.fin;
        ligneNb.hidden = finActuel !== "occurrences";
        ligneDate.hidden = finActuel !== "date";
      });
    });
    majDateDefaut();
    return function lireChoixSerie() {
      if (!chk.checked) return null;
      var freq = uniteSelect.value;
      var intervalle = Math.max(1, Math.min(365, parseInt(intervalleInput.value, 10) || 1));
      if (finActuel === "date") return { frequence: freq, intervalle: intervalle, finType: "date", finValeur: dateInput.value || isoBase };
      var n = Math.max(2, Math.min(366, parseInt(pop.querySelector(".serie-nb").value, 10) || 4));
      return { frequence: freq, intervalle: intervalle, finType: "occurrences", finValeur: n };
    };
  }
  // Applique la réponse d'une API "série" (enregistrer-serie/gerer-serie,
  // étape 4 du §6bis, migration hors Google) : contrairement aux anciennes
  // apiEnregistrerSerie/apiModifierSerie/apiSupprimerSerie (WebApp.gs), ces
  // deux Edge Functions ne renvoient plus la semaine affichée rafraîchie ni
  // la liste des semaines touchées ({semaine, semainesTouchees}) — une série

  // (plus de plafond "5 semaines créées", cf. genererSemaines côté client,
  // étape 2) : borner le rechargement à "les semaines touchées" n'aurait
  // plus de sens. On oublie tout le cache et on recharge simplement la
  // fenêtre affichée — même filet que la synchronisation (cf. synchroniser()
  // juste au-dessus), le paramètre `r` n'est donc plus utilisé ici.
  function apresEcritureSerie() {
    oublierCache();

  }

  /* ============================================================
     FORMULAIRES AJOUT / ÉDITION — tâches, absences, jalons, notes.
     ============================================================ */
  // creerGroupeTaches (round du 12.09.2026 — refonte "case par case" de la
  // sélection, cf. cablerAjoutCellule/surlignerPlagePersonnes) : 1 SEUL item
  // par personne concernée, sur exactement {giDebut,duree,demiDebut,demiFin}
  // — les bords précis de la plage sélectionnée (bornesDepuisDemiSlots côté
  // appelant), désormais partagés par TOUT type de bulle (tâche, absence,
  // congé, vacances...), plus de traitement spécial pour les absences.
  // Remplace 2 anciens comportements :
  //  - le cas "absence, duree>1" (round du 11.09.2026, §51.2.2) posait déjà
  //    1 item/personne en journée entière — devenu le cas général ici ;
  //  - le cas "tâche" fragmentait 1 item PAR JOUR avec une demi-journée FIXE
  //    par ligne de sélection (matin/aprem "figé" pour toute la durée, cf.
  //    lignesSecteur) — Lionel a explicitement rejeté ce modèle : « Ce
  //    comportement doit être pareil pour tout type des bulles. on ne
  //    sélectionne pas que les matin ou que les après midi. » Le payload
  //    porte donc maintenant demiDebut/demiFin (bords de plage), plus une
  //    demi-journée par ligne — ouvrirEdition (formulaire "Tâche"/"Absence"
  //    avec descriptif) créait déjà 1 item fusionné par cible de cette façon
  //    (cf. son commentaire) ; ceci aligne les boutons rapides/formulaires
  //    historiques (Armature/Béton/Livraison/Entrée dynamique/Absence
  //    rapide) sur le même modèle.
  function creerGroupeTaches(cibles, giDebut, duree, payload) {
    var demiDebut = payload.demiDebut !== undefined ? payload.demiDebut : null;
    var demiFin = payload.demiFin !== undefined ? payload.demiFin : null;
    var personnesVues = {};
    cibles.forEach(function (c) {
      if (personnesVues[c.personne]) return;
      personnesVues[c.personne] = true;
      var ta = itemPlageTache(payload.type, payload.texte, c.personne, giDebut, duree, {
        chantier: payload.chantier, important: payload.important, statut: payload.statut,
        demiDebut: demiDebut, demiFin: demiFin
      });
      ta.dateDebutIso = isoDeGi(giDebut);
      TACHES.push(ta);
    });
  }
  function ajoutRapide(cibles, giDebut, duree, texte, type, demiDebut, demiFin) {
    sauvegarderUndo();
    creerGroupeTaches(cibles, giDebut, duree, { type: type, texte: texte, important: false, chantier: null, statut: null, demiDebut: demiDebut, demiFin: demiFin });
    render();
    toast("Ajouté.");
  }

  // Crée une série (§4 du spec) — un appel serveur par cible (ancre, demi)
  // touchée, cf. FRONTEND-CHANGELOG.md : apiEnregistrerSerie ne prend qu'UNE
  // seule cible {ancre,demi} par appel, contrairement au moteur du prototype
  // qui partageait un seul serieId entre toutes les lignes d'une sélection
  // multi-personnes — ici chaque ligne reçoit sa propre série.
  function creerSerieServeur(type, cibles, giDebut, texte, important, chantier, statut, choixSerie, apresChaqueAppel) {
    var isoDebut = isoDeGi(giDebut);
    // enregistrer-serie n'a que 3 types ("tache"|"jalon"|"note", cf.
    // champsSerie côté fonction) : "absence" n'a jamais été une vraie
    // catégorie serveur (la table `taches` n'a pas de colonne `type` — c'est
    // le TEXTE qui la rend visuellement distincte côté client, cf.
    // estAbsence() plus haut) — traduite ici en "tache", comme le reste du
    // formulaire d'édition le fait déjà.
    var typeServeur = (type === "absence") ? "tache" : type;
    var chaine = Promise.resolve();
    var dernier = null;
    (cibles.length ? cibles : [{}]).forEach(function (c) {
      chaine = chaine.then(function () {
        var payload = {
          type: typeServeur, personneId: c.personne != null ? ancreDe(c.personne) : undefined, demi: c.demi,
          texte: texte,
          // statut/chantier restent des NOMS/CLÉS côté vue (CHANTIERS/STATUTS,
          // cf. étape 3 du §6bis) — enregistrer-serie veut de vrais id,
          // traduits ici via les lookups posés au bootstrap (demarrer()).
          statutId: statut ? (etat.statutIdParCle[statut] || null) : null,
          important: !!important,
          chantierId: chantier ? ((etat.chantierParNom[chantier] && etat.chantierParNom[chantier].ligne) || null) : null,
          dateDebutIso: isoDebut, frequence: choixSerie.frequence, intervalle: choixSerie.intervalle,
          finType: choixSerie.finType, finValeur: choixSerie.finValeur
        };
        return invoquerFonctionServeur("enregistrer-serie", payload).then(function (r) { dernier = r; });
      });
    });
    return chaine.then(function () { if (dernier) apresChaqueAppel(dernier); });
  }

  function boutonsMenuAjout(personneId) {
    var estIntervenant = secteurPersonne(personneId) === "sous-traitant";
    var html = '<button type="button" data-t="tache">Tâche</button>';
    // "Absence" (qui ouvre l'éditeur, pour saisir un motif) reste proposée
    // telle quelle au personnel : ce n'est pas une entrée rapide mais un type
    // de bulle à part entière.
    if (!estIntervenant) html += '<button type="button" data-t="absence">Absence</button>';
    // Congé / Vacances : codés en dur jusqu'ici, donc ni renommables, ni
    // assignables, ni supprimables (Lionel : "il faut ajouter les absences aux
    // ajouts rapides à éditer"). Ils viennent maintenant de la liste
    // configurable, comme n'importe quel formulaire — repli sur les 2 boutons
    // historiques TANT QU'aucune entrée rapide de type "absence" n'existe,
    // pour que rien ne disparaisse de son menu avant qu'il ne les ait créées.
    var aDesAbsencesConfigurees = FORMULAIRES_RAPIDES.some(function (f) { return f.typeEntree === "absence"; });
    if (!estIntervenant && !aDesAbsencesConfigurees) {
      html += '<button type="button" data-rapide="Congé">Congé</button>';
      html += '<button type="button" data-rapide="Vacances">Vacances</button>';
    }
    // "Assigné à" (restauré round "reverifie 1x que tu a tout fait" du
    // 02.09.2026, cf. FORMULAIRES_RAPIDES[].assigneA côté serveur) : "" =
    // tout le monde, sinon réservé à cette seule personne. L'index `i` reste
    // celui du tableau GLOBAL non filtré — cablerBoutonsMenuAjout relit
    // FORMULAIRES_RAPIDES[+btn.dataset.form], donc filtrer le tableau
    // lui-même déciderait un mauvais formulaire au clic.
    FORMULAIRES_RAPIDES.forEach(function (f, i) {
      if (!formulaireVisiblePour(f, personneId)) return;
      html += '<button type="button" data-form="' + i + '">' + esc(f.nom) + '</button>';
    });
    return html;
  }
  function cablerBoutonsMenuAjout(pop, fermer, cell, x, y, cibles, giDebut, duree, plageInit, demiDebut, demiFin) {
    pop.querySelectorAll("button[data-t]").forEach(function (btn) {
      btn.addEventListener("click", function () { var type = btn.dataset.t; fermer(); ouvrirEdition(cell, null, type, x, y, plageInit, demiDebut, demiFin); });
    });
    pop.querySelectorAll("button[data-rapide]").forEach(function (btn) {
      btn.addEventListener("click", function () { var texte = btn.dataset.rapide; fermer(); ajoutRapide(cibles, giDebut, duree, texte, "absence", demiDebut, demiFin); });
    });

      btn.addEventListener("click", function () {
        var f = FORMULAIRES_RAPIDES[+btn.dataset.form]; fermer();
        if (!f) return;
        if (f.nom === "Armature") { ouvrirFormulaireArmature(cibles, giDebut, duree, x, y, plageInit, demiDebut, demiFin); return; }
        if (f.nom === "Béton") { ouvrirFormulaireBeton(cibles, giDebut, duree, x, y, plageInit, demiDebut, demiFin); return; }
        if (f.nom === "Livraison armature") { ouvrirFormulaireLivraisonArmature(cibles, giDebut, duree, x, y, plageInit, demiDebut, demiFin); return; }
        // Un formulaire sans champ s'ajoute en un clic, avec SON type :
        // "Congé" configuré en absence pose bien un congé, pas une tâche.
        if (!f.champs || !f.champs.length) { ajoutRapide(cibles, giDebut, duree, f.nom, f.typeEntree === "absence" ? "absence" : "tache", demiDebut, demiFin); return; }
        ouvrirFormulaireDynamique(f, cibles, giDebut, duree, x, y, plageInit, demiDebut, demiFin);

  function ouvrirAjout(cell, x, y) {
    var kind = cell.dataset.kind;
    // Clic simple (sans glissé) sur jalon/note (round du 12.09.2026 — Lionel :
    // « je les veux case par case, une case = une demi journée ») : la
    // demi-journée visée est désormais celle sous le POINTEUR (moitié
    // gauche/droite de la case pleine largeur, cf. demiDepuisPointeur — déjà
    // utilisée pour le glissement d'une note existante), pas systématiquement
    // la journée entière comme avant ce round.
    if (kind !== "personne") {

    chargerFormulairesRapides();

  function ouvrirAjoutPlage(kind, cibles, giDebut, duree, demiDebut, demiFin) {

    var plageInit = { cibles: cibles, giDebut: giDebut, duree: duree, demiDebut: demiDebut || null, demiFin: demiFin || null, px: px, py: py };

      '<button type="button" class="chip" data-zone="radier">Radier</button>' +
      '<button type="button" class="chip" data-zone="dalle">Dalle</button>' +
      '<button type="button" class="chip" data-zone="autre">Autre…</button>' +

    var pos = positionFormulaire(x, y, plageInit);
    positionnerPop(pop, pos.px, pos.py);
    var fermer = fermerAuClicExterieur(pop, null, function () { pop.querySelector(".f-ok").click(); });

    var precisionWrap = pop.querySelector(".precision-wrap");
    var etapeWrap = pop.querySelector(".etape-wrap");
    var champEtape = pop.querySelector(".f-etape");
    var champAutre = pop.querySelector(".f-texte-autre");
    var champChantierSel = pop.querySelector(".f-chantier");
    var apercuTexte = pop.querySelector(".apercu-texte");

      (estSousTraitantDyn ? champStatutHTML(null) : "") +

  // ---- ouvrirEdition (tâche/absence) — adaptation du prototype : la case
  // "Série" à la création appelle désormais creerSerieServeur (serveur
  // d'abord, cache invalidé, PUIS re-rendu — apresEcritureSerie), au lieu de
  // générer les occurrences en mémoire. Modifier/supprimer un item qui PORTE
  // déjà un serieId (constaté depuis le cache, cf. tacheSlotAuGi/
  // construireVueDepuisCache — le serveur renvoie taches[].serieId) passe
  // systématiquement, quelle que soit la portée choisie ("unique" compris),
  // par apiModifierSerie/apiSupprimerSerie : ces items vivent dans une case
  // matérialisée côté feuille, jamais localement — on ne les "splice" plus
  // dans TACHES par optimisme (cf. FRONTEND-CHANGELOG.md). Un item SANS

  function ouvrirEdition(cell, itemExisting, typeIfNew, x, y, plageInit, demiDebutArg, demiFinArg) {
    var extraCell = cell ? { personne: cell.dataset.personne, demi: cell.dataset.demi } : null;
    var giDebut0 = plageInit ? plageInit.giDebut : (cell ? +cell.dataset.jour : (itemExisting ? itemExisting.giDebut : 0));
    var duree0 = plageInit ? plageInit.duree : (itemExisting ? (itemExisting.duree || 1) : 1);
    var cibles = plageInit ? plageInit.cibles : (extraCell ? [extraCell] : []);

    // cablerAjoutCellule — round du 12.09.2026, corrige Lionel : « Les
    // boutons A/P ne sont pas automatiquement en surbrillance suivant la
    // bulle »), plutôt qu'une seule demi-journée reprise de la case cliquée

      demiFin: itemExisting ? (itemExisting.demiFin || null) : (demiFinArg !== undefined ? demiFinArg : demiInit),

    var pop = document.createElement("div");

    if (typeAffiche === "tache") {
      // Nouvelle tâche : pré-coché EN PRIORITÉ sur le chantier déjà présent
      // dans la case ciblée s'il y en a un (round du 03.09.2026, cf.
      // chantierExistantDansCase — sinon ajouter une 2e tâche sur une case
      // qui en a déjà une change silencieusement le chantier de la 1ère à la
      // synchronisation), sinon le chantier par défaut choisi dans la
      // légende, sinon comportement d'avant (aucun "selected", le navigateur
      // prend le 1er de la liste). Modification d'une tâche existante :
      // inchangé, son propre chantier.
      defautNouveau = chantierExistantDansCase(cibles, state.giDebut, state.giFin - state.giDebut + 1) || chantierParDefautValide();
      var options = Object.keys(CHANTIERS).map(function (k) {
        var sel = itemExisting ? (itemExisting.chantier === k) : (defautNouveau === k);

    var estSousTraitant = personneRef ? secteurPersonne(personneRef) === "sous-traitant" : false;
    var champStatut = (typeAffiche === "tache" && estSousTraitant) ? champStatutHTML(itemExisting ? itemExisting.statut : null) : "";
    // Round D — Lionel : « modifier une série lors de l'ouverture d'un
    // formulaire avec série ». Un item déjà en série (itemExisting.serieId)
    // affiche désormais le bandeau serieInfoExistanteHTML (au lieu de rien

    // sera demandée à l'enregistrement (cf. demanderPorteeSerie plus bas,

    // reste réservée à la CRÉATION (nouvelle tâche/absence) : la proposer

    // construireOccurrencesSerie côté fonctions/enregistrer-serie/logic.js) —

    var fermer = fermerAuClicExterieur(pop, !itemExisting ? surbrillancePrecisePersonnes(cibles, state.giDebut, state.giFin - state.giDebut + 1, state.demiDebut, state.demiFin) : null, function () { pop.querySelector(".f-ok").click(); });

    pop.querySelector(".f-annuler").addEventListener("click", fermer);
    pop.querySelector(".f-important").addEventListener("click", function () {
      state.important = !state.important;

    function rafraichirDates() {
      pop.querySelector(".dates-plage").outerHTML = datesPlageHTML(state.giDebut, state.giFin, state.demiDebut, state.demiFin);
      cablerDatesPlage(pop, state, rafraichirDates);

    cablerDatesPlage(pop, state, rafraichirDates);
    var texteActuel = texteInit;
    cablerDescriptifEdit(pop, function () { return texteActuel; }, function (v) { texteActuel = v; }, "Cliquer pour ajouter un descriptif…");

    var chantierSel = pop.querySelector(".f-chantier");
    if (chantierSel) chantierSel.addEventListener("change", function () {
      var c = CHANTIERS[chantierSel.value];
      pop.querySelector(".bandeau").style.background = c ? c.couleur : "";
    });
    var statutRow = pop.querySelector(".statut-row");
    var statutActuel = itemExisting ? (itemExisting.statut || null) : null;
    if (statutRow) cablerChipsExclusifs(statutRow, "statut", function (v) { statutActuel = v || null; });
    var lireChoixSerie = cablerSerieChamps(pop, itemExisting ? itemExisting.dateDebutIso : isoDeGi(state.giDebut));
    cablerLienPlus(pop);

    var suppr = pop.querySelector(".f-suppr");
    if (suppr) suppr.addEventListener("click", function () {
      function supprimerUnique() {
        sauvegarderUndo();
        var i = TACHES.indexOf(itemExisting);
        if (i >= 0) TACHES.splice(i, 1);
        fermer(); render(); toast("Supprimé.");
      }
      if (itemExisting.serieId) {
        demanderPorteeSerie("Supprimer", function (portee) {
          fermer();
          invoquerFonctionServeur("gerer-serie", { action: "supprimer", portee: portee, serieId: itemExisting.serieId, dateRefIso: itemExisting.dateDebutIso }).then(function () {
            apresEcritureSerie(); toast("Supprimé.");
          }).catch(function (err) {
            toast("Échec de la suppression : " + (err && err.message ? err.message : err));
          });
        });
        return;
      }
      supprimerUnique();
    });
    pop.querySelector(".f-ok").addEventListener("click", function () {
      var texte = texteActuel.trim();
      if (!texte) { fermer(); return; }
      var important = state.important;
      var chantierSel2 = pop.querySelector(".f-chantier");
      var chantier = chantierSel2 ? chantierSel2.value : (itemExisting ? itemExisting.chantier : null);
      var statutFinal = statutRow ? statutActuel : null;
      var giDebutFinal = state.giDebut, dureeFinal = state.giFin - state.giDebut + 1;
      var demiDebutFinal = state.demiDebut, demiFinFinal = state.demiFin;
      // Sur 1 seul jour, Début=matin + Fin=aprem est une combinaison valide
      // côté fiche (cf. cablerDatesPlage) mais équivaut à une journée
      // entière — ramenée ici à la forme canonique (null/null) qu'attend
      // tout le reste du fichier (demisOccupeesTache, rendu des bulles,
      // glissé/redimensionnement...), qui suppose encore demiDebut ===
      // demiFin dès que la durée vaut 1.
      if (state.giDebut === state.giFin && demiDebutFinal === "matin" && demiFinFinal === "aprem") { demiDebutFinal = null; demiFinFinal = null; }

      if (itemExisting) {
        function appliquerModifUnique() {
          sauvegarderUndo();
          itemExisting.texte = texte;
          itemExisting.important = important;
          if (chantier) itemExisting.chantier = chantier;
          if (statutRow) itemExisting.statut = statutActuel;
          // giDebut/duree/demiDebut/demiFin : mutation directe puis render()
          // — même trajet déjà emprunté par le glissement/redimensionnement
          // d'une bulle tâche (cf. plus haut, it.demiDebut/it.demiFin/
          // it.giDebut posés en place avant render()), le moteur de diff
          // (synchroniser/calculerEtatLocal) ne distingue pas l'origine du
          // changement.
          itemExisting.giDebut = giDebutFinal;
          itemExisting.duree = dureeFinal;
          itemExisting.demiDebut = demiDebutFinal;
          itemExisting.demiFin = demiFinFinal;
          itemExisting.dateDebutIso = isoDeGi(giDebutFinal);
          fermer(); render(); toast("Modifié.");
        }
        if (itemExisting.serieId) {
          demanderPorteeSerie("Modifier", function (portee) {
            fermer();
            var chantierAppl = chantier || itemExisting.chantier;
            // gerer-serie veut des id (chantierId/statutId), la vue ne connaît
            // que le nom/la clé — traduction via les lookups du bootstrap,
            // mêmes que creerSerieServeur ci-dessus. Ni les dates ni la
            // demi-journée ne sont envoyées ici : gerer-serie ne sait pas
            // (encore) déplacer une série entière — déplacer une occurrence
            // en série passe par "Cet élément seul" (portee=unique), qui la
            // détache déjà de la série côté vue, exactement comme avant
            // cette refonte.
            var modifs = {
              texte: texte, important: important,
              chantierId: chantierAppl ? ((etat.chantierParNom[chantierAppl] && etat.chantierParNom[chantierAppl].ligne) || null) : null,
              statutId: statutFinal ? (etat.statutIdParCle[statutFinal] || null) : null
            };
            invoquerFonctionServeur("gerer-serie", { action: "modifier", portee: portee, serieId: itemExisting.serieId, dateRefIso: itemExisting.dateDebutIso, modifs: modifs }).then(function () {
              apresEcritureSerie(); toast("Modifié.");
            }).catch(function (err) {
              toast("Échec de la modification : " + (err && err.message ? err.message : err));
            });
          });
          return;
        }
        appliquerModifUnique();
        return;
      }
      var choixSerie = lireChoixSerie();
      if (choixSerie) {
        fermer();
        creerSerieServeur(typeAffiche, cibles, giDebutFinal, texte, important, chantier, statutFinal, choixSerie, function (r) {
          apresEcritureSerie(r); toast("Série ajoutée.");
        }).catch(function (err) {
          toast("Échec de la création de la série : " + (err && err.message ? err.message : err));
        });
      } else {
        // 1 item fusionné {giDebut,duree,demiDebut,demiFin} PAR CIBLE, plutôt
        // que creerGroupeTaches (1 ligne serveur par jour, demi UNIQUE par
        // case) — la 1re ne sait pas représenter un bord de demi-journée
        // différent en début/fin. Même trajet que le glissement/
        // redimensionnement d'une bulle existante (déjà prouvé côté
        // synchroniser()/calculerEtatLocal, qui reconstruit l'état désiré
        // depuis TACHES sans distinguer "nouveau" de "modifié").
        sauvegarderUndo();
        cibles.forEach(function (c) {
          var nouveau = itemPlageTache(typeAffiche, texte, c.personne, giDebutFinal, dureeFinal, {
            important: important, chantier: chantier, statut: statutFinal, demiDebut: demiDebutFinal, demiFin: demiFinFinal
          });
          nouveau.dateDebutIso = isoDeGi(giDebutFinal);

    });
  }

  // ---- ouvrirEditionPlage (jalon/note) — même adaptation, avec une limite
